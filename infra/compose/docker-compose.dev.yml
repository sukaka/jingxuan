# LOCAL DEVELOPMENT ONLY. Do not deploy this compose file to production.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev_root_CHANGE_ME}
      MYSQL_DATABASE: medical_crm
      MYSQL_USER: crm
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dev_crm_CHANGE_ME}
      TZ: UTC
    # 本地迁移含审计触发器；仅开发环境允许无 SUPER 的账号在 binlog 下创建触发器。
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00", "--log-bin-trust-function-creators=1"]
    ports: ["127.0.0.1:3307:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      retries: 15
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6380:6379"]
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: ["redis_data:/data"]
  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    ports: ["127.0.0.1:29092:29092"]
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes: ["kafka_data:/var/lib/kafka/data"]
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dev_minio_CHANGE_ME}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev_minio_secret_CHANGE_ME}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio_data:/data"]
  clamav:
    image: clamav/clamav:1.4.3
    # 该版本仅提供 amd64；Apple Silicon 使用 Docker 仿真运行，其他架构也需按镜像支持情况部署。
    platform: linux/amd64
    environment:
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
    ports: ["127.0.0.1:3310:3310"]
    volumes: ["clamav_data:/var/lib/clamav"]
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
volumes:
  mysql_data: {}
  redis_data: {}
  kafka_data: {}
  minio_data: {}
  clamav_data: {}
