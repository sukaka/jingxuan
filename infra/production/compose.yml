name: ${COMPOSE_PROJECT_NAME:-whale-crm}

services:
  mysql:
    image: mysql:8.4.8
    pull_policy: never
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: medical_crm
      MYSQL_USER: crm
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD}"
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --log-bin-trust-function-creators=1
      - --binlog-expire-logs-seconds=604800
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 30s
    networks: [internal]

  redis:
    image: redis:7.4.2-alpine
    pull_policy: never
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\" --maxmemory 512mb --maxmemory-policy allkeys-lru"]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  kafka:
    image: apache/kafka:4.1.2
    pull_policy: never
    restart: unless-stopped
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server=localhost:9092"]
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 30s
    networks: [internal]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    pull_policy: never
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}"
      MINIO_API_CORS_ALLOW_ORIGIN: "${PUBLIC_URL:?set PUBLIC_URL}"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 18
    networks: [internal, edge]

  clamav:
    image: clamav/clamav:1.4.3
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    environment:
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 45s
    networks: [internal, edge]

  crm-api:
    image: whale-crm/crm-api:${RELEASE_VERSION:-2.0.0}
    pull_policy: never
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: UTC
      DB_JDBC_URL: "${DB_JDBC_URL:-jdbc:mysql://mysql:3306/medical_crm?connectionTimeZone=UTC&useSSL=false&allowPublicKeyRetrieval=true}"
      DB_USER: crm
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CORS_ALLOWED_ORIGINS: "${PUBLIC_URL}"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}"
      APP_AES_KEY_BASE64: "${APP_AES_KEY_BASE64:?set APP_AES_KEY_BASE64}"
      APP_BLIND_INDEX_PEPPER: "${APP_BLIND_INDEX_PEPPER:?set APP_BLIND_INDEX_PEPPER}"
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      FILES_ENABLED: "${FILES_ENABLED:-false}"
      FILES_BUCKET: "${FILES_BUCKET:-crm-private}"
      FILES_PUBLIC_ENDPOINT: "${FILES_PUBLIC_ENDPOINT:-}"
      FILES_REGION: "${FILES_REGION:-us-east-1}"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: 3310
      OUTBOX_RELAY_ENABLED: 'true'
      KNOWLEDGE_SYNC_KAFKA_ENABLED: 'true'
      KNOWLEDGE_SYNC_WORKER_ENABLED: 'true'
      AI_WORKER_ENABLED: 'true'
      AI_WORKER_BASE_URL: http://ai-worker:8090
      AI_INTERNAL_TOKEN: "${AI_INTERNAL_TOKEN:?set AI_INTERNAL_TOKEN}"
      AI_PROVIDER_ALLOW_HTTP: 'false'
      AI_DIFY_ALLOW_HTTP: 'false'
      REFUND_MOCK_ENABLED: 'false'
      FEATURE_REAL_YOUZAN: "${FEATURE_REAL_YOUZAN:-false}"
      FEATURE_REAL_WECOM: "${FEATURE_REAL_WECOM:-false}"
      FEATURE_AI_WRITEBACK: "${FEATURE_AI_WRITEBACK:-false}"
      FEATURE_REAL_DIFY: "${FEATURE_REAL_DIFY:-false}"
      WECOM_OFFICIAL_ENABLED: "${WECOM_OFFICIAL_ENABLED:-false}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    networks: [internal, edge]

  clamav-proxy:
    image: whale-crm/clamav-proxy:${RELEASE_VERSION:-2.0.0}
    pull_policy: never
    restart: unless-stopped
    network_mode: service:crm-api
    depends_on:
      crm-api:
        condition: service_started

  ai-worker:
    image: whale-crm/ai-worker:${RELEASE_VERSION:-2.0.0}
    pull_policy: never
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m
    environment:
      AI_PROVIDER: "${AI_PROVIDER:-disabled}"
      AI_INTERNAL_TOKEN: "${AI_INTERNAL_TOKEN}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-}"
      FEATURE_AI_WRITEBACK: "${FEATURE_AI_WRITEBACK:-false}"
      FEATURE_REAL_DIFY: "${FEATURE_REAL_DIFY:-false}"
      AI_DIFY_ALLOW_HTTP: 'false'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks: [internal, edge]

  web:
    image: whale-crm/web:${RELEASE_VERSION:-2.0.0}
    pull_policy: never
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    depends_on:
      crm-api:
        condition: service_healthy
    networks: [internal, edge]

  caddy:
    image: caddy:2.11.4-alpine
    pull_policy: never
    restart: unless-stopped
    environment:
      SITE_ADDRESS: "${CADDY_SITE_ADDRESS:?set CADDY_SITE_ADDRESS}"
      FILES_SITE_ADDRESS: "${FILES_SITE_ADDRESS:-}"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./runtime/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks: [edge]

volumes:
  mysql_data:
  redis_data:
  kafka_data:
  minio_data:
  clamav_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  edge:
