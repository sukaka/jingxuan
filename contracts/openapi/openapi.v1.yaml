      responses:
        '201':
          description: 已创建待审核合同版本
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContractEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/FileScanNotReady'}
  /institution-contracts/{id}:
    get:
      tags: [InstitutionDocuments]
      summary: 合同版本详情（institution:read + 机构范围）
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200':
          description: 返回 versionNo 与乐观锁 version 等完整合同版本字段
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContractEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /institution-contracts/{id}/activation-requests:
    post:
      tags: [InstitutionChanges]
      summary: 合同激活申请（institution:change_request + 范围；baseVersion + CLEAN）
      description: 仅 PENDING_REVIEW 且版本一致的合同可申请，走 MARKET→FINANCE 独立双审；最终激活时旧 ACTIVE 版本转 SUPERSEDED，历史版本不覆盖。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWorkflowRequest'}
      responses:
        '200':
          description: 已创建 PENDING_REVIEW/currentStep=MARKET 激活申请
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChangeRequestEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/FileScanNotReady'}
  /institution-qualifications:
    get:
      tags: [InstitutionDocuments]
      summary: 机构资质分页（institution:read + 机构范围；证照号仅掩码）
      parameters:
        - {name: institutionId, in: query, required: true, schema: {type: integer, format: int64}}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - {name: status, in: query, required: false, schema: {type: string, maxLength: 48, enum: [PENDING_REVIEW, APPROVED, REJECTED]}}
      responses:
        '200':
          description: 资质分页，不返回证照号明文或密文
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QualificationPageResponse'}
