        guaranteeRoi: {type: boolean, nullable: true}
        roiTerms: {type: string, nullable: true}
        settlementName: {type: string, nullable: true, description: 仅授权财务角色返回，其他角色为 null}
        bankNameMasked: {type: string, nullable: true}
        bankAccountMasked: {type: string, nullable: true}
        taxIdMasked: {type: string, nullable: true}
        introduction: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
    CreateProfileChangeRequest:
      type: object
      required: [institutionId, fieldCode, newValue, baseVersion, reason]
      properties:
        institutionId: {type: integer, format: int64}
        fieldCode: {type: string, minLength: 1, maxLength: 64, description: 仅 InstitutionFieldPolicy 允许的敏感字段}
        newValue:
          description: 按 fieldCode 接收字符串、0至1数字、非负整数分或布尔值；敏感值加密保存，不在响应中返回明文。
        baseVersion: {type: integer, format: int64, minimum: 0, description: 申请时机构当前版本}
        reason: {type: string, minLength: 1, maxLength: 1000}
        evidenceFileId: {type: integer, format: int64, nullable: true, description: 可选证据文件，存在时必须 CLEAN}
    ReviewChangeRequest:
      type: object
      required: [version, decision]
      properties:
        version: {type: integer, format: int64, minimum: 0, description: 变更申请当前版本}
        decision: {type: string, enum: [APPROVE, REJECT]}
        comment: {type: string, maxLength: 1000, nullable: true}
    RevalidateChangeRequest:
      type: object
      required: [version, baseVersion, reason]
      properties:
        version: {type: integer, format: int64, minimum: 0, description: 冲突申请当前版本}
        baseVersion: {type: integer, format: int64, minimum: 0, description: 机构当前最新版本；不是旧冲突版本}
        reason: {type: string, minLength: 1, maxLength: 1000}
