        intent: {type: string, nullable: true, enum: [GENERAL, APPOINTMENT_INTENT, PRICE_INQUIRY, REPURCHASE_INTENT, null]}
        aiProvider: {type: string, nullable: true}
        aiModel: {type: string, nullable: true}
        sendProvider: {type: string, nullable: true, enum: [OFFICIAL, MOCK, DISABLED, null]}
