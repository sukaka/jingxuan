    UploadInitRequest:
      type: object
      required: [originalName, mimeType, sizeBytes, sha256, classification]
      properties:
        originalName: {type: string, minLength: 1, maxLength: 255}
        mimeType: {type: string, enum: [application/pdf, image/jpeg, image/png, text/plain, text/markdown, text/x-markdown], description: 实际内容会在完成时重新检测；知识发布只接受 CLEAN MATERIAL 的 UTF-8 TXT/Markdown，且最大 1 MiB}
        sizeBytes: {type: integer, format: int64, minimum: 1, description: 声明字节数；还须通过服务端配置上限及完成时实际大小校验}
        sha256: {type: string, pattern: '[0-9a-fA-F]{64}', description: 声明内容摘要，完成时必须与实际对象一致}
        classification: {type: string, enum: [CONTRACT, QUALIFICATION, CHANGE_EVIDENCE, PAYMENT, REDEMPTION, MATERIAL, MERCHANT_RESOURCE]}
        institutionId: {type: integer, format: int64, minimum: 1, nullable: true, description: 除 PAYMENT 可空外，其他类别必填并检查机构范围}
    UploadInitResponse:
      type: object
      required: [fileId, objectKey, uploadUrl, expiresAt, method, sha256]
      description: uploadUrl 仅用于短期私有 PUT 上传，不是永久公开 URL，也不代表文件已 CLEAN。
      properties:
        fileId: {type: integer, format: int64}
        objectKey: {type: string, description: 私有对象键，不是公开地址}
        uploadUrl: {type: string, format: uri, description: 短期预签名 PUT URL}
        expiresAt: {type: string, format: date-time}
        method: {type: string, enum: [PUT]}
        sha256: {type: string, pattern: '[0-9a-fA-F]{64}'}
    UploadCompleteRequest:
      type: object
      required: [fileId, etag]
      properties:
        fileId: {type: integer, format: int64, minimum: 1}
        etag: {type: string, minLength: 1, maxLength: 128, description: 对象存储 ETag；CLEAN 回放必须与已记录值一致}
    FileMetadataResponse:
      type: object
      required: [id, objectKey, originalName, mimeType, sizeBytes, sha256, classification, institutionId, scanStatus, uploadedBy, etag, lastError, expiresAt, createdAt, updatedAt, version]
      description: 私有元数据，不包含下载 URL。只有 scanStatus=CLEAN 且未过期的文件才能被机构文档引用或下载。
      properties:
        id: {type: integer, format: int64}
        objectKey: {type: string, description: 私有对象键，不是公开 URL}
        originalName: {type: string, nullable: true}
        mimeType: {type: string}
        sizeBytes: {type: integer, format: int64, minimum: 0}
        sha256: {type: string, pattern: '[0-9a-fA-F]{64}'}
        classification: {type: string, enum: [CONTRACT, QUALIFICATION, CHANGE_EVIDENCE, PAYMENT, REDEMPTION, MATERIAL, MERCHANT_RESOURCE]}
        institutionId: {type: integer, format: int64, nullable: true}
        scanStatus: {type: string, enum: [PENDING, SCANNING, CLEAN, BLOCKED, ERROR]}
        uploadedBy: {type: integer, format: int64}
        etag: {type: string, nullable: true}
        lastError: {type: string, nullable: true, description: 脱敏失败类别，不包含对象内容或签名凭证}
        expiresAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
