      description: 资料类型不可改变；version 用于乐观锁，status 仅支持 PUBLISHED/OFFLINE。附件须为同机构 MERCHANT_RESOURCE 且扫描 CLEAN 的私有文件。操作写入审计并支持幂等。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
