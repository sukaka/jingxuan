    MaterialRevisionView:
      type: object
      required: [id, materialId, revisionNo, title, summary, categoryCode, institutionId, projectId, cityCode, tags, fileId, changeNote, status, reviewerId, reviewNote, reviewedAt, createdBy, createdAt, updatedAt, version]
      properties:
        id: {type: integer, format: int64}
        materialId: {type: integer, format: int64}
        revisionNo: {type: integer, format: int32, minimum: 1}
        title: {type: string}
        summary: {type: string, nullable: true}
        categoryCode: {type: string}
        institutionId: {type: integer, format: int64, nullable: true}
        projectId: {type: integer, format: int64, nullable: true}
        cityCode: {type: string, nullable: true}
        tags: {type: array, items: {type: string}}
        fileId: {type: integer, format: int64, description: 私有文件引用，不是公开 URL}
        changeNote: {type: string, nullable: true}
        status: {type: string, enum: [DRAFT, PENDING, APPROVED, REJECTED]}
        reviewerId: {type: integer, format: int64, nullable: true}
        reviewNote: {type: string, nullable: true}
        reviewedAt: {type: string, format: date-time, nullable: true}
        createdBy: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
    MaterialView:
      type: object
      required: [id, materialNo, title, categoryCode, institutionId, projectId, cityCode, summary, tags, currentRevisionId, reviewStatus, createdBy, createdAt, updatedAt, version, revisions]
      properties:
        id: {type: integer, format: int64}
        materialNo: {type: string}
        title: {type: string}
        categoryCode: {type: string}
        institutionId: {type: integer, format: int64, nullable: true}
        projectId: {type: integer, format: int64, nullable: true}
        cityCode: {type: string, nullable: true}
        summary: {type: string, nullable: true}
        tags: {type: array, items: {type: string}}
        currentRevisionId: {type: integer, format: int64, nullable: true, description: 仅 APPROVED 修订成为当前版本；DRAFT/PENDING/REJECTED 不冒充实审通过}
        reviewStatus: {type: string, enum: [DRAFT, PENDING, APPROVED, REJECTED], description: 审核状态不以下架覆盖；主档下架状态由 offlineAt 表示}
        offlineAt: {type: string, format: date-time, nullable: true, description: 非空表示已下架；普通只读管家不可见}
        offlineBy: {type: integer, format: int64, nullable: true}
        offlineReason: {type: string, nullable: true}
        createdBy: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
        revisions: {type: array, items: {$ref: '#/components/schemas/MaterialRevisionView'}, description: 列表响应仅含本行一个修订；详情响应包含当前范围可见历史并按 revisionNo 倒序}
    MaterialDownload:
      type: object
      required: [materialId, revisionId, fileId, downloadUrl, expiresAt]
      description: downloadUrl 是短期预签名 GET URL，不是公开文件地址；到期后须重新授权申请。
      properties:
        materialId: {type: integer, format: int64}
        revisionId: {type: integer, format: int64}
        fileId: {type: integer, format: int64}
        downloadUrl: {type: string, format: uri}
        expiresAt: {type: string, format: date-time}
    MaterialPageResponse:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data:
          type: object
          required: [items, total, page, size]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/MaterialView'}}
            total: {type: integer, format: int64, minimum: 0}
            page: {type: integer, format: int32, minimum: 1}
            size: {type: integer, format: int32, minimum: 1, maximum: 100}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    MaterialEnvelope:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data: {$ref: '#/components/schemas/MaterialView'}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    MaterialDownloadEnvelope:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data: {$ref: '#/components/schemas/MaterialDownload'}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    ExportType:
      type: string
      enum: [CUSTOMER, ORDER, REDEMPTION, FOLLOWUP]
      description: 分别要求 customer:read、order:read、redemption:read、followup:read，另需 export:create
    ExportStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, FAILED]
    ExportFilterInput:
      type: object
      properties:
        customerId: {type: integer, format: int64, minimum: 1, nullable: true}
        status: {type: string, maxLength: 64, nullable: true, description: FOLLOWUP 导出不支持状态筛选}
        cityCode: {type: string, maxLength: 64, nullable: true, description: 仅 CUSTOMER 导出支持}
        sourceCode: {type: string, maxLength: 64, nullable: true, description: 仅 CUSTOMER 导出支持}
        sourceSystem: {type: string, maxLength: 48, nullable: true, description: 仅 ORDER 导出支持}
        channelCode: {type: string, maxLength: 64, nullable: true, description: 仅 CUSTOMER/FOLLOWUP 导出支持}
        from: {type: string, format: date-time, nullable: true, description: 带时区的开始时间；不得晚于 to}
        to: {type: string, format: date-time, nullable: true, description: 带时区的结束时间}
    ExportFilter:
      allOf:
        - $ref: '#/components/schemas/ExportFilterInput'
        - type: object
          required: [customerId, status, cityCode, sourceCode, sourceSystem, channelCode, from, to]
    ExportScopeRequest:
      type: object
      description: 可选收窄条件；不能扩大服务端实时数据范围。institutionIds 仅 REDEMPTION 导出支持。
      properties:
        teamIds: {type: array, items: {type: integer, format: int64, minimum: 1}}
        ownerId: {type: integer, format: int64, minimum: 1, nullable: true}
        institutionIds: {type: array, items: {type: integer, format: int64, minimum: 1}}
    CreateExportRequest:
      type: object
      required: [exportType, reason]
      properties:
        exportType: {$ref: '#/components/schemas/ExportType'}
        columns:
          type: array
          maxItems: 40
          items: {type: string, minLength: 1, maxLength: 64}
          description: |-
            服务端按 exportType 校验字段白名单；缺省使用该类型默认字段，重复或未列出字段返回 400。
            CUSTOMER 可选 customerNo, displayName, nickname, remarkName, mobile, cityCode, sourceCode, channelCode, customerStatus, tierCode, intentLevel, spendingLevel, birthday, points, attentionProjects, blockerNote, remark, ownerStaffId, ownerName, teamId, firstAddedAt, firstOrderAt, lastFollowupAt, createdAt；默认 customerNo, displayName, mobile, customerStatus, ownerStaffId, teamId, createdAt。
            ORDER 可选 orderNo, customerNo, customerName, soldByUserId, ownerAtSaleId, externalOrderNo, sourceSystem, orderTypeCode, campaignId, campaignBatchId, status, receiverType, listAmountFen, discountAmountFen, payableFen, paidFen, refundedFen, orderedAt, paidAt, createdAt；默认 orderNo, customerNo, status, payableFen, paidFen, refundedFen, orderedAt。
            REDEMPTION 可选 redemptionId, appointmentId, customerNo, customerName, institutionId, ownerStaffId, teamId, serviceAt, status, settlementStatus, postedBy, postedAt, createdAt；默认 redemptionId, customerNo, institutionId, serviceAt, status, postedAt。
            FOLLOWUP 可选 followupId, customerNo, customerName, ownerStaffId, ownerName, channelCode, contactAt, summary, intentProject, estimatedAmountFen, nextFollowupAt, blockerNote, createdBy, createdAt；默认 followupId, customerNo, ownerStaffId, channelCode, contactAt, nextFollowupAt。
        reason: {type: string, minLength: 2, maxLength: 500}
        filters:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ExportFilterInput'
        scope:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ExportScopeRequest'
    ExportScope:
      type: object
      required: [kind, teamIds, selfId, institutionIds]
      properties:
        kind: {type: string, enum: [ALL, TEAM, SELF, INSTITUTION, NONE]}
        teamIds: {type: array, items: {type: integer, format: int64}}
        selfId: {type: integer, format: int64}
        institutionIds: {type: array, items: {type: integer, format: int64}}
    ExportRestriction:
      type: object
      required: [teamIds, ownerId, institutionIds]
      properties:
        teamIds: {type: array, nullable: true, items: {type: integer, format: int64}}
        ownerId: {type: integer, format: int64, nullable: true}
        institutionIds: {type: array, nullable: true, items: {type: integer, format: int64}}
    StoredExportScope:
      type: object
      required: [requested, executed, restriction]
      description: requested 为申请时服务端范围，executed 为实际执行时与实时范围求交并收窄后的结果，restriction 为客户端可选收窄；下载时重新核对当前范围。
      properties:
        requested: {$ref: '#/components/schemas/ExportScope'}
        executed:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ExportScope'
        restriction:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ExportRestriction'
    ExportJob:
      type: object
      required: [id, jobNo, exportType, status, columns, filters, scope, reason, rowCount, fileId, expiresAt, lastError, startedAt, finishedAt, createdAt, updatedAt, version]
      properties:
        id: {type: integer, format: int64}
        jobNo: {type: string}
        exportType: {$ref: '#/components/schemas/ExportType'}
        status: {$ref: '#/components/schemas/ExportStatus'}
        columns: {type: array, items: {type: string}, description: 服务端已校验的字段编码}
        filters: {$ref: '#/components/schemas/ExportFilter'}
        scope: {$ref: '#/components/schemas/StoredExportScope'}
        reason: {type: string}
        rowCount: {type: integer, format: int64, minimum: 0}
        fileId: {type: integer, format: int64, nullable: true, description: 私有 EXPORT 文件引用，不是公开 URL}
        expiresAt: {type: string, format: date-time, nullable: true}
        lastError: {type: string, nullable: true, description: 脱敏失败类别，不包含导出内容}
        startedAt: {type: string, format: date-time, nullable: true}
        finishedAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
    ExportAccessLog:
      type: object
      required: [id, jobId, actorUserId, action, result, reason, denialCode, createdAt]
      properties:
        id: {type: integer, format: int64}
        jobId: {type: integer, format: int64, nullable: true}
        actorUserId: {type: integer, format: int64}
        action: {type: string, enum: [REQUEST, DOWNLOAD]}
        result: {type: string, enum: [ALLOWED, DENIED]}
        reason: {type: string}
        denialCode: {type: string, nullable: true, description: 审计拒绝原因；不是新增全局 API 错误码}
        createdAt: {type: string, format: date-time}
    ExportDownload:
      type: object
      required: [fileId, downloadUrl, expiresAt]
      description: downloadUrl 是短期预签名 GET URL，不是公开文件地址；过期后须重新执行授权检查并申请。
      properties:
        fileId: {type: integer, format: int64}
        downloadUrl: {type: string, format: uri}
        expiresAt: {type: string, format: date-time}
    ExportJobPageResponse:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data:
          type: object
          required: [items, total, page, size]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/ExportJob'}}
            total: {type: integer, format: int64, minimum: 0}
            page: {type: integer, format: int32, minimum: 1}
            size: {type: integer, format: int32, minimum: 1, maximum: 100}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    ExportJobEnvelope:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data: {$ref: '#/components/schemas/ExportJob'}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    ExportAccessLogPageResponse:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data:
          type: object
          required: [items, total, page, size]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/ExportAccessLog'}}
            total: {type: integer, format: int64, minimum: 0}
            page: {type: integer, format: int32, minimum: 1}
            size: {type: integer, format: int32, minimum: 1, maximum: 100}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    ExportDownloadEnvelope:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data: {$ref: '#/components/schemas/ExportDownload'}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    ClaimRiskCaseRequest:
      type: object
      required: [version]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        reason: {type: string, maxLength: 1000, nullable: true}
    ResolveRiskCaseRequest:
      type: object
      required: [version, resolution]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        resolution: {type: string, minLength: 1, maxLength: 2000}
    CloseRiskCaseRequest:
      type: object
      required: [version, reason]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 1000}
    RiskCase:
      type: object
      required: [id, riskCaseNo, riskType, severity, sourceType, sourceRef, status, createdAt, updatedAt, version]
      description: evidence/resolution 已脱敏；值为 null 的可选字段按 NON_NULL 省略。
      properties:
        id: {type: integer, format: int64}
        riskCaseNo: {type: string}
        riskType: {type: string}
        severity: {type: string, enum: [HIGH, MEDIUM, LOW]}
        sourceType: {type: string}
        sourceRef: {type: string}
        status: {type: string, enum: [OPEN, ASSIGNED, RESOLVED, CLOSED]}
        ownerUserId: {type: integer, format: int64, nullable: true}
        evidence: {type: string, nullable: true, description: 脱敏证据，不包含原始敏感报文}
        resolution: {type: string, nullable: true}
        resolvedAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
        orderId: {type: integer, format: int64, nullable: true, description: 由真实来源记录关联；无法可靠关联时为 null}
        orderNo: {type: string, nullable: true}
        customerId: {type: integer, format: int64, nullable: true, description: 只来自真实订单或已确认客户映射，不使用原型演示客户}
        customerNo: {type: string, nullable: true}
        customerName: {type: string, nullable: true, description: 可空；前端应显示未关联/待核实，不能补造名称}
    RiskCaseHistory:
      type: object
      required: [id, riskCaseId, action, fromStatus, toStatus, actorUserId, note, createdAt]
      properties:
        id: {type: integer, format: int64}
        riskCaseId: {type: integer, format: int64}
        action: {type: string, enum: [REGISTER, CLAIM, RESOLVE, CLOSE]}
        fromStatus: {type: string, enum: [OPEN, ASSIGNED, RESOLVED, CLOSED], nullable: true, description: REGISTER 时为 null}
        toStatus: {type: string, enum: [OPEN, ASSIGNED, RESOLVED, CLOSED]}
        actorUserId: {type: integer, format: int64, nullable: true, description: 系统登记可为 null}
        note: {type: string, nullable: true, description: 脱敏备注}
        createdAt: {type: string, format: date-time}
    RiskCaseDetail:
      type: object
      required: [riskCase, history]
      properties:
        riskCase: {$ref: '#/components/schemas/RiskCase'}
        history: {type: array, items: {$ref: '#/components/schemas/RiskCaseHistory'}, description: 只追加历史，不提供修改或物理删除接口}
    RiskCasePageResponse:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data:
          type: object
          required: [items, total, page, size]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/RiskCase'}}
            total: {type: integer, format: int64, minimum: 0}
            page: {type: integer, format: int32, minimum: 1}
            size: {type: integer, format: int32, minimum: 1, maximum: 100}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    RiskCaseDetailEnvelope:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data: {$ref: '#/components/schemas/RiskCaseDetail'}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    RiskSyncResponse:
      type: object
      required: [createdCount, updatedCount, syncedAt]
      properties:
        createdCount: {type: integer, format: int32, minimum: 0}
        updatedCount: {type: integer, format: int32, minimum: 0}
        syncedAt: {type: string, format: date-time}
    RiskSyncEnvelope:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data: {$ref: '#/components/schemas/RiskSyncResponse'}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    PointsLedgerItem:
      type: object
      required: [id, delta, reasonCode, sourceType, sourceRef, operatorUserId, createdAt]
      properties:
        id: {type: integer, format: int64}
        delta: {type: integer, format: int32, description: 积分增减值，正数增加、负数扣减；不是金额}
        reasonCode: {type: string}
        sourceType: {type: string, description: 手工调整为 MANUAL_ADJUST；其他追加分录按真实来源返回}
        sourceRef: {type: string}
        operatorUserId: {type: integer, format: int64, nullable: true}
        createdAt: {type: string, format: date-time}
    CustomerPointsView:
      type: object
      required: [balance, ledger]
      properties:
        balance: {type: integer, format: int64, description: 权威账本 SUM(delta)，不是 points_cached，也不是金额}
        ledger: {type: array, items: {$ref: '#/components/schemas/PointsLedgerItem'}}
    CustomerPointsEnvelope:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data: {$ref: '#/components/schemas/CustomerPointsView'}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    CustomerSegmentCriteria:
      type: object
      additionalProperties: false
      description: 各条件组之间为 AND，同一组代码或项目 ID 之间为 OR；空数组表示该组不限制。服务端去空白、去重并排序，所有项目条件使用 crm_project 正式子项目 ID。
      properties:
        cityCodes:
          type: array
          maxItems: 20
          default: []
          items: {type: string, minLength: 1, maxLength: 64}
          description: 当前客户 city_code 集合
        tierCodes:
          type: array
          maxItems: 20
          default: []
          items: {type: string, minLength: 1, maxLength: 16}
          description: 当前客户 tier_code 集合；不提供任何生产分级阈值
        attentionProjectIds:
          type: array
          maxItems: 20
          default: []
          items: {type: integer, format: int64, minimum: 1}
          description: 当前正规关注项目；仅匹配 crm_customer_attention_project，不按旧 attention_projects 文本猜测
        purchasedProjectIds:
          type: array
          maxItems: 20
          default: []
          items: {type: integer, format: int64, minimum: 1}
          description: 曾经发放项目的任一正向 GRANT 权益流水；不要求当前仍有余额，不受后续退款回收影响
        redeemedProjectIds:
          type: array
          maxItems: 20
          default: []
          items: {type: integer, format: int64, minimum: 1}
          description: 按任一选中项目分别计算正式 REDEEM 减已批准 REDEMPTION_REVERSAL 冲正的净核销次数，不合计多个项目
        redeemedMinCount:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1
          description: 仅作用于 redeemedProjectIds 中任一项目的净核销阈值；缺省为 1，未选核销项目时不产生筛选
    CreateCustomerSegmentRequest:
      type: object
      additionalProperties: false
      required: [name, filters]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        filters: {$ref: '#/components/schemas/CustomerSegmentCriteria'}
    UpdateCustomerSegmentRequest:
      type: object
      additionalProperties: false
      required: [name, filters, version]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        filters: {$ref: '#/components/schemas/CustomerSegmentCriteria'}
        version: {type: integer, format: int64, minimum: 0}
    PreviewCustomerSegmentRequest:
      type: object
      additionalProperties: false
      required: [filters]
      properties:
        filters: {$ref: '#/components/schemas/CustomerSegmentCriteria'}
        page: {type: integer, minimum: 1, default: 1}
        size: {type: integer, minimum: 1, maximum: 100, default: 20}
    CreateSegmentOperationBatchRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        operationType: {type: string, enum: [FOLLOWUP], default: FOLLOWUP, description: 当前仅记录 FOLLOWUP 操作意图，不自动创建跟进}
        version: {type: integer, format: int64, minimum: 0, description: 分组定义当前版本}
    CustomerSegment:
      type: object
      required: [id, name, filters, createdAt, updatedAt, version]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        name: {type: string, maxLength: 128}
        filters: {$ref: '#/components/schemas/CustomerSegmentCriteria'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
    CustomerSegmentBatch:
      type: object
      required: [id, segmentId, batchNo, operationType, memberCount, createdAt]
      description: 显式创建时冻结的条件、数据范围成员及数量快照；响应不返回成员清单，且创建批次本身不执行 FOLLOWUP。
      properties:
        id: {type: integer, format: int64, minimum: 1}
        segmentId: {type: integer, format: int64, minimum: 1}
        batchNo: {type: string, maxLength: 64}
        operationType: {type: string, enum: [FOLLOWUP]}
        memberCount: {type: integer, minimum: 0}
        createdAt: {type: string, format: date-time}
    CustomerSegmentPage:
      type: object
      required: [items, total, page, size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/CustomerSegment'}}
        total: {type: integer, format: int64, minimum: 0}
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1, maximum: 100}
    CustomerSegmentMemberPage:
      type: object
      required: [items, total, page, size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/CustomerSummary'}}
        total: {type: integer, format: int64, minimum: 0}
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1, maximum: 100}
    CustomerSegmentEnvelope:
      allOf:
        - {$ref: '#/components/schemas/ApiResponse'}
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/CustomerSegment'}
    CustomerSegmentBatchEnvelope:
      allOf:
        - {$ref: '#/components/schemas/ApiResponse'}
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/CustomerSegmentBatch'}
    CustomerSegmentPageEnvelope:
      allOf:
        - {$ref: '#/components/schemas/ApiResponse'}
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/CustomerSegmentPage'}
    CustomerSegmentMemberPageEnvelope:
      allOf:
        - {$ref: '#/components/schemas/ApiResponse'}
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/CustomerSegmentMemberPage'}
    CustomerTimelineItem:
      type: object
      required: [type, eventKey, sourceId, occurredAt, title, summary, details, actorUserId]
      description: 跨领域当前摘要视图，不是新的 Kafka 事件或历史流水替代品；details 只含各来源白名单字段，不含聊天全文。
      properties:
        type: {type: string, enum: [FOLLOWUP, INTENT, BLOCKER, NEXT_FOLLOWUP, TASK, OWNERSHIP, ORDER, APPOINTMENT, REDEMPTION, REFUND, TIER, COMPLAINT]}
        eventKey: {type: string, minLength: 1, maxLength: 128, description: 来源 ID 的 20 位左补零字符串与事件判别符组成，用于同时间稳定排序}
        sourceId: {type: string, pattern: '^\d+$', description: 来源记录 ID 的字符串形式，不是 event_id 或客户 ID}
        occurredAt: {type: string, format: date-time}
        title: {type: string}
        summary: {type: string, nullable: true, description: 来源摘要或脱敏结论；前端必须按纯文本渲染}
        details:
          type: object
          additionalProperties: true
          description: 按 type 返回的白名单业务字段；不保证跨类型具有相同键，不包含聊天正文
        actorUserId: {type: integer, format: int64, minimum: 1, nullable: true}
    CustomerTimelinePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/CustomerTimelineItem'}}
        nextCursor: {type: string, maxLength: 1024, nullable: true, description: 仅在有下一页时返回；按 occurredAt/type/eventKey 倒序继续，绑定本客户且不是跨客户授权凭证}
    CustomerTimelineEnvelope:
      allOf:
        - {$ref: '#/components/schemas/ApiResponse'}
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/CustomerTimelinePage'}
    BatchTagOperation:
      type: string
      enum: [ADD, REMOVE]
      description: ADD 只新增缺失目标标签，REMOVE 只删除存在目标标签；均保留其他标签
    BatchTagSourceType:
      type: string
      enum: [FILTER, SEGMENT, OPERATION_BATCH, ROLLBACK]
    BatchTagJobStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, PARTIAL_FAILED, FAILED]
    BatchTagJobItemStatus:
      type: string
      enum: [PENDING, SUCCEEDED, NO_CHANGE, SKIPPED, FAILED]
    BatchTagSourceRequest:
      type: object
      additionalProperties: false
      required: [type]
      description: FILTER 可提供 filters（缺省为空条件）；SEGMENT/OPERATION_BATCH 必须提供正整数 id。OPERATION_BATCH 固定使用 V33 快照，但取数时仍应用当前客户数据范围。
      properties:
        type: {type: string, enum: [FILTER, SEGMENT, OPERATION_BATCH]}
        id: {type: integer, format: int64, minimum: 1, nullable: true}
        filters: {$ref: '#/components/schemas/CustomerSegmentCriteria'}
        batchNo: {type: string, maxLength: 128, nullable: true, description: 可选批次编号字段；当前服务端以来源 id 定位，batchNo 不能替代 id}
    PreviewBatchTagJobRequest:
      type: object
      additionalProperties: false
      required: [operation, tagCodes, source]
      properties:
        operation: {$ref: '#/components/schemas/BatchTagOperation'}
        tagCodes:
          type: array
          minItems: 1
          maxItems: 20
          items: {type: string, pattern: '^\S{1,64}$'}
          description: 服务端去空白、去重并排序；ADD 须全部为 ACTIVE customerTags，REMOVE 可包含未知历史标签
        source: {$ref: '#/components/schemas/BatchTagSourceRequest'}
        page: {type: integer, minimum: 1, default: 1, description: 仅控制预览响应页，不限制固定快照成员总数}
        size: {type: integer, minimum: 1, maximum: 100, default: 20, description: 仅控制预览响应页大小}
    CreateBatchTagJobRequest:
      type: object
      additionalProperties: false
      required: [previewId]
      properties:
        previewId: {type: string, minLength: 1, maxLength: 64, description: 当前用户本人创建的服务端预览令牌；客户端不能提交替代成员清单}
    BatchTagJobActionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: {type: integer, format: int64, minimum: 0, description: execute/retry 为当前任务版本；rollback 为原任务版本}
    BatchTagMember:
      type: object
      required: [customerId, customerNo, customerName, ownerStaffId, teamId]
      properties:
        customerId: {type: integer, format: int64, minimum: 1}
        customerNo: {type: string, maxLength: 48}
        customerName: {type: string, maxLength: 192, nullable: true, description: 预览时客户称呼快照}
        ownerStaffId: {type: integer, format: int64, minimum: 1, description: 预览时专属管家快照，执行仍复核当前归属}
        teamId: {type: integer, format: int64, minimum: 1, nullable: true}
    BatchTagPreview:
      type: object
      required: [previewId, operation, tagCodes, sourceType, sourceId, items, total, page, size]
      properties:
        previewId: {type: string, maxLength: 64}
        operation: {$ref: '#/components/schemas/BatchTagOperation'}
        tagCodes: {type: array, items: {type: string, maxLength: 64}}
        sourceType: {type: string, enum: [FILTER, SEGMENT, OPERATION_BATCH]}
        sourceId: {type: integer, format: int64, minimum: 1, nullable: true, description: FILTER 为 null，其余为分组或操作批次 ID}
        items: {type: array, items: {$ref: '#/components/schemas/BatchTagMember'}}
        total: {type: integer, format: int64, minimum: 0, description: 服务端固定快照成员总数，不仅是本页数量}
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1, maximum: 100}
    BatchTagScopeSnapshot:
      type: object
      additionalProperties: false
      required: [type, teamIds, selfId]
      description: 请求时授权上下文快照，仅用于审计；执行授权以原请求人的实时权限和数据范围为准。
      properties:
        type: {type: string, enum: [ALL, TEAM, SELF]}
        teamIds: {type: array, items: {type: integer, format: int64, minimum: 1}}
        selfId: {type: integer, format: int64, minimum: 1, description: 请求人用户 ID}
    BatchTagSourceSnapshot:
      type: object
      additionalProperties: false
      description: 按 sourceType 保存 FILTER 的 filters，SEGMENT 的 segmentId/name/version/filters，OPERATION_BATCH 的批次与 filters，或 ROLLBACK 的原任务信息。
      properties:
        filters: {$ref: '#/components/schemas/CustomerSegmentCriteria'}
        segmentId: {type: integer, format: int64, minimum: 1}
        name: {type: string, maxLength: 128}
        version: {type: integer, format: int64, minimum: 0}
        batchId: {type: integer, format: int64, minimum: 1}
        batchNo: {type: string, maxLength: 64}
        operationType: {type: string, enum: [FOLLOWUP]}
        memberCount: {type: integer, minimum: 0}
        originalJobId: {type: integer, format: int64, minimum: 1}
        originalJobNo: {type: string, maxLength: 64}
        originalOperation: {$ref: '#/components/schemas/BatchTagOperation'}
    BatchTagJob:
      type: object
      required: [id, jobNo, requestedBy, operation, tagCodes, sourceType, sourceId, sourceSnapshot, scopeSnapshot, idempotencyKey, rollbackOfJobId, status, totalCount, succeededCount, noChangeCount, skippedCount, failedCount, attemptCount, lastErrorMasked, createdAt, startedAt, finishedAt, version]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        jobNo: {type: string, maxLength: 64}
        requestedBy: {type: integer, format: int64, minimum: 1, description: 原请求人；worker 按此身份实时重验}
        operation: {$ref: '#/components/schemas/BatchTagOperation'}
        tagCodes: {type: array, items: {type: string, maxLength: 64}, description: 任务级标签并集；回滚明细可仅为各自实际变更子集}
        sourceType: {$ref: '#/components/schemas/BatchTagSourceType'}
        sourceId: {type: integer, format: int64, minimum: 1, nullable: true, description: FILTER 为 null；ROLLBACK 为原任务 ID}
        sourceSnapshot: {$ref: '#/components/schemas/BatchTagSourceSnapshot'}
        scopeSnapshot: {$ref: '#/components/schemas/BatchTagScopeSnapshot'}
        idempotencyKey: {type: string, minLength: 1, maxLength: 128, description: 创建该任务的幂等键快照}
        rollbackOfJobId: {type: integer, format: int64, minimum: 1, nullable: true, description: 独立回滚任务指向原任务；普通任务为 null}
        status: {$ref: '#/components/schemas/BatchTagJobStatus'}
        totalCount: {type: integer, minimum: 0}
        succeededCount: {type: integer, minimum: 0, description: 实际发生标签变更的明细数}
        noChangeCount: {type: integer, minimum: 0, description: 目标状态已符合、未重复变更的明细数}
        skippedCount: {type: integer, minimum: 0, description: 权限、归属、客户删除/合并等实时复核跳过数}
        failedCount: {type: integer, minimum: 0}
        attemptCount: {type: integer, minimum: 0, description: 已完成的任务执行次数，不是明细数}
        lastErrorMasked: {type: string, maxLength: 512, nullable: true}
        createdAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time, nullable: true, description: 最近一次开始时间}
        finishedAt: {type: string, format: date-time, nullable: true, description: 最近一次完成时间}
        version: {type: integer, format: int64, minimum: 0}
    BatchTagJobItem:
      type: object
      required: [id, customerId, customerNo, customerName, ownerStaffId, teamId, tagCodes, status, failureCode, reason, beforeTagCodes, afterTagCodes, changedTagCodes, attemptCount, processedAt, version]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        customerId: {type: integer, format: int64, minimum: 1}
        customerNo: {type: string, maxLength: 48}
        customerName: {type: string, maxLength: 192, nullable: true}
        ownerStaffId: {type: integer, format: int64, minimum: 1}
        teamId: {type: integer, format: int64, minimum: 1, nullable: true}
        tagCodes: {type: array, items: {type: string, maxLength: 64}, description: 此明细实际请求处理标签；独立回滚为原成功变更子集}
        status: {$ref: '#/components/schemas/BatchTagJobItemStatus'}
        failureCode: {type: string, maxLength: 64, nullable: true, description: 如 PERMISSION_REVOKED、OWNERSHIP_OUT_OF_SCOPE、MERGE_CONFLICT、CUSTOMER_NOT_FOUND、TAG_DICTIONARY_INACTIVE}
        reason: {type: string, maxLength: 500, nullable: true, description: 脱敏结果说明}
        beforeTagCodes: {type: array, items: {type: string}, nullable: true, description: 最近一次已处理尝试前完整标签，含未知历史标签；SKIPPED/FAILED 可为 null}
        afterTagCodes: {type: array, items: {type: string}, nullable: true, description: 最近一次已处理尝试后完整标签}
        changedTagCodes: {type: array, items: {type: string}, nullable: true, description: 最近一次实际改变子集；独立回滚只依据原任务该事实}
        attemptCount: {type: integer, minimum: 0}
        processedAt: {type: string, format: date-time, nullable: true}
        version: {type: integer, format: int64, minimum: 0}
    BatchTagJobItemPage:
      type: object
      required: [items, total, page, size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/BatchTagJobItem'}}
        total: {type: integer, format: int64, minimum: 0}
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1, maximum: 100}
    BatchTagJobDetail:
      type: object
      required: [job, items]
      properties:
        job: {$ref: '#/components/schemas/BatchTagJob'}
        items: {$ref: '#/components/schemas/BatchTagJobItemPage'}
    BatchTagJobPage:
      type: object
      required: [items, total, page, size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/BatchTagJob'}}
        total: {type: integer, format: int64, minimum: 0}
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1, maximum: 100}
    BatchTagPreviewEnvelope:
      allOf:
        - {$ref: '#/components/schemas/ApiResponse'}
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/BatchTagPreview'}
    BatchTagJobDetailEnvelope:
      allOf:
        - {$ref: '#/components/schemas/ApiResponse'}
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/BatchTagJobDetail'}
    BatchTagJobPageEnvelope:
      allOf:
        - {$ref: '#/components/schemas/ApiResponse'}
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/BatchTagJobPage'}
    ApiResponse:
      type: object
      required: [code, message, requestId, timestamp]
      description: 通用成功响应信封；data 的具体结构由引用此模型的接口定义
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data: {description: 由具体接口定义的响应数据}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    EmptyResponse:
      type: object
      required: [code, message, requestId, timestamp]
      description: ApiResponse<Void>；data 为 null 时按 NON_NULL 省略。
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    ClaimTaskRequest:
      type: object
      required: [version]
      properties:
        version: {type: integer, format: int64, minimum: 0, description: 任务当前乐观锁版本}
    ReassignTaskRequest:
      type: object
      required: [assigneeUserId, reason, version]
      properties:
        assigneeUserId: {type: integer, format: int64, description: 目标 ACTIVE 内部员工用户 ID}
        reason: {type: string, minLength: 1, maxLength: 500, description: 转派原因，不得为空白}
        version: {type: integer, format: int64, minimum: 0, description: 任务当前乐观锁版本}
    ReturnTaskRequest:
      type: object
      required: [reason, version]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500, description: 退回原因，不得为空白}
        version: {type: integer, format: int64, minimum: 0, description: 任务当前乐观锁版本}
    CompleteTaskRequest:
      type: object
      required: [version]
      properties:
        version: {type: integer, format: int64, minimum: 0, description: 任务当前乐观锁版本}
    UpdateTaskAssigneeRequest:
      type: object
      required: [assigneeUserId, reason, version]
      description: 旧版 /assignee 请求；与 REASSIGN 使用相同字段和约束
      properties:
        assigneeUserId: {type: integer, format: int64, description: 目标 ACTIVE 内部员工用户 ID}
        reason: {type: string, minLength: 1, maxLength: 500, description: 转派原因，不得为空白}
        version: {type: integer, format: int64, minimum: 0, description: 任务当前乐观锁版本}
    TaskItemResponse:
      type: object
      required: [id, customerId, assigneeUserId, originalAssigneeUserId, taskTeamId, taskType, priority, status, title, description, dueAt, claimedAt, completedAt, createdAt, version]
      properties:
        id: {type: integer, format: int64}
        customerId: {type: integer, format: int64, nullable: true}
        assigneeUserId: {type: integer, format: int64, nullable: true, description: 当前负责人；OPEN 任务池任务为空}
        originalAssigneeUserId: {type: integer, format: int64, nullable: true, description: 首次负责人；创建后不可变，退回任务池仍保留}
        taskTeamId: {type: integer, format: int64, nullable: true, description: 任务池团队快照；转派时更新为目标团队，不随成员日后换组自动改变}
        taskType: {type: string}
        priority: {type: string, enum: [LOW, MEDIUM, HIGH, URGENT]}
        status: {type: string, enum: [OPEN, PROCESSING, DONE, CANCELED]}
        title: {type: string}
        description: {type: string, nullable: true}
        dueAt: {type: string, format: date-time, nullable: true}
        claimedAt: {type: string, format: date-time, nullable: true, description: 当前负责人接手/转派时间，UTC；退回任务池后清空}
        completedAt: {type: string, format: date-time, nullable: true, description: 完成时间，UTC；未完成时为空}
        createdAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
    TaskItemEnvelope:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data: {$ref: '#/components/schemas/TaskItemResponse'}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    TaskActionItemResponse:
      type: object
      required: [id, taskId, action, fromStatus, toStatus, fromAssigneeUserId, toAssigneeUserId, actorUserId, reason, createdAt]
      properties:
        id: {type: integer, format: int64}
        taskId: {type: integer, format: int64}
        action: {type: string, enum: [CLAIM, REASSIGN, RETURN, COMPLETE]}
        fromStatus: {type: string, enum: [OPEN, PROCESSING, DONE, CANCELED]}
        toStatus: {type: string, enum: [OPEN, PROCESSING, DONE, CANCELED]}
        fromAssigneeUserId: {type: integer, format: int64, nullable: true}
        toAssigneeUserId: {type: integer, format: int64, nullable: true}
        actorUserId: {type: integer, format: int64}
        reason: {type: string, maxLength: 500, nullable: true, description: REASSIGN/RETURN 必有值，CLAIM/COMPLETE 为空}
        createdAt: {type: string, format: date-time, description: 动作发生时间，UTC}
    TaskActionListEnvelope:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data:
          type: array
          items: {$ref: '#/components/schemas/TaskActionItemResponse'}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
