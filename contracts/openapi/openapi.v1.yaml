        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewChangeRequest'}
      responses:
        '200':
          description: 返回审核后申请；可能为 PENDING_REVIEW/APPROVED/REJECTED/CONFLICT_REVALIDATE
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChangeRequestEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/FileScanNotReady'}
