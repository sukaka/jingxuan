        settlementDay: {$ref: '#/components/schemas/SettlementDayRule', nullable: true}
        onlineRate: {type: number, minimum: 0, maximum: 1, nullable: true}
        offlineRate: {type: number, minimum: 0, maximum: 1, nullable: true}
