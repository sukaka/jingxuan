        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/FileScanNotReady'}
  /files/upload-init:
    post:
      tags: [Files]
      summary: 初始化私有上传（已认证 + 文件类别权限/机构范围；每次创建新对象）
      description: >-
        本接口没有 Idempotency-Key，每次调用创建新 PENDING 对象。CONTRACT/QUALIFICATION/CHANGE_EVIDENCE 需 institution:write 或 institution:change_request，
        PAYMENT 需 order:confirm_payment，REDEMPTION 需 redemption:post，MATERIAL 需 material:write；除 PAYMENT 外必须给 institutionId。
        返回短期 PUT 预签名 URL，不是永久公开 URL，也不构成扫描豁免。
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UploadInitRequest'}
      responses:
        '201':
          description: 返回私有 objectKey、短期 uploadUrl、expiresAt、method=PUT 与 sha256
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadInitEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /files/upload-complete:
    post:
      tags: [Files]
      summary: 完成上传并校验/扫描（已认证 + 原类别上传权限与范围；无 Idempotency-Key）
      description: 以 fileId+etag 和版本/扫描状态处理重试；校验 ETag、大小、SHA-256、MIME 和实际内容后执行扫描。CLEAN 且 ETag 相同的回放返回元数据，其他重复/校验或扫描失败返回 409。
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UploadCompleteRequest'}
      responses:
        '200':
          description: 仅实际校验和扫描通过后返回 CLEAN；非 CLEAN 不会被当作可引用文件
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileMetadataEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /files/{id}:
    get:
      tags: [Files]
      summary: 私有文件元数据（已认证 + 类别读取权限与机构范围；范围外 404）
      description: 按类别要求 institution:read/order:read/redemption:read/material:read；只返回元数据，不保证 CLEAN，也不返回永久公开 URL。
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200':
          description: 返回 scanStatus、hash、大小、机构、版本和错误类别等元数据
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileMetadataEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /files/{id}/download:
    get:
      tags: [Files]
      summary: 生成短期私有下载 URL（已认证 + CLEAN + 未过期 + 类别读取权限与范围）
      description: 每次重验权限与 CLEAN/有效期并记录下载审计；downloadUrl 是短期预签名 GET URL，不是永久公开地址，过期后须重新申请。
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200':
          description: 返回 fileId、短期 downloadUrl 与 expiresAt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DownloadEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
