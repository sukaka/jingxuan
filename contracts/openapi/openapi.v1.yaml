        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /institution-qualifications/{id}/review-requests:
    post:
      tags: [InstitutionChanges]
      summary: 资质审核申请（institution:change_request + 范围；baseVersion + CLEAN）
      description: 仅 PENDING_REVIEW 且版本一致的资质可申请，走 MARKET 审核；最终 APPROVED/REJECTED 由审核接口决定，申请人和审核历史均保留。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
