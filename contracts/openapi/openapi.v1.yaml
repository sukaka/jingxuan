    post:
      tags: [InstitutionDocuments]
      summary: 创建 PENDING_REVIEW 资质（institution:change_request + 范围；扫描件必须 CLEAN）
      description: 证照号加密保存，响应只返回 licenseNoMasked；随后通过独立审核申请批准或驳回，不直接写 APPROVED。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateQualificationRequest'}
      responses:
        '201':
          description: 已创建待审核资质
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QualificationEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/FileScanNotReady'}
  /institution-qualifications/{id}:
    get:
