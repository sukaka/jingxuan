      properties:
        availableCount: {type: integer, format: int64, minimum: 0, description: 当前有效且可用的项目服务次数之和}
        customerCount: {type: integer, format: int64, minimum: 0, description: 仍有有效可用权益的去重客户数}
    EntitlementSummaryResponse:
      type: object
