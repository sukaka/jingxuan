        minIntervalSeconds: {type: integer, minimum: 0, maximum: 3600}
        dailyLimit: {type: integer, minimum: 1, maximum: 100}
        allowedStart: {type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$'}
        allowedEnd: {type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$'}
        zoneId: {type: string, minLength: 1, maxLength: 64}
        blockedTerms:
          type: array
