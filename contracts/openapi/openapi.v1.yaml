      tags: [InstitutionProfiles]
      summary: 普通字段白名单更新（institution:write + 员工 ALL；version 乐观锁）
      description: 仅 shortName/cityCode/address/contactName/contactPhone/introduction 可修改，未传字段保持不变；佣金、保证金、结算、名称/等级及银行税号等字段必须走变更申请，未知字段返回 400。
