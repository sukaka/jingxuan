      summary: 机构激活申请（institution:change_request + 范围；baseVersion + CLEAN 证据）
      description: 仅版本一致的 PENDING 主档可申请；资料完整性校验后进入 MARKET→FINANCE 双审，两位审核人必须不同，审批前不改变正式状态。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
