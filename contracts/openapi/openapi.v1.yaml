      required: [corpId]
      properties:
        corpId: {type: string, minLength: 1, maxLength: 96, description: Mock 企业标识；真实企业授权待 Q10}
        cursor: {type: integer, format: int64, minimum: 0, nullable: true, description: 回放起点，不得超过已确认成功 seq；缺省使用已保存游标}
        limit: {type: integer, format: int32, minimum: 1, maximum: 100, nullable: true, description: 缺省 50，仅 Mock 分页限制}
    WecomSyncResponse:
      type: object
      required: [adapter, received, stored, duplicates, skipped, lastSeq, hasMore, dataGap]
      properties:
        adapter: {type: string, example: MOCK_DEV_ONLY, description: Mock/禁用适配器名称，不是官方 SDK 名称}
        received: {type: integer, format: int32, minimum: 0}
        stored: {type: integer, format: int32, minimum: 0, description: 本次实际加密归档消息数}
        duplicates: {type: integer, format: int32, minimum: 0, description: 同 corpId+msgId 已存在而跳过的数量}
        skipped: {type: integer, format: int32, minimum: 0, description: 同意或成员覆盖不满足而跳过数量}
        lastSeq: {type: integer, format: int64, minimum: 0, description: 已确认覆盖区间末尾 seq，失败不得推进}
        hasMore: {type: boolean}
        dataGap: {type: boolean, description: 存在覆盖缺口或尚无已确认覆盖区间；不是无沟通结论}
    WecomLinkRequest:
      type: object
      required: [customerId, version, reason]
      properties:
        customerId: {type: integer, format: int64, description: 当前可见的 CRM 客户 ID，不是昵称或手机号}
        version: {type: integer, format: int64, minimum: 0, description: 联系人当前乐观锁版本}
        reason: {type: string, minLength: 1, maxLength: 1000, description: 人工身份匹配证据和理由}
    WecomContact:
      type: object
      required: [id, corpId, externalUserid, staffUserId, customerId, consentStatus, consentEvidenceRef, linkType, linkReason, createdBy, lastSyncedAt, version]
      properties:
        id: {type: integer, format: int64}
        corpId: {type: string}
        externalUserid: {type: string, description: 企微外部联系身份，不是自然人唯一 ID}
        staffUserId: {type: integer, format: int64}
        name: {type: string, nullable: true, description: 官方客户详情返回的名称}
        avatar: {type: string, nullable: true}
        contactType: {type: integer, nullable: true, description: 1微信用户，2企业微信用户}
        gender: {type: integer, nullable: true}
        unionid: {type: string, nullable: true, description: 仅满足官方条件时返回，不作为CRM客户唯一ID}
        remark: {type: string, nullable: true}
        description: {type: string, nullable: true}
        addWay: {type: integer, nullable: true, description: 官方客户添加来源编码}
        channelState: {type: string, nullable: true}
        followCreatedAt: {type: string, format: date-time, nullable: true}
        tagSnapshotJson: {type: string, nullable: true, description: 企业/规则组标签JSON快照}
        followStatus: {type: string, enum: [ACTIVE, DELETED_BY_STAFF, DELETED_BY_CUSTOMER]}
        customerId: {type: integer, format: int64, nullable: true, description: 人工确认前的未匹配状态为 null}
        consentStatus: {type: string, enum: [PENDING, GRANTED, REVOKED], description: Mock 状态不代表真实授权}
        consentEvidenceRef: {type: string, nullable: true, description: 同意证据引用，不含敏感证据正文；Mock 引用非真实证明}
        linkType: {type: string, enum: [MANUAL], nullable: true}
        linkReason: {type: string, nullable: true}
        createdBy: {type: integer, format: int64, nullable: true}
        lastSyncedAt: {type: string, format: date-time, nullable: true}
        version: {type: integer, format: int64, minimum: 0}
    WecomMessageView:
      type: object
      required: [id, corpId, msgId, archiveSeq, customerId, externalUserid, staffUserId, conversationId, messageType, senderType, sentAt, contentObjectKey, consentSnapshot, currentConsentStatus, status]
      properties:
        id: {type: integer, format: int64, description: 内部消息引用 messageRef}
        corpId: {type: string}
        msgId: {type: string}
        archiveSeq: {type: integer, format: int64, minimum: 1}
        customerId: {type: integer, format: int64, nullable: true, description: 未人工匹配时为 null}
        externalUserid: {type: string}
        staffUserId: {type: integer, format: int64}
        conversationId: {type: string, nullable: true}
        messageType: {type: string}
        senderType: {type: string, enum: [EMPLOYEE, CUSTOMER]}
        sentAt: {type: string, format: date-time}
        contentObjectKey: {type: string, description: 私有 AES+MinIO 对象引用，不是公开 URL，不是正文}
        consentSnapshot: {type: string, enum: [PENDING, GRANTED, REVOKED], description: 采集时同意快照}
        currentConsentStatus: {type: string, enum: [PENDING, GRANTED, REVOKED], description: 每次查询时的当前同意状态}
        status: {type: string, enum: [STORED, UNMATCHED]}
    WecomContentView:
      type: object
      required: [messageRef, messageType, sentAt, content]
      description: 仅授权读取时返回的解密正文；事件契约不携带此 content。
      properties:
        messageRef: {type: integer, format: int64}
        messageType: {type: string}
        sentAt: {type: string, format: date-time}
        content: {type: string, description: AES+MinIO 校验后解密的消息正文，需每次授权复查}
    WecomMonitorView:
      type: object
      required: [corpId, archiveScope, lastSeq, lastSuccessAt, lastAttemptAt, status, dataGap, gapReason, messageCount, unmatchedCount, activeGaps, historicalGaps]
      properties:
        corpId: {type: string}
        archiveScope: {type: string, example: MOCK_ARCHIVE}
        lastSeq: {type: integer, format: int64, minimum: 0}
        lastSuccessAt: {type: string, format: date-time, nullable: true}
        lastAttemptAt: {type: string, format: date-time, nullable: true}
        status: {type: string, enum: [NEVER_SYNCED, SUCCESS, ERROR]}
        dataGap: {type: boolean, description: 当前存在覆盖缺口；无游标或 committedSeq=0 时为 true}
        gapReason: {type: string, nullable: true, description: 脱敏缺口原因，不含聊天正文}
        messageCount: {type: integer, format: int64, minimum: 0, description: 当前授权范围消息数，不能据此判断无沟通}
        unmatchedCount: {type: integer, format: int64, minimum: 0, description: 未人工匹配联系人数量（ALL 范围计算）}
        activeGaps: {type: integer, format: int64, minimum: 0, description: OPEN 状态缺口数}
        historicalGaps: {type: integer, format: int64, minimum: 0, description: 已解决历史缺口数，历史仍保留}
