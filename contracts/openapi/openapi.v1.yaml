      operationId: resolveComplaint
      summary: 登记客诉处理结论（complaint:write + 数据范围 + CSRF + 幂等键 + version + 审计）
      description: ASSIGNED → RESOLVED，保存脱敏处理结论和 resolvedAt；历史不可覆盖。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolveComplaintRequest'}
      responses:
        '200':
          description: RESOLVED 客诉详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComplaintCaseDetailEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /complaints/{id}/close:
    post:
      tags: [Complaints]
      operationId: closeComplaint
      summary: 关闭已处理客诉（complaint:write + 数据范围 + CSRF + 幂等键 + version + 审计）
      description: RESOLVED → CLOSED；closedAt 首次写入后不可覆盖。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ComplaintReasonRequest'}
      responses:
        '200':
          description: CLOSED 客诉详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComplaintCaseDetailEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /complaints/{id}/dismiss:
    post:
      tags: [Complaints]
      operationId: dismissComplaint
      summary: 驳回非终态正式客诉（complaint:write + 数据范围 + CSRF + 幂等键 + version + 审计）
      description: OPEN/ASSIGNED/RESOLVED → DISMISSED；CLOSED 与 DISMISSED 均不可再转换。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ComplaintReasonRequest'}
      responses:
        '200':
          description: DISMISSED 客诉详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComplaintCaseDetailEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /customer-tier-rules:
    get:
      tags: [CustomerTiers]
      operationId: listCustomerTierRules
      summary: 客户分级规则版本列表（ADMIN + customer:write + 租户隔离）
      description: Q12 正式业务阈值仍待运营确认；契约只描述配置结构，不给出生产金额、权重或分数线默认值。
      responses:
        '200':
          description: 当前租户规则版本列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerTierRuleListEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [CustomerTiers]
      operationId: createCustomerTierRule
      summary: 创建 DRAFT 客户分级规则版本（ADMIN + customer:write + CSRF + 幂等键 + 审计）
      description: 必须配置 S/A/B/C/D 五级、至少一个指标、合计 100 的权重及结构化阈值；禁止表达式。示例金额不构成 Q12 业务拍板。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerTierRuleRequest'}
      responses:
        '201':
          description: 已创建 DRAFT 规则，versionNo 由服务端递增
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerTierRuleEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /customer-tier-rules/{id}:
    get:
      tags: [CustomerTiers]
      operationId: getCustomerTierRule
      summary: 客户分级规则详情（ADMIN + customer:write + 租户隔离）
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: 规则、五级等级项与指标配置
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerTierRuleEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [CustomerTiers]
      operationId: updateCustomerTierRule
      summary: 修改 DRAFT 客户分级规则（ADMIN + customer:write + CSRF + 幂等键 + version + 审计）
      description: ACTIVE/RETIRED 配置冻结；ruleCode 创建后不可改，修改只限 DRAFT，version 位于 query。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {name: version, in: query, required: true, schema: {type: integer, format: int64, minimum: 0}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerTierRuleRequest'}
      responses:
        '200':
          description: 已更新 DRAFT 规则
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerTierRuleEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /customer-tier-rules/{id}/activation:
    post:
      tags: [CustomerTiers]
      operationId: activateCustomerTierRule
      summary: 激活 DRAFT 分级规则（ADMIN + customer:write + CSRF + 幂等键 + version + 审计）
      description: 每租户至多一个 ACTIVE；激活新版本会退役旧 ACTIVE 并将待复核降级单标记 STALE，不改写既有指标快照或等级历史。生产启用前仍须完成 Q12 阈值确认。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerTierVersionRequest'}
      responses:
        '200':
          description: ACTIVE 规则
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerTierRuleEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /customer-tier-rules/{id}/retirement:
    post:
      tags: [CustomerTiers]
      operationId: retireCustomerTierRule
      summary: 退役 ACTIVE 分级规则（ADMIN + customer:write + CSRF + 幂等键 + version + 审计）
      description: 退役后不再用于新重算，待复核降级单转 STALE；历史规则、快照和等级历史仍保留。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerTierVersionRequest'}
      responses:
        '200':
          description: RETIRED 规则
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerTierRuleEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /customer-tier-rules/{id}/trial:
    post:
      tags: [CustomerTiers]
      operationId: trialCustomerTierRule
      summary: 用指定规则试算一个客户（ADMIN + customer:write + 客户数据范围 + CSRF）
      description: 只读试算，不保存快照、不调整等级、不创建复核单，因此无 Idempotency-Key；snapshotId 省略。滚动窗口为 asOf 在规则时区减 12 个月（含）至 asOf（不含）。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerTierTrialRequest'}
      responses:
        '200':
          description: 试算指标与建议等级；数据不完整时建议为空
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerTierEvaluationEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /customer-tier-rules/{id}/samples:
    get:
      tags: [CustomerTiers]
      operationId: sampleCustomerTierRule
      summary: 按当前数据范围抽样试算规则（ADMIN + customer:write + 客户数据范围）
      description: 只读、不保存快照或变更等级；空数据范围返回空数组。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: 范围内样本试算列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerTierEvaluationListEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /customers/{customerId}/tier:
    get:
      tags: [CustomerTiers]
      operationId: getCustomerTier
      summary: 客户当前等级、锁定、最新快照与待复核单（customer:read + 后端数据范围）
      parameters:
        - {name: customerId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: 当前等级视图；latestSnapshot/pendingReview 可省略
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerTierViewEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /customers/{customerId}/tier-recalculations:
    post:
      tags: [CustomerTiers]
      operationId: recalculateCustomerTier
      summary: 按 ACTIVE 规则重算滚动 12 个月指标（customer:write + 数据范围 + CSRF + 幂等键 + 客户 version + 审计）
      description: 每次保存不可覆盖指标快照。三项金额独立：CONFIRMED 支付流水、有效订单 paid_fen、SUCCEEDED 退款支付，互不冲减；升级自动生效，降级仅创建人工复核，锁定客户不自动升降级。
      parameters:
        - {name: customerId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerTierRecalculateRequest'}
      responses:
        '200':
          description: 已保存的指标快照；suggestedTierCode 不等于降级已生效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerTierEvaluationEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /customers/{customerId}/tier-adjustments:
    post:
      tags: [CustomerTiers]
      operationId: adjustCustomerTier
      summary: 人工调整客户等级并可锁定（customer:write + 数据范围 + CSRF + 幂等键 + version + 审计）
      description: 目标等级须属于当前 ACTIVE 规则；只追加 MANUAL_ADJUST 历史并使旧待复核单失效，不通过通用客户 PATCH 覆盖等级。lock=true 禁止后续自动升降级。
      parameters:
        - {name: customerId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerTierAdjustmentRequest'}
      responses:
        '200':
          description: 调整后的等级视图
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerTierViewEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /customers/{customerId}/tier-history:
    get:
      tags: [CustomerTiers]
      operationId: listCustomerTierHistory
      summary: 客户等级生效历史（customer:read + 后端数据范围）
      description: 自动升级、批准降级和人工调整均只追加，不返回覆盖式编辑能力。
      parameters:
        - {name: customerId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: 等级历史列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerTierHistoryListEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /customers/{customerId}/tier-metric-snapshots:
    get:
      tags: [CustomerTiers]
      operationId: listCustomerTierMetricSnapshots
      summary: 客户滚动指标快照（customer:read + 后端数据范围）
      parameters:
        - {name: customerId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: 不可覆盖的重算快照列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerTierEvaluationListEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /customer-tier-reviews:
    get:
      tags: [CustomerTiers]
      operationId: listCustomerTierReviews
      summary: 降级人工复核分页（customer:read + 后端客户数据范围）
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [PENDING_REVIEW, APPROVED, REJECTED, STALE]}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: 范围内复核单分页；空范围返回空页
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerTierReviewPageEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /customer-tier-reviews/{id}/approve:
    post:
      tags: [CustomerTiers]
      operationId: approveCustomerTierReview
      summary: 批准降级复核（customer:write + 数据范围 + CSRF + 幂等键 + version + 审计）
      description: 仅 PENDING_REVIEW 且客户版本/等级、ACTIVE 规则和最新快照均未变化时可批准；批准后追加 DOWNGRADE_APPROVED 历史，旧复核不可重用。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerTierReviewRequest'}
      responses:
        '200':
          description: APPROVED 复核单，等级已生效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerTierReviewEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /customer-tier-reviews/{id}/reject:
    post:
      tags: [CustomerTiers]
      operationId: rejectCustomerTierReview
      summary: 驳回降级复核（customer:write + 数据范围 + CSRF + 幂等键 + version + 审计）
      description: 仅关闭当前 PENDING_REVIEW 复核单，不改变客户等级，不追加等级生效历史。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerTierReviewRequest'}
      responses:
        '200':
          description: REJECTED 复核单，客户等级保持不变
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerTierReviewEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /customer-segments:
    get:
      tags: [CustomerSegments]
      operationId: listCustomerSegments
      summary: 分页查询动态分组定义（customer:read）
      description: 仅按当前租户查询未删除定义；成员不在此接口返回，也不因列表查询保存快照。
      parameters:
        - {name: keyword, in: query, required: false, schema: {type: string, maxLength: 64}, description: 分组名称包含匹配}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: 动态分组定义分页
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerSegmentPageEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [CustomerSegments]
      operationId: createCustomerSegment
      summary: 创建动态分组（customer:write + CSRF + 幂等 + 审计）
      description: 只保存名称和筛选条件；同租户未删除分组名称唯一，不保存预览成员。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCustomerSegmentRequest'}
      responses:
        '201':
          description: 已创建或同键同内容回放
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerSegmentEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /customer-segments/preview:
    post:
      tags: [CustomerSegments]
      operationId: previewCustomerSegment
      summary: 实时预览动态分组成员（customer:read + 客户数据范围）
      description: 按当前事实与当前用户数据范围实时查询，不创建分组、操作批次或成员快照；三类项目条件均使用正式项目 ID。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PreviewCustomerSegmentRequest'}
      responses:
        '200':
          description: 当前可见成员分页
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerSegmentMemberPageEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /customer-segments/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    get:
      tags: [CustomerSegments]
      operationId: getCustomerSegment
      summary: 查询动态分组定义（customer:read）
      responses:
        '200':
          description: 当前租户内未删除的分组定义
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerSegmentEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [CustomerSegments]
      operationId: updateCustomerSegment
      summary: 修改动态分组定义（customer:write + 创建人或 ALL 客户数据范围 + CSRF + version + 审计）
      description: 仅创建者本人或拥有 customer ALL 数据范围的用户可修改（否则返回 403 FORBIDDEN）；修改只影响之后的实时成员计算；既有操作批次条件和成员快照不回写。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateCustomerSegmentRequest'}
      responses:
        '200':
          description: 更新后的分组定义
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerSegmentEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [CustomerSegments]
      operationId: deleteCustomerSegment
      summary: 逻辑删除动态分组（customer:write + 创建人或 ALL 客户数据范围 + CSRF + version + 审计）
      description: 仅创建者本人或拥有 customer ALL 数据范围的用户可删除（否则返回 403 FORBIDDEN）；删除后定义不再可用；已创建的操作批次和成员快照保留且不可改删。
      parameters:
        - {name: version, in: query, required: true, schema: {type: integer, format: int64, minimum: 0}}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '200':
          description: 已逻辑删除；data 按 NON_NULL 省略
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmptyResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /customer-segments/{id}/members:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    get:
      tags: [CustomerSegments]
      operationId: listCustomerSegmentMembers
      summary: 实时查询动态分组成员（customer:read + 客户数据范围）
      description: 使用分组当前条件和当前用户数据范围计算，不读取或创建操作批次快照；范围为空时返回空页。
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: 当前可见成员分页
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerSegmentMemberPageEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /customer-segments/{id}/operation-batches:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    post:
      tags: [CustomerSegments]
      operationId: createCustomerSegmentOperationBatch
      summary: 创建显式操作批次（customer:write + 数据范围 + CSRF + 幂等 + version + 审计）
      description: 当前仅支持 FOLLOWUP；固定分组条件及当前数据范围内客户成员快照，仅记录批次，不自动创建跟进或执行其他操作。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSegmentOperationBatchRequest'}
      responses:
        '201':
          description: 已创建不可变操作批次或同键同内容回放
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerSegmentBatchEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /customers/{id}/timeline:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    get:
      tags: [CustomerTimeline]
      operationId: getCustomerTimeline
      summary: 查询客户跨领域时间线（customer:read + 客户数据范围 + 分领域读权限过滤）
      description: 仅返回白名单摘要，不返回聊天全文；各领域时间线项分别受对应读权限门控（followup:read、task:read、order:read、appointment:read、redemption:read、refund:read、complaint:read），无权领域项自动隐藏。范围外客户按 404 处理。
      parameters:
        - name: cursor
          in: query
          required: false
          schema: {type: string, maxLength: 1024}
          description: 上一页返回的不透明 Base64URL 游标，绑定 version=1、客户 ID、occurredAt/type/eventKey；不可跨客户复用或自行构造。
        - {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: 按 occurredAt、type、eventKey 倒序排列的摘要页；nextCursor 为空表示没有下一页
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerTimelineEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /batch-tag-jobs/preview:
    post:
      tags: [BatchTagJobs]
      operationId: previewBatchTagJob
      summary: 创建服务端批量打标预览（customer:write + 非机构账号 + 数据范围 + CSRF + 幂等 + 审计）
      description: ADD 要求标签为有效 customerTags 字典项；REMOVE 可处理未知历史标签。FILTER/SEGMENT 按当前条件实时计算，OPERATION_BATCH 取既有成员快照；三者均受当前数据范围约束并固定为服务端预览成员。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PreviewBatchTagJobRequest'}
      responses:
        '200':
          description: 预览令牌、固定成员总数及当前分页；令牌仅创建人可用于后续建任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchTagPreviewEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /batch-tag-jobs:
    get:
      tags: [BatchTagJobs]
      operationId: listBatchTagJobs
      summary: 分页查询批量打标任务（customer:read + 非机构账号）
      description: ALL 数据范围可查询本租户任务，其他非空范围仅查询本人请求的任务；空范围返回空页。
      parameters:
        - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/BatchTagJobStatus'}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: 可见任务分页，按 ID 倒序
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchTagJobPageEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [BatchTagJobs]
      operationId: createBatchTagJob
      summary: 按服务端预览创建 PENDING 任务（customer:write + 非机构账号 + CSRF + 幂等 + 审计）
      description: 复制预览的操作、标签、来源、数据范围及全部成员为不可变任务快照；空成员预览不能建任务，每个预览至多一个任务。此步骤不修改客户标签。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateBatchTagJobRequest'}
      responses:
        '201':
          description: PENDING 任务及前 100 条明细，或同键同内容回放
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchTagJobDetailEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /batch-tag-jobs/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    get:
      tags: [BatchTagJobs]
      operationId: getBatchTagJob
      summary: 查询任务与逐项当前结果（customer:read + 非机构账号 + 可见范围）
      description: 任务请求人可查看本人任务，ALL 数据范围可查看本租户任务；不存在或不可见均返回 404。
      parameters:
        - {name: itemPage, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
        - {name: itemSize, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        '200':
          description: 任务及独立明细分页
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchTagJobDetailEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /batch-tag-jobs/{id}/execute:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    post:
      tags: [BatchTagJobs]
      operationId: executeBatchTagJob
      summary: 执行 PENDING 任务（任务请求人 + customer:write + CSRF + 幂等 + version + 审计）
      description: 仅 PENDING 可首次执行；逐项按原请求人实时重验权限、数据范围、归属、删除/合并及 ADD 字典状态。仅增量改变目标标签，保留其他历史标签；完成后创建站内通知。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BatchTagJobActionRequest'}
      responses:
        '200':
          description: 执行后的任务与前 100 条明细，或同键同内容回放
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchTagJobDetailEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /batch-tag-jobs/{id}/retry:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    post:
      tags: [BatchTagJobs]
      operationId: retryBatchTagJob
      summary: 重试失败明细（任务请求人 + customer:write + CSRF + 幂等 + version + 审计）
      description: 仅 PARTIAL_FAILED/FAILED 且存在 FAILED 明细时可重试；SUCCEEDED/NO_CHANGE/SKIPPED 明细不重开，逐项和任务执行历史只追加。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BatchTagJobActionRequest'}
      responses:
        '200':
          description: 重试后的任务与前 100 条明细，或同键同内容回放
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchTagJobDetailEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /batch-tag-jobs/{id}/rollback:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    post:
      tags: [BatchTagJobs]
      operationId: rollbackBatchTagJob
      summary: 创建独立反向任务（customer:write + 非机构账号 + 可见范围 + CSRF + 幂等 + version + 审计）
      description: 原任务须非 PENDING/RUNNING、存在实际变更且尚无回滚任务。仅按原任务 changedTagCodes 的实际变更子集生成 ADD↔REMOVE 反向 PENDING 任务，不覆盖原任务；返回的新任务仍须单独 execute。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BatchTagJobActionRequest'}
      responses:
        '201':
          description: 新独立回滚任务及前 100 条明细，或同键同内容回放
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchTagJobDetailEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
    cookieAuth:
      type: apiKey
      in: cookie
      name: CRM_TOKEN
      description: HttpOnly JWT（2h）。写方法另需 X-CSRF-Token 头 == CRM_CSRF Cookie（登录接口除外）。
  parameters:
    Page: {name: page, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
    Size: {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
      description: 写请求必传；同键仅可对应同一资源及相同请求，不同请求返回 409。幂等回放不重复改变状态或写账本。
    PaymentIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, maxLength: 128}
      description: 必传。同键仅可对应同一订单及相同请求体；同键不同订单或请求体返回 409，同键同请求幂等回放且不重复支付、发权益或写 Outbox。
    CsrfToken: {name: X-CSRF-Token, in: header, required: true, schema: {type: string}, description: 必须等于 CRM_CSRF Cookie 值}
    ReportFrom:
      name: from
      in: query
      required: true
      schema: {type: string, format: date}
      description: 统计开始日期，包含当天；不得晚于 to，区间最长 366 天
    ReportTo:
      name: to
      in: query
      required: true
      schema: {type: string, format: date}
      description: 统计结束日期，包含当天；UTC 结束边界为次日零时（toUtcExclusive）
    ReportTimeZone:
      name: timeZone
      in: query
      required: false
      schema: {type: string, maxLength: 64, default: UTC}
      description: Java ZoneId 可识别的时区 ID 或 offset；用于把 from/to 转为 UTC 边界，响应返回规范化 timeZone
    ReportSourceSystem:
      name: sourceSystem
      in: query
      required: false
      schema: {type: string, pattern: '[A-Za-z0-9_]{1,48}', default: ALL}
      description: 订单来源；服务端去空白并转大写，ALL 表示不限制来源
    ReportReceiverType:
      name: receiverType
      in: query
      required: false
      schema: {type: string, maxLength: 32, enum: [ALL, PLATFORM, INSTITUTION], default: ALL}
    ReportMetricVersion:
      name: metricVersion
      in: query
      required: false
      schema: {type: string, maxLength: 32, enum: [P2_FACT_V1], default: P2_FACT_V1}
      description: 当前唯一支持的报表口径版本；其他值返回 400
    ReportCustomerId: {name: customerId, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}, description: 可选客户筛选，只能收窄后端数据范围}
    ReportCampaignId: {name: campaignId, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}}
    ReportCampaignBatchId: {name: campaignBatchId, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}}
    ReportChannelId: {name: channelId, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}}
    ReportStaffUserId: {name: staffUserId, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}, description: 业绩员工筛选，只能收窄后端数据范围}
    ReportSkuId: {name: skuId, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}}
    ReportInstitutionId: {name: institutionId, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}}
    ReportPage: {name: page, in: query, required: false, schema: {type: integer, format: int32, minimum: 1, maximum: 10000, default: 1}}
    ReportSize: {name: size, in: query, required: false, schema: {type: integer, format: int32, minimum: 1, maximum: 100, default: 20}}
    ReportDrillDownLimit: {name: drillDownLimit, in: query, required: false, schema: {type: integer, format: int32, minimum: 1, maximum: 50, default: 20}}
    OperationsDrillDownType:
      name: drillDownType
      in: query
      required: false
      schema: {type: string, maxLength: 32, enum: [NONE, FOLLOWUP, APPOINTMENT_CONFIRMED, CHECKED_IN, SERVICE_DONE, REDEMPTION, PAYMENT, REFUND], default: NONE}
    PerformanceDrillDownType:
      name: drillDownType
      in: query
      required: false
      schema: {type: string, maxLength: 32, enum: [NONE, PAYMENT, REFUND], default: NONE}
    CampaignDrillDownType:
      name: drillDownType
      in: query
      required: false
      schema: {type: string, maxLength: 32, enum: [NONE, APPOINTMENT_CONFIRMED, CHECKED_IN, SERVICE_DONE, REDEMPTION, PAYMENT, REFUND], default: NONE}
    SkuDrillDownType:
      name: drillDownType
      in: query
      required: false
      schema: {type: string, maxLength: 32, enum: [NONE, PAID_ORDER_LINE], default: NONE}
  responses:
    ValidationFailed:
      description: VALIDATION_FAILED — 字段、格式或业务输入无效
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthorized:
      description: UNAUTHORIZED — 未认证或凭证失效
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Forbidden:
      description: FORBIDDEN / CSRF_TOKEN_INVALID — 无操作或数据范围权限，或 CSRF 校验失败
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: NOT_FOUND — 资源不存在或不在可见数据范围
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: CONFLICT — 状态/版本冲突、交易号冲突或同幂等键不同请求
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    BusinessRulePending:
      description: PENDING_BUSINESS_RULE — Q01/Q02 等必要业务规则未确认；details 携带 Qxx
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    ServiceUnavailable:
      description: AUTH_PROTECTION_UNAVAILABLE — 登录保护、OAuth 状态或票据缓存服务暂不可用
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    FileScanNotReady:
      description: PENDING_BUSINESS_RULE — 文件扫描服务尚未就绪，不能审核或引用文件
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    CsrfInvalid:
      description: CSRF_TOKEN_INVALID — X-CSRF-Token 与 CRM_CSRF Cookie 不一致
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    SettlementDayRule:
      type: string
      pattern: '^([1-9]|1[0-9]|2[0-8]|LAST_DAY)$'
      description: 每月 1–28 日或 LAST_DAY；LAST_DAY 按 Asia/Shanghai 业务月的实际最后一天计算
    InstitutionSettlementDefault:
      type: object
      required: [defaultSettlementDay, version, configured, updatedAt]
      properties:
        defaultSettlementDay: {$ref: '#/components/schemas/SettlementDayRule'}
        version: {type: integer, format: int64, minimum: 0}
        configured: {type: boolean, description: false 表示未保存租户配置，当前展示内置 LAST_DAY}
        updatedAt: {type: string, format: date-time, nullable: true}
    UpdateInstitutionSettlementDefaultRequest:
      type: object
      additionalProperties: false
      required: [defaultSettlementDay, version]
      properties:
        defaultSettlementDay: {$ref: '#/components/schemas/SettlementDayRule'}
