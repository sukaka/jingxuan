      description: 仅 CONFLICT_REVALIDATE 且申请 version 一致时可复核；baseVersion 必须是机构当前版本，重算 targetVersion 后回到 PENDING_REVIEW 和原首审步骤，不直接生效。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RevalidateChangeRequest'}
      responses:
        '200':
          description: 已回到 PENDING_REVIEW，等待重新分级审核
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChangeRequestEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
