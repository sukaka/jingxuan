        - {name: merchantKeyword, in: query, required: false, schema: {type: string, maxLength: 120}, description: 同时匹配机构编号、名称、简介及当前展示的医生、仪器、案例资料}
        - {name: status, in: query, required: false, schema: {type: string, maxLength: 48, enum: [PENDING, ACTIVE]}}
        - {name: cityCode, in: query, required: false, schema: {type: string, maxLength: 64}}
