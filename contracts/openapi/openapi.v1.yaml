        dueFollowupCount: {type: integer, format: int64, minimum: 0, nullable: true, description: 截止时间为今日或已到期的回访任务数}
        overdueTaskCount: {type: integer, format: int64, minimum: 0, nullable: true, description: 截止时间早于当前时间的未完成任务数}
        pendingAppointmentCount: {type: integer, format: int64, minimum: 0, nullable: true, description: 待机构确认预约数}
        awaitingRedemptionCount: {type: integer, format: int64, minimum: 0, nullable: true, description: 服务已完成但尚未正式核销的预约数}
        pendingRefundCount: {type: integer, format: int64, minimum: 0, nullable: true, description: 待审批退款数，不代表退款已成功}
    PerformanceRow:
      allOf:
        - $ref: '#/components/schemas/ReportFinancialTotals'
