      type: object
      required: [baseVersion, reason]
      properties:
        baseVersion: {type: integer, format: int64, minimum: 0, description: 目标主档/合同/资质当前版本}
        reason: {type: string, minLength: 1, maxLength: 1000}
        evidenceFileId: {type: integer, format: int64, nullable: true, description: 可选证据文件，存在时必须 CLEAN}
    ProfileChangeStep:
      type: object
      required: [id, changeRequestId, sequenceNo, stepCode, status, reviewerUserId, reviewedAt, comment, createdAt]
      properties:
        id: {type: integer, format: int64}
        changeRequestId: {type: integer, format: int64}
        sequenceNo: {type: integer, format: int32, minimum: 0}
        stepCode: {type: string, enum: [REQUESTED, MARKET, FINANCE, REVALIDATE, CONFLICT]}
        status: {type: string, enum: [REQUESTED, PENDING_REVIEW, APPROVED, REJECTED, CONFLICT_REVALIDATE]}
        reviewerUserId: {type: integer, format: int64}
        reviewedAt: {type: string, format: date-time}
        comment: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
    ChangeRequestResponse:
      type: object
      required: [id, institutionId, changeType, fieldCode, targetId, baseVersion, targetVersion, beforeMasked, afterMasked, reason, evidenceFileId, status, currentStep, requestedBy, requestedAt, completedAt, version, steps]
      description: 不包含 beforeCipher/afterCipher；beforeMasked/afterMasked 仅为脱敏 JSON。PENDING_REVIEW+MARKET/FINANCE 对应 PENDING_MARKET/PENDING_FINANCE，APPROVED+COMPLETED 对应 EFFECTIVE。
      properties:
        id: {type: integer, format: int64}
        institutionId: {type: integer, format: int64}
        changeType: {type: string, enum: [ONBOARDING, PROFILE_FIELD, CONTRACT_ACTIVATION, QUALIFICATION_REVIEW]}
        fieldCode: {type: string, nullable: true}
        targetId: {type: integer, format: int64}
        baseVersion: {type: integer, format: int64, minimum: 0}
        targetVersion: {type: integer, format: int64, minimum: 0}
        beforeMasked:
          type: object
          nullable: true
          additionalProperties: true
          description: 脱敏原值 JSON，不含密文或敏感明文
        afterMasked:
          type: object
          nullable: true
          additionalProperties: true
          description: 脱敏新值 JSON，不含密文或敏感明文
        reason: {type: string}
        evidenceFileId: {type: integer, format: int64, nullable: true}
        status: {$ref: '#/components/schemas/InstitutionChangeStatus'}
        currentStep: {$ref: '#/components/schemas/InstitutionChangeStep'}
        requestedBy: {type: integer, format: int64}
        requestedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time, nullable: true}
        version: {type: integer, format: int64, minimum: 0}
        steps:
          type: array
          items: {$ref: '#/components/schemas/ProfileChangeStep'}
