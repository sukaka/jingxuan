      description: 创建时敏感值加密保存，响应仅返回掩码或按权限隐藏；创建后须走激活审批，不直接 ACTIVE。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
