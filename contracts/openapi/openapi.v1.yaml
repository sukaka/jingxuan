        customerId: {type: integer, format: int64}
        receiverType: {type: string, enum: [PLATFORM, INSTITUTION]}
        orderTypeCode: {type: string, enum: [REGULAR, FLASH, PROMOTION]}
        campaignId: {type: integer, format: int64, nullable: true}
        campaignBatchId: {type: integer, format: int64, nullable: true}
        payableFen: {type: integer, format: int64, minimum: 1, description: 应付金额，整数分；不得高于订单原价}
        validTo: {type: string, format: date, nullable: true}
        items:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/OrderItemRequest'}
        channelId: {type: integer, format: int64, nullable: true, description: 可选成交渠道；服务端保存渠道及其当时 businessOwnerUserId 为商务快照}
      description: campaignId 与 campaignBatchId 必须同时缺省或指向有效活动批次；渠道只能从有效渠道选择，不从当前客户来源或管家身份推断商务归属。
    OrderItemRequest:
      type: object
      required: [skuId, quantity]
      properties:
        skuId: {type: integer, format: int64}
        quantity: {type: integer, format: int32, minimum: 1, maximum: 1000}
    OrderReviewRequest:
      type: object
      required: [version]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        reason: {type: string, maxLength: 500, nullable: true}
    PaymentConfirmRequest:
      type: object
      required: [externalTradeNo, paymentChannel, amountFen, paidAt, evidenceRef]
      properties:
        externalTradeNo: {type: string, minLength: 1, maxLength: 128, description: 人工核验的真实外部交易/流水编号}
        paymentChannel: {type: string, enum: [BANK_TRANSFER, OFFLINE]}
        amountFen: {type: integer, format: int64, minimum: 1, description: 已核验支付金额，整数分；当前必须等于订单 payableFen}
        paidAt: {type: string, format: date-time, description: 实际支付时间，必须带时区或 UTC offset}
        evidenceRef: {type: string, minLength: 1, maxLength: 192, description: 人工复核凭证的审计引用；不得虚构支付网关验证结果}
        voucherFileId: {type: integer, format: int64, nullable: true, description: 可选凭证文件 ID；不替代 evidenceRef}
    Order:
      type: object
      required: [id, orderNo, customerId, customerName, soldByUserId, ownerAtSaleId, externalOrderNo, sourceSystem, externalShopId, orderTypeCode, orderTypeLabelSnapshot, campaignId, campaignBatchId, campaignCodeSnapshot, campaignNameSnapshot, batchCodeSnapshot, batchNameSnapshot, channelId, businessOwnerAtSaleId, status, receiverType, listAmountFen, discountAmountFen, payableFen, paidFen, refundedFen, orderedAt, paidAt, createdAt, version]
      description: 活动、批次、渠道与商务字段是订单成交时快照；后续修改活动或渠道不得覆盖历史值。
      properties:
        id: {type: integer, format: int64}
        orderNo: {type: string}
        customerId: {type: integer, format: int64}
        customerName: {type: string, nullable: true}
        soldByUserId: {type: integer, format: int64}
        ownerAtSaleId: {type: integer, format: int64, description: 成交时客户归属快照}
        externalOrderNo: {type: string, nullable: true}
        sourceSystem: {type: string, example: CRM}
        externalShopId: {type: string, nullable: true, description: 外部店铺标识；本地手工订单为 null}
        orderTypeCode: {type: string, enum: [REGULAR, FLASH, PROMOTION]}
        orderTypeLabelSnapshot: {type: string, nullable: true, description: 成交时订单类型显示名快照}
        campaignId: {type: integer, format: int64, nullable: true}
        campaignBatchId: {type: integer, format: int64, nullable: true}
        campaignCodeSnapshot: {type: string, nullable: true}
        campaignNameSnapshot: {type: string, nullable: true}
        batchCodeSnapshot: {type: string, nullable: true}
        batchNameSnapshot: {type: string, nullable: true}
        channelId: {type: integer, format: int64, nullable: true, description: 成交渠道 ID 快照}
        businessOwnerAtSaleId: {type: integer, format: int64, nullable: true, description: 成交时渠道商务 ID 快照，不从当前客户归属推断}
        status: {$ref: '#/components/schemas/OrderStatus'}
        receiverType: {type: string, enum: [PLATFORM, INSTITUTION]}
        listAmountFen: {type: integer, format: int64, minimum: 0, description: 订单原价，整数分}
        discountAmountFen: {type: integer, format: int64, minimum: 0, description: 优惠金额，整数分}
        payableFen: {type: integer, format: int64, minimum: 0, description: 应付金额，整数分}
        paidFen: {type: integer, format: int64, minimum: 0, description: 已确认支付金额，整数分；草稿为 0}
        refundedFen: {type: integer, format: int64, minimum: 0, description: 已确认成功退款累计金额，整数分；申请、批准和执行中不增加}
        orderedAt: {type: string, format: date-time, nullable: true}
        paidAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
    OrderItem:
      type: object
      required: [id, orderId, skuId, packageVersionId, skuCodeSnapshot, skuNameSnapshot, purchaseQuantity, listAmountFen, paidAllocatedFen, entitlementSnapshot, version]
      properties:
        id: {type: integer, format: int64}
        orderId: {type: integer, format: int64}
        skuId: {type: integer, format: int64}
        packageVersionId: {type: integer, format: int64}
        skuCodeSnapshot: {type: string, nullable: true}
        skuNameSnapshot: {type: string}
        purchaseQuantity: {type: integer, format: int32, minimum: 1}
        listAmountFen: {type: integer, format: int64, minimum: 0, description: 订单行原价，整数分}
        paidAllocatedFen: {type: integer, format: int64, minimum: 0, description: 订单行实付分摊结果，整数分；Q02 未确认（含单行）为 0，不得用于机构结算}
        entitlementSnapshot:
          type: string
          nullable: true
          description: >-
            销售时冻结的 JSON 文本，不是新的权益发放请求。allocationStatus=PENDING_Q02 时（包括单行）订单行 paidAllocatedFen=0；
            已配置时 projectSnapshots 各项保存 allocationPriceFen 权重和 paidAllocatedFen 分摊结果，均为整数分。
            这些快照不生成或启用机构结算。
        version: {type: integer, format: int64, minimum: 0}
    PaymentTxn:
      type: object
      required: [id, orderId, paymentChannel, receiverType, externalTradeNo, amountFen, status, confirmedAt, confirmedBy, voucherFileId, evidenceRef, verificationMethod, createdAt, version]
      properties:
        id: {type: integer, format: int64}
        orderId: {type: integer, format: int64}
        paymentChannel: {type: string, enum: [BANK_TRANSFER, OFFLINE, YOUZAN], description: 人工渠道为 BANK_TRANSFER/OFFLINE；适配器回调为 YOUZAN}
        receiverType: {type: string, enum: [PLATFORM, INSTITUTION]}
        externalTradeNo: {type: string}
        amountFen: {type: integer, format: int64, minimum: 0, description: 支付金额，整数分}
        status: {type: string, enum: [PENDING, CONFIRMED, FAILED, REVERSED]}
        confirmedAt: {type: string, format: date-time, nullable: true}
        confirmedBy: {type: integer, format: int64, nullable: true}
        voucherFileId: {type: integer, format: int64, nullable: true}
        evidenceRef: {type: string, description: 支付核验凭证或适配器来源引用}
        verificationMethod: {type: string, enum: [MANUAL_REVIEW, PROVIDER_CALLBACK], description: MANUAL_REVIEW 为人工凭证确认，PROVIDER_CALLBACK 为适配器验真后的供应商回调}
        createdAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
    OrderStatusHistory:
      type: object
      required: [id, orderId, fromStatus, toStatus, actorUserId, triggerType, triggerRef, reason, createdAt]
      properties:
        id: {type: integer, format: int64}
        orderId: {type: integer, format: int64}
        fromStatus: {type: string, description: 变更前状态；创建时 NONE}
        toStatus: {$ref: '#/components/schemas/OrderStatus'}
        actorUserId: {type: integer, format: int64, nullable: true}
        triggerType: {type: string, example: PAYMENT_CONFIRMED}
        triggerRef: {type: string, nullable: true}
        reason: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
    Entitlement:
      type: object
      required: [id, customerId, orderItemId, projectId, projectName, grantedCount, availableCount, versionNo, validFrom, validTo, status, createdAt, version]
      properties:
        id: {type: integer, format: int64}
        customerId: {type: integer, format: int64}
        orderItemId: {type: integer, format: int64}
        projectId: {type: integer, format: int64}
        projectName: {type: string}
        grantedCount: {type: integer, format: int32, minimum: 0}
        availableCount: {type: integer, format: int32, minimum: 0, description: 可用次数事务快照，权威余额另见账本汇总}
        versionNo: {type: integer, format: int32, minimum: 0}
        validFrom: {type: string, format: date, nullable: true}
        validTo: {type: string, format: date, nullable: true}
        status: {type: string, enum: [PENDING, AVAILABLE, EXHAUSTED, EXPIRED, REVOKED]}
        createdAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
    EntitlementLedgerEntry:
      type: object
      required: [id, entitlementId, txnType, deltaCount, sourceType, sourceRef, idempotencyKey, actorUserId, reason, createdAt, version]
      properties:
        id: {type: integer, format: int64}
        entitlementId: {type: integer, format: int64}
        txnType: {type: string, enum: [GRANT, REDEEM, CORRECTION_IN, REFUND_REVOKE], description: GRANT/CORRECTION_IN 为正，REDEEM/REFUND_REVOKE 为负；冲正和退款只追加流水}
        deltaCount: {type: integer, format: int32, description: 次数增减；不允许通过更新历史流水改余额}
        sourceType: {type: string, enum: [PAYMENT, REDEMPTION, REDEMPTION_REVERSAL, REFUND]}
        sourceRef: {type: string}
        idempotencyKey: {type: string}
        actorUserId: {type: integer, format: int64, nullable: true}
        reason: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
    OrderDetail:
      type: object
      required: [order, items, payments, history]
      properties:
        order: {$ref: '#/components/schemas/Order'}
        items:
          type: array
          items: {$ref: '#/components/schemas/OrderItem'}
