    NotificationItem:
      type: object
      required: [id, tenantId, recipientUserId, notificationType, title, contentMasked, sourceType, sourceId, dedupeKey, deepLink, channels, deliveries, createdAt, readAt, version]
      additionalProperties: false
      properties:
        id: {type: integer, format: int64, minimum: 1}
        tenantId: {type: integer, format: int64, minimum: 1, description: 服务端认证租户；不能用于跨租户查询}
        recipientUserId: {type: integer, format: int64, minimum: 1, description: 必须等于当前登录用户 ID}
        notificationType: {type: string, minLength: 1, maxLength: 64, description: 稳定通知类型代码}
        title: {type: string, minLength: 1, maxLength: 200}
        contentMasked: {type: string, minLength: 1, maxLength: 4000, description: 脱敏展示内容，不含完整联系方式、聊天正文、密钥或银行资料}
        sourceType: {type: string, minLength: 1, maxLength: 64, description: 来源业务类型代码；跳转后仍由目标 API 校验权限}
        sourceId: {type: string, minLength: 1, maxLength: 128, description: 来源业务标识，不是客户手机号或微信昵称}
        dedupeKey: {type: string, minLength: 1, maxLength: 128, description: 同一租户与收件人内的通知去重键}
        deepLink: {type: string, maxLength: 1024, nullable: true, description: 服务端允许的内部相对路由，不是任意外部 URL；目标资源仍可能因权限而不可见}
        channels: {type: array, minItems: 1, uniqueItems: true, items: {type: string, enum: [IN_APP, WECOM_APP]}, description: 创建时请求渠道快照，不是各渠道当前投递状态}
        deliveries: {type: array, minItems: 1, items: {$ref: '#/components/schemas/NotificationDeliverySummaryItem'}, description: 实际渠道当前投递摘要；投递状态不表示通知已读，已读仅以 readAt 为准}
        createdAt: {type: string, format: date-time}
        readAt: {type: string, format: date-time, nullable: true, description: 首次已读时间；null 表示未读，不表示企微渠道已读}
        version: {type: integer, format: int64, minimum: 0, description: 单条已读的乐观锁版本}
    MarkNotificationReadRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: {type: integer, format: int64, minimum: 0}
    NotificationDeliverySummaryItem:
      type: object
      required: [channel, status, lastErrorMasked, providerMessageId]
      additionalProperties: false
      properties:
        channel: {type: string, enum: [IN_APP, WECOM_APP]}
        status: {type: string, enum: [REQUESTED, PENDING, SENDING, RETRY_WAIT, SUCCEEDED, MOCKED, DISABLED, FAILED, UNKNOWN], description: 实际投递状态；MOCKED 仅为模拟完成，SUCCEEDED 也不表示通知或企微消息已读}
        lastErrorMasked: {type: string, maxLength: 512, nullable: true, description: 脱敏错误，不含正文、密钥或上游完整报文}
        providerMessageId: {type: string, maxLength: 255, nullable: true, description: 官方消息 ID 或明确带 mock- 前缀的模拟 ID；MOCKED 不得展示为真实发送成功}
    NotificationDeliveryItem:
      type: object
      required: [id, notificationId, recipientUserId, channel, status, attemptCount, automaticRetryCount, nextAttemptAt, lastStartedAt, provider, providerMessageId, lastErrorMasked, createdAt, updatedAt, version]
      additionalProperties: false
      properties:
        id: {type: integer, format: int64, minimum: 1}
        notificationId: {type: integer, format: int64, minimum: 1}
        recipientUserId: {type: integer, format: int64, minimum: 1}
        channel: {type: string, enum: [IN_APP, WECOM_APP]}
        status: {type: string, enum: [REQUESTED, PENDING, SENDING, RETRY_WAIT, SUCCEEDED, MOCKED, DISABLED, FAILED, UNKNOWN], description: MOCKED 仅为模拟投递，UNKNOWN 不得当作成功或终态失败}
        attemptCount: {type: integer, minimum: 0}
        automaticRetryCount: {type: integer, minimum: 0}
        nextAttemptAt: {type: string, format: date-time, nullable: true}
        lastStartedAt: {type: string, format: date-time, nullable: true}
        provider: {type: string, enum: [IN_APP, OFFICIAL, MOCK, DISABLED], nullable: true}
        providerMessageId: {type: string, maxLength: 255, nullable: true, description: 官方消息 ID 或明确带 mock- 前缀的模拟 ID；MOCKED 不得展示为真实发送成功}
        lastErrorMasked: {type: string, maxLength: 512, nullable: true, description: 脱敏错误，不含正文、密钥或上游完整报文}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
    RetryNotificationDeliveryRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: {type: integer, format: int64, minimum: 0}
        reason: {type: string, maxLength: 500, nullable: true, description: UNKNOWN 重试前必填的人工核实原因；其他状态可空}
    NotificationEnvelope:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data: {$ref: '#/components/schemas/NotificationItem'}
        requestId: {type: string}
