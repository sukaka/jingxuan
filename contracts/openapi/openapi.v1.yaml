    CustomerTierThresholdDefinition:
      type: object
      deprecated: true
      description: 旧评分规则的只读历史配置，不再用于分级
      required: [tierCode, value]
      properties:
        tierCode: {type: string, enum: [S, A, B, C, D]}
        value: {type: integer, format: int64, minimum: 0}
    CustomerTierLevelDefinition:
      type: object
      required: [tierCode, tierName, sortNo]
      properties:
        tierCode: {type: string, enum: [S, A, B, C, D]}
        tierName: {type: string, minLength: 1, maxLength: 64, description: 仅用于页面展示，不参与金额计算}
        sortNo: {type: integer, minimum: 1, maximum: 5, description: 数值越小等级越高；五级必须各占一个顺序}
        minScore: {type: number, minimum: 0, maximum: 100, nullable: true, deprecated: true, description: 旧评分字段，仅为历史兼容保留；新规则传 0，不参与计算}
        minConsumptionFen: {type: integer, format: int64, minimum: 0, nullable: true, description: 进入该等级所需最低实际消费金额（整数分）；新规则必填且随等级递减，D 级为 0；旧历史版本可为空}
    CustomerTierMetricDefinition:
      type: object
      deprecated: true
      description: 旧评分规则的只读历史配置，新规则不再接受
      required: [metricCode, direction, weight, thresholds]
      properties:
        metricCode: {type: string, enum: [PAYMENT_AMOUNT_FEN, PAID_AMOUNT_FEN, REFUND_AMOUNT_FEN, ORDER_COUNT, COMMUNICATION_COUNT]}
        direction: {type: string, enum: [GTE, LTE]}
        weight: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 100}
        thresholds:
          type: array
          minItems: 5
          maxItems: 5
          items: {$ref: '#/components/schemas/CustomerTierThresholdDefinition'}
    CustomerTierRuleRequest:
      type: object
      required: [ruleCode, ruleName, timezone, levels, metrics]
      properties:
        ruleCode: {type: string, pattern: '^[A-Z][A-Z0-9_]{0,63}$'}
        ruleName: {type: string, minLength: 1, maxLength: 128}
        timezone: {type: string, minLength: 1, maxLength: 64, example: Asia/Shanghai, description: Java ZoneId；用于滚动 12 个月窗口}
        levels:
          type: array
          minItems: 5
          maxItems: 5
          items: {$ref: '#/components/schemas/CustomerTierLevelDefinition'}
          description: 必须且只能包含 S/A/B/C/D 各一项，每级必须提供 minConsumptionFen；仅按实际消费金额定级
        metrics:
          type: array
          maxItems: 0
          description: 新规则固定为空数组；不再接受指标、权重或指标门槛
    CustomerTierRule:
      type: object
      required: [id, ruleCode, versionNo, ruleName, timezone, status, levels, metrics, createdAt, version]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        ruleCode: {type: string, pattern: '^[A-Z][A-Z0-9_]{0,63}$'}
        versionNo: {type: integer, minimum: 1}
        ruleName: {type: string, maxLength: 128}
        timezone: {type: string, maxLength: 64}
        status: {type: string, enum: [DRAFT, ACTIVE, RETIRED]}
        levels: {type: array, minItems: 5, maxItems: 5, items: {$ref: '#/components/schemas/CustomerTierLevelDefinition'}}
        metrics: {type: array, items: {$ref: '#/components/schemas/CustomerTierMetricDefinition'}, description: 旧版本只读历史配置；金额规则为空数组}
        activatedAt: {type: string, format: date-time, nullable: true}
        retiredAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
    CustomerTierRuleEnvelope:
      allOf:
        - {$ref: '#/components/schemas/ApiResponse'}
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/CustomerTierRule'}
    CustomerTierRuleListEnvelope:
      allOf:
        - {$ref: '#/components/schemas/ApiResponse'}
        - type: object
          required: [data]
          properties:
            data: {type: array, items: {$ref: '#/components/schemas/CustomerTierRule'}}
    CustomerTierVersionRequest:
      type: object
      required: [version]
      properties:
        version: {type: integer, format: int64, minimum: 0, description: 规则当前乐观锁版本}
    CustomerTierTrialRequest:
      type: object
      required: [customerId]
      properties:
        customerId: {type: integer, format: int64, minimum: 1}
        asOf: {type: string, format: date-time, nullable: true, description: 缺省由服务端取当前时间；滚动窗口右端点（不含）}
    CustomerTierRecalculateRequest:
      type: object
      required: [version]
      properties:
        version: {type: integer, format: int64, minimum: 0, description: 客户当前乐观锁版本，不是规则 version}
        asOf: {type: string, format: date-time, nullable: true}
    CustomerTierAdjustmentRequest:
      type: object
      required: [tierCode, reason, lock, version]
      properties:
        tierCode: {type: string, enum: [S, A, B, C, D], description: 必须同时属于当前 ACTIVE 规则}
        reason: {type: string, minLength: 1, maxLength: 1000}
        lock: {type: boolean, description: true 时禁止自动升降级并保存锁定理由；false 时解除锁定}
        version: {type: integer, format: int64, minimum: 0, description: 客户当前乐观锁版本}
    CustomerTierEvaluation:
      type: object
      required: [customerId, ruleId, asOf, windowStartInclusive, windowEndExclusive, timezone, paymentAmountFen, paidAmountFen, refundAmountFen, actualConsumptionFen, orderCount, manualFollowupCount, archivedMessageCount, communicationComplete, sourceTrigger]
      properties:
        snapshotId: {type: integer, format: int64, minimum: 1, nullable: true, description: 持久化重算返回；TRIAL/SAMPLE 不保存时省略}
        customerId: {type: integer, format: int64, minimum: 1}
        ruleId: {type: integer, format: int64, minimum: 1}
        asOf: {type: string, format: date-time}
        windowStartInclusive: {type: string, format: date-time, description: asOf 在规则时区减 12 个月（含）}
        windowEndExclusive: {type: string, format: date-time, description: asOf（不含）；半开窗口}
        timezone: {type: string, maxLength: 64}
        paymentAmountFen: {type: integer, format: int64, minimum: 0, description: 独立金额：窗口内 CONFIRMED 支付流水 amount_fen 合计，不冲减退款}
        paidAmountFen: {type: integer, format: int64, minimum: 0, description: 窗口内非 DRAFT/CANCELED 订单的 paid_fen 合计，按 paid_at 取界}
        refundAmountFen: {type: integer, format: int64, minimum: 0, description: 窗口内 SUCCEEDED 退款支付 amount_fen 合计，按 succeeded_at 取界；申请中或失败退款不计}
        actualConsumptionFen: {type: integer, format: int64, minimum: 0, nullable: true, description: 实际消费金额（整数分）＝max(0, paidAmountFen - refundAmountFen)，唯一分级依据；旧评分快照为空}
        orderCount: {type: integer, format: int64, minimum: 0, description: ordered_at 在窗口内且非 DRAFT/CANCELED 的订单数；不参与定级}
        manualFollowupCount: {type: integer, format: int64, minimum: 0, description: 历史沟通记录；不参与定级}
        archivedMessageCount: {type: integer, format: int64, minimum: 0, description: 合法企微归档消息数；不参与定级}
        communicationCount: {type: integer, format: int64, minimum: 0, nullable: true, description: 人工跟进+合法归档；存在采集缺口时省略而不是 0；不参与定级}
        communicationComplete: {type: boolean, description: 仅描述沟通采集完整性，不影响按金额给出建议等级}
        score: {type: number, minimum: 0, maximum: 100, nullable: true, deprecated: true, description: 旧评分字段，仅为历史兼容保留；金额规则不计算且始终为空}
        suggestedTierCode: {type: string, enum: [S, A, B, C, D], nullable: true, description: 实际消费金额达到的最高等级；旧规则缺消费门槛时为空；降级仍须人工批准}
        sourceTrigger: {type: string, enum: [DAILY, ORDER_PAID, REFUND_SUCCEEDED, FOLLOWUP, MANUAL, TRIAL, SAMPLE]}
    CustomerTierEvaluationEnvelope:
      allOf:
        - {$ref: '#/components/schemas/ApiResponse'}
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/CustomerTierEvaluation'}
