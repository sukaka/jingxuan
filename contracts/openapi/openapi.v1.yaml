          required: [userId, displayName, attributionStatus, targetFen, targetStatus, targetCompletionRate, targetCompletionStatus, commissionFen, commissionStatus, sourceWatermark]
          properties:
            userId: {type: integer, format: int64, nullable: true, description: 成交快照人员 ID；未配置时为 null}
            displayName: {type: string, nullable: true}
            attributionStatus: {type: string, enum: [UNCONFIGURED, USER_NOT_FOUND, AT_SALE_SNAPSHOT]}
            targetFen: {type: integer, format: int64, nullable: true, description: 目标金额，整数分；未配置为 null}
            targetStatus: {type: string, enum: [UNCONFIGURED]}
            targetCompletionRate: {type: number, nullable: true, description: 目标完成率；未配置为 null，不是金额}
            targetCompletionStatus: {type: string, enum: [UNCONFIGURED]}
            commissionFen: {type: integer, format: int64, nullable: true, description: 提成金额，整数分；未配置为 null，不作为已批准工资事实}
            commissionStatus: {type: string, enum: [UNCONFIGURED]}
            sourceWatermark: {type: string, format: date-time, nullable: true}
    PerformanceDailyItem:
      type: object
      required: [statDate, paidOrderCount, refundCount, paidFen, refundFen, netPaidFen]
      properties:
        statDate: {type: string, format: date, description: 按请求时区归属的事实日期}
        paidOrderCount: {type: integer, format: int64, minimum: 0}
        refundCount: {type: integer, format: int64, minimum: 0}
        paidFen: {type: integer, format: int64, description: 当日已确认支付，整数分}
        refundFen: {type: integer, format: int64, description: 当日成功退款，整数分}
        netPaidFen: {type: integer, format: int64, description: paidFen-refundFen，整数分}
    PerformanceReport:
      allOf:
