            items: {type: array, items: {$ref: '#/components/schemas/Order'}}
            total: {type: integer, format: int64, minimum: 0}
            page: {type: integer, format: int32, minimum: 1}
            size: {type: integer, format: int32, minimum: 1, maximum: 100}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    OrderFulfillmentResponse:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
