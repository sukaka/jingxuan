      description: 仅统计范围内真实业务事实，不生成演示经营数字。from/to 为 timeZone 下的闭区间日期，最长 366 天；fromUtc/toUtcExclusive 和 sourceWatermark 显式返回。Q13 转化率 value=null，status=PENDING_DEFINITION。
