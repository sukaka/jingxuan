        - {name: institutionId, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}}
        - {name: resourceType, in: query, required: false, schema: {type: string, enum: [DOCTOR, EQUIPMENT, CASE]}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [PUBLISHED, OFFLINE, ALL], default: PUBLISHED}}
        - {name: keyword, in: query, required: false, schema: {type: string, maxLength: 120}}
        - $ref: '#/components/parameters/Page'
