    RefundStatus:
      type: string
      enum: [REQUESTED, APPROVED, REJECTED, PROCESSING, SUCCEEDED, FAILED]
    CreateRefundRequest:
      type: object
      additionalProperties: false
      required: [orderId, requestedFen, reasonCode, items]
      properties:
        orderId: {type: integer, format: int64, minimum: 1}
        requestedFen: {type: integer, format: int64, minimum: 1, description: 申请退款总额，整数分}
        reasonCode: {type: string, minLength: 1, maxLength: 64}
        reasonDetail: {type: string, maxLength: 1000, nullable: true}
        items:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/RefundItemRequest'}
      description: items 的 allocatedFen 合计必须等于 requestedFen；每个 entitlementId 只能出现一次。
    RefundItemRequest:
      type: object
      additionalProperties: false
      required: [entitlementId, revokeCount, allocatedFen]
      properties:
        entitlementId: {type: integer, format: int64, minimum: 1, description: 具体权益批次，不是项目或订单}
        revokeCount: {type: integer, format: int32, minimum: 1, description: 人工明确指定的回收次数，不自动返还可选项目}
        allocatedFen: {type: integer, format: int64, minimum: 0, description: 人工明确指定的现金分摊，整数分}
    ReviewRefundRequest:
      type: object
      additionalProperties: false
      required: [version, decision, reason]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        decision: {type: string, enum: [APPROVED, REJECTED]}
        approvedFen: {type: integer, format: int64, minimum: 1, nullable: true, description: APPROVED 必填，不得超过 requestedFen；REJECTED 必须为 null}
        reason: {type: string, minLength: 1, maxLength: 1000}
    ExecuteRefundRequest:
      type: object
      additionalProperties: false
      required: [version, provider, externalRefundNo, amountFen]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        provider: {type: string, enum: [BANK_TRANSFER, OFFLINE, MOCK], description: 人工渠道可凭证复核；MOCK 只能经验签回调确认}
        externalRefundNo: {type: string, minLength: 1, maxLength: 128, description: provider 内唯一外部退款号}
        amountFen: {type: integer, format: int64, minimum: 1, description: 执行金额，必须等于 approvedFen}
        evidenceRef: {type: string, maxLength: 192, nullable: true}
    ConfirmRefundSuccessRequest:
      type: object
      additionalProperties: false
      required: [externalRefundNo, amountFen, succeededAt, evidenceRef, voucherFileId]
      properties:
        externalRefundNo: {type: string, minLength: 1, maxLength: 128, description: 当前退款下 PENDING 执行记录的外部退款号}
        amountFen: {type: integer, format: int64, minimum: 1, description: 必须等于执行及批准金额}
        succeededAt: {type: string, format: date-time, description: 真实退款成功时间，必须带时区或 UTC offset}
        evidenceRef: {type: string, minLength: 1, maxLength: 192, description: 人工财务复核凭证审计引用}
        voucherFileId: {type: integer, format: int64, minimum: 1, description: 必须为当前可引用的 CLEAN 私有凭证}
    RefundCallbackRequest:
      type: object
      additionalProperties: false
      required: [externalRefundNo, amountFen, status, occurredAt]
      properties:
        externalRefundNo: {type: string, minLength: 1, maxLength: 128}
        amountFen: {type: integer, format: int64, minimum: 1, description: 回调金额必须等于原执行金额}
        status: {type: string, enum: [SUCCEEDED, FAILED]}
        occurredAt: {type: string, format: date-time}
        evidenceRef: {type: string, maxLength: 192, nullable: true, description: 脱敏适配器证据引用，不包含完整报文或密钥}
      description: 本地 Mock 验签结构，不代表有赞或其他官方退款字段目录。
    Refund:
      type: object
      required: [id, refundNo, orderId, customerId, requestedFen, approvedFen, succeededFen, reasonCode, reasonDetail, status, requestedBy, approvedBy, executedBy, succeededAt, createdAt, updatedAt, version]
      properties:
        id: {type: integer, format: int64}
        refundNo: {type: string}
        orderId: {type: integer, format: int64}
        customerId: {type: integer, format: int64}
        requestedFen: {type: integer, format: int64, minimum: 1}
        approvedFen: {type: integer, format: int64, minimum: 1, nullable: true, description: 未审批为 null，不得以 0 冒充待审批}
        succeededFen: {type: integer, format: int64, minimum: 0, description: 仅真实成功事实累计；申请/批准/执行中为 0}
        reasonCode: {type: string}
        reasonDetail: {type: string, nullable: true}
        status: {$ref: '#/components/schemas/RefundStatus'}
        requestedBy: {type: integer, format: int64}
        approvedBy: {type: integer, format: int64, nullable: true}
        executedBy: {type: integer, format: int64, nullable: true}
        succeededAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
    RefundItem:
      type: object
      required: [id, refundId, entitlementId, revokeCount, allocatedFen]
      properties:
        id: {type: integer, format: int64}
        refundId: {type: integer, format: int64}
        entitlementId: {type: integer, format: int64}
        revokeCount: {type: integer, format: int32, minimum: 1}
        allocatedFen: {type: integer, format: int64, minimum: 0}
    RefundPayment:
      type: object
      required: [id, refundId, provider, externalRefundNo, amountFen, status, verificationMethod, evidenceRef, voucherFileId, succeededAt, createdAt, updatedAt, version]
      properties:
        id: {type: integer, format: int64}
        refundId: {type: integer, format: int64}
        provider: {type: string}
        externalRefundNo: {type: string}
        amountFen: {type: integer, format: int64, minimum: 1}
        status: {type: string, enum: [PENDING, SUCCEEDED, FAILED]}
        verificationMethod: {type: string, enum: [MANUAL_REVIEW, PROVIDER_CALLBACK], nullable: true, description: PENDING 时尚无验证方式为 null}
        evidenceRef: {type: string, nullable: true, description: 脱敏证据引用，不含凭证正文}
        voucherFileId: {type: integer, format: int64, nullable: true}
        succeededAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
    RefundStatusHistory:
      type: object
      required: [id, refundId, fromStatus, toStatus, actorUserId, reason, createdAt]
      properties:
        id: {type: integer, format: int64}
        refundId: {type: integer, format: int64}
        fromStatus: {type: string, description: 创建时 NONE，其余为真实前状态}
        toStatus: {$ref: '#/components/schemas/RefundStatus'}
        actorUserId: {type: integer, format: int64, nullable: true, description: 验签回调可为空，人工操作必填}
        reason: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
    RefundDetail:
      type: object
      required: [refund, items, payments, history]
      properties:
        refund: {$ref: '#/components/schemas/Refund'}
        items: {type: array, items: {$ref: '#/components/schemas/RefundItem'}}
        payments: {type: array, items: {$ref: '#/components/schemas/RefundPayment'}}
        history: {type: array, items: {$ref: '#/components/schemas/RefundStatusHistory'}, description: 只追加，不覆盖历史状态}
    SettlementBatchStatus:
      type: string
      enum: [DRAFT, CONFIRMED, PARTIALLY_PAID, PAID]
    SettlementAmountStatus:
      type: string
      enum: [PENDING_VERIFICATION, VERIFIED]
    CreateSettlementBatchRequest:
      type: object
      additionalProperties: false
      required: [institutionId, settlementType, periodKey, redemptionIds]
      properties:
        institutionId: {type: integer, format: int64, minimum: 1}
        settlementType: {type: string, enum: [MONTHLY, PER_REDEMPTION]}
        periodKey: {type: string, minLength: 1, maxLength: 64, description: "月结为 YYYY-MM，次结为 REDEMPTION:{id}；机构+periodKey+settlementType 唯一"}
        redemptionIds:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items: {type: integer, format: int64, minimum: 1}
      description: 只能包含本机构真实 POSTED 且未入其他批次的核销；不从核销金额自动推算佣金。
    VerifySettlementBatchRequest:
      type: object
      additionalProperties: false
      required: [version, ruleVersion, grossFen, commissionFen, netPayableFen, verificationEvidence]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        ruleVersion: {type: string, minLength: 1, maxLength: 96, description: 财务离线核准的真实规则版本，不由系统猜测}
        grossFen: {type: integer, format: int64, minimum: 0}
        commissionFen: {type: integer, format: int64, minimum: 0}
        netPayableFen: {type: integer, format: int64, minimum: 0, description: 必须等于 grossFen-commissionFen}
        verificationEvidence: {type: string, minLength: 1, maxLength: 192, description: 人工核准证据的脱敏审计引用}
    RecordSettlementPaymentRequest:
      type: object
      additionalProperties: false
      required: [version, amountFen, bankTradeNo, paidAt, voucherFileId, evidenceRef]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        amountFen: {type: integer, format: int64, minimum: 1, description: 本次付款，累计不得超过 netPayableFen}
        bankTradeNo: {type: string, minLength: 1, maxLength: 128, description: 已人工核验的真实银行流水，全局唯一}
        paidAt: {type: string, format: date-time}
        voucherFileId: {type: integer, format: int64, minimum: 1, description: 必须为 CLEAN 私有付款凭证}
        evidenceRef: {type: string, minLength: 1, maxLength: 192}
    SettlementBatch:
      type: object
      required: [id, institutionId, settlementType, periodKey, status, amountStatus, grossFen, commissionFen, netPayableFen, paidFen, ruleVersion, verificationEvidence, createdAt, updatedAt, version]
      properties:
        id: {type: integer, format: int64}
        institutionId: {type: integer, format: int64}
        settlementType: {type: string, enum: [MONTHLY, PER_REDEMPTION]}
        periodKey: {type: string}
        status: {$ref: '#/components/schemas/SettlementBatchStatus'}
        amountStatus: {$ref: '#/components/schemas/SettlementAmountStatus'}
        grossFen: {type: integer, format: int64, minimum: 0, description: amountStatus=PENDING_VERIFICATION 时数值未核准，客户端必须展示待核实而非 0 元}
        commissionFen: {type: integer, format: int64, minimum: 0, description: 仅 VERIFIED 可作为已核准佣金}
        netPayableFen: {type: integer, format: int64, minimum: 0, description: 仅 VERIFIED 可作为应付净额}
        paidFen: {type: integer, format: int64, minimum: 0, description: 已登记付款累计；不是银行对账确认额}
        ruleVersion: {type: string, nullable: true, description: 财务核准版本；待核实不得用于推算}
        verificationEvidence: {type: string, nullable: true, description: 脱敏核准证据引用}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
    SettlementLine:
      type: object
      required: [id, settlementBatchId, redemptionId, amountStatus, grossFen, commissionFen, payableFen, rateSnapshot, pendingReason, createdAt]
      properties:
        id: {type: integer, format: int64}
        settlementBatchId: {type: integer, format: int64}
        redemptionId: {type: integer, format: int64, description: 全局唯一，防止同一核销重复结算}
        amountStatus: {$ref: '#/components/schemas/SettlementAmountStatus'}
        grossFen: {type: integer, format: int64, minimum: 0, description: PENDING_VERIFICATION 时尚未核准}
        commissionFen: {type: integer, format: int64, minimum: 0}
        payableFen: {type: integer, format: int64, minimum: 0}
        rateSnapshot: {type: string, nullable: true, description: 创建时冻结的机构费率快照 JSON 文本，不表示金额已核准}
        pendingReason: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
    SettlementPayment:
      type: object
      required: [id, settlementBatchId, amountFen, bankTradeNo, paidAt, voucherFileId, evidenceRef, createdBy, createdAt]
      properties:
        id: {type: integer, format: int64}
        settlementBatchId: {type: integer, format: int64}
        amountFen: {type: integer, format: int64, minimum: 1}
        bankTradeNo: {type: string}
        paidAt: {type: string, format: date-time}
        voucherFileId: {type: integer, format: int64}
        evidenceRef: {type: string}
        createdBy: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
      description: 追加式财务登记记录；不是银行回调，不提供 PATCH/DELETE。
    SettlementBatchDetail:
      type: object
      required: [batch, lines, payments]
      properties:
        batch: {$ref: '#/components/schemas/SettlementBatch'}
        lines: {type: array, items: {$ref: '#/components/schemas/SettlementLine'}}
        payments: {type: array, items: {$ref: '#/components/schemas/SettlementPayment'}}
    ReconciliationIssue:
      type: object
      required: [checkType, resourceId, institutionId, expectedCount, actualCount, expectedFen, actualFen, detail]
      properties:
        checkType: {type: string, enum: [ENTITLEMENT_LEDGER, ORDER_CASH, REFUND_ALLOCATION, SETTLEMENT_PAYMENT, UNBATCHED_REDEMPTION]}
        resourceId: {type: integer, format: int64, minimum: 1, description: 由 checkType 决定资源类型}
        institutionId: {type: integer, format: int64, nullable: true}
        expectedCount: {type: integer, format: int64, nullable: true}
        actualCount: {type: integer, format: int64, nullable: true}
        expectedFen: {type: integer, format: int64, nullable: true, description: 整数分；非金额差异为 null}
        actualFen: {type: integer, format: int64, nullable: true, description: 整数分；非金额差异为 null}
        detail: {type: string, description: 脱敏差异说明，不自动给出修账结果}
    ReconciliationReport:
      type: object
      required: [generatedAt, issueCount, issues]
      properties:
        generatedAt: {type: string, format: date-time}
        issueCount: {type: integer, format: int32, minimum: 0}
        issues: {type: array, items: {$ref: '#/components/schemas/ReconciliationIssue'}}
    RefundPageResponse:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data:
          type: object
          required: [items, total, page, size]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Refund'}}
            total: {type: integer, format: int64, minimum: 0}
            page: {type: integer, format: int32, minimum: 1}
            size: {type: integer, format: int32, minimum: 1, maximum: 100}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    RefundDetailResponse:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data: {$ref: '#/components/schemas/RefundDetail'}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    SettlementBatchPageResponse:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data:
          type: object
          required: [items, total, page, size]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/SettlementBatch'}}
            total: {type: integer, format: int64, minimum: 0}
            page: {type: integer, format: int32, minimum: 1}
            size: {type: integer, format: int32, minimum: 1, maximum: 100}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    SettlementBatchDetailResponse:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data: {$ref: '#/components/schemas/SettlementBatchDetail'}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    ReconciliationResponse:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data: {$ref: '#/components/schemas/ReconciliationReport'}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    ReportWindow:
      type: object
      required: [from, to, fromUtc, toUtcExclusive, timeZone, sourceSystem, receiverType, metricVersion, sourceWatermark]
      properties:
        from: {type: string, format: date, description: timeZone 下包含的统计开始日期}
        to: {type: string, format: date, description: timeZone 下包含的统计结束日期}
        fromUtc: {type: string, format: date-time, description: 开始日期在 timeZone 的零点对应 UTC instant，包含}
        toUtcExclusive: {type: string, format: date-time, description: 结束日期次日在 timeZone 的零点对应 UTC instant，不包含}
        timeZone: {type: string, description: 服务端规范化后的 Java ZoneId}
        sourceSystem: {type: string}
        receiverType: {type: string, enum: [ALL, PLATFORM, INSTITUTION]}
        metricVersion: {type: string, enum: [P2_FACT_V1]}
        sourceWatermark: {type: string, format: date-time, nullable: true, description: 本次实际事实源最大水位；无事实或无可用水位时为 null，不伪造同步进度}
    PendingRatio:
      type: object
      required: [value, status, questionCode, description]
      properties:
        value: {type: number, nullable: true, description: Q13 未确认前固定 null；不是金额，不得显示为 0%}
        status: {type: string, enum: [PENDING_DEFINITION]}
        questionCode: {type: string, enum: [Q13]}
        description: {type: string}
    OperationsConversionRates:
      type: object
      required: [contactToPaid, paidToCheckedIn, appointmentToCheckedIn, appointmentToServiceCompleted, checkedInToRedeemed]
      properties:
        contactToPaid: {$ref: '#/components/schemas/PendingRatio'}
        paidToCheckedIn: {$ref: '#/components/schemas/PendingRatio'}
        appointmentToCheckedIn: {$ref: '#/components/schemas/PendingRatio'}
        appointmentToServiceCompleted: {$ref: '#/components/schemas/PendingRatio'}
        checkedInToRedeemed: {$ref: '#/components/schemas/PendingRatio'}
    CampaignConversionRates:
      type: object
      required: [contactToPaid, appointmentToCheckedIn, checkedInToRedeemed]
      properties:
        contactToPaid: {$ref: '#/components/schemas/PendingRatio'}
        appointmentToCheckedIn: {$ref: '#/components/schemas/PendingRatio'}
        checkedInToRedeemed: {$ref: '#/components/schemas/PendingRatio'}
    ReportFact:
      type: object
      required: [factType, sourceId, orderId, customerId, campaignId, campaignBatchId, skuId, eventAt, amountFen, quantity, sourceSystem, receiverType]
      properties:
        factType: {type: string, enum: [FOLLOWUP, APPOINTMENT_CONFIRMED, CHECKED_IN, SERVICE_DONE, REDEMPTION, PAYMENT, REFUND, PAID_ORDER_LINE]}
        sourceId: {type: integer, format: int64, nullable: true}
        orderId: {type: integer, format: int64, nullable: true}
        customerId: {type: integer, format: int64, nullable: true}
        campaignId: {type: integer, format: int64, nullable: true}
        campaignBatchId: {type: integer, format: int64, nullable: true}
        skuId: {type: integer, format: int64, nullable: true}
        eventAt: {type: string, format: date-time}
        amountFen: {type: integer, format: int64, nullable: true, description: 支付/退款事实金额，整数分；非金额事实为 null}
        quantity: {type: integer, format: int64, nullable: true, description: 订单行销量或核销次数；不适用时为 null}
        sourceSystem: {type: string, nullable: true}
        receiverType: {type: string, enum: [PLATFORM, INSTITUTION], nullable: true}
    ReportDrillDown:
      type: object
      required: [drillDown, drillDownType, drillDownLimit]
      properties:
        drillDown: {type: array, items: {$ref: '#/components/schemas/ReportFact'}, description: 仅在 drillDownType 非 NONE 且存在可见事实时非空}
        drillDownType: {type: string, enum: [NONE, FOLLOWUP, APPOINTMENT_CONFIRMED, CHECKED_IN, SERVICE_DONE, REDEMPTION, PAYMENT, REFUND, PAID_ORDER_LINE]}
        drillDownLimit: {type: integer, format: int32, minimum: 1, maximum: 50}
    ReportFinancialTotals:
      type: object
      required: [paidOrderCount, refundCount, paidFen, platformPaidFen, institutionPaidFen, refundFen, platformRefundFen, institutionRefundFen, netPaidFen, platformNetPaidFen, institutionNetPaidFen]
      properties:
        paidOrderCount: {type: integer, format: int64, minimum: 0}
        refundCount: {type: integer, format: int64, minimum: 0}
        paidFen: {type: integer, format: int64, description: 已确认支付金额，整数分}
        platformPaidFen: {type: integer, format: int64, description: 平台收款已确认支付金额，整数分}
        institutionPaidFen: {type: integer, format: int64, description: 机构收款已确认支付金额，整数分}
        refundFen: {type: integer, format: int64, description: 已确认成功退款金额，整数分}
        platformRefundFen: {type: integer, format: int64, description: 平台收款对应的已确认成功退款，整数分}
        institutionRefundFen: {type: integer, format: int64, description: 机构收款对应的已确认成功退款，整数分}
        netPaidFen: {type: integer, format: int64, description: paidFen-refundFen，整数分}
        platformNetPaidFen: {type: integer, format: int64, description: platformPaidFen-platformRefundFen，整数分}
        institutionNetPaidFen: {type: integer, format: int64, description: institutionPaidFen-institutionRefundFen，整数分}
    OperationsMetrics:
      allOf:
        - $ref: '#/components/schemas/ReportFinancialTotals'
        - type: object
          required: [contactCustomerCount, contactEventCount, confirmedAppointmentCount, checkedInCustomerCount, checkedInAppointmentCount, serviceCompletedCount, redemptionBatchCount, redeemedCustomerCount, redeemedCount]
          properties:
            contactCustomerCount: {type: integer, format: int64, minimum: 0}
            contactEventCount: {type: integer, format: int64, minimum: 0}
            confirmedAppointmentCount: {type: integer, format: int64, minimum: 0}
            checkedInCustomerCount: {type: integer, format: int64, minimum: 0}
            checkedInAppointmentCount: {type: integer, format: int64, minimum: 0}
            serviceCompletedCount: {type: integer, format: int64, minimum: 0, description: CHECKED_IN→SERVICE_DONE 历史事实去重预约数}
            redemptionBatchCount: {type: integer, format: int64, minimum: 0}
            redeemedCustomerCount: {type: integer, format: int64, minimum: 0}
            redeemedCount: {type: integer, format: int64, minimum: 0}
    OperationsStaffRow:
      type: object
      required: [staffUserId, staffName, contactCustomerCount, contactEventCount, paidOrderCount, confirmedAppointmentCount, serviceCompletedCount, checkedInCustomerCount, checkedInAppointmentCount, redemptionBatchCount, redeemedCustomerCount, redeemedCount, paidFen, conversionRates]
      properties:
        staffUserId: {type: integer, format: int64, nullable: true}
        staffName: {type: string, nullable: true}
        contactCustomerCount: {type: integer, format: int64, minimum: 0}
        contactEventCount: {type: integer, format: int64, minimum: 0}
        paidOrderCount: {type: integer, format: int64, minimum: 0}
        confirmedAppointmentCount: {type: integer, format: int64, minimum: 0}
        serviceCompletedCount: {type: integer, format: int64, minimum: 0}
        checkedInCustomerCount: {type: integer, format: int64, minimum: 0}
        checkedInAppointmentCount: {type: integer, format: int64, minimum: 0}
        redemptionBatchCount: {type: integer, format: int64, minimum: 0}
        redeemedCustomerCount: {type: integer, format: int64, minimum: 0}
        redeemedCount: {type: integer, format: int64, minimum: 0}
        paidFen: {type: integer, format: int64, description: 已确认支付金额，整数分}
        conversionRates: {$ref: '#/components/schemas/OperationsConversionRates'}
    OperationsInstitutionRow:
      type: object
      required: [institutionId, institutionName, confirmedAppointmentCount, serviceCompletedCount, checkedInCustomerCount, checkedInAppointmentCount, redemptionBatchCount, redeemedCustomerCount, redeemedCount, pendingReconciliationFen, pendingReconciliationStatus, conversionRates]
      properties:
        institutionId: {type: integer, format: int64, nullable: true}
        institutionName: {type: string, nullable: true}
        confirmedAppointmentCount: {type: integer, format: int64, minimum: 0}
        serviceCompletedCount: {type: integer, format: int64, minimum: 0}
        checkedInCustomerCount: {type: integer, format: int64, minimum: 0}
        checkedInAppointmentCount: {type: integer, format: int64, minimum: 0}
        redemptionBatchCount: {type: integer, format: int64, minimum: 0}
        redeemedCustomerCount: {type: integer, format: int64, minimum: 0}
        redeemedCount: {type: integer, format: int64, minimum: 0}
        pendingReconciliationFen: {type: integer, format: int64, nullable: true, description: 已核准结算批次净应付减已付的未付余额，整数分；金额未核实时为 null，不是 0}
        pendingReconciliationStatus: {type: string, enum: [VERIFIED, PENDING_VERIFICATION], description: VERIFIED 仅表示金额可核实，不表示已付款}
        conversionRates: {$ref: '#/components/schemas/OperationsConversionRates'}
    CampaignEngagementMetrics:
      type: object
      required: [confirmedAppointmentCount, checkedInCustomerCount, checkedInAppointmentCount, redemptionBatchCount, redeemedCount]
      properties:
        confirmedAppointmentCount: {type: integer, format: int64, minimum: 0}
        checkedInCustomerCount: {type: integer, format: int64, minimum: 0}
        checkedInAppointmentCount: {type: integer, format: int64, minimum: 0}
        redemptionBatchCount: {type: integer, format: int64, minimum: 0}
        redeemedCount: {type: integer, format: int64, minimum: 0}
    CampaignTouchMetrics:
      type: object
      required: [touchCustomerCount, touchStatus]
      properties:
        touchCustomerCount: {type: integer, format: int64, nullable: true, description: 触达事实源未建立，当前固定 null，不是 0}
        touchStatus: {type: string, enum: [SOURCE_NOT_AVAILABLE]}
    OperationsReport:
      allOf:
        - $ref: '#/components/schemas/ReportWindow'
        - type: object
          required: [metrics, conversionRates, staffRows, institutionRows]
          properties:
            metrics: {$ref: '#/components/schemas/OperationsMetrics'}
            conversionRates: {$ref: '#/components/schemas/OperationsConversionRates'}
            staffRows: {type: array, items: {$ref: '#/components/schemas/OperationsStaffRow'}}
            institutionRows: {type: array, items: {$ref: '#/components/schemas/OperationsInstitutionRow'}}
        - $ref: '#/components/schemas/ReportDrillDown'
    OperationsDashboard:
      allOf:
        - $ref: '#/components/schemas/ReportWindow'
        - type: object
          required: [metrics, dailyItems, institutionRows, campaignRows, duty]
          properties:
            metrics: {$ref: '#/components/schemas/OperationsMetrics'}
            dailyItems: {type: array, items: {$ref: '#/components/schemas/PerformanceDailyItem'}}
            institutionRows: {type: array, items: {$ref: '#/components/schemas/OperationsInstitutionRow'}}
            campaignRows: {type: array, maxItems: 6, items: {$ref: '#/components/schemas/CampaignRow'}}
            duty: {$ref: '#/components/schemas/OperationsDuty'}
    OperationsDuty:
      type: object
      description: 值班待办计数。对应模块无读取权限时为 null，不表示数量为零。
