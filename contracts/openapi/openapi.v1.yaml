    post:
      tags: [InstitutionChanges]
      summary: FINANCE 审核（institution:approve_finance + 范围；申请 version；双审不得同人）
      description: 申请人不能自审，双审的 FINANCE 审核人不得与 MARKET 审核人相同。最终批准前重验 baseVersion/targetVersion 与 CLEAN；冲突转 CONFLICT_REVALIDATE 而非覆盖。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewChangeRequest'}
      responses:
        '200':
          description: 返回审核后申请；APPROVED/currentStep=COMPLETED 表示 EFFECTIVE
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChangeRequestEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/FileScanNotReady'}
