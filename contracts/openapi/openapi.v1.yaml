        paidFen: {type: integer, format: int64, minimum: 0, nullable: true, description: 内部订单已确认支付金额，整数分；无内部订单为 null}
        sourceSystem: {type: string, description: 内部订单来源；未映射时为原始 WEBHOOK/PULL 来源}
