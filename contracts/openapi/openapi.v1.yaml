      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/QuickReplyPreviewRequest'}}}
      responses:
        '200': {description: 渲染内容、变量及缺失项, content: {application/json: {schema: {$ref: '#/components/schemas/QuickReplyPreviewEnvelope'}}}}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /quick-replies/{id}/usage:
    post:
      tags: [QuickReply]
      operationId: recordQuickReplyUsage
      summary: 记录话术复制或当前会话 SDK 回调（quickreply:view + CSRF + 幂等）
      description: 校验员工、客户数据范围和企微映射；内容脱敏，日志只追加。SDK_SUCCESS 不代表客户已读。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/QuickReplyUsageRequest'}}}
      responses:
        '201': {description: 已记录, content: {application/json: {schema: {$ref: '#/components/schemas/QuickReplyUsageEnvelope'}}}}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /quick-replies/categories:
    get:
      tags: [QuickReply]
      operationId: listQuickReplyCategories
      summary: 快捷话术分类列表（quickreply:view + 作用域）
      responses:
        '200': {description: 分类列表, content: {application/json: {schema: {$ref: '#/components/schemas/QuickReplyCategoryListEnvelope'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [QuickReply]
      operationId: createQuickReplyCategory
      summary: 新建话术分类（quickreply:manage + CSRF + 幂等 + 审计）
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/QuickReplyCategoryRequest'}}}
      responses:
        '201': {description: 已创建, content: {application/json: {schema: {$ref: '#/components/schemas/QuickReplyCategoryEnvelope'}}}}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /quick-replies/categories/{id}:
    patch:
      tags: [QuickReply]
      operationId: updateQuickReplyCategory
      summary: 修改话术分类（quickreply:manage + version + 审计）
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/QuickReplyCategoryRequest'}}}
      responses:
        '200': {description: 已修改, content: {application/json: {schema: {$ref: '#/components/schemas/QuickReplyCategoryEnvelope'}}}}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /quick-replies/categories/{id}/disable:
    post:
      tags: [QuickReply]
      operationId: disableQuickReplyCategory
      summary: 停用话术分类（quickreply:manage + version + 审计）
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/QuickReplyReasonRequest'}}}
      responses:
        '200': {description: 已停用, content: {application/json: {schema: {$ref: '#/components/schemas/QuickReplyCategoryEnvelope'}}}}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /quick-replies/variables:
    get:
      tags: [QuickReply]
      operationId: listQuickReplyVariables
      summary: 快捷话术变量白名单（quickreply:view）
      responses:
        '200': {description: 已注册变量及业务口径, content: {application/json: {schema: {$ref: '#/components/schemas/QuickReplyVariableListEnvelope'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /quick-replies/{id}/favorite:
    put:
      tags: [QuickReply]
      operationId: favoriteQuickReply
      summary: 收藏当前员工的话术（quickreply:view + CSRF + 幂等）
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {description: 已收藏；列表按个人收藏优先排序, content: {application/json: {schema: {$ref: '#/components/schemas/QuickReplyTemplateEnvelope'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [QuickReply]
      operationId: unfavoriteQuickReply
      summary: 取消当前员工的个人收藏（quickreply:view + CSRF + 幂等）
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {description: 已取消收藏；使用日志不变, content: {application/json: {schema: {$ref: '#/components/schemas/QuickReplyTemplateEnvelope'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /quick-replies/statistics:
    get:
      tags: [QuickReply]
      operationId: getQuickReplyStatistics
      summary: 快捷话术使用统计（quickreply:view；普通员工仅本人）
      description: 直接聚合只追加使用日志；successRate 只以 SDK_SUCCESS/SDK_FAILED/SDK_UNKNOWN 为分母，COPIED 不计入发送成功率，不代表客户已读。
      parameters:
        - {name: employeeId, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}}
        - {name: from, in: query, required: false, schema: {type: string, format: date}}
        - {name: to, in: query, required: false, schema: {type: string, format: date}}
      responses:
        '200': {description: 按模板聚合的使用统计, content: {application/json: {schema: {$ref: '#/components/schemas/QuickReplyUsageStatListEnvelope'}}}}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /quick-replies/usages:
    get:
      tags: [QuickReply]
      operationId: listQuickReplyUsages
      summary: 快捷话术使用日志（quickreply:view；普通员工仅本人）
      parameters:
        - {name: templateId, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}}
        - {name: employeeId, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: 脱敏使用记录分页, content: {application/json: {schema: {$ref: '#/components/schemas/QuickReplyUsagePageEnvelope'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /wecom/oauth/authorize:
    get:
      tags: [WecomSidebar]
      operationId: authorizeWecomSidebar
      summary: 发起企微侧边栏 OAuth 成员授权
      description: 使用服务端配置的 CorpID、AgentID 和固定回调地址；state 为一次性随机值并存储于单实例 Redis，前端不能指定 CRM 员工。
      responses:
        '302': {description: 跳转企业微信官方 OAuth 授权页}
        '422': {$ref: '#/components/responses/BusinessRulePending'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /wecom/oauth/callback:
    get:
      tags: [WecomSidebar]
      operationId: completeWecomSidebarOAuth
      summary: 完成企微 OAuth 并建立现有 CRM 会话
      description: 校验一次性 state，通过官方 getuserinfo 获取成员，只接受唯一映射的 ACTIVE CRM 员工；成功后写 HttpOnly CRM_TOKEN 与可读 CRM_CSRF Cookie 并跳转固定侧边栏地址。
      parameters:
        - {name: code, in: query, required: true, schema: {type: string, maxLength: 512}}
        - {name: state, in: query, required: true, schema: {type: string, maxLength: 128}}
      responses:
        '302': {description: CRM 会话建立成功并跳转侧边栏}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/BusinessRulePending'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /wecom/jssdk/signature:
    post:
      tags: [WecomSidebar]
      operationId: signWecomSidebarPage
      summary: 生成企微 JS-SDK 企业与应用双签名（wecom:sidebar:view + CSRF）
      description: 服务端缓存企业及 agent_config 票据；URL 不包含 #，非本地必须 HTTPS 且 Origin 在受信配置内。Secret、access_token 和 ticket 不进入响应。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WecomJsSdkSignatureRequest'}
      responses:
        '200':
          description: 企业 config 与应用 agentConfig 签名
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WecomJsSdkSignatureEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/BusinessRulePending'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /wecom/sidebar/context:
    get:
      tags: [WecomSidebar]
      operationId: getWecomSidebarContext
      summary: 获取当前员工、企微客户映射及 CRM 摘要（wecom:sidebar:view + 数据范围）
      description: externalUserid 来自企微 JS-SDK，不是 CRM 主键；多个 CRM 客户映射时拒绝猜测。客户详情按当前用户数据范围校验，订单/套餐摘要分别受 order:read 与 entitlement:read 控制。
      parameters:
        - {name: externalUserid, in: query, required: false, schema: {type: string, maxLength: 192}}
      responses:
        '200':
          description: READY、CUSTOMER_UNLINKED 或 WAITING_CONTEXT 状态及摘要
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WecomSidebarContextEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /integrations/wecom/rooms:
    get:
      tags: [WecomIntegration]
      operationId: listWecomRooms
      summary: 当前数据范围内的群聊与完整成员清单（wecom:read）
      description: 管理员登记的群聊上下文和成员历史，不代表已调用供应商群成员接口。非 ALL 范围只返回存在当前可采且属于本人/团队员工的群；不包含消息正文。
      parameters: [{name: corpId, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 96}}]
      responses:
        '200': {description: 群聊配置与成员, content: {application/json: {schema: {$ref: '#/components/schemas/WecomRoomListEnvelope'}}}}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /integrations/wecom/rooms/{roomId}:
    put:
      tags: [WecomIntegration]
      operationId: saveWecomRoom
      summary: 登记或更新完整群成员清单（wecom:monitor + CSRF + 幂等 + version）
      description: 完整清单不是增量补丁；未列出的旧成员标记 REMOVED，不删除历史消息。启用时必须有已映射可采员工、至少一位外部参与人及所有当前外部参与人的有效同意；停用不删除历史。群聊 customerId 始终为空。
      parameters:
        - {name: roomId, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 192}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WecomRoomSaveRequest'}
      responses:
        '200': {description: 已保存的完整清单, content: {application/json: {schema: {$ref: '#/components/schemas/WecomRoomEnvelope'}}}}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /integrations/wecom/messages:
    get:
      tags: [WecomIntegration]
      summary: 已授权企微消息 metadata 分页（wecom:read + 当前同意/成员覆盖/数据范围）
      description: 每次查询都复查采集时和当前同意、归档成员覆盖及客户/员工范围。群聊通过已确认参与人中的可采员工判断 TEAM/SELF 范围，群消息 customerId、externalUserid、staffUserId 为空，senderWecomUserid 标识实际发送人。列表不含正文；空结果不等于没有沟通。
      parameters:
        - {name: customerId, in: query, required: false, schema: {type: integer, format: int64}, description: 可选单聊客户过滤；不可见返回 404；群聊不归属单一客户}
        - {name: conversationId, in: query, required: false, schema: {type: string, maxLength: 192}, description: 可选会话或群 roomid 过滤}
        - {name: corpId, in: query, required: false, schema: {type: string, maxLength: 96}, description: 可选企业过滤；仍叠加租户、同意、成员覆盖与 ALL/TEAM/SELF 范围}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 返回 msgId/archiveSeq、同意快照、当前同意、私有对象引用及状态；无可见消息时 items=[]
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WecomMessagePageResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /integrations/wecom/media/{id}/content:
    get:
      tags: [WecomIntegration]
      operationId: getWecomMediaContent
      summary: 下载已完成且获授权的企微媒体（wecom:read + 消息数据范围）
      description: 每次复查消息同意、归档成员覆盖与客户范围；仅 STORED 资产可读。返回私有对象流与附件响应，不暴露 sdkfileid、对象 Key 或永久公开 URL。PENDING/RETRY/FAILED 返回 422。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}, description: 内部媒体资产 ID}
      responses:
        '200': {description: 私有媒体字节流, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {description: PENDING_BUSINESS_RULE — 媒体尚未完成下载或对象存储不可用, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /integrations/wecom/messages/{id}/content:
    get:
      tags: [WecomIntegration]
      summary: 读取授权消息正文（wecom:read + 当前同意/成员覆盖/数据范围 + 对象校验）
      description: 仅当采集快照和当前同意均 GRANTED、成员覆盖有效且范围通过时，校验密文 SHA-256 后 AES 解密并写读取审计；撤回同意或越权返回 404，不是公开下载。
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}, description: 内部消息引用 messageRef}]
      responses:
        '200':
          description: 返回 messageRef/messageType/sentAt/content；正文来自私有 AES+MinIO 对象，不进入事件 payload
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WecomContentEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: PENDING_BUSINESS_RULE — 私有对象存储未配置，不能读取正文
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /integrations/wecom/monitor:
    get:
      tags: [WecomIntegration]
      summary: 企微归档游标与 DATA_GAP 监控（wecom:read + 数据范围）
      description: corpId 必填。无游标时返回 NEVER_SYNCED、lastSeq=0、dataGap=true，而不是“无沟通”；activeGaps 为 OPEN 缺口，historicalGaps 为已解决历史，messageCount 按当前范围计算。
      parameters:
        - {name: corpId, in: query, required: true, schema: {type: string, maxLength: 96}}
      responses:
        '200':
          description: 返回 archiveScope/lastSeq/lastSuccessAt/lastAttemptAt/status/dataGap/gapReason 及计数空态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WecomMonitorEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /integrations/youzan/orders:
    get:
      tags: [YouzanIntegration]
      summary: 有赞原始订单与映射分页（order:read + 数据范围；含未映射 Raw）
      description: 按外部订单最新 Raw 返回，授权范围内可包含未映射/未匹配记录。无内部订单时 mapId/orderId/orderStatus/paidFen/verificationMethod 为空；payloadMaskedJson 仅向 integration:youzan:manage 返回脱敏文本，其他 order:read 用户为 null，不返回 payload_cipher。
      parameters:
        - {name: shopId, in: query, required: true, schema: {type: string}}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 原始事件、外部金额/时间、映射状态及可空的内部订单字段
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanOrderPageResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /integrations/youzan/orders/{id}:
    get:
      tags: [YouzanIntegration]
      summary: Raw 原始订单详情（order:read + 数据范围；id 为 crm_youzan_event 数据库主键）
      description: 按 Raw 数据库主键读取，不是外部 eventId 或内部 orderId。未映射时 mapId/orderId/orderStatus/paidFen/verificationMethod 为空；范围外 404。
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200':
          description: 返回 Raw 处理状态和可空的内部映射/支付字段；脱敏原文仅 manage 可见
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanOrderViewEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /integrations/runtime-config:
    get:
      tags: [IntegrationRuntime]
      summary: 当前租户真实集成全局开关（integration:runtime:manage）
      description: 未保存页面配置时返回环境变量默认值和 version=0；不含 CorpID、Secret、Token 或其他凭证。
      responses:
        '200':
          description: 三个全局开关、乐观锁版本与配置来源
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntegrationRuntimeConfigEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [IntegrationRuntime]
      summary: 保存当前租户真实集成全局开关并即时生效（integration:runtime:manage）
      description: 写审计且支持幂等与乐观锁。开启不等于供应商授权、Q10/Q11 验收或生产联通已完成；店铺开关、企业凭证和成员/同意校验仍然有效。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IntegrationRuntimeConfigRequest'}
      responses:
        '200':
          description: 保存后的页面配置
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntegrationRuntimeConfigEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /integrations/youzan/sync:
    post:
      tags: [YouzanIntegration]
      summary: 单页拉取同步（integration:youzan:manage；真实店铺默认禁用）
      description: 支持 Mock fixture 和已启用的真实店铺配置。Idempotency-Key 仅为请求标识，未持久化同步结果；原始事件、外部订单映射和处理时间版本共同防止重复建单/发权益。真实同步受店铺租约和分页缩窗保护。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/YouzanSyncRequest'}
      responses:
        '200':
          description: 返回本页 received/processed/duplicates/issues、nextCursor 和 hasMore
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanSyncEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: PENDING_BUSINESS_RULE — 真实有赞未获 Q11 授权而禁用
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /integrations/youzan/reconcile:
    post:
      tags: [YouzanIntegration]
      summary: 补偿轮询（integration:youzan:manage；最多 10 页，不宣称完整对账）
      description: 从 cursor 补偿拉取并保存 nextCursor/最近成功时间；最多执行 10 页，hasMore=true 表示仍有未处理页面。原始事件幂等、店铺租约和补偿重试共同覆盖 webhook 之外的缺口，真实店铺默认禁用。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/YouzanSyncRequest'}
      responses:
        '200':
          description: 返回累计同步结果及最后游标；不是实时官方对账
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanSyncEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: PENDING_BUSINESS_RULE — 真实有赞未获 Q11 授权而禁用
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /integrations/youzan/reconcile-report:
    get:
      tags: [YouzanIntegration]
      summary: 有赞同步对账摘要（order:read）
      parameters:
        - {name: shopId, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: 返回 shopId、原始事件数、内部订单映射数、OPEN 异常数和 lastSyncAt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanReconcileReportEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /integrations/youzan/sync-issues:
    get:
      tags: [YouzanIntegration]
      summary: 有赞同步异常分页（order:read；异常详情仅脱敏）
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [OPEN, RETRYING, RESOLVED, DEAD]}}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: MAPPING_FAILED/CUSTOMER_UNRESOLVED/PAYMENT_MISMATCH/RETRY 等异常分页
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanIssuePageResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /integrations/youzan/sync-issues/{id}/retry:
    post:
      tags: [YouzanIntegration]
      summary: 重试未解决同步异常（campaign:write；已解决/终止返回 409）
      description: 仅 OPEN/RETRYING 可重试，更新尝试次数后按原事件重处理；header 未提供独立结果快照，业务幂等仍由事件与订单映射保证。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: 返回原事件最新处理状态，可能为 PROCESSED、MAPPING_FAILED、CUSTOMER_UNRESOLVED、PAYMENT_MISMATCH 或 RETRY
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanEventEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /integrations/youzan/sku-mappings:
    get:
      tags: [YouzanIntegration]
      summary: 外部 SKU 与 CRM SKU 映射列表（order:read）
      parameters:
        - {name: shopId, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: 返回 shopId+externalSkuId 到 crmSkuId 的 ACTIVE/INACTIVE 映射
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanSkuMappingListEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [YouzanIntegration]
      summary: 新建或更新 SKU 映射（campaign:write；既有映射需 version）
      description: 创建使用 shopId+externalSkuId+crmSkuId，更新必须匹配 version；目标 SKU 必须可见且 entitlementIssuable，否则 422。未明确映射的外部 SKU 不自动发权益。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/YouzanSkuMappingRequest'}
      responses:
        '200':
          description: 返回保存后的映射
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanSkuMappingEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: PENDING_BUSINESS_RULE — SKU 权益规则未确认或不完整
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /integrations/youzan/customer-links:
    get:
      tags: [YouzanIntegration]
      summary: 外部客户与 CRM 客户映射列表（order:read）
      parameters:
        - {name: shopId, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: 返回 externalCustomerId 与 customerId 的人工/强证据映射；不使用手机号或昵称充当客户 ID
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanCustomerLinkListEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [YouzanIntegration]
      summary: 人工确认客户映射（campaign:write + 客户范围；既有映射需 version）
      description: externalCustomerId 是外部标识而非手机号/昵称；customerId 必须可见，reason 为必填人工证据。更新需匹配 version，未确认客户进入 CUSTOMER_UNRESOLVED，不自动发权益。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/YouzanCustomerLinkRequest'}
      responses:
        '200':
          description: 返回 MANUAL/HIGH 的人工确认映射
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanCustomerLinkEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /integrations/youzan/shops:
    get:
      tags: [YouzanIntegration]
      summary: 有赞店铺授权配置列表（integration:youzan:manage）
      description: 仅返回密钥配置状态和 Token 到期时间，不返回 clientSecret、accessToken 或 refreshToken。
      responses:
        '200':
          description: 店铺配置列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanShopConfigListEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [YouzanIntegration]
      summary: 新建或更新有赞店铺授权配置（integration:youzan:manage）
      description: clientSecret 仅用于写入并加密保存；入参自动去除首尾空白，新建禁止空白密钥，编辑留空表示保持不变。仅修改 shopName 或 syncEnabled 会保留已验证连接与缓存 Token；修改 clientId 或 clientSecret 会清空 Token 并将状态重置为 UNVERIFIED。真实同步受企业运行时开关或 FEATURE_REAL_YOUZAN 及店铺开关约束。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/YouzanShopConfigRequest'}
      responses:
        '200':
          description: 已保存的安全配置视图
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanShopConfigEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /integrations/youzan/shops/{shopId}/test:
    post:
      tags: [YouzanIntegration]
      summary: 测试有赞 Token 与订单接口连接（integration:youzan:manage）
      parameters:
        - {name: shopId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: 连接测试通过
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanShopConfigEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: 真实功能开关未启用或授权尚未满足
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /integrations/youzan/shops/{shopId}/sync-policy:
    get:
      tags: [YouzanIntegration]
      summary: 查询店铺全量/增量同步策略（integration:youzan:manage）
      parameters:
        - {name: shopId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 未配置时 data 为 null
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanSyncPolicyEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [YouzanIntegration]
      summary: 保存全量开始时间、增量频率、重叠窗口和页大小（integration:youzan:manage）
      parameters:
        - {name: shopId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/YouzanSyncPolicyRequest'}
      responses:
        '200':
          description: 已保存策略
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanSyncPolicyEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /integrations/youzan/sync-jobs:
    get:
      tags: [YouzanIntegration]
      summary: 查询真实店铺同步任务及处理统计（integration:youzan:manage）
      parameters:
        - {name: shopId, in: query, required: true, schema: {type: string}}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 同步任务分页
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanSyncJobPageEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /webhooks/youzan/official:
    post:
      tags: [YouzanIntegration]
      summary: 有赞云官方消息入口；验签后返回官方 200 ACK 并延迟查询订单详情
      description: 使用 Client-Id、Event-Type 和 Event-Sign，按 client_id + 原始请求实体 + client_secret 验签。验签通过后按有赞云官方协议返回 HTTP 200 {"code":0,"msg":"success"}；其中 test=true 控制台验证消息与非订单事件仅返回 200 ACK，不进入订单或支付处理；订单类消息只作为变更通知触发延迟查单，不直接确认支付。
      security: []
      parameters:
        - {name: Client-Id, in: header, required: true, schema: {type: string}}
        - {name: Event-Type, in: header, required: true, schema: {type: string}}
        - {name: Event-Sign, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, description: 有赞官方消息原始实体，含 msgId/kdtId/msg/test 等}
      responses:
        '200':
          description: 有赞云官方消息推送标准成功 ACK；含 test=true 控制台验证消息与非订单事件的无副作用应答，订单类消息仅表示验签入库并已排期查单，不代表订单或支付已处理成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanOfficialWebhookAck'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401':
          description: 签名无效、店铺未配置/未启用同步或真实接入未启用
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '413':
          description: 消息体超过 1MB 限制（含 Content-Length 超限与 chunked 流式超限）；过深 JSON 按 400 拒绝
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /webhooks/youzan:
    post:
      tags: [YouzanIntegration]
      summary: Mock 有赞签名回调（非官方路径/签名；真实接入禁用）
      description: >-
        仅验证本地 Mock 的 HmacSHA256(timestamp + rawBody) hex 与 300 秒时间窗，X-Youzan-Mock-* 不是官方请求头或规则。
        验签成功后保存脱敏 JSON 与 AES 密文并异步处理；重复事件仍返回 202 + duplicate=true，不重复建单或发权益。Q11 未确认前 FEATURE_REAL_YOUZAN=false。
      security: []
      parameters:
        - {name: X-Youzan-Mock-Signature, in: header, required: false, schema: {type: string}, description: Mock 必填的 HMAC hex；缺失/错误/过期返回 401}
        - {name: X-Youzan-Mock-Timestamp, in: header, required: false, schema: {type: integer, format: int64}, description: Mock 必填的 Unix 秒时间戳，允许偏差 300 秒}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/YouzanWebhookEvent'}
      responses:
        '202':
          description: 验签通过并已接收，返回原始事件处理引用；不代表后续映射或支付已成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanEventEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401':
          description: UNAUTHORIZED — Mock 签名缺失、无效、过期或真实接入未启用
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /institution-merchant-resources:
    get:
      tags: [InstitutionProfiles]
      summary: 机构医生、仪器与案例资料分页（institution:read + 机构范围）
      description: 默认只返回 PUBLISHED 资料；status=ALL 用于有读取权限的管理视图。institutionId 只能收窄范围，跨机构返回 404。
      parameters:
        - {name: institutionId, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}}
        - {name: resourceType, in: query, required: false, schema: {type: string, enum: [DOCTOR, EQUIPMENT, CASE]}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [PUBLISHED, OFFLINE, ALL], default: PUBLISHED}}
        - {name: keyword, in: query, required: false, schema: {type: string, maxLength: 120}}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 授权机构范围内的真实资料分页
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstitutionMerchantResourcePageResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /institution-merchant-resources/summary:
    get:
      tags: [InstitutionProfiles]
      summary: 当前展示资料的按机构数量汇总（institution:read + 机构范围）
      description: 只统计 PUBLISHED 的医生、仪器和案例，OFFLINE 保留历史但不计入当前展示数量。
      responses:
        '200':
          description: 授权范围内各机构的展示资料数量，包括零数量机构
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstitutionMerchantResourceSummaryListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /institution-merchant-resources/{id}:
    patch:
      tags: [InstitutionProfiles]
      summary: 编辑、下架或恢复机构展示资料（institution:write + 员工机构范围）
      description: 资料类型不可改变；version 用于乐观锁，status 仅支持 PUBLISHED/OFFLINE。附件须为同机构 MERCHANT_RESOURCE 且扫描 CLEAN 的私有文件。操作写入审计并支持幂等。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
