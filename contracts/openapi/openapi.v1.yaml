  /channels/{id}:
    patch:
      tags: [Channels]
      operationId: updateChannel
      summary: 更新渠道（channel:write + CSRF + version 乐观锁）
      description: businessOwnerUserId 是后续新订单的商务归因来源；修改渠道不回写历史订单的 businessOwnerAtSaleId。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateChannelRequest'}
      responses:
        '200':
          description: 已更新渠道；历史订单快照不变
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChannelEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /materials:
    get:
      tags: [Materials]
      operationId: searchMaterials
      summary: 素材分页（material:read 或 material:review + 机构范围）
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {name: keyword, in: query, required: false, schema: {type: string, maxLength: 100}}
        - {name: categoryCode, in: query, required: false, schema: {type: string, maxLength: 48}}
        - {name: institutionId, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}}
        - {name: projectId, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}}
        - {name: cityCode, in: query, required: false, schema: {type: string, maxLength: 64}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [DRAFT, PENDING, APPROVED, REJECTED, OFFLINE]}, description: OFFLINE 查询主档下架状态；审核历史状态仍保留在修订中}
        - {name: globalOnly, in: query, required: false, schema: {type: boolean}, description: true 仅查询 institutionId=null 的受控全局素材}
      responses:
        '200':
          description: 可见素材分页；每项 revisions 仅含本行对应的单个修订，完整可见历史使用 GET /materials/{id}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MaterialPageResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Materials]
      operationId: createMaterial
      summary: 创建素材及首个 DRAFT 修订（material:write + CSRF）
      description: institutionId=null 表示全局素材，仅全机构范围可维护。fileId 必须是归属一致且未过期的 CLEAN 私有 MATERIAL 文件。
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMaterialRequest'}
      responses:
        '201':
          description: 已创建素材与首个修订
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MaterialEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/FileScanNotReady'}
  /materials/{id}:
    get:
      tags: [Materials]
      operationId: getMaterial
      summary: 素材与修订历史详情（material:read/write/review + 机构范围）
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
      responses:
        '200':
          description: 素材详情；revisions 按 revisionNo 倒序
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MaterialEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Materials]
      operationId: updateMaterialRevision
      summary: 编辑指定 DRAFT 修订（material:write + CSRF）
      description: revisionId 指定待编辑修订，version 是该修订的乐观锁版本；不得变更机构归属，历史已审修订不覆盖。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateMaterialRequest'}
      responses:
        '200':
          description: 已更新 DRAFT 修订
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MaterialEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/FileScanNotReady'}
  /materials/{id}/offline:
    post:
      tags: [Materials]
      operationId: offlineMaterial
      summary: 下架素材（material:write + CSRF + 幂等键）
      description: 仅 ACTIVE 且存在已审核当前版本的素材可下架。记录主档下架事实与审计，不修改审核修订或当前版本指针；普通只读管家不可见或下载，管理角色可在原数据范围内查看历史。当前不提供恢复接口。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OfflineMaterialRequest'}
      responses:
        '200':
          description: 已下架或同键回放；返回主档乐观锁版本及保留下来的审核历史
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MaterialEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /materials/{id}/revisions:
    post:
      tags: [Materials]
      operationId: createMaterialRevision
      summary: 新增素材 DRAFT 修订（material:write + CSRF）
      description: version 是素材主记录乐观锁版本；仅最新修订为 APPROVED/REJECTED 时可新增，revisionNo 递增，历史版本不覆盖。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMaterialRevisionRequest'}
      responses:
        '201':
          description: 已创建下一 DRAFT 修订
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MaterialEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/FileScanNotReady'}
  /materials/{id}/revisions/{revisionId}/submit:
    post:
      tags: [Materials]
      operationId: submitMaterialRevision
      summary: DRAFT → PENDING 送审（material:write + CSRF）
      description: version 是该修订的乐观锁版本；文件必须为 CLEAN，送审后不能再按 DRAFT 编辑。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {name: revisionId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmitMaterialRevisionRequest'}
      responses:
        '200':
          description: 已送审
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MaterialEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/FileScanNotReady'}
  /materials/{id}/revisions/{revisionId}/review:
    post:
      tags: [Materials]
      operationId: reviewMaterialRevision
      summary: PENDING → APPROVED/REJECTED 审核（material:review + CSRF；禁止自审）
      description: version 是该修订的乐观锁版本；REJECTED 必须填写 reviewNote，APPROVED 才更新 currentRevisionId。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {name: revisionId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewMaterialRevisionRequest'}
      responses:
        '200':
          description: 已审核修订
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MaterialEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/FileScanNotReady'}
  /materials/{id}/revisions/{revisionId}/download:
    get:
      tags: [Materials]
      operationId: downloadMaterialRevision
      summary: 生成修订文件短期私有下载地址（机构范围 + 修订状态权限）
      description: 仅返回该修订对应 CLEAN 私有文件的短期预签名 GET URL，不是公开文件地址。APPROVED 可读；PENDING 仅审核权限；DRAFT/REJECTED 仅可编辑的维护人。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {name: revisionId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: materialId、revisionId、fileId、短期 downloadUrl 与 expiresAt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MaterialDownloadEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/FileScanNotReady'}
  /exports:
    post:
      tags: [Exports]
      operationId: createExport
      summary: 创建 CUSTOMER/ORDER/REDEMPTION/FOLLOWUP 导出（export:create + 数据集读取权限 + CSRF）
      description: 必填 Idempotency-Key。scope 只能收窄，服务端与实时数据范围求交并保存 requested/executed/restriction；字段由服务端白名单校验，手机号仅脱敏导出。任务为 PENDING，不代表文件已生成。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateExportRequest'}
      responses:
        '201':
          description: 已创建或幂等回放导出任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportJobEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
    get:
      tags: [Exports]
      operationId: searchExports
      summary: 导出任务分页（export:read + 后端可见范围）
      parameters:
        - {name: exportType, in: query, required: false, schema: {$ref: '#/components/schemas/ExportType'}}
        - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/ExportStatus'}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: 当前用户可见导出任务分页
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportJobPageResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /exports/access-logs:
    get:
      tags: [Exports]
      operationId: searchExportAccessLogs
      summary: 导出申请/下载审计分页（export:read + 后端可见范围）
      description: 只读追加审计，不返回敏感导出内容。denialCode 是审计中的拒绝原因，不等同于新的全局 API 错误码。
      parameters:
        - {name: jobId, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}}
        - {name: actorId, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}}
        - {name: action, in: query, required: false, schema: {type: string, enum: [REQUEST, DOWNLOAD]}}
        - {name: result, in: query, required: false, schema: {type: string, enum: [ALLOWED, DENIED]}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: 可见导出审计分页
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportAccessLogPageResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /exports/{id}:
    get:
      tags: [Exports]
      operationId: getExport
      summary: 导出任务详情（export:read + 可见范围；范围外 404）
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
      responses:
        '200':
          description: 任务状态、筛选、已校验范围、行数及私有文件引用
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportJobEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /exports/{id}/download:
    get:
      tags: [Exports]
      operationId: downloadExport
      summary: 生成导出文件短期私有下载地址（export:read + 原申请人 + 数据集权限）
      description: 每次重验申请人身份、数据集读取权限、当前数据范围与已保存执行范围的一致性；仅 SUCCEEDED 且文件存在、CLEAN、未过期时成功。downloadUrl 是短期预签名 GET URL，不是公开文件地址。
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
      responses:
        '200':
          description: fileId、短期 downloadUrl 与 expiresAt；记录 DOWNLOAD 审计
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportDownloadEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /risks:
    get:
      tags: [Risks]
      operationId: searchRiskCases
      summary: 风险单分页（risk:read；仅授权内部员工，后端租户隔离（机构账号及 MANAGER 禁止））
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [OPEN, ASSIGNED, RESOLVED, CLOSED]}}
        - {name: severity, in: query, required: false, schema: {type: string, enum: [HIGH, MEDIUM, LOW]}}
        - {name: riskType, in: query, required: false, schema: {type: string, maxLength: 64}}
        - {name: sourceType, in: query, required: false, schema: {type: string, maxLength: 48}}
        - {name: sourceRef, in: query, required: false, schema: {type: string, maxLength: 128}}
        - {name: ownerUserId, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}}
        - {name: keyword, in: query, required: false, schema: {type: string, maxLength: 128}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: 范围内风险单分页；不包含 history
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RiskCasePageResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /risks/{id}:
    get:
      tags: [Risks]
      operationId: getRiskCase
      summary: 风险单与追加历史（risk:read；仅授权内部员工，后端租户隔离（机构账号及 MANAGER 禁止））
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
      responses:
        '200':
          description: 风险单及 history；历史只追加，无物理删除接口
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RiskCaseDetailEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /risks/{id}/claim:
    post:
      tags: [Risks]
      operationId: claimRiskCase
      summary: OPEN → ASSIGNED 认领（risk:write + CSRF + version）
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClaimRiskCaseRequest'}
      responses:
        '200':
          description: 已认领并追加 CLAIM 历史
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RiskCaseDetailEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /risks/{id}/resolve:
    post:
      tags: [Risks]
      operationId: resolveRiskCase
      summary: ASSIGNED → RESOLVED 处理（risk:write + CSRF + version）
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolveRiskCaseRequest'}
      responses:
        '200':
          description: 已保存处理结论并追加 RESOLVE 历史
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RiskCaseDetailEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /risks/{id}/close:
    post:
      tags: [Risks]
      operationId: closeRiskCase
      summary: RESOLVED → CLOSED 关闭（risk:write + CSRF + version）
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CloseRiskCaseRequest'}
      responses:
        '200':
          description: 已关闭并追加 CLOSE 历史；历史风险单仍只读可查
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RiskCaseDetailEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /ai/config:
    get:
      tags: [AI]
      summary: 查询当前租户大模型 Web 配置（ai:config，V15 默认仅 ADMIN）
      description: 不返回 API Key 明文或密文。无配置记录时返回 disabled、enabled=false、timeoutSeconds=30、version=0 的默认视图，不回显环境变量配置。
      responses:
        '200':
          description: 当前租户的 Web 配置或默认视图
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiProviderConfigEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [AI]
      summary: 保存大模型 Web 配置（ai:config，V15 默认仅 ADMIN；CSRF + 幂等键 + 乐观锁）
      description: >-
        body.version 必须等于当前版本，首次保存为 0；冲突返回 409。apiKey 可选，省略、null 或空白表示保留原密钥，响应只返回 apiKeyConfigured。
        保存后连接状态重置为 UNVERIFIED。openai_compatible 必须具有完整的 baseUrl、apiKey 和 model；baseUrl 默认仅允许 HTTPS。
      parameters: [{$ref: '#/components/parameters/CsrfToken'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAiProviderConfigRequest'}
      responses:
        '200':
          description: 已保存或返回同键同请求的当前配置；不回显密钥
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiProviderConfigEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /ai/config/test:
    post:
      tags: [AI]
      summary: 测试已保存的大模型连接（ai:config，V15 默认仅 ADMIN；CSRF + 幂等键）
      description: >-
        使用已保存配置经 Worker 执行一次实际抽取请求，不创建 AI_JOB、洞察或业务待办。openai_compatible 会调用 /chat/completions，
        可能产生 Token 费用和供应商限流，不是免费探活；mock 不调用外部供应商。HTTP 200 的 data.connectionStatus 可能为 CONNECTED 或 FAILED，
        lastErrorMasked 仅含脱敏错误。disabled 或未保存配置分别返回 400/404。
      parameters: [{$ref: '#/components/parameters/CsrfToken'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200':
          description: 测试已完成并更新连接状态与版本；同键回放不重复调用供应商
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiProviderConfigEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /ai/knowledge/config:
    get:
      tags: [AI]
      summary: 查询当前租户 Dify 知识问答配置（ai:knowledge:config，V20 默认仅 ADMIN）
      description: 独立于会话证据抽取的模型配置，不返回 App API Key 明文或密文。无记录时返回 disabled、enabled=false、timeoutSeconds=30、version=0。
      responses:
        '200':
          description: 当前租户 Dify 配置或默认视图
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DifyKnowledgeConfigEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [AI]
      summary: 保存 Dify 知识问答配置（CSRF + 幂等键 + 乐观锁）
      description: >-
        provider 仅 disabled/mock/dify。首次保存 version=0，后续必须与当前版本一致。apiKey 省略、null 或空白表示保留原密钥；
        dify 必须具备 baseUrl 和已保存 Key，disabled 不得 enabled=true。保存后连接状态重置 UNVERIFIED，真实请求仍受 FEATURE_REAL_DIFY 与 Q19 阻断。
      parameters: [{$ref: '#/components/parameters/CsrfToken'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateDifyKnowledgeConfigRequest'}
      responses:
        '200':
          description: 已保存或返回同键同请求的当前配置；不回显密钥
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DifyKnowledgeConfigEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /ai/knowledge/config/test:
    post:
      tags: [AI]
      summary: 测试已保存的 Dify 知识问答连接（CSRF + 幂等键）
      description: >-
        经 AI Worker 内部知识契约发送固定合成问题，不读取客户、聊天或素材，不创建业务待办。mock 不访问外部服务；
        dify 只有在 FEATURE_REAL_DIFY 开启后才可请求 blocking /chat-messages，可能产生 Token 费用。HTTP 200 的 connectionStatus 仍需区分 CONNECTED/FAILED；
        disabled 或未保存配置分别返回 400/404，同键回放不重复请求 Worker。
      parameters: [{$ref: '#/components/parameters/CsrfToken'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200':
          description: 测试已完成并更新连接状态与版本；不宣称知识质量或真实供应商验收
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DifyKnowledgeConfigEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /ai/knowledge/documents:
    get:
      tags: [AI]
      summary: 查询知识资料与最新同步状态（ai:knowledge:read 或 ai:knowledge:publish）
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [WAITING, SYNCING, ACTIVE, FAILED, DISABLED]}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: 当前租户知识资料分页，含最新任务、尝试次数和脱敏错误
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeDocumentPageResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /ai/knowledge/documents/{id}/disable:
    post:
      tags: [AI]
      summary: 停用知识资料及远端文档（ai:knowledge:publish；CSRF + 幂等键）
      description: >-
        有远端 documentId 时先停用 Dify 文档再更新 CRM，未创建远端文档的等待任务可直接停用；同键回放不重复调用。
        DISABLED 为本阶段终态：已停用资料不再被 Worker 认领，晚到的同步结果、事件或人工重试不得重新激活；重新启用不在当前接口范围内。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: 已停用；不删除素材审核历史
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeDocumentEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '502':
          description: 远端文档停用失败（AI_PROVIDER_FAILED），CRM 保留原状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Dataset 同步未启用（AI_PROVIDER_DISABLED）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /ai/knowledge/sync-jobs/{id}/retry:
    post:
      tags: [AI]
      summary: 人工重试失败的知识同步任务（ai:knowledge:publish；CSRF + 幂等键）
      description: 仅未停用资料的 FAILED/RETRY 可重试，重置为 PENDING 且 attemptCount=0；同键回放不重复推进版本。已停用资料返回 409。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: 已恢复为待执行状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeSyncJobEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /ai/knowledge/documents/publications:
    post:
      tags: [AI]
      summary: 发布已审核素材版本到知识同步队列（ai:knowledge:publish，V21 默认仅 ADMIN）
      description: >-
        要求 CSRF、幂等键、租户/机构数据范围、APPROVED 修订、CLEAN MATERIAL 文件及 UTF-8 TXT/Markdown（最大 1 MiB）。
        同步必须已由 syncEnabled 开启；响应只创建 WAITING 任务与 Outbox，不表示已经调用 Dify 或索引完成。
        相同 revisionId + contentHash 复用原任务，同幂等键不同请求体返回 409。已停用资料返回 409，不能通过再次发布隐式启用。
      parameters: [{$ref: '#/components/parameters/CsrfToken'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublishKnowledgeDocumentRequest'}
      responses:
        '201':
          description: 已创建或复用知识同步任务；不返回正文或密钥
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeSyncJobEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503':
          description: Dataset 同步未启用（AI_PROVIDER_DISABLED），不创建同步任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /ai/jobs:
    post:
      tags: [AI]
      summary: 创建授权消息证据抽取任务（ai:write + CSRF + 幂等键）
      description: 只接收 1–50 个消息 ID；服务端实时校验客户/成员/同意范围并推导客户与会话。任务异步执行，AI 不写业务事实。
      parameters: [{$ref: '#/components/parameters/CsrfToken'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAiJobRequest'}
      responses:
        '201':
          description: 已创建或返回同键原任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiJobEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    get:
      tags: [AI]
      summary: 按实时数据范围查询 AI 任务（ai:read）
      parameters:
        - {name: conversationId, in: query, required: false, schema: {type: string}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [QUEUED, RUNNING, RETRY, PROPOSED, FAILED, CONFIRMED, REJECTED]}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: AI 任务分页
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiJobPageResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /ai/jobs/{id}:
    get:
      tags: [AI]
      summary: AI 任务与待核实洞察详情；范围外 404
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200':
          description: 任务与洞察
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiJobEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /ai/jobs/{id}/confirmation:
    post:
      tags: [AI]
      summary: 人工确认或驳回 AI 建议（ai:confirm + task:write + CSRF + 幂等键）
      description: CONFIRM 只创建普通 FOLLOWUP 待办；REJECT 只记录人工结论。均不产生支付、退款、预约、合同或核销事实。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfirmAiJobRequest'}
      responses:
        '200':
          description: 人工处理结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiJobEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /ai/quality/summary:
    get:
      tags: [AI]
      summary: 主管 AI 会话质量建议统计（wecom:monitor + ai:read）
      description: 统计真实任务；风险标记仅为待核实 AI 建议，不作为处罚事实。
      responses:
        '200':
          description: 范围化质量统计
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiQualitySummaryEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /refunds:
    get:
      tags: [Refunds]
      summary: 退款分页（refund:read + 客户数据范围）
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - {name: customerId, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: orderId, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/RefundStatus'}}
      responses:
        '200':
          description: 范围内退款摘要分页；金额均为整数分
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RefundPageResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Refunds]
      summary: 创建 REQUESTED 退款申请（refund:write + 客户数据范围）
      description: 必须逐权益批次明确 revokeCount 和 allocatedFen，不按比例推断；申请不确认退款、不回收权益。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRefundRequest'}
      responses:
        '201':
          description: 已创建或幂等回放申请；succeededFen=0 且无退款成功事件
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RefundDetailResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /refunds/{id}:
    get:
      tags: [Refunds]
      summary: 退款详情（refund:read + 客户数据范围）
      description: 返回申请、逐权益回收计划、通道记录和追加状态历史；REQUESTED/APPROVED/PROCESSING 不代表资产已改变。
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200':
          description: 退款完整详情；范围外 404
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RefundDetailResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /refunds/{id}/review:
    post:
      tags: [Refunds]
      summary: REQUESTED → APPROVED/REJECTED（refund:approve；禁止自审）
      description: 审批人必须与申请人不同；APPROVED 仅允许后续执行，不增加订单 refundedFen、不追加 REFUND_REVOKE。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewRefundRequest'}
      responses:
        '200':
          description: 已审批或驳回，返回最新退款详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RefundDetailResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /refunds/{id}/executions:
    post:
      tags: [Refunds]
      summary: 登记退款执行并转 PROCESSING（refund:execute）
      description: 仅 APPROVED 可执行，保存 provider+externalRefundNo 唯一执行记录；此操作不确认资金成功且不改变权益。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExecuteRefundRequest'}
      responses:
        '200':
          description: 已登记 PENDING 通道记录，退款状态 PROCESSING
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RefundDetailResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /refunds/{id}/success:
    post:
      tags: [Refunds]
      summary: 人工财务复核确认退款成功（refund:execute）
      description: >-
        仅复核真实退款凭证后将 PENDING 执行记录转 SUCCEEDED。订单成功退款额、逐权益 REFUND_REVOKE、余额快照、状态历史、
        refund.succeeded.v1 与 entitlement.refund_revoked.v1 Outbox 在同一事务提交；任一步失败全部回滚。不是支付网关回调。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfirmRefundSuccessRequest'}
      responses:
        '200':
          description: 已确认或幂等回放真实成功事实；不重复回收权益
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RefundDetailResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /integrations/refunds/{provider}/callback:
    post:
      tags: [Refunds]
      summary: 退款适配器验签回调；本地仅 Mock，成功/失败同路径
      description: >-
        仅已启用的适配器可处理。本地 Mock 使用 X-Refund-Mock-* HMAC 验签，不是任何官方供应商字段；SUCCEEDED 才进入统一成功事务，
        FAILED 只追加失败事实。重复成功回调不重复退款或回收权益；未知 provider、签名或金额不符拒绝。
      security: []
      parameters:
        - {name: provider, in: path, required: true, schema: {type: string, maxLength: 48}, description: 本地仅 MOCK；真实供应商默认禁用}
        - {name: X-Refund-Mock-Signature, in: header, required: true, schema: {type: string}, description: Mock 回调 HMAC；真实供应商不使用此头}
        - {name: X-Refund-Mock-Timestamp, in: header, required: true, schema: {type: integer, format: int64}, description: Mock Unix 秒时间戳}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefundCallbackRequest'}
      responses:
        '200':
          description: 验签后处理结果；FAILED 不表示资产发生变化
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RefundDetailResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {description: UNAUTHORIZED — 签名、时间窗、来源无效或 Mock 未启用, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /settlements/batches:
    get:
      tags: [Settlements]
      summary: 机构结算批次分页（settlement:read + 本机构/内部授权范围）
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - {name: institutionId, in: query, required: false, schema: {type: integer, format: int64}, description: 机构账号只能查询本机构}
        - {name: settlementType, in: query, required: false, schema: {type: string, enum: [MONTHLY, PER_REDEMPTION]}}
        - {name: status, in: query, required: false, schema: {type: string, maxLength: 32, enum: [DRAFT, CONFIRMED, PARTIALLY_PAID, PAID]}}
      responses:
        '200':
          description: 范围内批次摘要分页；待核实金额不显示为 0 元
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SettlementBatchPageResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Settlements]
      summary: 按真实 POSTED 核销创建 DRAFT 批次（settlement:write；机构账号只读）
      description: 保存当前规则版本快照但不自动应用佣金率。同一核销只能进入一个批次，月结与次卡次结互斥；同内容重复创建返回原批次，不同内容 409。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSettlementBatchRequest'}
      responses:
        '201':
          description: 已创建或同内容幂等回放 DRAFT/PENDING_VERIFICATION 批次，尚不可付款
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SettlementBatchDetailResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: CONFLICT — 重复核销、批次内容或幂等冲突, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /settlements/batches/{id}:
    get:
      tags: [Settlements]
      summary: 结算批次详情（settlement:read + 本机构/内部授权范围）
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200':
          description: 批次、逐核销规则快照和追加付款记录；范围外 404
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SettlementBatchDetailResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /settlements/batches/{id}/verification:
    post:
      tags: [Settlements]
      summary: 财务人工核准规则版本与金额（settlement:write）
      description: 仅接受真实核准的 ruleVersion、gross/commission/netPayable 与 verificationEvidence，校验非负及 gross-commission=netPayable 后转 CONFIRMED/VERIFIED；不按机构费率推算。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VerifySettlementBatchRequest'}
      responses:
        '200':
          description: 已核准，可按净额分次登记付款
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SettlementBatchDetailResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /settlements/batches/{id}/payments:
    post:
      tags: [Settlements]
      summary: 登记追加式结算付款（settlement:write；不是银行回调）
      description: 仅 CONFIRMED/PARTIALLY_PAID 且 amountStatus=VERIFIED 可登记；bankTradeNo 唯一，voucherFileId 必须为 CLEAN，累计付款不得超过 netPayableFen。成功登记发布 settlement.payment.recorded.v1。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordSettlementPaymentRequest'}
      responses:
        '200':
          description: 已追加付款并更新 paidFen/批次状态；历史付款不覆盖
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SettlementBatchDetailResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: CONFLICT — 待核实付款、超额付款、重复银行流水、状态、版本或幂等冲突, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /settlements/reconciliation:
    get:
      tags: [Settlements]
      summary: 只读风险对账（settlement:read + 本机构/内部授权范围）
      description: 检查权益账本、订单现金/退款、退款分摊、批次付款及未入批核销，返回真实差异；不自动修账或生成付款。
      parameters:
        - {name: institutionId, in: query, required: false, schema: {type: integer, format: int64}, description: 机构账号仅可使用本机构 ID}
      responses:
        '200':
          description: 对账差异列表；issues=[] 仅表示本次检查范围无差异
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReconciliationResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
    cookieAuth:
      type: apiKey
      in: cookie
      name: CRM_TOKEN
      description: HttpOnly JWT（2h）。写方法另需 X-CSRF-Token 头 == CRM_CSRF Cookie（登录接口除外）。
  parameters:
    Page: {name: page, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
    Size: {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
      description: 写请求必传；同键仅可对应同一资源及相同请求，不同请求返回 409。幂等回放不重复改变状态或写账本。
    PaymentIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, maxLength: 128}
      description: 必传。同键仅可对应同一订单及相同请求体；同键不同订单或请求体返回 409，同键同请求幂等回放且不重复支付、发权益或写 Outbox。
    CsrfToken: {name: X-CSRF-Token, in: header, required: true, schema: {type: string}, description: 必须等于 CRM_CSRF Cookie 值}
    ReportFrom:
      name: from
      in: query
      required: true
      schema: {type: string, format: date}
      description: 统计开始日期，包含当天；不得晚于 to，区间最长 366 天
    ReportTo:
      name: to
      in: query
      required: true
      schema: {type: string, format: date}
      description: 统计结束日期，包含当天；UTC 结束边界为次日零时（toUtcExclusive）
    ReportTimeZone:
      name: timeZone
      in: query
      required: false
      schema: {type: string, maxLength: 64, default: UTC}
      description: Java ZoneId 可识别的时区 ID 或 offset；用于把 from/to 转为 UTC 边界，响应返回规范化 timeZone
    ReportSourceSystem:
      name: sourceSystem
      in: query
      required: false
      schema: {type: string, pattern: '[A-Za-z0-9_]{1,48}', default: ALL}
      description: 订单来源；服务端去空白并转大写，ALL 表示不限制来源
    ReportReceiverType:
      name: receiverType
      in: query
      required: false
      schema: {type: string, maxLength: 32, enum: [ALL, PLATFORM, INSTITUTION], default: ALL}
    ReportMetricVersion:
      name: metricVersion
      in: query
      required: false
      schema: {type: string, maxLength: 32, enum: [P2_FACT_V1], default: P2_FACT_V1}
      description: 当前唯一支持的报表口径版本；其他值返回 400
    ReportCustomerId: {name: customerId, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}, description: 可选客户筛选，只能收窄后端数据范围}
    ReportCampaignId: {name: campaignId, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}}
    ReportCampaignBatchId: {name: campaignBatchId, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}}
    ReportChannelId: {name: channelId, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}}
    ReportStaffUserId: {name: staffUserId, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}, description: 业绩员工筛选，只能收窄后端数据范围}
    ReportSkuId: {name: skuId, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}}
    ReportInstitutionId: {name: institutionId, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}}
    ReportPage: {name: page, in: query, required: false, schema: {type: integer, format: int32, minimum: 1, maximum: 10000, default: 1}}
    ReportSize: {name: size, in: query, required: false, schema: {type: integer, format: int32, minimum: 1, maximum: 100, default: 20}}
    ReportDrillDownLimit: {name: drillDownLimit, in: query, required: false, schema: {type: integer, format: int32, minimum: 1, maximum: 50, default: 20}}
    OperationsDrillDownType:
      name: drillDownType
      in: query
      required: false
      schema: {type: string, maxLength: 32, enum: [NONE, FOLLOWUP, APPOINTMENT_CONFIRMED, CHECKED_IN, SERVICE_DONE, REDEMPTION, PAYMENT, REFUND], default: NONE}
    PerformanceDrillDownType:
      name: drillDownType
      in: query
      required: false
      schema: {type: string, maxLength: 32, enum: [NONE, PAYMENT, REFUND], default: NONE}
    CampaignDrillDownType:
      name: drillDownType
      in: query
      required: false
      schema: {type: string, maxLength: 32, enum: [NONE, APPOINTMENT_CONFIRMED, CHECKED_IN, SERVICE_DONE, REDEMPTION, PAYMENT, REFUND], default: NONE}
    SkuDrillDownType:
      name: drillDownType
      in: query
      required: false
      schema: {type: string, maxLength: 32, enum: [NONE, PAID_ORDER_LINE], default: NONE}
  responses:
    ValidationFailed:
      description: VALIDATION_FAILED — 字段、格式或业务输入无效
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthorized:
      description: UNAUTHORIZED — 未认证或凭证失效
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Forbidden:
      description: FORBIDDEN / CSRF_TOKEN_INVALID — 无操作或数据范围权限，或 CSRF 校验失败
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: NOT_FOUND — 资源不存在或不在可见数据范围
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: CONFLICT — 状态/版本冲突、交易号冲突或同幂等键不同请求
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    BusinessRulePending:
      description: PENDING_BUSINESS_RULE — Q01/Q02 等必要业务规则未确认；details 携带 Qxx
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    FileScanNotReady:
      description: PENDING_BUSINESS_RULE — 文件扫描服务尚未就绪，不能审核或引用文件
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    CsrfInvalid:
      description: CSRF_TOKEN_INVALID — X-CSRF-Token 与 CRM_CSRF Cookie 不一致
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    UpdateAiProviderConfigRequest:
      type: object
      required: [provider, timeoutSeconds, enabled, version]
      additionalProperties: false
      properties:
        provider: {type: string, enum: [disabled, mock, openai_compatible]}
        baseUrl: {type: string, nullable: true, maxLength: 1024, description: OpenAI 兼容服务基础地址；默认要求 HTTPS，仅显式允许的内网地址可使用 HTTP}
        apiKey: {type: string, nullable: true, maxLength: 512, description: 仅写入；省略、null 或空白保留原密钥，不在任何响应或审计中返回}
        model: {type: string, nullable: true, maxLength: 128}
        timeoutSeconds: {type: integer, minimum: 1, maximum: 300}
        enabled: {type: boolean, description: Web 任务总开关；disabled 时不得为 true}
        version: {type: integer, format: int64, minimum: 0, description: 当前配置乐观锁版本；首次保存为 0}
    AiProviderConfig:
      type: object
      required: [provider, baseUrl, apiKeyConfigured, model, timeoutSeconds, enabled, connectionStatus, lastErrorMasked, lastConnectedAt, version]
      properties:
        provider: {type: string, enum: [disabled, mock, openai_compatible]}
        baseUrl: {type: string, nullable: true}
        apiKeyConfigured: {type: boolean, description: 仅表示是否已保存密钥，不包含密钥内容}
        model: {type: string, nullable: true}
        timeoutSeconds: {type: integer, minimum: 1, maximum: 300}
        enabled: {type: boolean}
        connectionStatus: {type: string, enum: [UNVERIFIED, CONNECTED, FAILED]}
        lastErrorMasked: {type: string, nullable: true, description: 脱敏连接错误，不含 API Key 或供应商原始错误响应}
        lastConnectedAt: {type: string, format: date-time, nullable: true}
        version: {type: integer, format: int64, minimum: 0}
    AiProviderConfigEnvelope:
      type: object
      properties:
        code: {type: string}
        message: {type: string}
        data: {$ref: '#/components/schemas/AiProviderConfig'}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    UpdateDifyKnowledgeConfigRequest:
      type: object
      required: [provider, timeoutSeconds, enabled, version]
      additionalProperties: false
      properties:
        provider: {type: string, enum: [disabled, mock, dify]}
        baseUrl: {type: string, nullable: true, maxLength: 1024, description: Dify API 基础地址；默认 HTTPS，仅显式允许的内网地址可使用 HTTP}
        apiKey: {type: string, nullable: true, maxLength: 512, description: Chatflow App Key，仅写入；省略、null 或空白保留原密钥}
        datasetId: {type: string, nullable: true, maxLength: 128, description: 显式映射的 Dify Dataset ID}
        datasetApiKey: {type: string, nullable: true, maxLength: 512, description: Dataset API Key，仅写入；省略、null 或空白保留原密钥}
        timeoutSeconds: {type: integer, minimum: 1, maximum: 300}
        enabled: {type: boolean, description: 租户知识问答开关；disabled 时不得为 true，真实请求另受 FEATURE_REAL_DIFY 限制}
        syncEnabled: {type: boolean, nullable: true, description: 资料同步开关；开启时必须已配置 Dataset ID 和 Dataset API Key，默认关闭}
        version: {type: integer, format: int64, minimum: 0, description: 当前配置乐观锁版本；首次保存为 0}
    DifyKnowledgeConfig:
      type: object
      required: [provider, baseUrl, apiKeyConfigured, datasetId, datasetApiKeyConfigured, syncEnabled, timeoutSeconds, enabled, connectionStatus, lastErrorMasked, lastConnectedAt, version]
      properties:
        provider: {type: string, enum: [disabled, mock, dify]}
        baseUrl: {type: string, nullable: true}
        apiKeyConfigured: {type: boolean, description: 仅表示是否已保存 App Key，不包含明文或密文}
        datasetId: {type: string, nullable: true}
        datasetApiKeyConfigured: {type: boolean, description: 仅表示是否已保存 Dataset Key，不包含明文或密文}
        syncEnabled: {type: boolean}
        timeoutSeconds: {type: integer, minimum: 1, maximum: 300}
        enabled: {type: boolean}
        connectionStatus: {type: string, enum: [UNVERIFIED, CONNECTED, FAILED]}
        lastErrorMasked: {type: string, nullable: true, description: 固定脱敏错误，不含上游原始报文}
        lastConnectedAt: {type: string, format: date-time, nullable: true}
        version: {type: integer, format: int64, minimum: 0}
    DifyKnowledgeConfigEnvelope:
      type: object
      properties:
        code: {type: string}
        message: {type: string}
        data: {$ref: '#/components/schemas/DifyKnowledgeConfig'}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    PublishKnowledgeDocumentRequest:
      type: object
      required: [materialId, revisionId, version]
      additionalProperties: false
      properties:
        materialId: {type: integer, format: int64, minimum: 1}
        revisionId: {type: integer, format: int64, minimum: 1}
        version: {type: integer, format: int64, minimum: 0, description: 当前素材修订乐观锁版本}
    KnowledgeSyncJob:
      type: object
      required: [id, documentId, revisionId, status, contentHash, attemptCount, lastErrorMasked, version]
      properties:
        id: {type: integer, format: int64}
        documentId: {type: integer, format: int64}
        revisionId: {type: integer, format: int64}
        status: {type: string, enum: [WAITING, PENDING, RUNNING, INDEXING, RETRY, SUCCEEDED, FAILED]}
        contentHash: {type: string, pattern: '^[0-9a-f]{64}$'}
        attemptCount: {type: integer, minimum: 0}
        lastErrorMasked: {type: string, nullable: true, description: 脱敏错误，不含正文或密钥}
        version: {type: integer, format: int64, minimum: 0}
    KnowledgeSyncJobEnvelope:
      type: object
      properties:
        code: {type: string}
        message: {type: string}
        data: {$ref: '#/components/schemas/KnowledgeSyncJob'}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    KnowledgeDocumentResponse:
      type: object
      required: [id, materialId, activeRevisionId, datasetId, difyDocumentId, status, publishedAt, latestJobId, latestJobStatus, attemptCount, lastErrorMasked, version]
      properties:
        id: {type: integer, format: int64}
        materialId: {type: integer, format: int64}
        activeRevisionId: {type: integer, format: int64, nullable: true}
        datasetId: {type: string, nullable: true}
        difyDocumentId: {type: string, nullable: true}
        status: {type: string, enum: [WAITING, SYNCING, ACTIVE, FAILED, DISABLED]}
        publishedAt: {type: string, format: date-time, nullable: true}
        latestJobId: {type: integer, format: int64, nullable: true}
        latestJobStatus: {type: string, nullable: true, enum: [WAITING, PENDING, RUNNING, INDEXING, RETRY, SUCCEEDED, FAILED]}
        attemptCount: {type: integer, nullable: true, minimum: 0}
        lastErrorMasked: {type: string, nullable: true}
        version: {type: integer, format: int64, minimum: 0}
    KnowledgeDocumentEnvelope:
      type: object
      properties:
        code: {type: string}
        message: {type: string}
        data: {$ref: '#/components/schemas/KnowledgeDocumentResponse'}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    KnowledgeDocumentPageResponse:
      type: object
      properties:
        code: {type: string}
        message: {type: string}
        data:
          type: object
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/KnowledgeDocumentResponse'}}
            total: {type: integer, format: int64}
            page: {type: integer}
            size: {type: integer}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    CreateAiJobRequest:
      type: object
      required: [messageIds]
      additionalProperties: false
      properties:
        messageIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: {type: integer, format: int64, minimum: 1}
          description: 当前用户有权读取的企微文本消息；客户与会话由服务端推导
    ConfirmAiJobRequest:
      type: object
      required: [version, decision]
      additionalProperties: false
      properties:
        version: {type: integer, format: int64, minimum: 0}
        decision: {type: string, enum: [CONFIRM, REJECT]}
        title: {type: string, maxLength: 255, description: CONFIRM 时必填，人工编辑后的普通待办标题}
        description: {type: string, maxLength: 2000}
        dueAt: {type: string, format: date-time, nullable: true}
        reason: {type: string, maxLength: 1000, description: REJECT 时必填}
    AiJob:
      type: object
      required: [id, customerId, conversationId, requestedBy, status, provider, modelName, errorMasked, taskId, version, createdAt, insight]
      properties:
        id: {type: integer, format: int64}
        customerId: {type: integer, format: int64}
        conversationId: {type: string}
        requestedBy: {type: integer, format: int64}
        status: {type: string, enum: [QUEUED, RUNNING, RETRY, PROPOSED, FAILED, CONFIRMED, REJECTED]}
        provider: {type: string, nullable: true}
        modelName: {type: string, nullable: true}
        errorMasked: {type: string, nullable: true, description: 脱敏错误，不含聊天或密钥}
        taskId: {type: integer, format: int64, nullable: true}
        version: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        insight: {$ref: '#/components/schemas/AiInsight', nullable: true}
    AiInsight:
      type: object
      required: [insightType, projectCodes, mentionedInstitution, mentionedTime, absoluteTime, evidenceMessageIds, confidence, proposedActions, factStatus, allowFinancialWrite, reasoningSummary, replyDraft, followupDraft, riskFlags]
      properties:
        insightType: {type: string, enum: [APPOINTMENT_INTENT, PRICE_INQUIRY, REFUND_INTENT, COMPLAINT, REPURCHASE_INTENT, SERVICE_EXPERIENCE, SERVICE_COMPLETION_CLAIM, GENERAL]}
        projectCodes: {type: array, items: {type: string}}
        mentionedInstitution: {type: string, nullable: true}
        mentionedTime: {type: string, nullable: true}
        absoluteTime: {type: string, format: date-time, nullable: true}
        evidenceMessageIds: {type: array, minItems: 1, items: {type: integer, format: int64}}
        confidence: {type: number, minimum: 0, maximum: 1, description: 模型自报分数，不代表校准概率}
        proposedActions: {type: array, items: {type: string, enum: [VERIFY_BALANCE, ASK_PREFERRED_INSTITUTION, CREATE_FOLLOWUP_DRAFT, VERIFY_SERVICE_RECORD, OFFER_HUMAN_SUPPORT, VERIFY_PAYMENT_RECORD]}}
        factStatus: {type: string, enum: [UNVERIFIED]}
        allowFinancialWrite: {type: boolean, enum: [false]}
        reasoningSummary: {type: string}
        replyDraft: {type: string, description: 只能人工复制，不自动发送}
        followupDraft: {type: object, nullable: true, additionalProperties: true}
