          application/json:
            schema: {$ref: '#/components/schemas/UploadInitRequest'}
      responses:
        '201':
          description: 返回私有 objectKey、短期 uploadUrl、expiresAt、method=PUT 与 sha256
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadInitEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /files/upload-complete:
    post:
      tags: [Files]
      summary: 完成上传并校验/扫描（已认证 + 原类别上传权限与范围；无 Idempotency-Key）
      description: 以 fileId+etag 和版本/扫描状态处理重试；校验 ETag、大小、SHA-256、MIME 和实际内容后执行扫描。CLEAN 且 ETag 相同的回放返回元数据，其他重复/校验或扫描失败返回 409。
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UploadCompleteRequest'}
      responses:
        '200':
          description: 仅实际校验和扫描通过后返回 CLEAN；非 CLEAN 不会被当作可引用文件
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileMetadataEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /files/{id}:
    get:
      tags: [Files]
      summary: 私有文件元数据（已认证 + 类别读取权限与机构范围；范围外 404）
      description: 按类别要求 institution:read/order:read/redemption:read/material:read；只返回元数据，不保证 CLEAN，也不返回永久公开 URL。
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200':
          description: 返回 scanStatus、hash、大小、机构、版本和错误类别等元数据
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileMetadataEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /files/{id}/download:
    get:
      tags: [Files]
      summary: 生成短期私有下载 URL（已认证 + CLEAN + 未过期 + 类别读取权限与范围）
      description: 每次重验权限与 CLEAN/有效期并记录下载审计；downloadUrl 是短期预签名 GET URL，不是永久公开地址，过期后须重新申请。
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200':
          description: 返回 fileId、短期 downloadUrl 与 expiresAt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DownloadEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /reports/wecom-analytics:
    get:
      tags: [Reporting]
      operationId: getWecomAnalytics
      summary: 企微话术、AI 采纳与真实业务转化分析（report:read + 客户数据范围）
      description: 默认最近 30 个企业自然日，最长 366 天；所有查询带 tenantId、当前客户数据范围和可选员工条件。AI 采纳率按创建批次当前 ACCEPTED 状态计算；复制、采纳、SDK 结果分别计数。到院率使用同一 CONFIRMED 预约批次的 CHECKED_IN 事实；复购率是期内有至少两笔不同已支付订单的客户占期内付费客户比例，不按流水重复计数。无分母时比率为 null，不返回 0 冒充无效果。
      parameters:
        - {name: from, in: query, required: false, schema: {type: string, format: date}, description: 企业自然日开始日期，默认结束日前 29 天}
        - {name: to, in: query, required: false, schema: {type: string, format: date}, description: 企业自然日结束日期，默认当前日期}
        - {name: employeeId, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}, description: 可选员工；SELF 只能查询本人，其他范围仍受客户权限约束}
      responses:
        '200': {description: 真实只读聚合及不支持的能力，不含聊天正文或客户隐私, content: {application/json: {schema: {$ref: '#/components/schemas/WecomAnalyticsEnvelope'}}}}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
