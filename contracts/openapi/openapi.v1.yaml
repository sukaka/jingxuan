openapi: 3.0.3
info:
  title: WhaleBeauty CRM API
  version: 0.1.0
  description: >
    Development contract. Each phase expands fields and paths with authorization, audit and tests.
    P0-1: auth (cookie JWT + CSRF double-submit), users/roles/permissions,
    dictionary admin, audit logs.
    P0-1b: customers (23-field profile, masked mobile, tags, points ledger),
    merge approval state machine, ownership-transfer approval, followups, tasks.
    P0-2: projects, packages, version snapshots, SKUs and institution applicability.
    P0-3: order drafts, trusted manual payment confirmation, entitlement snapshots and
    append-only ledger, idempotency and transactional Outbox.
    P0-4: appointments, institution-only posting, append-only redemption history and
    reversal request/review with per-entitlement corrections.
    P0-5: institution profiles, independent change reviews, contract versions,
    qualification review and private scanned files.
    P1-1: Youzan Mock adapter and P1-1R real-connection prebuild: encrypted shop
    credentials, token/order clients, official messages and sync jobs. Real supplier
    access remains disabled by default pending Q11 credentials and sandbox verification.
    P1-2: Mock-only Wecom archive, consent-aware metadata, identity links and
    data-gap monitoring; official SDK access remains disabled pending Q10.
    P1-3: authorized evidence extraction jobs, strict schemas, asynchronous retry,
    supervisor quality suggestions and human-confirmed FOLLOWUP tasks only; ADMIN-only
    Web provider configuration with encrypted keys and explicit connection tests.
    P1-4: reviewed refunds with explicit entitlement revocation, manually verified
    settlement batches, append-only payment records and read-only reconciliation.
    P2: fact-based operations/performance/campaign/SKU reports with explicit timezone and
    source watermarks, campaign/channel and order sale snapshots, material revisions,
    scoped private exports, risk history and points ledger APIs. Q13 ratios remain null
    with PENDING_DEFINITION; downloads are short-lived private URLs, not public files.
servers:
  - url: http://localhost:8080/api/v1
security:
  - cookieAuth: []
paths:
  /auth/captcha:
    get:
      tags: [Auth]
      summary: 获取一次性算术验证码；5分钟有效，答案仅保存在服务端短时存储
      description: 返回 PNG base64 与随机 captchaId，不返回答案。验证成功后立即失效；重复或错误答案返回400。图片禁止缓存，领取频率受限。
      security: []
      responses:
        '200':
          description: 验证码图片和唯一标识，不包含答案
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaptchaResponse'}
        '429':
          description: 领取过于频繁
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: 登录保护存储不可用
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /auth/login:
    post:
      tags: [Auth]
      summary: 用户名密码和一次性验证码登录；成功设置 CRM_TOKEN(HttpOnly JWT, 2h) 与 CRM_CSRF(可读) Cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthUserEnvelope'}
        '400':
          description: 验证码错误、已过期或请求字段无效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429':
          description: 连续登录失败达到限流阈值，Retry-After=900
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: 登录保护存储不可用，未跳过验证码或失败限流
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /auth/logout:
    post:
      tags: [Auth]
      summary: 登出；吊销服务端会话并清 Cookie，写审计
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      responses:
        '200': {description: 已登出}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/CsrfInvalid'}
  /auth/me:
    get:
      tags: [Auth]
      summary: 当前登录主体（角色/权限实时从 DB 解析，不缓存）
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthUserEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /users:
    get:
      tags: [Users]
      summary: 用户分页列表（user:read）；支持关键词、类型、团队、角色和状态组合筛选
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - {name: keyword, in: query, required: false, schema: {type: string, maxLength: 64}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [ACTIVE, DISABLED]}}
        - {name: userType, in: query, required: false, schema: {type: string, enum: [EMPLOYEE, INSTITUTION]}}
        - {name: teamId, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}}
        - {name: roleCode, in: query, required: false, schema: {type: string, maxLength: 64}}
      responses:
        '200':
          description: 用户分页
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPageResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Users]
      summary: 创建用户（user:write），密码 BCrypt 落库
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUser'}
      responses:
        '201': {description: 已创建}
        '409': {$ref: '#/components/responses/Conflict'}
  /users/teams:
    get:
      tags: [Users]
      summary: 当前租户启用团队选项（user:read）
      responses:
        '200':
          description: 团队 ID 与名称列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: string, example: OK}
                  message: {type: string}
                  requestId: {type: string}
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, teamName]
                      properties:
                        id: {type: integer, format: int64}
                        teamName: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /users/{id}:
    patch:
      tags: [Users]
      summary: 修改用户资料（user:write）；body.version 乐观锁，冲突 409
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateUser'}
      responses:
        '200': {description: 已更新}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /users/{id}/roles:
    put:
      tags: [Users]
      summary: 覆盖式分配角色（user:write）；下一请求立即生效，写审计
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssignRoles'}
      responses:
        '200': {description: 已更新角色}
        '400': {description: 角色不存在}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/{id}/disable:
    post:
      tags: [Users]
      summary: 停用用户（user:write）；吊销全部会话，写审计
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '200': {description: 已停用}
        '409': {$ref: '#/components/responses/Conflict'}
  /roles:
    get:
      tags: [Roles]
      summary: 角色列表含权限代码（user:read）
      responses:
        '200': {description: 角色列表}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Roles]
      summary: 创建角色（user:write）
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRole'}
      responses:
        '201': {description: 已创建}
        '409': {$ref: '#/components/responses/Conflict'}
  /roles/{id}/permissions:
    put:
      tags: [Roles]
      summary: 覆盖式设置角色权限（user:write）；持有该角色的用户下一请求即生效
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateRolePermissions'}
      responses:
        '200': {description: 已更新}
        '400': {description: 权限代码不存在}
        '404': {$ref: '#/components/responses/NotFound'}
  /permissions:
    get:
      tags: [Roles]
      summary: 权限目录（user:read）
      responses:
        '200': {description: 权限目录}
        '403': {$ref: '#/components/responses/Forbidden'}
  /dictionaries/{dictCode}/options:
    get:
      tags: [Dictionaries]
      summary: 启用中字典选项（dictionary:read，所有登录角色具备）
      parameters:
        - {name: dictCode, in: path, required: true, schema: {type: string, pattern: '[A-Za-z0-9_-]{1,64}'}}
      responses:
        '200': {description: ACTIVE 选项列表}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /dictionary-types:
    get:
      tags: [Dictionaries]
      summary: 字典类型与全部状态选项（dictionary:write，管理端）
      responses:
        '200': {description: 类型+选项（含 INACTIVE 历史项）}
        '403': {$ref: '#/components/responses/Forbidden'}
  /dictionary-types/{id}/items:
    get:
      tags: [Dictionaries]
      summary: 指定字典类型的全部状态条目（dictionary:read）
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: 指定类型的条目列表（含 INACTIVE 历史项）}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /dictionary-items:
    post:
      tags: [Dictionaries]
      summary: 新建字典项（dictionary:write）；optionCode 创建后不可变
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateDictionaryItem'}
      responses:
        '201': {description: 已创建（ACTIVE）}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /dictionary-items/{id}:
    patch:
      tags: [Dictionaries]
      summary: 修改字典项 label/sortNo（dictionary:write）；body.version 乐观锁
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateDictionaryItem'}
      responses:
        '200': {description: 已更新}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /dictionary-items/{id}/disable:
    post:
      tags: [Dictionaries]
      summary: 停用字典项（dictionary:write）；options 不再返回，历史可查
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '200': {description: 已停用（INACTIVE）}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /audit-logs:
    get:
      tags: [Audit]
      summary: 审计日志分页查询（audit:read）；审计只追加不可编辑
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - {name: actorId, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: actionCode, in: query, required: false, schema: {type: string, maxLength: 96}}
        - {name: targetType, in: query, required: false, schema: {type: string, maxLength: 64}}
      responses:
        '200': {description: '审计分页 {items,total,page,size}，含脱敏 before/after 快照'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /projects:
    get:
      tags: [Catalog]
      summary: 标准子项目分页（product:read）
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - {name: keyword, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [ACTIVE, INACTIVE]}}
      responses:
        '200': {description: '子项目分页 {items,total,page,size}，金额为整数分'}
    post:
      tags: [Catalog]
      summary: 新建标准子项目（product:write，编码唯一）
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProject'}
      responses:
        '201': {description: 已创建}
        '409': {description: 编码重复}
  /projects/{id}:
    patch:
      tags: [Catalog]
      summary: 编辑/停用子项目（product:write，version 乐观锁）
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProject'}
      responses:
        '200': {description: 已更新}
        '409': {description: 版本冲突}
  /packages:
    get:
      tags: [Catalog]
      summary: 套餐分页（product:read）
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - {name: keyword, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
      responses:
        '200': {description: 套餐分页}
    post:
      tags: [Catalog]
      summary: 新建套餐主定义（product:write）
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePackage'}
      responses:
        '201': {description: 已创建}
        '409': {description: 编码重复}
  /packages/{id}:
    patch:
      tags: [Catalog]
      summary: 编辑套餐主定义/停用（product:write）；停用联动 SKU 下架但不改历史快照
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdatePackage'}
      responses:
        '200': {description: 已更新}
        '409': {description: 版本冲突}
  /packages/{id}/versions:
    get:
      tags: [Catalog]
      summary: 套餐版本列表（product:read）
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200': {description: 版本列表}
    post:
      tags: [Catalog]
      summary: 创建版本草稿及子项目权益模板（product:write）
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePackageVersion'}
      responses:
        '201': {description: 已创建 DRAFT 快照}
        '400': {description: 项目/次数配置错误}
  /package-versions/{id}:
    patch:
      tags: [Catalog]
      summary: 编辑 DRAFT 版本（product:write）；ACTIVE/ARCHIVED 禁止覆盖
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdatePackageVersion'}
      responses:
        '200': {description: 已更新}
        '409': {description: 版本冲突或已激活}
  /package-versions/{id}/snapshot:
    get:
      tags: [Catalog]
      summary: 完整版本快照（product:read）；机构账号仅本机构适用的版本与机构
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200':
          description: 含子项目、SKU、机构、Q01/Q02 和 entitlementIssuable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PackageVersionSnapshot'}
        '404': {description: 不存在或不适用于本机构}
  /package-versions/{id}/projects:
    put:
      tags: [Catalog]
      summary: 替换 DRAFT 版本子项目（product:write，version 乐观锁）
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReplaceVersionProjects'}
      responses:
        '200': {description: 已替换}
        '409': {description: 版本冲突或已激活}
  /package-versions/{id}/activate:
    post:
      tags: [Catalog]
      summary: DRAFT → ACTIVE（product:write）；只激活配置，不代表选择模板可直接发权益
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VersionReview'}
      responses:
        '200': {description: 已激活}
        '409': {description: 状态冲突}
  /package-versions/{id}/archive:
    post:
      tags: [Catalog]
      summary: ACTIVE → ARCHIVED（product:write）；关联 SKU 下架，历史快照保留
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VersionReview'}
      responses:
        '200': {description: 已归档}
        '409': {description: 状态冲突}
  /skus:
    get:
      tags: [Catalog]
      summary: SKU 分页（product:read）；机构账号仅本机构适用 SKU
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - {name: keyword, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [ACTIVE, INACTIVE]}}
        - {name: packageId, in: query, schema: {type: integer, format: int64}}
      responses:
        '200': {description: SKU 分页，售价整数分}
    post:
      tags: [Catalog]
      summary: 创建停用状态 SKU（product:write）；必须复核后才能上架
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSku'}
      responses:
        '201': {description: 已创建 INACTIVE SKU}
        '409': {description: SKU 编码重复}
  /skus/{id}:
    patch:
      tags: [Catalog]
      summary: 编辑 DRAFT 版本 SKU；ACTIVE 版本仅允许未上架 SKU 补配机构，规格价格冻结
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateSku'}
      responses:
        '200': {description: 已更新}
        '409': {description: 状态或版本冲突}
  /skus/{id}/activate:
    post:
      tags: [Catalog]
      summary: 上架 SKU（product:write）；复核 ACTIVE 版本、权益规则与有效机构，Q01 未确认返回 422
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VersionReview'}
      responses:
        '200': {description: 已上架}
        '400': {description: 配置不完整}
        '422': {description: PENDING_BUSINESS_RULE，Q01 未确认，只能保存模板}
  /skus/{id}/disable:
    post:
      tags: [Catalog]
      summary: 停用 SKU（product:write）；不改写历史快照
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VersionReview'}
      responses:
        '200': {description: 已停用}
  /skus/{id}/institutions:
    get:
      tags: [Catalog]
      summary: 指定 SKU 的适用机构（product:read + 机构范围）
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200': {description: 机构列表}
        '404': {description: 不存在或不适用于本机构}
  /institutions:
    get:
      tags: [Catalog]
      summary: 合作机构只读选项（institution:read）；机构账号仅本机构
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - {name: keyword, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
      responses:
        '200': {description: 机构分页，不返回银行/税号等敏感字段}
  /customers:
    get:
      tags: [Customers]
      summary: 客户分页列表（customer:read + DataScope；ownerId 只允许收窄）
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - {name: keyword, in: query, required: false, schema: {type: string, maxLength: 64},
           description: 编号/称呼/昵称/备注名模糊；纯数字走手机号盲索引等值}
        - {name: status, in: query, required: false, schema: {type: string}}
        - {name: cityCode, in: query, required: false, schema: {type: string}}
        - {name: sourceCode, in: query, required: false, schema: {type: string}}
        - {name: channelCode, in: query, required: false, schema: {type: string}}
        - {name: tierCode, in: query, required: false, schema: {type: string}}
        - {name: ownerId, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: followupDueBefore, in: query, required: false, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: 范围内客户分页
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerPageResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Customers]
      summary: 新建客户（customer:write）。手机号可空（C01）；customerNo 服务端生成；昵称/称呼至少其一
      parameters:
        - {name: Idempotency-Key, in: header, required: false, schema: {type: string, maxLength: 128},
           description: 可选幂等键；同键同请求体返回首次结果，同键不同体 409}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCustomer'}
      responses:
        '201': {description: 已创建，返回详情}
        '400': {description: VALIDATION_FAILED}
        '409': {$ref: '#/components/responses/Conflict'}
  /customer-owner-options:
    get:
      tags: [Customers]
      summary: 可选所属管家（customer:read）；ADMIN 全部、MANAGER_LEAD 本组、MANAGER 本人，仅 ACTIVE 且具备管家角色
      responses:
        '200':
          description: 管家选项
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: string, example: OK}
                  message: {type: string}
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/OwnerOption'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /customers/{id}/legacy-profile:
    get:
      tags: [Customers]
      summary: 原客户信息表 23 字段映射视图（customer:read + 范围）；手机号仅脱敏，未导入/未落地字段明确标记
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200':
          description: 按原表顺序返回 23 项，PENDING_IMPORT/PENDING_DOMAIN 不伪造值
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: string, example: OK}
                  message: {type: string}
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/LegacyProfileItem'}
        '404': {$ref: '#/components/responses/NotFound'}
  /customers/{id}:
    get:
      tags: [Customers]
      summary: 客户详情（customer:read + 范围；范围外 404 不泄露存在性）
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200': {description: 详情（手机号仅 mobileMasked）}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Customers]
      summary: 编辑客户白名单字段（customer:write + 范围；body.version 乐观锁；未传字段不变，mobile 传空串清除）
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateCustomer'}
      responses:
        '200': {description: 已更新}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /customers/{id}/tags:
    put:
      tags: [Customers]
      summary: 全量替换客户标签（customer:write + 范围；审计 before/after）
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateCustomerTags'}
      responses:
        '200': {description: 已替换，返回详情}
        '404': {$ref: '#/components/responses/NotFound'}
  /customers/{id}/points:
    get:
      tags: [Customers]
      operationId: getCustomerPoints
      summary: 客户积分视图（customer:read + 后端数据范围）；balance = 账本 SUM(delta)
      description: 积分不是金额。balance 由追加账本求和，points_cached 仅为缓存；范围外返回 404，不泄露客户存在性。
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}]
      responses:
        '200':
          description: 权威积分余额与完整流水
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerPointsEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /customers/{id}/points-adjustments:
    post:
      tags: [Customers]
      operationId: adjustCustomerPoints
      summary: 追加积分调整（customer:points_adjust + 后端数据范围 + CSRF）
      description: delta 不得为 0，调整后余额不得为负；只追加 MANUAL_ADJUST 流水并刷新缓存，不直接覆盖余额。可选 Idempotency-Key 同键同请求返回首次结果，同键不同请求或余额不足返回 409。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {name: Idempotency-Key, in: header, required: false, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PointsAdjustment'}
      responses:
        '200':
          description: 调整后的权威积分余额与完整流水
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerPointsEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /customer-merge-candidates:
    get:
      tags: [CustomerMerges]
      summary: 合并候选分页（customer:merge；主从客户均须在可见范围）
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - {name: status, in: query, required: false, schema: {type: string, enum: [SUGGESTED, REVIEWING, CONFIRMED, REJECTED, REVERSED]}}
      responses:
        '200':
          description: 候选分页及更正状态
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ApiResponse'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/MergeCandidatePage'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /customer-merge-candidates/scan:
    post:
      tags: [CustomerMerges]
      summary: 按 mobile_hash / identity external_id 扫描生成 SUGGESTED 候选（幂等，不重复生成同主从）
      responses:
        '200': {description: '{created, items} 本次新建候选'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /customer-merges:
    post:
      tags: [CustomerMerges]
      summary: 人工登记合并候选（customer:merge；两客户均须可见且未归档；同对客户 409）
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMergeCase'}
      responses:
        '201': {description: 已登记 SUGGESTED}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /customer-merges/{id}/review:
    post:
      tags: [CustomerMerges]
      summary: SUGGESTED → REVIEWING（body.version 乐观锁）
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewMergeCase'}
      responses:
        '200': {description: 已转 REVIEWING}
        '409': {$ref: '#/components/responses/Conflict'}
  /customer-merges/{id}/confirm:
    post:
      tags: [CustomerMerges]
      summary: REVIEWING → CONFIRMED；锁主从并同事务迁移 identity/tag/followup/task/积分流水，按账本重算主客户积分，从客户 deleted=1
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewMergeCase'}
      responses:
        '200': {description: 已合并}
        '404': {description: 合并单或其一客户不可见}
        '409': {$ref: '#/components/responses/Conflict'}
  /customer-merges/{id}/reject:
    post:
      tags: [CustomerMerges]
      summary: 拒绝合并 → REJECTED（version + reason）
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RejectMergeCase'}
      responses:
        '200': {description: 已拒绝}
        '409': {$ref: '#/components/responses/Conflict'}
  /customer-merge-candidates/{id}/reversal-requests:
    post:
      tags: [CustomerMerges]
      operationId: requestMergeReversal
      summary: 对已确认合并申请更正（customer:merge + CSRF + 幂等键）
      description: 仅 CONFIRMED 可申请；双方客户均须在数据范围内。申请只生成 REQUESTED，不修改客户或关联数据。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MergeReversalAction'}
      responses:
        '200':
          description: 已申请或幂等回放
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MergeReversalEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /customer-merge-reversals:
    get:
      tags: [CustomerMerges]
      operationId: getMergeReversal
      summary: 查询合并更正状态（customer:merge + 双方数据范围）
      parameters:
        - {name: mergeCaseId, in: query, required: true, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: 更正单状态及人工复核警示
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MergeReversalEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /customer-merge-reversals/{id}/approve:
    post:
      tags: [CustomerMerges]
      operationId: approveMergeReversal
      summary: 审批并执行合并更正（customer:merge_reverse + CSRF + 幂等键）
      description: 有快照时只迁回快照中的身份、标签、跟进、任务、积分、订单及权益，原合并单改 REVERSED。无快照时只恢复从客户并进入 MANUAL_REVIEW。去重删除的身份和标签不自动重建；支付金额、发放和核销事实不覆盖。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MergeReversalAction'}
      responses:
        '200':
          description: EXECUTED 或 MANUAL_REVIEW
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MergeReversalEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /customer-merge-reversals/{id}/complete:
    post:
      tags: [CustomerMerges]
      operationId: completeMergeReversal
      summary: 人工确认旧合并更正完成（customer:merge_reverse + CSRF + 幂等键）
      description: 仅 MANUAL_REVIEW 可完成；须填写逐项人工处理说明，原合并单改 REVERSED，不伪造系统自动恢复结果。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MergeReversalAction'}
      responses:
        '200':
          description: 已人工确认完成或幂等回放
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MergeReversalEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /customer-merge-reversals/{id}/reject:
    post:
      tags: [CustomerMerges]
      operationId: rejectMergeReversal
      summary: 驳回合并更正申请（customer:merge_reverse + CSRF + 幂等键）
      description: 仅 REQUESTED 可驳回；不改变原合并结果、客户或关联数据。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MergeReversalAction'}
      responses:
        '200':
          description: 已驳回或幂等回放
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MergeReversalEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /customers/{id}/ownership-transfers:
    get:
      tags: [CustomerTransfers]
      summary: 客户的转交审批单列表（customer:read + 范围）
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200': {description: 转交单列表（含状态/审批人/版本）}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [CustomerTransfers]
      summary: 发起转交（customer:transfer；PENDING，不改归属；组内 MANAGER_LEAD，跨团队仅 ADMIN；已有 PENDING 单 409）
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTransfer'}
      responses:
        '201': {description: 已创建 PENDING 转交单}
        '403': {description: "跨团队仅 ADMIN / 无 customer:transfer"}
        '409': {$ref: '#/components/responses/Conflict'}
  /customer-ownership-transfers/{id}/approve:
    post:
      tags: [CustomerTransfers]
      summary: 批准转交（body.version 乐观锁；客户 version 与 baseVersion 失配 409 复核）；同事务写 owner/team + 归属历史
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewTransfer'}
      responses:
        '200': {description: EFFECTIVE}
        '403': {description: 跨团队仅 ADMIN}
        '409': {$ref: '#/components/responses/Conflict'}
  /customer-ownership-transfers/{id}/reject:
    post:
      tags: [CustomerTransfers]
      summary: 驳回转交（version + reason）
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RejectTransfer'}
      responses:
        '200': {description: REJECTED}
        '409': {$ref: '#/components/responses/Conflict'}
  /customers/{id}/ownership-history:
    get:
      tags: [CustomerTransfers]
      summary: 生效的归属变更历史（只读，不可改）
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200': {description: 历史列表}
        '404': {$ref: '#/components/responses/NotFound'}
  /followups:
    get:
      tags: [Followups]
      summary: 跟进分页（followup:read + 客户数据范围）
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - {name: customerId, in: query, required: false, schema: {type: integer, format: int64}}
      responses:
        '200': {description: 跟进分页}
        '404': {description: 指定客户不可见}
    post:
      tags: [Followups]
      summary: 登记跟进（followup:write；contactAt 缺省当前；同事务刷新客户 last_followup_at）
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateFollowup'}
      responses:
        '201': {description: 已登记}
        '404': {$ref: '#/components/responses/NotFound'}
  /followups/{id}:
    patch:
      tags: [Followups]
      summary: 修改跟进（创建者或同组主管；version 乐观锁）
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateFollowup'}
      responses:
        '200': {description: 已更新}
        '403': {description: 非创建者/同组主管}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [Followups]
      summary: 软删除跟进（followup:write；创建者/同组主管/ADMIN + 客户范围；version 乐观锁）
      description: 仅创建者本人、客户同组主管或 ADMIN 可软删除。保留历史记录和 FOLLOWUP_DELETE 审计，不物理删除；重复删除或不可见返回 404，版本冲突返回 409。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: version, in: query, required: true, schema: {type: integer, format: int64, minimum: 0}}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '200':
          description: 已软删除并写审计；统一空数据信封（data 省略）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmptyResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /tasks:
    get:
      tags: [Tasks]
      summary: 任务分页（task:read；ALL/TEAM/SELF 范围；assigneeId 只收窄）
      description: SELF 范围除本人任务外，还可见 taskTeamId 等于本人团队且 assigneeUserId 为空的 OPEN 任务池任务；跨团队任务不可见。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - {name: assigneeId, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [OPEN, PROCESSING, DONE, CANCELED]}}
      responses:
        '200': {description: 任务分页}
    post:
      tags: [Tasks]
      summary: 新建任务（task:write + CSRF；分配给本人；customerId 须可见）
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTask'}
      responses:
        '201': {description: 已创建}
        '404': {description: customerId 不可见}
  /tasks/{id}:
    patch:
      tags: [Tasks]
      summary: 修改任务普通字段（task:write + CSRF；本人/同组主管/ADMIN；version 乐观锁）
      description: 禁止通过此接口修改 status；传入 status 返回 400。接手、转派、退回、完成必须分别调用对应动作接口。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTask'}
      responses:
        '200':
          description: 已更新普通字段
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskItemEnvelope'}
        '400': {description: VALIDATION_FAILED；包括试图通过通用 PATCH 修改 status}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: 非负责人/同组主管或 CSRF 无效}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: 版本冲突}
  /tasks/{id}/claim:
    post:
      tags: [Tasks]
      operationId: claimTask
      summary: 接手任务（task:write + 可见范围 + CSRF + 幂等键 + version）
      description: 仅 OPEN 任务可接手，动作后为 PROCESSING，assigneeUserId 为当前用户并写入 claimedAt。SELF 用户只能接手本人可见的同组任务池任务；同键同请求回放不重复追加日志。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClaimTaskRequest'}
      responses:
        '200':
          description: 已接手或幂等回放，返回最新任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskItemEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /tasks/{id}/reassign:
    post:
      tags: [Tasks]
      operationId: reassignTask
      summary: 转派任务（task:write + MANAGER_LEAD/ADMIN + CSRF + 幂等键 + version）
      description: 仅 OPEN/PROCESSING 任务可转派，动作后为 PROCESSING。目标须为 ACTIVE 内部员工；主管只能转派给本组成员，管理员可跨组。taskTeamId 更新为目标团队，originalAssigneeUserId 不变。reason 必填。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReassignTaskRequest'}
      responses:
        '200':
          description: 已转派或幂等回放，返回最新任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskItemEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /tasks/{id}/return:
    post:
      tags: [Tasks]
      operationId: returnTask
      summary: 退回任务池（task:write + 本人/同组主管/ADMIN + CSRF + 幂等键 + version）
      description: 仅 PROCESSING 任务可退回，动作后为 OPEN；assigneeUserId 和 claimedAt 清空，taskTeamId 与 originalAssigneeUserId 保留。reason 必填。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReturnTaskRequest'}
      responses:
        '200':
          description: 已退回任务池或幂等回放，返回最新任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskItemEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /tasks/{id}/complete:
    post:
      tags: [Tasks]
      operationId: completeTask
      summary: 完成任务（task:write + 本人/同组主管/ADMIN + CSRF + 幂等键 + version）
      description: 仅 PROCESSING 任务可完成，动作后为 DONE 并写入 completedAt；当前负责人不变。终态重复执行且非相同幂等请求返回 409。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompleteTaskRequest'}
      responses:
        '200':
          description: 已完成或幂等回放，返回最新任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskItemEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /tasks/{id}/actions:
    get:
      tags: [Tasks]
      operationId: listTaskActions
      summary: 查询任务动作日志（task:read + 任务可见范围）
      description: 按动作发生顺序返回 CLAIM/REASSIGN/RETURN/COMPLETE 日志；日志只追加，不可修改或删除。范围外返回 404。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: 只追加任务动作日志
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskActionListEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /tasks/{id}/assignee:
    patch:
      tags: [Tasks]
      summary: 旧版转派入口（task:write + 可编辑范围 + CSRF + 幂等键 + version）
      description: 兼容入口，内部统一执行 REASSIGN，不再是独立负责人覆盖操作。仅 MANAGER_LEAD/ADMIN 可调用，reason 与 Idempotency-Key 必填；目标须为 ACTIVE 内部员工。生成 REASSIGN 动作日志与 TASK_REASSIGN 审计，同键同请求回放不重复追加。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTaskAssigneeRequest'}
      responses:
        '200':
          description: 已按 REASSIGN 转派或幂等回放，返回最新任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskItemEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /orders:
    get:
      tags: [Orders]
      summary: 订单分页（order:read + 客户数据范围；customerId 只能收窄范围）
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - {name: customerId, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: status, in: query, required: false, schema: {type: string, maxLength: 48, enum: [DRAFT, PENDING_PAYMENT, PAID, PARTIALLY_REDEEMED, FULFILLED, CANCELED]}}
      responses:
        '200':
          description: 范围内订单分页；金额均为整数分
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderPageResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Orders]
      summary: 创建 DRAFT 订单及销售快照（order:write + 客户数据范围）；不发支付流水或权益
      description: >-
        金额字段均为整数分。Q01 未确认或权益明细不完整时不下单。
        Q02 未确认时（包括单行）保存订单行 paidAllocatedFen=0 与 entitlementSnapshot.allocationStatus=PENDING_Q02，不自行决定分摊；
        已配置时在 entitlementSnapshot.projectSnapshots 保存项目级 allocationPriceFen 权重和 paidAllocatedFen 分摊结果。
        不生成或启用机构结算。
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOrderRequest'}
      responses:
        '201':
          description: 已创建 DRAFT；返回订单行、空支付/权益列表及初始状态历史
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderFulfillmentResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/BusinessRulePending'}
  /orders/{id}:
    get:
      tags: [Orders]
      summary: 订单详情（order:read + 客户数据范围；范围外 404）
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200':
          description: 订单、订单行快照、支付流水、追加式状态历史及已发权益
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderFulfillmentResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /orders/{id}/submit:
    post:
      tags: [Orders]
      summary: DRAFT → PENDING_PAYMENT（order:write + 客户数据范围；version 乐观锁）
      description: 仅提交待支付，不确认支付、不发放权益；状态变化追加历史。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderReviewRequest'}
      responses:
        '200':
          description: 已提交待支付
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderFulfillmentResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: DRAFT/PENDING_PAYMENT → CANCELED（order:write + 客户数据范围；version 乐观锁）
      description: 已支付订单不能通过此接口取消或覆盖支付事实；状态变化追加历史。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderReviewRequest'}
      responses:
        '200':
          description: 已取消未支付订单
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderFulfillmentResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /orders/{id}/payment-confirmations:
    post:
      tags: [Orders]
      summary: 可信人工支付确认（order:confirm_payment）；不是有赞或支付网关回调
      description: >-
        仅授权人员依据真实人工核验凭证确认 PENDING_PAYMENT 订单，amountFen 必须等于 payableFen。
        支付 CONFIRMED、订单 PAID、状态历史、项目权益、GRANT 账本及 order.paid.v1 Outbox 在同一 MySQL 事务写入；
        DRAFT/CANCELED 不发放权益。同键同请求回放不重复支付、发权益或写 Outbox，同键不同请求 409。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/PaymentIdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentConfirmRequest'}
      responses:
        '200':
          description: 新确认或幂等回放后的订单与权益详情；payment.verificationMethod=MANUAL_REVIEW
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderFulfillmentResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: NOT_FOUND — 订单不存在或不在当前客户数据范围；不泄露订单存在性
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: CONFLICT — 同 Idempotency-Key 对应不同订单或请求体、同 paymentChannel + externalTradeNo 已用于其他订单，或订单状态/并发冲突
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /entitlements:
    get:
      tags: [Entitlements]
      summary: 客户项目权益分页（entitlement:read + 客户数据范围；customerId 只能收窄范围）
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - {name: customerId, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [PENDING, AVAILABLE, EXHAUSTED, EXPIRED, REVOKED]}}
      responses:
        '200':
          description: 范围内权益分页；availableCount 是与账本同事务刷新的快照
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntitlementPageResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /entitlements/summary:
    get:
      tags: [Entitlements]
      summary: 当前数据范围内有效可用权益汇总（entitlement:read）
      description: 按 Asia/Shanghai 当前日期排除非 AVAILABLE、剩余次数为零、尚未生效或已经过期的批次；customerId 只能进一步收窄范围。无数据范围时返回零，不执行越权汇总。
      parameters:
        - {name: customerId, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: 剩余服务总次数及仍有可用权益的客户数
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntitlementSummaryResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /entitlements/{id}:
    get:
      tags: [Entitlements]
      summary: 权益详情与权威流水（entitlement:read + 客户数据范围；范围外 404）
      description: availableBalance 为 GRANT/REDEEM 等追加流水的 SUM(deltaCount)；本接口只读，不提供管家正式核销。
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200':
          description: 权益快照、账本汇总余额及逐条流水
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntitlementDetailResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /appointments:
    get:
      tags: [Appointments]
      summary: 预约分页（appointment:read + 客户或本机构数据范围；筛选只能收窄）
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - {name: customerId, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: institutionId, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: status, in: query, required: false, schema: {type: string, maxLength: 48, enum: [PENDING_INSTITUTION, CONFIRMED, CHECKED_IN, SERVICE_DONE, REDEEMED, REJECTED, CANCELED, NO_SHOW]}}
      responses:
        '200':
          description: 预约摘要分页 {items,total,page,size}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppointmentPageResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Appointments]
      summary: 创建 PENDING_INSTITUTION 预约（appointment:write + 客户数据范围）
      description: 每个项目必须分别提供权益 entitlementId 和计划 count；同一批次不可重复。机构须 ACTIVE 且在订单快照适用范围内，本操作不正式核销。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAppointmentRequest'}
      responses:
        '201':
          description: 已创建预约及逐项目计划，返回完整详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppointmentDetailResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /appointments/{id}:
    get:
      tags: [Appointments]
      summary: 预约详情（appointment:read + 范围；包含逐项目计划、状态历史及关联正式核销）
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200':
          description: 预约完整详情；范围外返回 404
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppointmentDetailResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /appointments/{id}/confirm:
    post:
      tags: [Appointments]
      summary: PENDING_INSTITUTION → CONFIRMED（appointment:confirm + 本机构 FRONTDESK/OPERATOR）
      description: 机构账号确认接诊；body.version 乐观锁并追加状态历史，非法状态/版本或幂等冲突返回 409。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppointmentTransitionRequest'}
      responses:
        '200':
          description: 已确认接诊
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppointmentDetailResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /appointments/{id}/reject:
    post:
      tags: [Appointments]
      summary: PENDING_INSTITUTION → REJECTED（appointment:confirm + 本机构 FRONTDESK/OPERATOR）
      description: 机构账号拒绝接诊；body.version 乐观锁并追加状态历史。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppointmentTransitionRequest'}
      responses:
        '200':
          description: 已拒绝接诊
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppointmentDetailResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /appointments/{id}/cancel:
    post:
      tags: [Appointments]
      summary: PENDING_INSTITUTION/CONFIRMED → CANCELED（appointment:write + 客户数据范围）
      description: 仅非机构账号可取消可见客户预约；机构账号代替管家取消返回 403。body.version 乐观锁并追加历史。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppointmentTransitionRequest'}
      responses:
        '200':
          description: 已取消预约
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppointmentDetailResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /appointments/{id}/check-in:
    post:
      tags: [Appointments]
      summary: CONFIRMED → CHECKED_IN（appointment:confirm + 本机构 FRONTDESK/OPERATOR）
      description: 机构账号记录真实到院；body.version 乐观锁并追加状态历史，不允许跳过接诊状态。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppointmentTransitionRequest'}
      responses:
        '200':
          description: 已登记到院
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppointmentDetailResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /appointments/{id}/service-done:
    post:
      tags: [Appointments]
      summary: CHECKED_IN → SERVICE_DONE（appointment:confirm + 本机构 FRONTDESK/OPERATOR）
      description: 机构账号确认服务完成；body.version 乐观锁并追加历史。此命令本身不 POSTED、不扣权益。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppointmentTransitionRequest'}
      responses:
        '200':
          description: 已确认服务完成，等待 OPERATOR 正式核销
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppointmentDetailResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /appointments/{id}/no-show:
    post:
      tags: [Appointments]
      summary: CONFIRMED → NO_SHOW（appointment:confirm + 本机构 FRONTDESK/OPERATOR）
      description: 机构账号登记未到院；body.version 乐观锁并追加状态历史。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppointmentTransitionRequest'}
      responses:
        '200':
          description: 已登记未到院
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppointmentDetailResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /appointments/{id}/redemptions:
    post:
      tags: [Redemptions]
      summary: 机构正式 POSTED 核销（redemption:post + 本机构 OPERATOR；MANAGER/FRONTDESK 禁止）
      description: >-
        仅 SERVICE_DONE 预约可由本机构 OPERATOR 正式核销，appointmentVersion 必须匹配。
        lines 逐项目指定权益批次 entitlementId 和次数 count，并提供服务凭证；同事务追加 POSTED、逐项目 REDEEM 负流水、
        状态历史与 redemption.posted.v1 Outbox。结算状态保持 PENDING_VERIFICATION，不覆盖历史或启用机构结算。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PostRedemptionRequest'}
      responses:
        '200':
          description: 已追加 POSTED 核销及逐项目明细；幂等回放不重复扣减
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RedemptionDetailResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: FORBIDDEN / CSRF_TOKEN_INVALID — 非本机构 OPERATOR（包括 MANAGER/FRONTDESK）不得正式核销
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /appointment-options:
    get:
      tags: [Appointments]
      summary: 预约可选项双模式（appointment:read + (customer:read 或 redemption:post)）
      description: >-
        调用模式由账号类型决定，不是任意二选一。非机构管家使用 customerId 模式，必须有 customer:read 且客户在可见范围内；
        机构账号使用 appointmentId 模式，必须有 redemption:post、已授权该预约机构且机构角色为 OPERATOR。
        对应模式参数缺失返回 400；跨机构预约返回 404；FRONTDESK 不能借机构模式绕过 OPERATOR 限制。
      parameters:
        - name: customerId
          in: query
          required: false
          schema: {type: integer, format: int64}
          description: 非机构管家模式必填；返回该客户已支付且当前可用的逐项目批次及订单快照允许的 ACTIVE 机构。机构模式不使用此参数。
        - name: appointmentId
          in: query
          required: false
          schema: {type: integer, format: int64}
          description: 机构 OPERATOR 模式必填；仅返回本预约项目中适用于本机构的可用批次，不返回本预约之外的客户权益。
      responses:
        '200':
          description: >-
            统一返回 customerId、institutions、entitlements。customerId 模式保留管家客户视图；
            appointmentId 模式的 customerId 来自预约，institutions 仅含该预约机构，entitlements 仅含本预约且订单快照允许本机构的批次。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppointmentOptionsEnvelope'}
        '400':
          description: VALIDATION_FAILED — 非机构账号缺少 customerId、机构账号缺少 appointmentId，或参数格式无效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: FORBIDDEN — 缺少模式所需权限，或机构账号不是该预约机构的 OPERATOR；FRONTDESK 不得越权
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: NOT_FOUND — 客户不可见、预约不存在或不在本机构范围内；不泄露资源存在性
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /redemptions:
    get:
      tags: [Redemptions]
      summary: 正式核销摘要分页（redemption:read + 客户或本机构范围；支持机构/客户/项目筛选）
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - {name: customerId, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: institutionId, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: projectId, in: query, required: false, schema: {type: integer, format: int64}, description: 按核销明细子项目过滤}
        - {name: status, in: query, required: false, schema: {type: string, maxLength: 48, enum: [POSTED]}}
      responses:
        '200':
          description: Redemption 摘要分页；不包含 lines/history，详情使用 GET /redemptions/{id}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RedemptionPageResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /redemptions/{id}:
    get:
      tags: [Redemptions]
      summary: 正式核销详情（redemption:read + 范围；包含逐项目 lines 和追加 history）
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200':
          description: 原 POSTED 事实及明细；冲正不会覆盖此历史
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RedemptionDetailResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /redemptions/{id}/reversal-requests:
    post:
      tags: [RedemptionReversals]
      summary: 为 POSTED 核销申请冲正（redemption:reverse + 范围）；原事实不改为 REVERSED
      description: 校验 redemptionVersion 并创建 REQUESTED 申请；机构账号须为本机构 FRONTDESK/OPERATOR，非机构账号须具备客户范围。审核前原 POSTED 与账本不变，重复有效申请或幂等冲突返回 409。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateReversalRequest'}
      responses:
        '200':
          description: 已创建 REQUESTED 冲正申请；不是 PENDING，不直接恢复权益
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReversalDetailResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /redemption-reversals:
    get:
      tags: [RedemptionReversals]
      summary: 冲正申请分页（redemption:read 或 redemption:approve，另加数据范围）
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - {name: customerId, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: institutionId, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: status, in: query, required: false, schema: {type: string, maxLength: 48, enum: [REQUESTED, APPROVED, REJECTED]}}
      responses:
        '200':
          description: 冲正申请摘要分页；详情才包含 history/corrections
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReversalPageResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /redemption-reversals/{id}:
    get:
      tags: [RedemptionReversals]
      summary: 冲正申请详情（redemption:read 或 redemption:approve，另加数据范围）
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200':
          description: 申请、追加审核历史及逐项目 CORRECTION_IN corrections；范围外 404
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReversalDetailResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /redemption-reversals/{id}/approve:
    post:
      tags: [RedemptionReversals]
      summary: REQUESTED → APPROVED（redemption:approve + 客户范围；非机构审核人且不能自审）
      description: body.version 乐观锁。逐项目追加 CORRECTION_IN、审核历史及 redemption.reversal.approved.v1 Outbox；不 UPDATE 原 POSTED 或旧账本，重复审核/版本/幂等冲突返回 409。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewReversalRequest'}
      responses:
        '200':
          description: 已批准并返回 corrections；原核销历史仍可查
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReversalDetailResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /redemption-reversals/{id}/reject:
    post:
      tags: [RedemptionReversals]
      summary: REQUESTED → REJECTED（redemption:approve + 客户范围；非机构审核人且不能自审）
      description: body.version 乐观锁；只追加审核状态、历史及 redemption.reversal.rejected.v1 Outbox，不写 corrections，不改变原 POSTED 或权益账本。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewReversalRequest'}
      responses:
        '200':
          description: 已拒绝冲正申请
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReversalDetailResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /integrations/wecom/sync-policy:
    get:
      tags: [WecomIntegration]
      summary: 查询企微定时同步策略（wecom:read）
      parameters:
        - {name: corpId, in: query, required: true, schema: {type: string, maxLength: 96}}
      responses:
        '200':
          description: 返回策略；未配置时 data 为 null
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WecomSyncPolicyEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [WecomIntegration]
      summary: 保存企微定时同步策略（wecom:monitor + CSRF + Idempotency-Key）
      description: 可修改总开关、客户资料/会话归档开关、执行间隔和下次执行时间。保存后无需重启，过去时间视为立即执行。
      parameters:
        - {name: corpId, in: query, required: true, schema: {type: string, maxLength: 96}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WecomSyncPolicyRequest'}
      responses:
        '200':
          description: 已保存策略
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WecomSyncPolicyEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /integrations/wecom/sync:
    post:
      tags: [WecomIntegration]
      summary: Mock 企微归档同步（wecom:monitor + CSRF + Idempotency-Key；官方 SDK 禁用）
      description: 仅 Mock fixture，cursor 不得超过已确认成功位置。每次采集复查成员覆盖和客户同意；失败保留成功游标并记录 DATA_GAP，不宣称官方 SDK 已联通。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WecomSyncRequest'}
      responses:
        '200':
          description: 返回 adapter、received/stored/duplicates/skipped、lastSeq、hasMore 和 dataGap
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WecomSyncEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: PENDING_BUSINESS_RULE — Q10 未授权的官方能力或私有对象存储未就绪
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /integrations/wecom/contact-sync:
    post:
      tags: [WecomIntegration]
      summary: 企微官方客户资料全量同步或对账（wecom:monitor + CSRF + Idempotency-Key）
      description: FULL 只增量更新官方客户资料；RECONCILE 仅在完整成功后失效本轮不存在的跟进关系。不会自动合并 CRM 客户，也不会开启会话存档。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type: {type: string, enum: [FULL, RECONCILE]}
      responses:
        '200':
          description: 返回本次运行状态与接收/更新/失效计数
          content:
            application/json:
              schema: {type: object, properties: {code: {type: string}, data: {type: object}, requestId: {type: string}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /integrations/wecom/contact-sync/runs:
    get:
      tags: [WecomIntegration]
      summary: 查询客户资料同步运行历史（wecom:read）
      responses:
        '200':
          description: 最近50次 FULL/RECONCILE/CALLBACK 运行，错误信息已脱敏
          content:
            application/json:
              schema: {type: object, properties: {code: {type: string}, data: {type: array, items: {type: object}}, requestId: {type: string}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /integrations/wecom/callback:
    get:
      tags: [WecomIntegration]
      summary: 企业微信官方回调 URL 验证
      description: 校验 msg_signature 并解密 echostr，成功时返回无引号、无 BOM、无换行的明文。
      parameters:
        - {name: msg_signature, in: query, required: true, schema: {type: string}}
        - {name: timestamp, in: query, required: true, schema: {type: string}}
        - {name: nonce, in: query, required: true, schema: {type: string}}
        - {name: echostr, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: 解密后的 echostr 明文, content: {text/plain: {schema: {type: string}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [WecomIntegration]
      summary: 接收企业微信官方客户变更回调
      description: 验签解密、receiveid 校验并以 SHA-256 指纹落库去重后立即返回 success；后续异步重新拉详情或关闭跟进关系。回调不是 CRM 登录接口，不使用 CSRF Cookie。
      parameters:
        - {name: msg_signature, in: query, required: true, schema: {type: string}}
        - {name: timestamp, in: query, required: true, schema: {type: string}}
        - {name: nonce, in: query, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/xml:
            schema: {type: string, description: 含 Encrypt 的企业微信加密 XML}
      responses:
        '200': {description: success, content: {text/plain: {schema: {type: string, example: success}}}}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /integrations/wecom/contacts:
    get:
      tags: [WecomIntegration]
      summary: 企微外部联系与同意/人工身份映射列表（wecom:read + 数据范围）
      description: 返回 externalUserid、staffUserId、consentStatus/consentEvidenceRef、customerId 和人工链接信息；外部身份不等于手机号、昵称或自然人唯一 ID。
      responses:
        '200':
          description: 按当前员工/团队范围返回联系人；无可见记录时为空数组
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WecomContactListEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /integrations/wecom/contacts/{id}/link:
    post:
      tags: [WecomIntegration]
      summary: 人工确认企微外部身份与 CRM 客户（wecom:monitor + 双方数据范围 + version）
      description: customerId 必须在可见范围，reason 必填，version 为联系人当前版本。已确认链接不得改绑；同客户同理由可安全重放，冲突 409。header 不代表独立结果快照。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WecomLinkRequest'}
      responses:
        '200':
          description: 返回 MANUAL 人工确认链接；关联未匹配消息同步更新为 STORED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WecomContactEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /integrations/wecom/messages:
    get:
      tags: [WecomIntegration]
      summary: 已授权企微消息 metadata 分页（wecom:read + 当前同意/成员覆盖/数据范围）
      description: 每次查询都复查采集时和当前同意、归档成员覆盖及客户/员工范围。列表不含正文；空结果只表示当前授权范围无可见消息，不等于没有沟通。
      parameters:
        - {name: customerId, in: query, required: false, schema: {type: integer, format: int64}, description: 可选客户过滤；不可见返回 404}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 返回 msgId/archiveSeq、同意快照、当前同意、私有对象引用及状态；无可见消息时 items=[]
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WecomMessagePageResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /integrations/wecom/messages/{id}/content:
    get:
      tags: [WecomIntegration]
      summary: 读取授权消息正文（wecom:read + 当前同意/成员覆盖/数据范围 + 对象校验）
      description: 仅当采集快照和当前同意均 GRANTED、成员覆盖有效且范围通过时，校验密文 SHA-256 后 AES 解密并写读取审计；撤回同意或越权返回 404，不是公开下载。
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}, description: 内部消息引用 messageRef}]
      responses:
        '200':
          description: 返回 messageRef/messageType/sentAt/content；正文来自私有 AES+MinIO 对象，不进入事件 payload
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WecomContentEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: PENDING_BUSINESS_RULE — 私有对象存储未配置，不能读取正文
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /integrations/wecom/monitor:
    get:
      tags: [WecomIntegration]
      summary: 企微归档游标与 DATA_GAP 监控（wecom:read + 数据范围）
      description: corpId 必填。无游标时返回 NEVER_SYNCED、lastSeq=0、dataGap=true，而不是“无沟通”；activeGaps 为 OPEN 缺口，historicalGaps 为已解决历史，messageCount 按当前范围计算。
      parameters:
        - {name: corpId, in: query, required: true, schema: {type: string, maxLength: 96}}
      responses:
        '200':
          description: 返回 archiveScope/lastSeq/lastSuccessAt/lastAttemptAt/status/dataGap/gapReason 及计数空态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WecomMonitorEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /integrations/youzan/orders:
    get:
      tags: [YouzanIntegration]
      summary: 有赞原始订单与映射分页（order:read + 数据范围；含未映射 Raw）
      description: 按外部订单最新 Raw 返回，授权范围内可包含未映射/未匹配记录。无内部订单时 mapId/orderId/orderStatus/paidFen/verificationMethod 为空；payloadMaskedJson 仅向 integration:youzan:manage 返回脱敏文本，其他 order:read 用户为 null，不返回 payload_cipher。
      parameters:
        - {name: shopId, in: query, required: true, schema: {type: string}}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 原始事件、外部金额/时间、映射状态及可空的内部订单字段
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanOrderPageResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /integrations/youzan/orders/{id}:
    get:
      tags: [YouzanIntegration]
      summary: Raw 原始订单详情（order:read + 数据范围；id 为 crm_youzan_event 数据库主键）
      description: 按 Raw 数据库主键读取，不是外部 eventId 或内部 orderId。未映射时 mapId/orderId/orderStatus/paidFen/verificationMethod 为空；范围外 404。
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200':
          description: 返回 Raw 处理状态和可空的内部映射/支付字段；脱敏原文仅 manage 可见
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanOrderViewEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /integrations/runtime-config:
    get:
      tags: [IntegrationRuntime]
      summary: 当前租户真实集成全局开关（integration:runtime:manage）
      description: 未保存页面配置时返回环境变量默认值和 version=0；不含 CorpID、Secret、Token 或其他凭证。
      responses:
        '200':
          description: 三个全局开关、乐观锁版本与配置来源
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntegrationRuntimeConfigEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [IntegrationRuntime]
      summary: 保存当前租户真实集成全局开关并即时生效（integration:runtime:manage）
      description: 写审计且支持幂等与乐观锁。开启不等于供应商授权、Q10/Q11 验收或生产联通已完成；店铺开关、企业凭证和成员/同意校验仍然有效。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IntegrationRuntimeConfigRequest'}
      responses:
        '200':
          description: 保存后的页面配置
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntegrationRuntimeConfigEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /integrations/youzan/sync:
    post:
      tags: [YouzanIntegration]
      summary: 单页拉取同步（integration:youzan:manage；真实店铺默认禁用）
      description: 支持 Mock fixture 和已启用的真实店铺配置。Idempotency-Key 仅为请求标识，未持久化同步结果；原始事件、外部订单映射和处理时间版本共同防止重复建单/发权益。真实同步受店铺租约和分页缩窗保护。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/YouzanSyncRequest'}
      responses:
        '200':
          description: 返回本页 received/processed/duplicates/issues、nextCursor 和 hasMore
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanSyncEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: PENDING_BUSINESS_RULE — 真实有赞未获 Q11 授权而禁用
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /integrations/youzan/reconcile:
    post:
      tags: [YouzanIntegration]
      summary: 补偿轮询（integration:youzan:manage；最多 10 页，不宣称完整对账）
      description: 从 cursor 补偿拉取并保存 nextCursor/最近成功时间；最多执行 10 页，hasMore=true 表示仍有未处理页面。原始事件幂等、店铺租约和补偿重试共同覆盖 webhook 之外的缺口，真实店铺默认禁用。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/YouzanSyncRequest'}
      responses:
        '200':
          description: 返回累计同步结果及最后游标；不是实时官方对账
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanSyncEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: PENDING_BUSINESS_RULE — 真实有赞未获 Q11 授权而禁用
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /integrations/youzan/reconcile-report:
    get:
      tags: [YouzanIntegration]
      summary: Mock 同步对账摘要（order:read）
      parameters:
        - {name: shopId, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: 返回 shopId、原始事件数、内部订单映射数、OPEN 异常数和 lastSyncAt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanReconcileReportEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /integrations/youzan/sync-issues:
    get:
      tags: [YouzanIntegration]
      summary: 有赞同步异常分页（order:read；异常详情仅脱敏）
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [OPEN, RETRYING, RESOLVED, DEAD]}}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: MAPPING_FAILED/CUSTOMER_UNRESOLVED/PAYMENT_MISMATCH/RETRY 等异常分页
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanIssuePageResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /integrations/youzan/sync-issues/{id}/retry:
    post:
      tags: [YouzanIntegration]
      summary: 重试未解决同步异常（campaign:write；已解决/终止返回 409）
      description: 仅 OPEN/RETRYING 可重试，更新尝试次数后按原事件重处理；header 未提供独立结果快照，业务幂等仍由事件与订单映射保证。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: 返回原事件最新处理状态，可能为 PROCESSED、MAPPING_FAILED、CUSTOMER_UNRESOLVED、PAYMENT_MISMATCH 或 RETRY
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanEventEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /integrations/youzan/sku-mappings:
    get:
      tags: [YouzanIntegration]
      summary: 外部 SKU 与 CRM SKU 映射列表（order:read）
      parameters:
        - {name: shopId, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: 返回 shopId+externalSkuId 到 crmSkuId 的 ACTIVE/INACTIVE 映射
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanSkuMappingListEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [YouzanIntegration]
      summary: 新建或更新 SKU 映射（campaign:write；既有映射需 version）
      description: 创建使用 shopId+externalSkuId+crmSkuId，更新必须匹配 version；目标 SKU 必须可见且 entitlementIssuable，否则 422。未明确映射的外部 SKU 不自动发权益。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/YouzanSkuMappingRequest'}
      responses:
        '200':
          description: 返回保存后的映射
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanSkuMappingEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: PENDING_BUSINESS_RULE — SKU 权益规则未确认或不完整
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /integrations/youzan/customer-links:
    get:
      tags: [YouzanIntegration]
      summary: 外部客户与 CRM 客户映射列表（order:read）
      parameters:
        - {name: shopId, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: 返回 externalCustomerId 与 customerId 的人工/强证据映射；不使用手机号或昵称充当客户 ID
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanCustomerLinkListEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [YouzanIntegration]
      summary: 人工确认客户映射（campaign:write + 客户范围；既有映射需 version）
      description: externalCustomerId 是外部标识而非手机号/昵称；customerId 必须可见，reason 为必填人工证据。更新需匹配 version，未确认客户进入 CUSTOMER_UNRESOLVED，不自动发权益。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/YouzanCustomerLinkRequest'}
      responses:
        '200':
          description: 返回 MANUAL/HIGH 的人工确认映射
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanCustomerLinkEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /integrations/youzan/shops:
    get:
      tags: [YouzanIntegration]
      summary: 有赞店铺授权配置列表（integration:youzan:manage）
      description: 仅返回密钥配置状态和 Token 到期时间，不返回 clientSecret、accessToken 或 refreshToken。
      responses:
        '200':
          description: 店铺配置列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanShopConfigListEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [YouzanIntegration]
      summary: 新建或更新有赞店铺授权配置（integration:youzan:manage）
      description: clientSecret 仅用于写入并加密保存；编辑时留空表示保持不变。真实同步仍受 FEATURE_REAL_YOUZAN 和店铺开关约束。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/YouzanShopConfigRequest'}
      responses:
        '200':
          description: 已保存的安全配置视图
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanShopConfigEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /integrations/youzan/shops/{shopId}/test:
    post:
      tags: [YouzanIntegration]
      summary: 测试有赞 Token 与订单接口连接（integration:youzan:manage）
      parameters:
        - {name: shopId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: 连接测试通过
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanShopConfigEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: 真实功能开关未启用或授权尚未满足
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /integrations/youzan/shops/{shopId}/sync-policy:
    get:
      tags: [YouzanIntegration]
      summary: 查询店铺全量/增量同步策略（integration:youzan:manage）
      parameters:
        - {name: shopId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 未配置时 data 为 null
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanSyncPolicyEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [YouzanIntegration]
      summary: 保存全量开始时间、增量频率、重叠窗口和页大小（integration:youzan:manage）
      parameters:
        - {name: shopId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/YouzanSyncPolicyRequest'}
      responses:
        '200':
          description: 已保存策略
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanSyncPolicyEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /integrations/youzan/sync-jobs:
    get:
      tags: [YouzanIntegration]
      summary: 查询真实店铺同步任务及处理统计（integration:youzan:manage）
      parameters:
        - {name: shopId, in: query, required: true, schema: {type: string}}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 同步任务分页
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanSyncJobPageEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /webhooks/youzan/official:
    post:
      tags: [YouzanIntegration]
      summary: 有赞云官方消息入口；验签后延迟查询订单详情
      description: 使用 Client-Id、Event-Type 和 Event-Sign，按 client_id + 原始请求实体 + client_secret 验签。消息只作为变更通知，不直接确认支付；测试消息不进入订单处理。
      security: []
      parameters:
        - {name: Client-Id, in: header, required: true, schema: {type: string}}
        - {name: Event-Type, in: header, required: true, schema: {type: string}}
        - {name: Event-Sign, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, description: 有赞官方消息原始实体，含 msgId/kdtId/msg 等}
      responses:
        '202':
          description: 验签通过并已接收，不代表订单详情或支付已处理成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanEventEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '413':
          description: 消息体超过1MB限制；过深JSON按400拒绝
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: 签名无效、店铺未授权或真实接入未启用
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /webhooks/youzan:
    post:
      tags: [YouzanIntegration]
      summary: Mock 有赞签名回调（非官方路径/签名；真实接入禁用）
      description: >-
        仅验证本地 Mock 的 HmacSHA256(timestamp + rawBody) hex 与 300 秒时间窗，X-Youzan-Mock-* 不是官方请求头或规则。
        验签成功后保存脱敏 JSON 与 AES 密文并异步处理；重复事件仍返回 202 + duplicate=true，不重复建单或发权益。Q11 未确认前 FEATURE_REAL_YOUZAN=false。
      security: []
      parameters:
        - {name: X-Youzan-Mock-Signature, in: header, required: false, schema: {type: string}, description: Mock 必填的 HMAC hex；缺失/错误/过期返回 401}
        - {name: X-Youzan-Mock-Timestamp, in: header, required: false, schema: {type: integer, format: int64}, description: Mock 必填的 Unix 秒时间戳，允许偏差 300 秒}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/YouzanWebhookEvent'}
      responses:
        '202':
          description: 验签通过并已接收，返回原始事件处理引用；不代表后续映射或支付已成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YouzanEventEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401':
          description: UNAUTHORIZED — Mock 签名缺失、无效、过期或真实接入未启用
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /institution-merchant-resources:
    get:
      tags: [InstitutionProfiles]
      summary: 机构医生、仪器与案例资料分页（institution:read + 机构范围）
      description: 默认只返回 PUBLISHED 资料；status=ALL 用于有读取权限的管理视图。institutionId 只能收窄范围，跨机构返回 404。
