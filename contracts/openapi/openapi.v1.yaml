          application/json:
            schema: {$ref: '#/components/schemas/CreateWorkflowRequest'}
      responses:
        '200':
          description: 已创建 PENDING_REVIEW/currentStep=MARKET 审核申请
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChangeRequestEnvelope'}
