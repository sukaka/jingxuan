  /institution-change-requests:
    get:
      tags: [InstitutionChanges]
      summary: 机构变更申请分页（institution:read + 机构范围；before/after 仅掩码）
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - {name: institutionId, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: status, in: query, required: false, schema: {type: string, maxLength: 48, enum: [PENDING_REVIEW, APPROVED, REJECTED, CONFLICT_REVALIDATE]}}
      responses:
        '200':
          description: 申请及分级步骤分页；PENDING_REVIEW 的阶段由 currentStep 表示
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChangeRequestPageResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [InstitutionChanges]
      summary: 敏感字段变更申请（institution:change_request + 范围；baseVersion 必须匹配）
      description: >-
        仅允许字段白名单。bankName/bankAccount/taxId/settlementName 走 FINANCE；fullName/businessTypeCode/ownershipCode/gradeCode 走 MARKET；
        佣金、收费、保证金、保投产与 settlementType 走 MARKET→FINANCE 双审且审核人不同。before/after 仅保存掩码，证据文件必须 CLEAN。
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProfileChangeRequest'}
      responses:
        '201':
          description: 已创建 PENDING_REVIEW 申请，currentStep 为 MARKET 或 FINANCE
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChangeRequestEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/FileScanNotReady'}
  /institution-change-requests/{id}:
    get:
      tags: [InstitutionChanges]
      summary: 机构变更申请详情（institution:read + 范围；含掩码快照和追加步骤）
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200':
          description: 返回 baseVersion/targetVersion、掩码值、当前状态与全部审核步骤
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChangeRequestEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /institution-change-requests/{id}/market-review:
    post:
      tags: [InstitutionChanges]
      summary: MARKET 审核（institution:approve_market + 范围；申请 version；禁止自审）
      description: 仅当前步骤允许时审核。双审流程通过后转 currentStep=FINANCE；baseVersion/targetVersion 已变化则返回 200 + CONFLICT_REVALIDATE，不覆盖较新正式值。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewChangeRequest'}
      responses:
        '200':
          description: 返回审核后申请；可能为 PENDING_REVIEW/APPROVED/REJECTED/CONFLICT_REVALIDATE
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChangeRequestEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/FileScanNotReady'}
  /institution-change-requests/{id}/finance-review:
    post:
      tags: [InstitutionChanges]
      summary: FINANCE 审核（institution:approve_finance + 范围；申请 version；双审不得同人）
      description: 申请人不能自审，双审的 FINANCE 审核人不得与 MARKET 审核人相同。最终批准前重验 baseVersion/targetVersion 与 CLEAN；冲突转 CONFLICT_REVALIDATE 而非覆盖。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewChangeRequest'}
      responses:
        '200':
          description: 返回审核后申请；APPROVED/currentStep=COMPLETED 表示 EFFECTIVE
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChangeRequestEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/FileScanNotReady'}
  /institution-change-requests/{id}/revalidate:
    post:
      tags: [InstitutionChanges]
      summary: 冲突申请复核（institution:change_request + 范围；version + 最新 baseVersion）
      description: 仅 CONFLICT_REVALIDATE 且申请 version 一致时可复核；baseVersion 必须是机构当前版本，重算 targetVersion 后回到 PENDING_REVIEW 和原首审步骤，不直接生效。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RevalidateChangeRequest'}
      responses:
        '200':
          description: 已回到 PENDING_REVIEW，等待重新分级审核
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChangeRequestEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /institution-contracts:
