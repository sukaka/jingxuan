        customerId: {type: integer, format: int64, description: 当前可见的 CRM 客户 ID，不是昵称或手机号}
        version: {type: integer, format: int64, minimum: 0, description: 联系人当前乐观锁版本}
        reason: {type: string, minLength: 1, maxLength: 1000, description: 人工身份匹配证据和理由}
    WecomContact:
      type: object
      required: [id, corpId, externalUserid, staffUserId, customerId, consentStatus, consentEvidenceRef, linkType, linkReason, createdBy, lastSyncedAt, version]
      properties:
        id: {type: integer, format: int64}
        corpId: {type: string}
        externalUserid: {type: string, description: 企微外部联系身份，不是自然人唯一 ID}
        staffUserId: {type: integer, format: int64}
        name: {type: string, nullable: true, description: 官方客户详情返回的名称}
        avatar: {type: string, nullable: true}
        contactType: {type: integer, nullable: true, description: 1微信用户，2企业微信用户}
        gender: {type: integer, nullable: true}
        unionid: {type: string, nullable: true, description: 仅满足官方条件时返回，不作为CRM客户唯一ID}
        remark: {type: string, nullable: true}
        description: {type: string, nullable: true}
        addWay: {type: integer, nullable: true, description: 官方客户添加来源编码}
        channelState: {type: string, nullable: true}
        followCreatedAt: {type: string, format: date-time, nullable: true}
        tagSnapshotJson: {type: string, nullable: true, description: 企业/规则组标签JSON快照}
        followStatus: {type: string, enum: [ACTIVE, DELETED_BY_STAFF, DELETED_BY_CUSTOMER]}
        customerId: {type: integer, format: int64, nullable: true, description: 人工确认前的未匹配状态为 null}
        consentStatus: {type: string, enum: [PENDING, GRANTED, REVOKED], description: Mock 状态不代表真实授权}
        consentEvidenceRef: {type: string, nullable: true, description: 同意证据引用，不含敏感证据正文；Mock 引用非真实证明}
        linkType: {type: string, enum: [MANUAL], nullable: true}
        linkReason: {type: string, nullable: true}
        createdBy: {type: integer, format: int64, nullable: true}
        lastSyncedAt: {type: string, format: date-time, nullable: true}
        version: {type: integer, format: int64, minimum: 0}
    WecomMessageView:
      type: object
      required: [id, corpId, msgId, archiveSeq, customerId, externalUserid, staffUserId, conversationId, conversationType, messageType, senderType, senderWecomUserid, senderStaffUserId, sentAt, contentObjectKey, consentSnapshot, currentConsentStatus, status, recalledAt, recallMessageId, roomRosterVersion]
      properties:
        id: {type: integer, format: int64, description: 内部消息引用 messageRef}
        corpId: {type: string}
        msgId: {type: string}
        archiveSeq: {type: integer, format: int64, minimum: 1}
        customerId: {type: integer, format: int64, nullable: true, description: 单聊未人工匹配或群聊时为 null；群聊不归属某一个客户}
        externalUserid: {type: string, nullable: true, description: 仅单聊的外部联系身份；群聊为 null}
        staffUserId: {type: integer, format: int64, nullable: true, description: 仅单聊的归属被存档员工；群聊为 null}
        conversationId: {type: string, nullable: true, maxLength: 192, description: 单聊会话或群聊 roomid}
        conversationType: {type: string, enum: [DIRECT, ROOM]}
        messageType: {type: string}
        senderType: {type: string, enum: [EMPLOYEE, CUSTOMER]}
        senderWecomUserid: {type: string, nullable: true, description: 实际发送人的企微账号或 external_userid，不是姓名}
        senderStaffUserId: {type: integer, format: int64, nullable: true, description: 实际发送员工的 CRM 映射；外部参与人为 null}
        sentAt: {type: string, format: date-time}
        contentObjectKey: {type: string, description: 私有 AES+MinIO 对象引用，不是公开 URL，不是正文}
        consentSnapshot: {type: string, enum: [PENDING, GRANTED, REVOKED], description: 采集时同意快照}
        currentConsentStatus: {type: string, enum: [PENDING, GRANTED, REVOKED], description: 每次查询时的当前同意状态；群聊含历史参与人复查}
        status: {type: string, enum: [STORED, UNMATCHED]}
        recalledAt: {type: string, format: date-time, nullable: true, description: 官方撤回生效时间；不删除原始内容}
        recallMessageId: {type: string, nullable: true, description: 导致撤回的官方控制消息 ID}
        roomRosterVersion: {type: integer, format: int64, minimum: 0, nullable: true, description: 群消息采集时完整成员清单版本；单聊为 null}
    WecomRoomParticipantView:
      type: object
      required: [wecomUserid, participantType, staffUserId, externalUserid, status]
      properties:
        wecomUserid: {type: string, description: 企微成员账号或 external_userid，不是昵称或手机号}
        participantType: {type: string, enum: [STAFF, EXTERNAL]}
        staffUserId: {type: integer, format: int64, nullable: true}
        externalUserid: {type: string, nullable: true}
        status: {type: string, enum: [ACTIVE, REMOVED], description: 退出保留历史，不物理删除}
    WecomRoomView:
      type: object
      required: [corpId, roomId, displayName, enabled, archivable, membershipConfirmedAt, version, participants]
      properties:
        corpId: {type: string}
        roomId: {type: string}
        displayName: {type: string, nullable: true, description: 管理员配置的显示名称，不冒充官方群名}
        enabled: {type: boolean, description: 是否允许新归档；不影响历史事实}
        archivable: {type: boolean, description: 当前是否同时满足群启用、员工覆盖、外部参与人及同意}
        membershipConfirmedAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
        participants: {type: array, items: {$ref: '#/components/schemas/WecomRoomParticipantView'}}
    WecomRoomSaveRequest:
      type: object
      required: [corpId, enabled, memberUserids, sourceEvidenceRef, version, reason]
      properties:
        corpId: {type: string, minLength: 1, maxLength: 96}
        displayName: {type: string, maxLength: 128, nullable: true}
        enabled: {type: boolean}
        memberUserids: {type: array, minItems: 1, maxItems: 500, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 192}, description: 完整当前成员清单，不是增量补丁}
        sourceEvidenceRef: {type: string, minLength: 1, maxLength: 255, description: 人工核对的清单来源证据引用，不代表自动供应商同步}
        version: {type: integer, format: int64, minimum: 0, description: 新群为 0；已有群必须匹配当前清单版本}
        reason: {type: string, minLength: 1, maxLength: 1000}
    WecomRoomListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data: {type: array, items: {$ref: '#/components/schemas/WecomRoomView'}}
    WecomRoomEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/WecomRoomView'}
    WecomMediaAssetView:
      type: object
      description: 消息内的授权媒体元数据；不包含 sdkfileid 或对象 Key
      properties:
        id: {type: integer, format: int64}
        mediaKind: {type: string}
        fileName: {type: string, nullable: true}
        contentType: {type: string}
        fileSize: {type: integer, format: int64, nullable: true}
        status: {type: string, enum: [PENDING, DOWNLOADING, RETRY, STORED, FAILED]}
        available: {type: boolean, description: 仅 status=STORED 时为 true}
    WecomContentView:
      type: object
      required: [messageRef, messageType, sentAt, content]
      description: 仅授权读取时返回的解密正文；事件契约不携带此 content。
      properties:
        messageRef: {type: integer, format: int64}
        messageType: {type: string}
        sentAt: {type: string, format: date-time}
        content: {type: string, description: AES+MinIO 校验后解密的消息正文，需每次授权复查}
        mediaAssets: {type: array, items: {$ref: '#/components/schemas/WecomMediaAssetView'}}
        recalledAt: {type: string, format: date-time, nullable: true, description: 官方撤回已补全时间；正文不删除，仍需授权读取}
    WecomMonitorView:
      type: object
      required: [corpId, archiveScope, lastSeq, lastSuccessAt, lastAttemptAt, status, dataGap, gapReason, messageCount, unmatchedCount, activeGaps, historicalGaps]
      properties:
        corpId: {type: string}
        archiveScope: {type: string, example: MOCK_ARCHIVE}
        lastSeq: {type: integer, format: int64, minimum: 0}
        lastSuccessAt: {type: string, format: date-time, nullable: true}
        lastAttemptAt: {type: string, format: date-time, nullable: true}
        status: {type: string, enum: [NEVER_SYNCED, SUCCESS, ERROR]}
        dataGap: {type: boolean, description: 当前存在覆盖缺口；无游标或 committedSeq=0 时为 true}
        gapReason: {type: string, nullable: true, description: 脱敏缺口原因，不含聊天正文}
        messageCount: {type: integer, format: int64, minimum: 0, description: 当前授权范围消息数，不能据此判断无沟通}
        unmatchedCount: {type: integer, format: int64, minimum: 0, description: 未人工匹配联系人数量（ALL 范围计算）}
        activeGaps: {type: integer, format: int64, minimum: 0, description: OPEN 状态缺口数}
        historicalGaps: {type: integer, format: int64, minimum: 0, description: 已解决历史缺口数，历史仍保留}
    WecomSyncEnvelope:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data: {$ref: '#/components/schemas/WecomSyncResponse'}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    WecomContactListEnvelope:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data:
          type: array
          items: {$ref: '#/components/schemas/WecomContact'}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    WecomContactEnvelope:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data: {$ref: '#/components/schemas/WecomContact'}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    WecomMessagePageResponse:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data:
          type: object
          required: [items, total, page, size]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/WecomMessageView'}}
            total: {type: integer, format: int64, minimum: 0}
            page: {type: integer, format: int32, minimum: 1}
            size: {type: integer, format: int32, minimum: 1, maximum: 100}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    WecomContentEnvelope:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data: {$ref: '#/components/schemas/WecomContentView'}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    WecomMonitorEnvelope:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data: {$ref: '#/components/schemas/WecomMonitorView'}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    RefundStatus:
      type: string
      enum: [REQUESTED, APPROVED, REJECTED, PROCESSING, SUCCEEDED, FAILED]
    CreateRefundRequest:
      type: object
      additionalProperties: false
      required: [orderId, requestedFen, reasonCode, items]
      properties:
        orderId: {type: integer, format: int64, minimum: 1}
        requestedFen: {type: integer, format: int64, minimum: 1, description: 申请退款总额，整数分}
        reasonCode: {type: string, minLength: 1, maxLength: 64}
        reasonDetail: {type: string, maxLength: 1000, nullable: true}
        items:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/RefundItemRequest'}
      description: items 的 allocatedFen 合计必须等于 requestedFen；每个 entitlementId 只能出现一次。
    RefundItemRequest:
      type: object
      additionalProperties: false
      required: [entitlementId, revokeCount, allocatedFen]
      properties:
        entitlementId: {type: integer, format: int64, minimum: 1, description: 具体权益批次，不是项目或订单}
        revokeCount: {type: integer, format: int32, minimum: 1, description: 人工明确指定的回收次数，不自动返还可选项目}
        allocatedFen: {type: integer, format: int64, minimum: 0, description: 人工明确指定的现金分摊，整数分}
    ReviewRefundRequest:
      type: object
      additionalProperties: false
      required: [version, decision, reason]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        decision: {type: string, enum: [APPROVED, REJECTED]}
        approvedFen: {type: integer, format: int64, minimum: 1, nullable: true, description: APPROVED 必填，不得超过 requestedFen；REJECTED 必须为 null}
        reason: {type: string, minLength: 1, maxLength: 1000}
    ExecuteRefundRequest:
      type: object
      additionalProperties: false
      required: [version, provider, externalRefundNo, amountFen]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        provider: {type: string, enum: [BANK_TRANSFER, OFFLINE, MOCK], description: 人工渠道可凭证复核；MOCK 只能经验签回调确认}
        externalRefundNo: {type: string, minLength: 1, maxLength: 128, description: provider 内唯一外部退款号}
        amountFen: {type: integer, format: int64, minimum: 1, description: 执行金额，必须等于 approvedFen}
        evidenceRef: {type: string, maxLength: 192, nullable: true}
    ConfirmRefundSuccessRequest:
      type: object
      additionalProperties: false
      required: [externalRefundNo, amountFen, succeededAt, evidenceRef, voucherFileId]
      properties:
        externalRefundNo: {type: string, minLength: 1, maxLength: 128, description: 当前退款下 PENDING 执行记录的外部退款号}
        amountFen: {type: integer, format: int64, minimum: 1, description: 必须等于执行及批准金额}
        succeededAt: {type: string, format: date-time, description: 真实退款成功时间，必须带时区或 UTC offset}
        evidenceRef: {type: string, minLength: 1, maxLength: 192, description: 人工财务复核凭证审计引用}
        voucherFileId: {type: integer, format: int64, minimum: 1, description: 必须为当前可引用的 CLEAN 私有凭证}
    RefundCallbackRequest:
      type: object
      additionalProperties: false
      required: [externalRefundNo, amountFen, status, occurredAt]
      properties:
        externalRefundNo: {type: string, minLength: 1, maxLength: 128}
        amountFen: {type: integer, format: int64, minimum: 1, description: 回调金额必须等于原执行金额}
        status: {type: string, enum: [SUCCEEDED, FAILED]}
        occurredAt: {type: string, format: date-time}
        evidenceRef: {type: string, maxLength: 192, nullable: true, description: 脱敏适配器证据引用，不包含完整报文或密钥}
      description: 本地 Mock 验签结构，不代表有赞或其他官方退款字段目录。
    Refund:
      type: object
      required: [id, refundNo, orderId, customerId, requestedFen, approvedFen, succeededFen, reasonCode, reasonDetail, status, requestedBy, approvedBy, executedBy, succeededAt, createdAt, updatedAt, version]
      properties:
        id: {type: integer, format: int64}
        refundNo: {type: string}
        orderId: {type: integer, format: int64}
        customerId: {type: integer, format: int64}
        requestedFen: {type: integer, format: int64, minimum: 1}
        approvedFen: {type: integer, format: int64, minimum: 1, nullable: true, description: 未审批为 null，不得以 0 冒充待审批}
        succeededFen: {type: integer, format: int64, minimum: 0, description: 仅真实成功事实累计；申请/批准/执行中为 0}
        reasonCode: {type: string}
        reasonDetail: {type: string, nullable: true}
        status: {$ref: '#/components/schemas/RefundStatus'}
        requestedBy: {type: integer, format: int64}
        approvedBy: {type: integer, format: int64, nullable: true}
        executedBy: {type: integer, format: int64, nullable: true}
        succeededAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
    RefundItem:
      type: object
      required: [id, refundId, entitlementId, revokeCount, allocatedFen]
      properties:
        id: {type: integer, format: int64}
        refundId: {type: integer, format: int64}
        entitlementId: {type: integer, format: int64}
        revokeCount: {type: integer, format: int32, minimum: 1}
        allocatedFen: {type: integer, format: int64, minimum: 0}
    RefundPayment:
      type: object
      required: [id, refundId, provider, externalRefundNo, amountFen, status, verificationMethod, evidenceRef, voucherFileId, succeededAt, createdAt, updatedAt, version]
      properties:
        id: {type: integer, format: int64}
        refundId: {type: integer, format: int64}
        provider: {type: string}
        externalRefundNo: {type: string}
        amountFen: {type: integer, format: int64, minimum: 1}
        status: {type: string, enum: [PENDING, SUCCEEDED, FAILED]}
        verificationMethod: {type: string, enum: [MANUAL_REVIEW, PROVIDER_CALLBACK], nullable: true, description: PENDING 时尚无验证方式为 null}
        evidenceRef: {type: string, nullable: true, description: 脱敏证据引用，不含凭证正文}
        voucherFileId: {type: integer, format: int64, nullable: true}
        succeededAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
    RefundStatusHistory:
      type: object
      required: [id, refundId, fromStatus, toStatus, actorUserId, reason, createdAt]
      properties:
        id: {type: integer, format: int64}
        refundId: {type: integer, format: int64}
        fromStatus: {type: string, description: 创建时 NONE，其余为真实前状态}
        toStatus: {$ref: '#/components/schemas/RefundStatus'}
        actorUserId: {type: integer, format: int64, nullable: true, description: 验签回调可为空，人工操作必填}
        reason: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
    RefundDetail:
      type: object
      required: [refund, items, payments, history]
      properties:
        refund: {$ref: '#/components/schemas/Refund'}
        items: {type: array, items: {$ref: '#/components/schemas/RefundItem'}}
        payments: {type: array, items: {$ref: '#/components/schemas/RefundPayment'}}
        history: {type: array, items: {$ref: '#/components/schemas/RefundStatusHistory'}, description: 只追加，不覆盖历史状态}
    SettlementBatchStatus:
      type: string
      enum: [DRAFT, CONFIRMED, PARTIALLY_PAID, PAID]
    SettlementAmountStatus:
      type: string
      enum: [PENDING_VERIFICATION, VERIFIED]
    CreateSettlementBatchRequest:
      type: object
      additionalProperties: false
      required: [institutionId, settlementType, periodKey, redemptionIds]
      properties:
        institutionId: {type: integer, format: int64, minimum: 1}
        settlementType: {type: string, enum: [MONTHLY, PER_REDEMPTION]}
        periodKey: {type: string, minLength: 1, maxLength: 64, description: "月结为 YYYY-MM，次结为 REDEMPTION:{id}；机构+periodKey+settlementType 唯一"}
        redemptionIds:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items: {type: integer, format: int64, minimum: 1}
      description: 只能包含本机构真实 POSTED 且未入其他批次的核销；不从核销金额自动推算佣金。
    VerifySettlementBatchRequest:
      type: object
      additionalProperties: false
      required: [version, ruleVersion, grossFen, commissionFen, netPayableFen, verificationEvidence]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        ruleVersion: {type: string, minLength: 1, maxLength: 96, description: 财务离线核准的真实规则版本，不由系统猜测}
        grossFen: {type: integer, format: int64, minimum: 0}
        commissionFen: {type: integer, format: int64, minimum: 0}
        netPayableFen: {type: integer, format: int64, minimum: 0, description: 必须等于 grossFen-commissionFen}
        verificationEvidence: {type: string, minLength: 1, maxLength: 192, description: 人工核准证据的脱敏审计引用}
    RecordSettlementPaymentRequest:
      type: object
      additionalProperties: false
      required: [version, amountFen, bankTradeNo, paidAt, voucherFileId, evidenceRef]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        amountFen: {type: integer, format: int64, minimum: 0, description: 本次付款（0 分用于零净应付对账闭环），累计不得超过 netPayableFen}
        bankTradeNo: {type: string, minLength: 1, maxLength: 128, description: 已人工核验的真实银行流水，全局唯一}
        paidAt: {type: string, format: date-time}
        voucherFileId: {type: integer, format: int64, minimum: 1, description: 必须为 CLEAN 私有付款凭证}
        evidenceRef: {type: string, minLength: 1, maxLength: 192}
    SettlementBatch:
      type: object
      required: [id, institutionId, settlementType, periodKey, settlementDay, settlementDaySource, settlementDate, status, amountStatus, grossFen, commissionFen, netPayableFen, paidFen, ruleVersion, verificationEvidence, createdAt, updatedAt, version]
      properties:
        id: {type: integer, format: int64}
        institutionId: {type: integer, format: int64}
        settlementType: {type: string, enum: [MONTHLY, PER_REDEMPTION]}
        periodKey: {type: string}
        settlementDay: {$ref: '#/components/schemas/SettlementDayRule', nullable: true, description: 入批时实际使用的月结规则；历史或 PER_REDEMPTION 为 null}
        settlementDaySource: {type: string, enum: [DEFAULT, INSTITUTION], nullable: true, description: DEFAULT=租户默认，INSTITUTION=机构覆盖；入批后冻结}
        settlementDate: {type: string, format: date, nullable: true, description: 按 Asia/Shanghai 与 periodKey 计算的实际结算日期；月结三项快照同时非空}
        status: {$ref: '#/components/schemas/SettlementBatchStatus'}
        amountStatus: {$ref: '#/components/schemas/SettlementAmountStatus'}
