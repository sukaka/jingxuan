        teamIds: {type: array, items: {type: integer, format: int64, minimum: 1}}
        ownerId: {type: integer, format: int64, minimum: 1, nullable: true}
        institutionIds: {type: array, items: {type: integer, format: int64, minimum: 1}}
    CreateExportRequest:
      type: object
      required: [exportType, reason]
      properties:
        exportType: {$ref: '#/components/schemas/ExportType'}
        columns:
          type: array
          maxItems: 40
          items: {type: string, minLength: 1, maxLength: 64}
          description: |-
            服务端按 exportType 校验字段白名单；缺省使用该类型默认字段，重复或未列出字段返回 400。
            CUSTOMER 可选 customerNo, displayName, nickname, remarkName, mobile, cityCode, sourceCode, channelCode, customerStatus, tierCode, intentLevel, spendingLevel, birthday, points, attentionProjects, blockerNote, remark, ownerStaffId, ownerName, teamId, firstAddedAt, firstOrderAt, lastFollowupAt, createdAt；默认 customerNo, displayName, mobile, customerStatus, ownerStaffId, teamId, createdAt。
            ORDER 可选 orderNo, customerNo, customerName, soldByUserId, ownerAtSaleId, externalOrderNo, sourceSystem, orderTypeCode, campaignId, campaignBatchId, status, receiverType, listAmountFen, discountAmountFen, payableFen, paidFen, refundedFen, orderedAt, paidAt, createdAt；默认 orderNo, customerNo, status, payableFen, paidFen, refundedFen, orderedAt。
            REDEMPTION 可选 redemptionId, appointmentId, customerNo, customerName, institutionId, ownerStaffId, teamId, serviceAt, status, settlementStatus, postedBy, postedAt, createdAt；默认 redemptionId, customerNo, institutionId, serviceAt, status, postedAt。
            FOLLOWUP 可选 followupId, customerNo, customerName, ownerStaffId, ownerName, channelCode, contactAt, summary, intentProject, estimatedAmountFen, nextFollowupAt, blockerNote, createdBy, createdAt；默认 followupId, customerNo, ownerStaffId, channelCode, contactAt, nextFollowupAt。
        reason: {type: string, minLength: 2, maxLength: 500}
        filters:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ExportFilterInput'
        scope:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ExportScopeRequest'
    ExportScope:
      type: object
      required: [kind, teamIds, selfId, institutionIds]
      properties:
        kind: {type: string, enum: [ALL, TEAM, SELF, INSTITUTION, NONE]}
        teamIds: {type: array, items: {type: integer, format: int64}}
        selfId: {type: integer, format: int64}
        institutionIds: {type: array, items: {type: integer, format: int64}}
    ExportRestriction:
      type: object
      required: [teamIds, ownerId, institutionIds]
      properties:
        teamIds: {type: array, nullable: true, items: {type: integer, format: int64}}
        ownerId: {type: integer, format: int64, nullable: true}
        institutionIds: {type: array, nullable: true, items: {type: integer, format: int64}}
    StoredExportScope:
      type: object
      required: [requested, executed, restriction]
      description: requested 为申请时服务端范围，executed 为实际执行时与实时范围求交并收窄后的结果，restriction 为客户端可选收窄；下载时重新核对当前范围。
      properties:
        requested: {$ref: '#/components/schemas/ExportScope'}
        executed:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ExportScope'
        restriction:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ExportRestriction'
    ExportJob:
      type: object
      required: [id, jobNo, exportType, status, columns, filters, scope, reason, rowCount, fileId, expiresAt, lastError, startedAt, finishedAt, createdAt, updatedAt, version]
      properties:
        id: {type: integer, format: int64}
        jobNo: {type: string}
        exportType: {$ref: '#/components/schemas/ExportType'}
        status: {$ref: '#/components/schemas/ExportStatus'}
        columns: {type: array, items: {type: string}, description: 服务端已校验的字段编码}
        filters: {$ref: '#/components/schemas/ExportFilter'}
        scope: {$ref: '#/components/schemas/StoredExportScope'}
        reason: {type: string}
        rowCount: {type: integer, format: int64, minimum: 0}
        fileId: {type: integer, format: int64, nullable: true, description: 私有 EXPORT 文件引用，不是公开 URL}
        expiresAt: {type: string, format: date-time, nullable: true}
        lastError: {type: string, nullable: true, description: 脱敏失败类别，不包含导出内容}
        startedAt: {type: string, format: date-time, nullable: true}
        finishedAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
    ExportAccessLog:
      type: object
      required: [id, jobId, actorUserId, action, result, reason, denialCode, createdAt]
      properties:
        id: {type: integer, format: int64}
        jobId: {type: integer, format: int64, nullable: true}
        actorUserId: {type: integer, format: int64}
        action: {type: string, enum: [REQUEST, DOWNLOAD]}
        result: {type: string, enum: [ALLOWED, DENIED]}
        reason: {type: string}
        denialCode: {type: string, nullable: true, description: 审计拒绝原因；不是新增全局 API 错误码}
        createdAt: {type: string, format: date-time}
    ExportDownload:
      type: object
      required: [fileId, downloadUrl, expiresAt]
      description: downloadUrl 是短期预签名 GET URL，不是公开文件地址；过期后须重新执行授权检查并申请。
      properties:
        fileId: {type: integer, format: int64}
        downloadUrl: {type: string, format: uri}
        expiresAt: {type: string, format: date-time}
    ExportJobPageResponse:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data:
          type: object
          required: [items, total, page, size]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/ExportJob'}}
            total: {type: integer, format: int64, minimum: 0}
            page: {type: integer, format: int32, minimum: 1}
            size: {type: integer, format: int32, minimum: 1, maximum: 100}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    ExportJobEnvelope:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data: {$ref: '#/components/schemas/ExportJob'}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    ExportAccessLogPageResponse:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data:
          type: object
          required: [items, total, page, size]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/ExportAccessLog'}}
            total: {type: integer, format: int64, minimum: 0}
            page: {type: integer, format: int32, minimum: 1}
            size: {type: integer, format: int32, minimum: 1, maximum: 100}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    ExportDownloadEnvelope:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data: {$ref: '#/components/schemas/ExportDownload'}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    ClaimRiskCaseRequest:
      type: object
      required: [version]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        reason: {type: string, maxLength: 1000, nullable: true}
    ResolveRiskCaseRequest:
      type: object
      required: [version, resolution]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        resolution: {type: string, minLength: 1, maxLength: 2000}
    CloseRiskCaseRequest:
      type: object
      required: [version, reason]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 1000}
    RiskCase:
      type: object
      required: [id, riskCaseNo, riskType, severity, sourceType, sourceRef, status, createdAt, updatedAt, version]
      description: evidence/resolution 已脱敏；值为 null 的可选字段按 NON_NULL 省略。
      properties:
        id: {type: integer, format: int64}
        riskCaseNo: {type: string}
        riskType: {type: string}
        severity: {type: string, enum: [HIGH, MEDIUM, LOW]}
        sourceType: {type: string}
        sourceRef: {type: string}
        status: {type: string, enum: [OPEN, ASSIGNED, RESOLVED, CLOSED]}
        ownerUserId: {type: integer, format: int64, nullable: true}
        evidence: {type: string, nullable: true, description: 脱敏证据，不包含原始敏感报文}
        resolution: {type: string, nullable: true}
        resolvedAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
        orderId: {type: integer, format: int64, nullable: true, description: 由真实来源记录关联；无法可靠关联时为 null}
        orderNo: {type: string, nullable: true}
        customerId: {type: integer, format: int64, nullable: true, description: 只来自真实订单或已确认客户映射，不使用原型演示客户}
        customerNo: {type: string, nullable: true}
        customerName: {type: string, nullable: true, description: 可空；前端应显示未关联/待核实，不能补造名称}
    RiskCaseHistory:
      type: object
      required: [id, riskCaseId, action, fromStatus, toStatus, actorUserId, note, createdAt]
      properties:
        id: {type: integer, format: int64}
        riskCaseId: {type: integer, format: int64}
        action: {type: string, enum: [REGISTER, CLAIM, RESOLVE, CLOSE]}
        fromStatus: {type: string, enum: [OPEN, ASSIGNED, RESOLVED, CLOSED], nullable: true, description: REGISTER 时为 null}
        toStatus: {type: string, enum: [OPEN, ASSIGNED, RESOLVED, CLOSED]}
        actorUserId: {type: integer, format: int64, nullable: true, description: 系统登记可为 null}
        note: {type: string, nullable: true, description: 脱敏备注}
        createdAt: {type: string, format: date-time}
    RiskCaseDetail:
      type: object
      required: [riskCase, history]
      properties:
        riskCase: {$ref: '#/components/schemas/RiskCase'}
        history: {type: array, items: {$ref: '#/components/schemas/RiskCaseHistory'}, description: 只追加历史，不提供修改或物理删除接口}
    RiskCasePageResponse:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data:
          type: object
          required: [items, total, page, size]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/RiskCase'}}
            total: {type: integer, format: int64, minimum: 0}
            page: {type: integer, format: int32, minimum: 1}
            size: {type: integer, format: int32, minimum: 1, maximum: 100}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    RiskCaseDetailEnvelope:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data: {$ref: '#/components/schemas/RiskCaseDetail'}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    PointsLedgerItem:
      type: object
      required: [id, delta, reasonCode, sourceType, sourceRef, operatorUserId, createdAt]
      properties:
        id: {type: integer, format: int64}
        delta: {type: integer, format: int32, description: 积分增减值，正数增加、负数扣减；不是金额}
        reasonCode: {type: string}
        sourceType: {type: string, description: 手工调整为 MANUAL_ADJUST；其他追加分录按真实来源返回}
        sourceRef: {type: string}
        operatorUserId: {type: integer, format: int64, nullable: true}
        createdAt: {type: string, format: date-time}
    CustomerPointsView:
      type: object
      required: [balance, ledger]
      properties:
        balance: {type: integer, format: int64, description: 权威账本 SUM(delta)，不是 points_cached，也不是金额}
        ledger: {type: array, items: {$ref: '#/components/schemas/PointsLedgerItem'}}
    CustomerPointsEnvelope:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data: {$ref: '#/components/schemas/CustomerPointsView'}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    ApiResponse:
      type: object
      required: [code, message, requestId, timestamp]
      description: 通用成功响应信封；data 的具体结构由引用此模型的接口定义
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data: {description: 由具体接口定义的响应数据}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    EmptyResponse:
      type: object
      required: [code, message, requestId, timestamp]
      description: ApiResponse<Void>；data 为 null 时按 NON_NULL 省略。
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    ClaimTaskRequest:
      type: object
      required: [version]
      properties:
        version: {type: integer, format: int64, minimum: 0, description: 任务当前乐观锁版本}
    ReassignTaskRequest:
      type: object
      required: [assigneeUserId, reason, version]
      properties:
        assigneeUserId: {type: integer, format: int64, description: 目标 ACTIVE 内部员工用户 ID}
        reason: {type: string, minLength: 1, maxLength: 500, description: 转派原因，不得为空白}
        version: {type: integer, format: int64, minimum: 0, description: 任务当前乐观锁版本}
    ReturnTaskRequest:
      type: object
      required: [reason, version]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500, description: 退回原因，不得为空白}
        version: {type: integer, format: int64, minimum: 0, description: 任务当前乐观锁版本}
    CompleteTaskRequest:
      type: object
      required: [version]
      properties:
        version: {type: integer, format: int64, minimum: 0, description: 任务当前乐观锁版本}
    UpdateTaskAssigneeRequest:
      type: object
      required: [assigneeUserId, reason, version]
      description: 旧版 /assignee 请求；与 REASSIGN 使用相同字段和约束
      properties:
        assigneeUserId: {type: integer, format: int64, description: 目标 ACTIVE 内部员工用户 ID}
        reason: {type: string, minLength: 1, maxLength: 500, description: 转派原因，不得为空白}
        version: {type: integer, format: int64, minimum: 0, description: 任务当前乐观锁版本}
    TaskItemResponse:
      type: object
      required: [id, customerId, assigneeUserId, originalAssigneeUserId, taskTeamId, taskType, priority, status, title, description, dueAt, claimedAt, completedAt, createdAt, version]
      properties:
        id: {type: integer, format: int64}
        customerId: {type: integer, format: int64, nullable: true}
        assigneeUserId: {type: integer, format: int64, nullable: true, description: 当前负责人；OPEN 任务池任务为空}
        originalAssigneeUserId: {type: integer, format: int64, nullable: true, description: 首次负责人；创建后不可变，退回任务池仍保留}
        taskTeamId: {type: integer, format: int64, nullable: true, description: 任务池团队快照；转派时更新为目标团队，不随成员日后换组自动改变}
        taskType: {type: string}
        priority: {type: string, enum: [LOW, MEDIUM, HIGH, URGENT]}
        status: {type: string, enum: [OPEN, PROCESSING, DONE, CANCELED]}
        title: {type: string}
        description: {type: string, nullable: true}
        dueAt: {type: string, format: date-time, nullable: true}
        claimedAt: {type: string, format: date-time, nullable: true, description: 当前负责人接手/转派时间，UTC；退回任务池后清空}
        completedAt: {type: string, format: date-time, nullable: true, description: 完成时间，UTC；未完成时为空}
        createdAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
    TaskItemEnvelope:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data: {$ref: '#/components/schemas/TaskItemResponse'}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
    TaskActionItemResponse:
      type: object
      required: [id, taskId, action, fromStatus, toStatus, fromAssigneeUserId, toAssigneeUserId, actorUserId, reason, createdAt]
      properties:
        id: {type: integer, format: int64}
        taskId: {type: integer, format: int64}
        action: {type: string, enum: [CLAIM, REASSIGN, RETURN, COMPLETE]}
        fromStatus: {type: string, enum: [OPEN, PROCESSING, DONE, CANCELED]}
        toStatus: {type: string, enum: [OPEN, PROCESSING, DONE, CANCELED]}
        fromAssigneeUserId: {type: integer, format: int64, nullable: true}
        toAssigneeUserId: {type: integer, format: int64, nullable: true}
        actorUserId: {type: integer, format: int64}
        reason: {type: string, maxLength: 500, nullable: true, description: REASSIGN/RETURN 必有值，CLAIM/COMPLETE 为空}
        createdAt: {type: string, format: date-time, description: 动作发生时间，UTC}
    TaskActionListEnvelope:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: {type: string, enum: [OK]}
        message: {type: string, example: success}
        data:
          type: array
          items: {$ref: '#/components/schemas/TaskActionItemResponse'}
        requestId: {type: string}
        timestamp: {type: string, format: date-time}
