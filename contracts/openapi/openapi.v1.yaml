    EntitlementDetail:
      type: object
      required: [entitlement, availableBalance, ledger]
      properties:
        entitlement: {$ref: '#/components/schemas/Entitlement'}
        availableBalance: {type: integer, format: int64, minimum: 0, description: 权威账本 SUM(deltaCount)}
        ledger:
          type: array
          items: {$ref: '#/components/schemas/EntitlementLedgerEntry'}
    OrderPageResponse:
      type: object
