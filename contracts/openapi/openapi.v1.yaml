        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: 批次当前状态、重试信息、明细与订单快照
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MonthlyBatchEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /followup-automation/batches/{id}/execute:
    post:
      tags: [FollowupAutomation]
      operationId: executeFollowupMonthlyBatch
      summary: 执行 READY 回访批次（followup:write + 仅 ALL 客户数据范围 + CSRF + 幂等键 + version + 审计）
      description: 需 customer ALL 数据范围（非 ALL 返回 403 FORBIDDEN）。每客户至多创建或去重一条任务；执行事实只追加 attempt。完成不代表真实企微已发送，通知渠道以共享投递记录为准。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MonthlyBatchActionRequest'}
      responses:
        '200':
          description: COMPLETED，或部分明细失败后的 FAILED；可据当前 version 重试
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MonthlyBatchEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /followup-automation/batches/{id}/retry:
    post:
      tags: [FollowupAutomation]
      operationId: retryFollowupMonthlyBatch
      summary: 重试 FAILED 回访批次（followup:write + 仅 ALL 客户数据范围 + CSRF + 幂等键 + version + 审计）
      description: 需 customer ALL 数据范围（非 ALL 返回 403 FORBIDDEN）。仅处理 PENDING/FAILED 明细；已 CREATED/SKIPPED 明细不重开任务，每次最终执行追加不可变 attempt。
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MonthlyBatchActionRequest'}
      responses:
        '200':
          description: 重试后的批次状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MonthlyBatchEnvelope'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
