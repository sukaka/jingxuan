      type: object
      required: [id, sourceMessageId, customerId, staffUserId, teamId, status, reasonMasked, intent, aiProvider, aiModel, sendProvider, providerMessageId, sendAttemptedAt, generationAttempts, sendAttempts, nextAttemptAt, createdAt, updatedAt, version]
      properties:
        id: {type: integer, format: int64}
        sourceMessageId: {type: integer, format: int64, description: 合法企微 TEXT/STORED 客户消息 ID}
        customerId: {type: integer, format: int64, nullable: true}
        staffUserId: {type: integer, format: int64}
        teamId: {type: integer, format: int64, nullable: true}
        status: {$ref: '#/components/schemas/AiChatDelegationRunStatus'}
