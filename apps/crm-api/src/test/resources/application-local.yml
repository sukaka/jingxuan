spring:
  datasource:
    hikari:
      maximum-pool-size: 16
      minimum-idle: 1
      idle-timeout: 10000
  flyway:
    locations: classpath:db/migration,classpath:db/dev

app:
  exports:
    worker:
      enabled: false
  files:
    enabled: false
  outbox:
    relay:
      enabled: false
  wecom:
    official:
      callback-delay-ms: 600000
