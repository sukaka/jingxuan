spring:
  application:
    name: crm-api
  autoconfigure:
    # 认证由平台自研 JWT/会话链承担（platform/security），不使用内存 UserDetailsService，避免误导性的 generated password 日志
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_JDBC_URL:jdbc:mysql://localhost:3307/medical_crm?connectionTimeZone=UTC}
    username: ${DB_USER:crm}
    password: ${MYSQL_PASSWORD:dev_crm_CHANGE_ME}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 3s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      enable-idempotence: true
    consumer:
      group-id: crm-knowledge-sync
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

mybatis:
  mapper-locations: classpath:mapper/**/*.xml

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    auth:
      # 开发默认密钥，仅本地使用；生产必须经 JWT_SECRET 环境变量注入 >=32 字节随机值
      jwt-secret: ${JWT_SECRET:dev-only-jwt-secret-do-not-use-in-prod-0123456789abcdef}
      jwt-ttl-seconds: 7200
      token-cookie-name: CRM_TOKEN
      csrf-cookie-name: CRM_CSRF
      csrf-header-name: X-CSRF-Token
      # 开发环境（http://localhost）可关闭 Secure；生产必须 true
      cookie-secure: ${COOKIE_SECURE:false}
    crypto:
      # 开发占位密钥（Base64 的 32 字节）：敏感列 AES-GCM 加密用；生产走密钥管理服务
      aes-key-base64: ${APP_AES_KEY_BASE64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      # 盲索引 HMAC pepper（开发占位），与 AES 密钥分离
      blind-index-pepper: ${APP_BLIND_INDEX_PEPPER:dev-only-blind-index-pepper-change-me}
  files:
    enabled: ${FILES_ENABLED:false}
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:false}
      delay-ms: 1000
  refunds:
    mock:
      enabled: ${REFUND_MOCK_ENABLED:false}
      secret: ${REFUND_MOCK_SECRET:dev-only-refund-mock-secret}
  ai:
    provider:
      # 默认仅允许 HTTPS；确需内网 HTTP 时必须显式开启，公网 HTTP 仍拒绝
      allow-http: ${AI_PROVIDER_ALLOW_HTTP:false}
    knowledge:
      allow-http: ${AI_DIFY_ALLOW_HTTP:false}
      sync:
        kafka:
          enabled: ${KNOWLEDGE_SYNC_KAFKA_ENABLED:false}
        worker:
          enabled: ${KNOWLEDGE_SYNC_WORKER_ENABLED:false}
          delay-ms: 1000
          batch-size: 5
          lease-ms: 30000
    worker:
      enabled: ${AI_WORKER_ENABLED:false}
      base-url: ${AI_WORKER_BASE_URL:http://localhost:8090}
      internal-token: ${AI_INTERNAL_TOKEN:dev-ai-internal-token-change-me}
      timeout-ms: 30000
      delay-ms: 1000
      batch-size: 10
      claim-timeout-ms: 45000
  wecom:
    official:
      # 未保存页面配置时的默认值；每租户运行时开关由 IntegrationRuntimeConfigService 读取
      enabled: ${WECOM_OFFICIAL_ENABLED:false}
      corp-id: ${WECOM_CORP_ID:}
      secret: ${WECOM_SECRET:}
      api-base-url: ${WECOM_API_BASE_URL:https://qyapi.weixin.qq.com}
      callback-token: ${WECOM_CALLBACK_TOKEN:}
      callback-aes-key: ${WECOM_CALLBACK_AES_KEY:}
      connect-timeout-ms: 3000
      read-timeout-ms: 10000
      page-size: 100
      max-pages: 10000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: info
    com.whale.crm: info
