spring:
  application:
    name: crm-api
  autoconfigure:
    # 认证由平台自研 JWT/会话链承担（platform/security），不使用内存 UserDetailsService，避免误导性的 generated password 日志
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_JDBC_URL:jdbc:mysql://localhost:3307/medical_crm?connectionTimeZone=UTC&useUnicode=true&characterEncoding=UTF-8}
    username: ${DB_USER:crm}
    password: ${MYSQL_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 3s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      enable-idempotence: true
    consumer:
      group-id: crm-knowledge-sync
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

mybatis:
  mapper-locations: classpath:mapper/**/*.xml

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    auth:
      # 密钥必须由环境或 local profile 显式注入 >=32 字节随机值
      jwt-secret: ${JWT_SECRET}
      jwt-ttl-seconds: 7200
      token-cookie-name: CRM_TOKEN
      csrf-cookie-name: CRM_CSRF
      csrf-header-name: X-CSRF-Token
      # 开发环境（http://localhost）可关闭 Secure；生产必须 true
      cookie-secure: ${COOKIE_SECURE:false}
      # 个人账号修改密码复杂度策略（前端从 /api/v1/auth/password-policy 实时读取）
      password-policy:
        min-length: ${PASSWORD_MIN_LENGTH:8}
        max-length: ${PASSWORD_MAX_LENGTH:64}
        require-uppercase: ${PASSWORD_REQUIRE_UPPERCASE:true}
        require-lowercase: ${PASSWORD_REQUIRE_LOWERCASE:true}
        require-digit: ${PASSWORD_REQUIRE_DIGIT:true}
        require-special: ${PASSWORD_REQUIRE_SPECIAL:true}
        forbid-whitespace: ${PASSWORD_FORBID_WHITESPACE:true}
        forbid-username: ${PASSWORD_FORBID_USERNAME:true}
        forbid-same-as-current: ${PASSWORD_FORBID_SAME_AS_CURRENT:true}
    crypto:
      # 敏感列 AES-GCM 密钥与盲索引 pepper，禁止在基础配置提供默认明文值
      aes-key-base64: ${APP_AES_KEY_BASE64}
      blind-index-pepper: ${APP_BLIND_INDEX_PEPPER}
  files:
    enabled: ${FILES_ENABLED:false}
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:false}
      delay-ms: 1000
  notification:
    kafka:
      enabled: ${NOTIFICATION_KAFKA_ENABLED:false}
    delivery:
      worker-enabled: ${NOTIFICATION_WORKER_ENABLED:false}
      delay-ms: 1000
      batch-size: 20
      lease-ms: 30000
      max-retries: 5
      retry-initial-delay-ms: 1000
      retry-max-delay-ms: 60000
  refunds:
    mock:
      enabled: ${REFUND_MOCK_ENABLED:false}
  ai:
    provider:
      # 默认仅允许 HTTPS；确需内网 HTTP 时必须显式开启，并配置明确放行的主机白名单
      allow-http: ${AI_PROVIDER_ALLOW_HTTP:false}
      allowed-hosts: ${AI_PROVIDER_ALLOWED_HOSTS:}
    knowledge:
      allow-http: ${AI_DIFY_ALLOW_HTTP:false}
      allowed-hosts: ${AI_DIFY_ALLOWED_HOSTS:}
      sync:
        kafka:
          enabled: ${KNOWLEDGE_SYNC_KAFKA_ENABLED:false}
        worker:
          enabled: ${KNOWLEDGE_SYNC_WORKER_ENABLED:false}
          delay-ms: 1000
          batch-size: 5
          lease-ms: 30000
    worker:
      enabled: ${AI_WORKER_ENABLED:false}
      base-url: ${AI_WORKER_BASE_URL:http://localhost:8090}
      internal-token: ${AI_INTERNAL_TOKEN}
      timeout-ms: 30000
      delay-ms: 1000
      batch-size: 10
      claim-timeout-ms: 45000
  wecom:
    official:
      # 未保存页面配置时的默认值；每租户运行时开关由 IntegrationRuntimeConfigService 读取
      allowed-tenant-id: ${WECOM_OFFICIAL_ALLOWED_TENANT_ID:1}
      enabled: ${WECOM_OFFICIAL_ENABLED:false}
      corp-id: ${WECOM_CORP_ID:}
      secret: ${WECOM_SECRET:}
      api-base-url: ${WECOM_API_BASE_URL:https://qyapi.weixin.qq.com}
      callback-token: ${WECOM_CALLBACK_TOKEN:}
      callback-aes-key: ${WECOM_CALLBACK_AES_KEY:}
      connect-timeout-ms: 3000
      read-timeout-ms: 10000
      page-size: 100
      max-pages: 10000
    archive:
      allowed-tenant-id: ${WECOM_ARCHIVE_ALLOWED_TENANT_ID:1}
      corp-id: ${WECOM_ARCHIVE_CORP_ID:}
      secret: ${WECOM_ARCHIVE_SECRET:}
      sdk-library-path: ${WECOM_ARCHIVE_SDK_LIBRARY_PATH:}
      private-key-directory: ${WECOM_ARCHIVE_PRIVATE_KEY_DIRECTORY:}
      proxy: ${WECOM_ARCHIVE_PROXY:}
      proxy-password: ${WECOM_ARCHIVE_PROXY_PASSWORD:}
      timeout-seconds: ${WECOM_ARCHIVE_TIMEOUT_SECONDS:15}
    media:
      worker-enabled: ${WECOM_MEDIA_WORKER_ENABLED:false}
      batch-size: ${WECOM_MEDIA_BATCH_SIZE:10}
      lease-ms: ${WECOM_MEDIA_LEASE_MS:30000}
      max-attempts: ${WECOM_MEDIA_MAX_ATTEMPTS:5}
      max-file-bytes: ${WECOM_MEDIA_MAX_FILE_BYTES:52428800}
      max-chunks: ${WECOM_MEDIA_MAX_CHUNKS:200}
      delay-ms: ${WECOM_MEDIA_DELAY_MS:5000}
    sidebar:
      enabled: ${WECOM_SIDEBAR_ENABLED:false}
      agent-id: ${WECOM_SIDEBAR_AGENT_ID:0}
      oauth-authorize-url: ${WECOM_OAUTH_AUTHORIZE_URL:https://open.weixin.qq.com/connect/oauth2/authorize}
      oauth-redirect-uri: ${WECOM_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/wecom/oauth/callback}
      sidebar-url: ${WECOM_SIDEBAR_URL:http://localhost:5173/wecom/sidebar}
      trusted-origins: ${WECOM_SIDEBAR_TRUSTED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
      oauth-state-ttl-seconds: 300
      ticket-refresh-skew-seconds: 60
    message:
      # 应用消息与会话归档完全独立；默认 DISABLED，MOCK 也不会记为官方发送成功。
      allowed-tenant-id: ${WECOM_MESSAGE_ALLOWED_TENANT_ID:1}
      mode: ${WECOM_MESSAGE_MODE:DISABLED}
      corp-id: ${WECOM_MESSAGE_CORP_ID:}
      secret: ${WECOM_MESSAGE_SECRET:}
      agent-id: ${WECOM_MESSAGE_AGENT_ID:0}
      api-base-url: ${WECOM_MESSAGE_API_BASE_URL:https://qyapi.weixin.qq.com}
      connect-timeout-ms: 3000
      read-timeout-ms: 10000
      token-refresh-skew-seconds: 60

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: info
    com.whale.crm: info
