# 本地开发：在 schema 迁移后追加开发用字典种子数据（幂等）。
# 生产环境不包含 db/dev 目录，种子不会进入正式库。
spring:
  datasource:
    password: ${MYSQL_PASSWORD:dev_crm_CHANGE_ME}
  flyway:
    locations: classpath:db/migration,classpath:db/dev

app:
  security:
    auth:
      jwt-secret: ${JWT_SECRET:dev-only-jwt-secret-do-not-use-in-prod-0123456789abcdef}
    crypto:
      aes-key-base64: ${APP_AES_KEY_BASE64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      blind-index-pepper: ${APP_BLIND_INDEX_PEPPER:dev-only-blind-index-pepper-change-me}
  files:
    enabled: ${FILES_ENABLED:true}
    bucket: ${FILES_BUCKET:crm-private-dev}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:dev_minio_CHANGE_ME}
    secret-key: ${MINIO_ROOT_PASSWORD:dev_minio_secret_CHANGE_ME}
    clamav-host: ${CLAMAV_HOST:localhost}
    clamav-port: ${CLAMAV_PORT:3310}
  outbox:
    relay:
      enabled: true
  refunds:
    mock:
      enabled: ${REFUND_MOCK_ENABLED:true}
      secret: ${REFUND_MOCK_SECRET:dev-only-refund-mock-secret}
  ai:
    worker:
      internal-token: ${AI_INTERNAL_TOKEN:dev-ai-internal-token-change-me}
  annual-h5:
    sms:
      mode: ${ANNUAL_H5_SMS_MODE:MOCK}
