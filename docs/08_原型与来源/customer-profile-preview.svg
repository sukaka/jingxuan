<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">客户详情基础档案示意图</title>
  <desc id="desc">沿用 CRM 原型的白底和青绿色页签，以双列字段名和内容展示客户基础档案，不展示研发字段映射信息。</desc>
  <rect width="1600" height="1120" fill="#f8fafb"/>
  <rect width="1600" height="1120" fill="#ffffff"/>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    .ink { fill: #183047; }
    .muted { fill: #79909f; }
    .label { fill: #7b919f; font-size: 16px; }
    .value { fill: #304b5c; font-size: 17px; font-weight: 500; }
    .tab { fill: #8298a6; font-size: 16px; font-weight: 600; }
  </style>

  <text x="40" y="57" class="ink" font-size="27" font-weight="700">客户详情</text>
  <g stroke="#183047" stroke-width="2.5" stroke-linecap="round">
    <path d="M1544 35 L1564 55 M1564 35 L1544 55"/>
  </g>

  <rect x="36" y="94" width="1528" height="132" rx="17" fill="#ffffff" stroke="#e6edf1"/>
  <circle cx="92" cy="160" r="33" fill="#e5f5f2"/>
  <text x="92" y="169" text-anchor="middle" fill="#147e75" font-size="25" font-weight="600">沈</text>
  <text x="146" y="151" class="ink" font-size="23" font-weight="700">沈梦琪</text>
  <rect x="254" y="126" width="82" height="34" rx="7" fill="#e7f7f3"/>
  <text x="295" y="149" text-anchor="middle" fill="#148b80" font-size="15" font-weight="600">服务中</text>
  <rect x="346" y="126" width="67" height="34" rx="7" fill="#e9eff2"/>
  <text x="379.5" y="149" text-anchor="middle" fill="#50697d" font-size="15" font-weight="600">A 层</text>
  <text x="146" y="190" class="muted" font-size="16">编号 C0000001001 · 管家 王丽 · 138****0011</text>
  <rect x="1368" y="132" width="158" height="54" rx="10" fill="#ffffff" stroke="#dce6eb"/>
  <text x="1447" y="166" text-anchor="middle" fill="#476071" font-size="17" font-weight="600">编辑档案</text>

  <g class="tab">
    <text x="66" y="291">客户概览</text>
    <text x="247" y="291">会员权益</text>
    <text x="428" y="291">核销记录</text>
    <text x="609" y="291">订单与退款</text>
    <text x="808" y="291">服务记录</text>
    <text x="989" y="291" fill="#0e9489">基础档案</text>
  </g>
  <path d="M66 322 H1534" stroke="#e7eef2"/>
  <path d="M981 322 H1063" stroke="#14a397" stroke-width="4" stroke-linecap="round"/>

  <rect x="36" y="350" width="1528" height="714" rx="14" fill="#ffffff" stroke="#e7eef2"/>
  <text x="68" y="399" class="ink" font-size="19" font-weight="700">基础档案</text>
  <path d="M68 423 H1532" stroke="#e9eff3"/>

  <g>
    <text x="80" y="475" class="label">用户姓名</text>
    <text x="294" y="475" class="value">沈梦琪</text>
    <text x="838" y="475" class="label">客户昵称</text>
    <text x="1052" y="475" class="value">Momo酱</text>
    <path d="M68 505 H772 M828 505 H1532" stroke="#edf2f4"/>

    <text x="80" y="554" class="label">客户电话</text>
    <text x="294" y="554" class="value">138****0011</text>
    <text x="838" y="554" class="label">客户来源</text>
    <text x="1052" y="554" class="value">外部内容</text>
    <path d="M68 584 H772 M828 584 H1532" stroke="#edf2f4"/>

    <text x="80" y="633" class="label">客户渠道</text>
    <text x="294" y="633" class="value">小红书</text>
    <text x="838" y="633" class="label">新客 / 老客</text>
    <text x="1052" y="633" class="value">老客</text>
    <path d="M68 663 H772 M828 663 H1532" stroke="#edf2f4"/>

    <text x="80" y="712" class="label">所在城市</text>
    <text x="294" y="712" class="value">杭州</text>
    <text x="838" y="712" class="label">关注项目</text>
    <text x="1052" y="712" class="value">皮肤管理</text>
    <path d="M68 742 H772 M828 742 H1532" stroke="#edf2f4"/>

    <text x="80" y="791" class="label">所属管家</text>
    <text x="294" y="791" class="value">王丽</text>
    <text x="838" y="791" class="label">所属账号</text>
    <text x="1052" y="791" class="value">鲸选美学 · 王丽</text>
    <path d="M68 821 H772 M828 821 H1532" stroke="#edf2f4"/>

    <text x="80" y="870" class="label">客户状态</text>
    <text x="294" y="870" class="value">服务中</text>
    <text x="838" y="870" class="label">下单数</text>
    <text x="1052" y="870" class="value">2 单</text>
    <path d="M68 900 H772 M828 900 H1532" stroke="#edf2f4"/>

    <text x="80" y="949" class="label">订单总金额</text>
    <text x="294" y="949" class="value">¥25,800.00</text>
    <text x="838" y="949" class="label">首次下单时间</text>
    <text x="1052" y="949" class="value">2026-09-20 14:32</text>
    <path d="M68 979 H772 M828 979 H1532" stroke="#edf2f4"/>

    <text x="80" y="1028" class="label">最后跟进时间</text>
    <text x="294" y="1028" class="value">2026-10-24 16:20</text>
    <text x="838" y="1028" class="label">备注</text>
    <text x="1052" y="1028" class="value">周末方便联系</text>
  </g>
</svg>
