d-title">商家 / 机构履约明细</h3><div class="card-sub">解决反馈中的“商家明细”，从预约到到院、完成、核销和待对账统一查看</div></div></div>${table(['机构','预约','到院','到院率','完成服务','核销次数','待对账'],ms.map(x=>`<tr><td><button class="btn-link" onclick="openHospital('${x.hospitalId}')">${escapeHtml(hospitalName(x.hospitalId))}</button></td><td>${x.appointments}</td><td>${x.arrivals}</td><td>${pct(x.arrivals,x.appointments)}%</td><td>${x.completed}</td><td>${x.redemptions}</td><td class="metric-strong">${money(x.amount)}</td></tr>`))}</section>${foot()}`}
function renderRiskLedger(){const rows=(S.riskLedger||[]).filter(x=>(filterValue==='all'||x.status===filterValue||x.severity===filterValue)&&[x.id,x.orderId,x.customer,x.type,x.finding,x.owner].join(' ').toLowerCase().includes(searchValue.toLowerCase()));return `${header('异常订单 / 风控台账 · V1.7','集中承接有赞同步异常、重复订单、商品映射、退款状态、权益与核销异常；每一条都有处理状态和责任人',`<button class="btn" onclick="setPage('youzan')">${ico('refresh',15)} 有赞同步</button>`)}<div class="grid4">${stat('异常总数',(S.riskLedger||[]).length+' 条','原型风控台账','shield')}${stat('高风险',(S.riskLedger||[]).filter(x=>x.severity==='高'&&x.status!=='已关闭').length+' 条','优先处理','warning')}${stat('待处理',(S.riskLedger||[]).filter(x=>x.status==='待处理').length+' 条','尚未认领 / 完成','clock')}${stat('已闭环',(S.riskLedger||[]).filter(x=>x.status==='已关闭').length+' 条','保留历史记录','check')}</div><section class="card" style="margin-top:18px"><div class="toolbar"><div class="toolbar-left"><input class="filter-input" placeholder="订单 / 客户 / 异常类型 / 责任人" value="${escapeHtml(searchValue)}" oninput="searchValue=this.value;render()"/><select class="select" onchange="filterValue=this.value;render()"><option value="all">全部状态</option><option value="待处理">待处理</option><option value="处理中">处理中</option><option value="高">高风险</option><option value="中">中风险</option><option value="已关闭">已关闭</option></select></div><span class="note">异常不能删除，只能处理、驳回或关闭并留痕</span></div>${table(['风险单','来源 / 订单','客户','异常类型','级别','发现内容','责任人','状态','操作'],rows.map(x=>`<tr><td><strong>${x.id}</strong><div class="muted" style="font-size:10px">${x.createdAt}</div></td><td>${pill(x.source,'info')}<div class="muted" style="font-size:10px;margin-top:4px">${escapeHtml(x.orderId||'—')}</div></td><td>${escapeHtml(x.customer)}</td><td><strong>${escapeHtml(x.type)}</strong></td><td>${riskSeverityPill(x.severity)}</td><td style="max-width:330px;white-space:normal;line-height:1.6">${escapeHtml(x.finding)}</td><td>${escapeHtml(x.owner)}</td><td>${pill(x.status,x.status==='待处理'?'warning':x.status==='已关闭'?'success':'info')}</td>< function renderContractRenewals(){const rows=S.contractRenewals||[];return `${header('合同续签管理 · V1.8','不只显示“合同快到期”，还要记录续签责任人、下一步、历史合同版本和新合同编号',`<button class="btn" onclick="setPage('hospitals')">${ico('hospital',15)} 机构中心</button>`)}<div class="grid4">${stat('续签任务',rows.length+' 个','含首次签约与续签','clipboard')}${stat('60天内到期',S.hospitals.filter(h=>{const d=riskDays(h.contractEnd);return d!==null&&d<=60}).length+' 家','建议启动续签','warning')}${stat('准备中',rows.filter(x=>x.status.includes('准备')).length+' 个','正在收集资料','clock')}${stat('续签历史',rows.reduce((s,x)=>s+(x.history||[]).length,0)+' 条','合同版本留痕','file')}</div><section class="card" style="margin-top:18px">${table(['机构','当前合同','当前到期','续签状态','负责人','下一步','更新时间','操作'],rows.map(x=>{const h=S.hospitals.find(y=>y.id===x.hospitalId);return `<tr><td><button class="btn-link" onclick="openHospital('${x.hospitalId}')">${escapeHtml(h?.name||x.hospitalId)}</button></td><td>${escapeHtml(h?.contractNo||x.oldContract)}</td><td>${escapeHtml(h?.contractEnd||x.oldEnd||'待签署')}<div style="margin-top:4px">${riskPill(h?.contractEnd,'到期')}</div></td><td>${pill(x.status,x.status==='续签完成'?'success':'warning')}</td><td>${escapeHtml(x.owner)}</td><td style="max-width:260px;white-space:normal">${escapeHtml(x.nextAction)}</td><td>${x.updated}</td><td><button class="btn btn-sm btn-primary" onclick="openModal('renewContract',{id:'${x.id}'})">登记续签</button></td></tr>`}) )}</section><section class="card" style="margin-top:18px"><div class="card-head"><div><h3 class="card-title">合同版本历史</h3><div class="card-sub">旧合同不能被新合同覆盖后消失</div></div></div>${table(['机构','旧合同','新合同','旧到期','新到期','登记时间','操作人'],rows.flatMap(x=>(x.history||[]).map(h=>`<tr><td>${escapeHtml(hospitalName(x.hospitalId))}</td><td>${escapeHtml(h.oldContract)}</td><td><strong>${escapeHtml(h.newContract)}</strong></td><td>${h.oldEnd}</td><td>${h.newEnd}</td><td>${h.time}</td><td>${escapeHtml(h.operator)}</td></tr>`)))}</section>${foot()}`}

function exportRows(kind){if(kind==='客户中心')return S.customers.map(c=>({客户编号:c.id,用户姓名:c.name,客户昵称:c.nickname,客户电话:c.phone,所在城市:c.city,客户来源:c.source,客户渠道:c.channel,客户分层:c.tier,意向:c.intentLevel,消费能力:c.spendingPower,所属管家:ownerName(c.owner),客户状态:c.status,最近跟进:c.lastFollow}));if(kind==='订单售卖')return S.orders.map(o=>({订单号:o.id,客户:tname(o.customerId),订单类型:o.orderType,所属活动:o.campaign,活动批次:o.campaignBatch,卡项:o.item,项目:o.project,实付:o.paid,到院机构:hospitalName(o.hospital),订单状态:o.status}));if(kind==='核销记录')return S.redemptions.map(r=>{const o=order(r.orderId);return {核销流水:r.id,客户:tname(o?.customerId),订单号:r.orderId,项目:o?.project,机构:hospitalName(r.hospital),次数:r.count,服务日期:r.date,状态:r.status}});return S.followups.map(f=>({沟通流水:f.id,客户:tname(f.customerId),日期:f.date,所属管家:ownerName(f.owner),沟通方式:f.channel,关注项目:f.intent,卡点:f.blocker,下次跟进:f.next,沟通内容:f.summary}))}
function csvEscape(v){const x=String(v??'');return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}
function requestExport(kind,reason='原型评审导出'){if(!isAdmin()){showToast('当前角色没有批量导出权限');return}const rows=exportRows(kind);if(!rows.length){showToast('没有可导出的数据');return}const headers=Object.keys(rows[0]);const csv='\ufeff'+headers.join(',')+'\n'+rows.map(r=>headers.map(h=>csvEscape(r[h])).join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`鲸选美学CRM_${kind}_${DEMO_DATE}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);S.exportLogs.unshift({id:cleanId('EX'),time:DEMO_DATE+' 21:20',actor:currentUserName(),dataset:kind,scope:'当前全局权限范围',format:'CSV',rows:rows.length,reason,status:'已完成'});save();render();showToast(`已导出 ${kind}：${rows.length} 条，并记录导出审计`)}
function renderExportCenter(){const logs=S.exportLogs||[];return `${header('数据导出中心 · V1.7','数据下载不再是一个无限制按钮：按角色、数据范围、字段和导出行为统一管控，并保留审计日志')}<div class="grid4">${stat('本月导出',logs.length+' 次','当前为原型演示记录','download')}${stat('可导出数据集','4 类','客户 / 订单 / 核销 / 跟进','file')}${stat('管家批量导出','默认禁止','可由管理员按角色授权','shield')}${stat('导出审计','100% 留痕','人、时间、范围、条数、原因','check')}</div><div class="section-grid section-grid-balanced"><section class="card"><div class="card-head"><div><h3 class="card-title">可执行导出</h3><div class="card-sub">点击会真实生成本地 CSV 演示文件，同时产生审计记录</div></div></div><div style="padding:18px 22px 24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px"><button class="quick-action" onclick="requestExport('客户中心')">${ico('users',18)}<strong>客户中心 CSV</strong><small>客户档案与分层字段</small></button><button class="quick-action" onclick="requestExport('订单售卖')">${ico('bag',18)}<strong>订单售卖 CSV</strong><small>含类型、活动与批次</small></button><button class="quick-action" onclick="requestExport('核销记录')">${ico('check',18)}<strong>核销记录 CSV</strong><small>机构、项目、次数和状态</small></button><button class="quick-action" onclick="requestExport('每日跟进')">${ico('chat',18)}<strong>每日跟进 CSV</strong><small>沟通、卡点和下次跟进</small></button></div></section><section class="card card-pad"><h3 class="card-title">导出权限原则</h3><p class="card-sub">正式系统必须由后端控制，不能只在前端隐藏按钮</p><div class="divider"></div><p style="line-height:2;color:#657d8a">• 运营管理员：全局数据，敏感字段按授权导出<br>• 管家主管：默认仅本组数据，导出需角色授权<br>• 普通管家：默认禁止批量导出与批量复制<br>• 商务：机构/渠道范围，不开放客户全量数据<br>• 财务：订单、退款、机构结算相关字段<br>• 合作机构：禁止导出 CRM 客户全量数据</p></section></div><section class="card" style="margin-top:18px"><div class="card-head"><div><h3 class="card-title">角色权限矩阵</h3><div class="card-sub">这是 V1.7 原型的权限设计，不代表最终公司制度</div></div></div>${table(['角色','可查看范围','手机号显示','复制权限','批量导出','导出范围'],[['运营管理员','全局','按权限显示','允许','允许','授权数据集'],['管家主管','本组客户','可配置','可配置','需授权','本组范围'],['普通管家','本人客户','业务所需','默认禁止批量复制','默认禁止','—'],['商务','机构 / 渠道','不开放客户全量','限制','限制','机构 / 渠道'],['财务','订单 / 退款 / 结算','按需脱敏','限制','允许授权','财务字段'],['合作机构','本机构履约','脱敏','禁止','禁止','—']].map(x=>`<tr><td><strong>${x[0]}</strong></td><td>${x[1]}</td><td>${x[2]}</td><td>${pill(x[3],x[3].includes('禁止')?'danger':'info')}</td><td>${pill(x[4],x[4].includes('禁止')?'danger':x[4].includes('允许')?'success':'warning')}</td><td>${x[5]}</td></tr>`))}</section><section class="card" style="margin-top:18px"><div class="card-head"><div><h3 class="card-title">导出审计日志</h3><div class="card-sub">谁导出了什么、多少条、为什么导出</div></div></div>${table(['时间','操作人','数据集','数据范围','格式','条数','导出原因','结果'],logs.map(l=>`<tr><td>${l.time}</td><td>${escapeHtml(l.actor)}</td><td><strong>${escapeHtml(l.dataset)}</strong></td><td>${escapeHtml(l.scope)}</td><td>${pill(l.format,'info')}</td><td>${l.rows}</td><td>${escapeHtml(l.reason)}</td><td>${pill(l.status,'success')}</td></tr>`))}</section>${foot()}`}
function chatMonitorFiltered(){return (S.chatMonitor||[]).filter(m=>filterValue==='all'||(filterValue==='24h'&&m.waitHours>=24)||(filterValue==='risk'&&m.level==='高风险')||(filterValue==='refund'&&m.risk.includes('退款'))||(filterValue==='unread'&&m.unread>0)).filter(m=>{const c=cust(m.customerId);return [c?.name,c?.nickname,ownerName(c?.owner),m.risk].join(' ').toLowerCase().includes(searchValue.toLowerCase())})}
function renderChatMonitor(){const all=S.chatMonitor||[],rows=chatMonitorFiltered();return `${header('企业微信会话监管 · V1.7','主管视角：关注未回复、退款/投诉等风险信号和长期无沟通；仅针对已合规接入的企业微信会话',`<button class="btn" onclick="setPage('ownerlogs')">${ico('users',15)} 客户归属日志</button>`)}<div class="grid4">${stat('客户最后发言',all.filter(x=>x.lastSpeaker==='客户').length+' 位','等待管家继续处理','chat')}${stat('超过24小时',all.filter(x=>x.waitHours>=24).length+' 位','优先提醒主管','clock')}${stat('高风险会话',all.filter(x=>x.level==='高风险').length+' 位','退款 / 长时间未回复等','warning')}${stat('有未读',all.filter(x=>x.unread>0).length+' 位','原型模拟未读状态','bell')}</div><section class="card" style="margin-top:18px"><div class="toolbar"><div class="toolbar-left"><input class="filter-input" placeholder="客户 / 管家 / 风险标签" value="${escapeHtml(searchValue)}" oninput="searchValue=this.value;render()"/><select class="select" onchange="filterValue=this.value;render()"><option value="all" ${filterValue==='all'?'selected':''}>全部会话</option><option value="24h" ${filterValue==='24h'?'selected':''}>超过24小时未回复</option><option value="risk" ${filterValue==='risk'?'selected':''}>高风险</option><option value="refund" ${filterValue==='refund'?'selected':''}>退款关键词</option><option value="unread" ${filterValue==='unread'?'selected':''}>有未读</option></select></div><span class="note">监管用于服务质量与待办发现，不替代正式订单、退款或核销事实</span></div>${table(['客户','所属管家','最后沟通','最后发言方','等待回复','AI风险标签','级别','未读','操作'],rows.map(m=>{const c=cust(m.customerId);return `<tr><td>${custNameCell(c)}</td><td>${escapeHtml(ownerName(c?.owner))}</td><td>${m.lastAt}</td><td>${pill(m.lastSpeaker,m.lastSpeaker==='客户'?'warning':'success')}</td><td>${m.waitHours?`${m.waitHours} 小时${m.waitHours>=24?' '+pill('超时','danger'):''}`:'已回复'}</td><td>${escapeHtml(m.risk)}</td><td>${pill(m.level,m.level==='高风险'?'danger':m.level==='关注'?'warning':'dark')}</td><td>${m.unread?pill(m.unread+'条','warning'):'—'}</td><td><button class="btn-link" onclick="chatId='${m.customerId}';setPage('wecom')">查看对话</button> <button class="btn-link" onclick="openCustomer('${m.customerId}')">客户档案</button></td></tr>`}))}</section><div class="callout" style="margin-top:18px">正式接入企业微信会话存档后，监管页应使用真实消息时间、最后发言方和回复时长计算；AI 风险标签只能作为辅助筛选，不应单独作为处罚或客户事实依据。</div>${foot()}`}
function renderOwnerLogs(){const rows=(S.ownerLogs||[]).filter(l=>{const c=cust(l.customerId);return [c?.name,c?.nickname,l.operator,l.reason,ownerName(l.from),ownerName(l.to)].join(' ').toLowerCase().includes(searchValue.toLowerCase())}).slice().sort((a,b)=>b.time.localeCompare(a.time));return `${header('客户归属变更日志 · V1.7','客户从谁转给谁必须保留完整历史，不能直接覆盖所属管家字段后不留痕',`<button class="btn" onclick="setPage('customers')">${ico('users',15)} 返回客户中心</button>`)}<div class="grid4">${stat('归属变更流水',(S.ownerLogs||[]).length+' 条','包含首次分配和人工转交','users')}${stat('人工调整',(S.ownerLogs||[]).filter(x=>x.source==='人工调整').length+' 条','需记录操作人与原因','activity')}${stat('当前在管客户',S.customers.filter(c=>c.owner).length+' 位','以客户当前owner为准','check')}${stat('不可覆盖历史','强制留痕','用于业绩争议与服务追溯','shield')}</div><section class="card" style="margin-top:18px"><div class="toolbar"><input class="filter-input" placeholder="客户 / 原管家 / 新管家 / 操作人 / 原因" value="${escapeHtml(searchValue)}" oninput="searchValue=this.value;render()"/><span class="note">转交只改变当前归属，不改写过去订单、跟进、核销记录中的历史责任人</span></div>${table(['时间','客户','原所属','新所属','操作人','变更原因','来源','当前归属','操作'],rows.map(l=>{const c=cust(l.customerId);return `<tr><td>${l.time}</td><td><button class="btn-link" onclick="openCustomer('${l.customerId}')">${escapeHtml(c?.name||l.customerId)}</button></td><td>${escapeHtml(l.from==='未分配'?'未分配':ownerName(l.from))}</td><td><strong>${escapeHtml(ownerName(l.to))}</strong></td><td>${escapeHtml(l.operator)}</td><td style="max-width:260px;white-space:normal">${escapeHtml(l.reason)}</td><td>${pill(l.source,'info')}</td><td>${escapeHtml(ownerName(c?.owner))}</td><td><button class="btn btn-sm" onclick="openModal('ownerTransfer',{customerId:'${l.customerId}'})">再次转交</button></td></tr>`}))}</section><section class="card" style="margin-top:18px"><div class="card-head"><div><h3 class="card-title">快速变更当前归属</h3><div class="card-sub">选择客户发起转交，保存后自动增加一条日志</div></div></div>${table(['客户','当前管家','客户状态','最近跟进','操作'],S.customers.map(c=>`<tr><td>${custNameCell(c)}</td><td>${escapeHtml(ownerName(c.owner))}</td><td>${customerBadge(c)}</td><td>${c.lastFollow||'—'}</td><td><button class="btn btn-sm btn-primary" onclick="openModal('ownerTransfer',{customerId:'${c.id}'})">变更所属</button></td></tr>`))}</section>${foot()}`}
function renderCatalog(){const catalog=S.catalog||{subprojects:[],packages:[]};return `${header('产品与套餐管理','对应原「产品组合项目明细表」和「产品子项目明细表」；明确区分选几项与可核销次数',`<button class="btn" onclick="openModal('catalogSub')">${ico('plus',16)} 新增子项目</button><button class="btn btn-primary" onclick="openModal('catalogPack')">${ico('plus',16)} 新增套餐方案</button>`)}
<div class="grid3">${stat('组合套餐方案',catalog.packages.length+' 种','包含「选N项」与「N次」规则','bag')}${stat('基础子项目',catalog.subprojects.length+' 项','各自维护项目分类和单价','file')}${stat('配置规则待确认',catalog.packages.filter(x=>x.detail.includes('待导入')||x.detail.includes('未完整')).length+' 项','原表有被截断的项目关联字段','clock')}</div>
<div class="section-grid" style="grid-template-columns:1fr 1fr"><section class="card"><div class="card-head"><div><h3 class="card-title">产品组合项目明细表</h3><p class="card-sub">类别 / 卡项名称 / 项目明细 / 次数选项 / 卡项组合优惠价</p></div></div>${table(['类别','卡项名称','项目/次数选项','优惠价'],catalog.packages.map(x=>`<tr><td>${pill(x.category,'info')}</td><td><strong>${escapeHtml(x.name)}</strong><div class="muted" style="font-size:10px;margin-top:5px">${escapeHtml(x.detail)}</div></td><td>${pill(x.option,x.option.startsWith('选')?'warning':'success')}</td><td class="metric-strong">${money(x.price)}</td></tr>`))}</section><section class="card"><div class="card-head"><div><h3 class="card-title">产品子项目明细表</h3><p class="card-sub">项目分类 / 项目明细 / 项目单价 / 关联套餐</p></div></div>${table(['项目分类','子项目明细','项目单价'],catalog.subprojects.map(x=>`<tr><td>${pill(x.category,'dark')}</td><td><strong>${escapeHtml(x.name)}</strong></td><td class="metric-strong">${money(x.price)}</td></tr>`))}</section></div>
<div class="banner" style="margin-top:18px"><div><strong>当前原型对于套餐选项的处理原则</strong><p>「选3项」表示可选择不同项目；「3次」表示次数权益。二者不允许混合累计。原截图中部分关联项目被折叠，必须拿到原表完整配置才能确定实际发放规则。</p></div>${pill('套餐规则待导入','warning')}</div>${foot()}`}
function renderDaily(){const rows=S.followups||[];return `${header('每日跟进台账','对应原「客户日跟进情况表—管家部」，每次沟通都单独新增记录，不覆盖历史',`<button class="btn btn-primary" onclick="openModal('followup')">${ico('plus',16)} 新增沟通记录</button>`)}<div class="grid3">${stat('跟进记录',rows.length+' 条','每次沟通新增独立流水','chat')}${stat('今天沟通客户',new Set(rows.filter(r=>r.date===DEMO_DATE).map(r=>r.customerId)).size+' 位','演示数据的2026年10月10日','users')}${stat('近期待跟进',rows.filter(r=>r.next&&r.next<=DEMO_DATE).length+' 位','下次跟进日期已到或逾期','calendar')}</div>
<section class="card" style="margin-top:18px"><div class="toolbar"><div><strong style="font-size:14px">客户沟通登记</strong><p class="note" style="margin:6px 0 0">电话、姓名、来源由客户档案关联带出；不得覆盖旧沟通内容。</p></div><span class="pill info">最新记录优先</span></div>${table(['填写日期','所属账号','所属管家','手机号 / 用户姓名','来源','激活情况','铺垫项目1','预计金额','最后一次跟进','下次跟进时间','成交日期','卡点情况','沟通内容 / 备注','创建人'],rows.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>{const c=cust(r.customerId);return `<tr><td>${r.date}</td><td>${escapeHtml(r.account)}</td><td>${escapeHtml(ownerName(r.owner))}</td><td><button class="btn-link" onclick="openCustomer('${r.customerId}','follow')">${escapeHtml(c?.name)}</button><div class="muted" style="font-size:10px">${escapeHtml(c?.phone||'暂无电话')}</div></td><td>${escapeHtml(c?.source||'')}</td><td>${pill(r.active,r.active==='已激活'?'success':'warning')}</td><td>${escapeHtml(r.intent)}</td><td>${money(r.estimate)}</td><td>${r.date}</td><td>${r.next||'—'}</td><td>${r.deal||'—'}</td><td>${escapeHtml(r.blocker||'—')}</td><td style="max-width:220px;white-space:normal;line-height:1.65">${escapeHtml(r.channel+'：'+r.summary)}</td><td>${escapeHtml(r.createdBy)}</td></tr>`}))}</section><div class="callout" style="margin-top:16px">成交日期来自原表的旧自动化触发器，但在新系统中不直接生成已付款订单。沟通记录标注成交后，系统先提醒管家补全订单项目、实付金额与付款凭证。</div>${foot()}`}

function deleteHospital(id){const h=S.hospitals.find(x=>x.id===id);if(!h)return;const refs=S.orders.some(o=>o.hospital===id)||S.redemptions.some(r=>r.hospital===id)||S.appointments.some(a=>a.hospital===id);if(refs){if(!confirm('机构「'+h.name+'」已有订单、预约或核销历史。\n\n删除后将从机构管理列表移除，但历史业务记录仍保留该机构名称用于对账和审计。确定继续归档删除？'))return;h.deleted=true;h.status='已归档';h.lastMaintained=DEMO_DATE;if(hospitalDrawerId===id)closeHospitalDrawer();save();render();showToast('机构已归档删除，历史记录仍保留');return}if(!confirm('确定删除机构「'+h.name+'」？此机构暂无业务历史，将直接删除。'))return;S.hospitals=S.hospitals.filter(x=>x.id!==id);if(hospitalDrawerId===id)closeHospitalDrawer();save();render();showToast('机构已删除')}

function renderDrawer(){if(!drawerId)return;const c=cust(drawerId);if(!c){closeDrawer();return;}const os=paidOrders(c.id);const own=ownerName(c.owner);const tabs=[['overview','客户概览'],['rights','会员权益'],['redemptions','核销记录'],['orders','订单与退款'],['follow','服务记录'],['profile','基础档案（23字段）']];const drawer=`<div class="drawer-screen" onclick="if(event.target===this)closeDrawer()"><div class="drawer"><div class="drawer-head"><div class="drawer-head-row"><div style="display:flex;align-items:center;gap:12px">${avatar(c.name,45)}<div><h2 style="margin:0 0 6px;font-size:20px">${escapeHtml(c.name)} <span style="font-size:12px;color:#8c9eaa;font-weight:500">${escapeHtml(c.nickname)}</span></h2><span class="muted" style="font-size:11px">${c.id} · ${escapeHtml(c.phone||'未登记手机号')} · 专属管家 ${own}</span></div></div><button class="circle-btn" onclick="closeDrawer()">${ico('close',19)}</button></div><div style="margin-top:18px;display:flex;gap:9px;flex-wrap:wrap">${customerBadge(c)}${pill(memberStatus(c),'info')}${pill('来源：'+c.source,'dark')}<button class="btn btn-sm" style="margin-left:auto" onclick="openModal('task',{customerId:'${c.id}'})">${ico('plus',13)} 新建跟进</button></div></div><div class="tabs" style="position:sticky;top:123px;background:#fff;z-index:2">${tabs.map(t=>`<button class="tab ${drawerTab===t[0]?'active':''}" onclick="drawerTab='${t[0]}';renderDrawer()">${t[1]}</button>`).join('')}</div><div class="drawer-body">${drawerTab==='overview'?`<div class="grid3"><div class="mini-stat"><small>累计订单实付</small><h3>${money(clientTotal(c.id))}</h3></div><div class="mini-stat"><small>剩余服务次数</small><h3>${clientBalance(c.id)} 次</h3></div><div class="mini-stat"><small>已成功退款</small><h3>${money(clientRefund(c.id))}</h3></div></div><div class="two-col" style="margin-top:17px"><section class="card"><div class="card-head"><h3 class="card-title">购买项目与剩余权益</h3><button class="btn-link" onclick="drawerTab='rights';renderDrawer()">查看全部</button></div><div class="tab-content">${os.length?os.map(o=>`<div style="margin-bottom:19px"><div style="display:flex;justify-content:space-between;margin-bottom:9px"><strong>${escapeHtml(o.project)}</strong><span class="text-primary">剩余 ${remaining(o)} / ${o.quantity} 次</span></div>${progress(usedCount(o.id)+refundQty(o.id),o.quantity)}<div class="muted" style="margin-top:7px;font-size:10px">${escapeHtml(o.item)} · 有效期至 ${o.expires}</div></div>`).join(''):empty('尚未购买权益','可创建订单草稿并确认支付')}</div></section><div><div class="ai-box"><h3>${ico('spark',16)} AI 服务建议（演示）</h3><p>${escapeHtml(c.name)}当前状态为「${escapeHtml(c.status)}」。${clientBalance(c.id)>0?`还有 ${clientBalance(c.id)} 次可用项目，建议结合预约时间及有效期安排跟进。`:'暂无已购买的可用次数，若客户表达购买意向，可继续跟进。'}</p><button class="btn btn-sm btn-primary" onclick="openModal('task',{customerId:'${c.id}'})">添加跟进任务</button></div><div class="card card-pad" style="margin-top:16px"><h3 class="card-title">客户基本信息</h3><p class="note" style="line-height:2.1">所在城市：${escapeHtml(c.city)}<br>生日：${escapeHtml(c.birthday||'待维护')}<br>积分：${Number(c.points||0).toLocaleString()}<br>关注项目：${escapeHtml(c.attention||'待填写')}<br>所属账号：${escapeHtml(c.account||'待关联')}<br>卡点情况：${escapeHtml(c.blocker||'暂无')}<br>最后跟进：${escapeHtml(c.lastFollow||'待记录')}</p></div></div></div>`:drawerTab==='rights'?`<section class="card">${table(['所属订单','子项目','购买','已核销','已退次数','剩余','到期'],os.map(o=>`<tr><td>${o.id}</td><td><strong>${escapeHtml(o.project)}</strong><div class="muted">${escapeHtml(o.item)}</div></td><td>${o.quantity}</td><td>${usedCount(o.id)}</td><td>${refundQty(o.id)}</td><td class="text-primary">${remaining(o)}</td><td>${o.expires}</td></tr>`))}</section>`:drawerTab==='redemptions'?`<section class="card"><div class="card-head"><div><h3 class="card-title">客户核销记录</h3><div class="card-sub">按核销流水记录实际履约机构，不仅展示订单默认机构</div></div><button class="btn btn-sm" onclick="closeDrawer();setPage('redemptions')">全部核销记录</button></div>${table(['核销流水','机构','项目','本次次数','订单号','到院日期','状态'],S.redemptions.filter(r=>order(r.orderId)?.customerId===c.id).slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>{const o=order(r.orderId);return `<tr><td>${r.id}</td><td><button class="hospital-name-link" onclick="openHospital('${r.hospital}')">${escapeHtml(hospitalName(r.hospital))}</button></td><td>${escapeHtml(o?.project||'待确认')}</td><td class="text-primary">${r.count} 次</td><td>${r.orderId}</td><td>${r.date}</td><td>${pill(r.status==='POSTED'?'已核销':r.status==='PENDING'?'待机构确认':r.status==='REJECTED'?'机构已退回':'已冲正',r.status==='POSTED'?'success':r.status==='REJECTED'?'danger':'warning')}</td></tr>`}))}</section>`:drawerTab==='orders'?`<section class="card">${table(['订单编号','购买卡项','实付','收款方','订单时间','状态'],S.orders.filter(o=>o.customerId===c.id).map(o=>`<tr><td>${o.id}</td><td>${escapeHtml(o.item)}</td><td>${money(o.paid)}</td><td>${o.recv==='PLATFORM'?'平台':'医院'}</td><td>${dshort(o.date)}</td><td>${pill(o.status==='PAID'?'已支付':'草稿','success')}</td></tr>`))}</section><section class="card" style="margin-top:16px"><div class="card-head"><h3 class="card-title">退款记录</h3></div>${table(['退款单号','退款金额','原因','状态'],S.refunds.filter(r=>r.customerId===c.id).map(r=>`<tr><td>${r.id}</td><td>${money(r.amount)}</td><td>${escapeHtml(r.reason)}</td><td>${pill(r.status==='SUCCESS'?'成功':r.status==='APPROVED'?'已审批':'待审批',r.status==='SUCCESS'?'success':'warning')}</td></tr>`))}</section>`:drawerTab==='follow'?`<section class="card"><div class="card-head"><h3 class="card-title">客户服务时间线</h3></div><div class="timeline">${[...S.redemptions.filter(r=>order(r.orderId)?.customerId===c.id).map(r=>({title:r.status==='POSTED'?'项目核销完成':r.status==='PENDING'?'核销待机构确认':'核销已退回',detail:`${order(r.orderId)?.project} · ${hospitalName(r.hospital)} · ${r.count}次`,date:r.date})),...S.tasks.filter(t=>t.customerId===c.id).map(t=>({title:t.type+'跟进：'+t.status,detail:t.title,date:t.due})),...S.followups.filter(f=>f.customerId===c.id).map(f=>({title:'日沟通：'+f.channel,detail:f.summary,date:f.date})),...S.orders.filter(o=>o.customerId===c.id).map(o=>({title:'创建订单：'+o.item,detail:money(o.paid)+' · '+(o.status==='PAID'?'已确认支付':'草稿'),date:o.date}))].sort((a,b)=>b.date.localeCompare(a.date)).map(v=>`<div class="timeline-item"><div class="time-track"></div><div><h4>${escapeHtml(v.title)}</h4><p>${escapeHtml(v.detail)} · ${v.date}</p></div></div>`).join('')||empty()}</div></section>`:profile(c)}</div></div></div>`;document.querySelector('#overlay').innerHTML=drawer}
function profile(c){const fields=[['用户姓名',c.name],['客户昵称',c.nickname],['客户电话',c.phone||'未登记'],['客户来源',c.source],['客户渠道',c.channel],['新客/老客',c.newOld],['所在城市',c.city],['关注项目',c.attention],['所属管家（真实姓名）',ownerName(c.owner)],['所属账号',c.account],['填写者（填写账号名称）','运营管理员（示例）'],['电话-是否重复','待计算 / 来源公式待核对'],['下单数',S.orders.filter(o=>o.customerId===c.id&&o.status==='PAID').length],['订单总金额',money(paidOrders(c.id).reduce((s,o)=>s+o.list,0))],['客户状态',c.status],['提交时间',c.joined],['客户首次入库时间',c.joined],['客户添加时间',c.firstAdd],['首次下单时间',c.firstOrder||'暂无'],['最后一次跟进时间',c.lastFollow],['卡点情况',c.blocker||'暂无'],['备注',c.memo||'暂无'],['备注名',c.customerNote||'未登记']];return `<section class="card"><div class="card-head"><div><h3 class="card-title">原始客户信息表字段对照</h3><div class="card-sub">23 个字段完整保留；部分历史公式待原表导出后确认</div></div></div><div class="info-grid">${fields.map(a=>`<div><div class="info-label">${escapeHtml(a[0])}</div><div class="info-value">${escapeHtml(a[1])}</div></div>`).join('')}</div></section>`}

function riskDays(date){if(!date)return null;return Math.ceil((new Date(date+'T00:00:00')-new Date(DEMO_DATE+'T00:00:00'))/86400000)}
function riskPill(date,label='到期'){const d=riskDays(date);if(d===null)return pill('待维护','warning');if(d<0)return pill('已过期','danger');if(d<=30)return pill(`${d}天后${label}`,'danger');if(d<=60)return pill(`${d}天后${label}`,'warning');return pill('正常','success')}
function tierPill(t){return pill(t||'C',t==='S'?'danger':t==='A'?'warning':t==='B'?'info':'dark')}
function renderDashboard(){const totalPaid=S.orders.filter(o=>o.status==='PAID').reduce((s,o)=>s+o.paid,0);const urgentHosp=S.hospitals.filter(h=>{const d=riskDays(h.qualificationExpiry);return d!==null&&d<=30}).length;const yz=S.youzanOrders||[],cm=S.chatMonitor||[];return `${header('运营工作台 · V1.7','按 2026-10-15 全量反馈补齐：运营统计、风控台账、大促分析、素材库、合同续签、SKU质量、生日积分',`<button class="btn" onclick="setPage('monitor')">${ico('chat',15)} 会话监管</button><button class="btn btn-primary" onclick="setPage('exports')">${ico('download',15)} 数据导出中心</button>`)}<div class="banner"><div><span class="soft-pill">${ico('spark',14)} V1.7 全量补齐</span><p><strong>V1.6：在 V1.5 基础上补齐运营统计、异常订单/风控台账、大促分析、独立素材库、合同续签、SKU标准化与数据质量，以及客户生日/积分维护。</strong></p><p>V1.3～V1.5 的管家端、合作机构端、机构中心、套餐多规格、有赞同步、导出权限、会话监管和归属日志全部保留。</p></div><button class="btn btn-primary" onclick="setPage('ownerlogs')">查看归属日志 ${ico('arrow',15)}</button></div><div class="grid4">${stat('待回复企微客户',cm.filter(x=>x.lastSpeaker==='客户'&&x.waitHours>0).length+' 位','主管可按未回复时长筛选','chat')}${stat('>24h 未回复',cm.filter(x=>x.waitHours>=24).length+' 位','优先处理服务断点','clock')}${stat('本月导出记录',(S.exportLogs||[]).length+' 次','每次导出保留审计','download')}${stat('活动订单',S.orders.filter(o=>o.orderType!=='普通订单').length+' 单','活动与批次单独统计','activity')}</div><div class="section-grid"><section class="card"><div class="card-head"><div><h3 class="card-title">反馈整改状态</h3><div class="card-sub">V1.6 覆盖原反馈七大业务域</div></div></div>${table(['事项','反馈级别','V1.6 原型状态','入口'],[['⑨ 数据下载/导出权限','P2','权限矩阵 + CSV导出 + 审计日志','exports'],['⑩ 订单类型区分','P2','普通/快闪/大促 + 活动/批次','orders'],['⑪ 聊天监控','P2','未回复时长 + 风险标签 + 对话入口','monitor'],['⑪ 客户归属日志','P2','每次转交保留前后归属、操作人和原因','ownerlogs'],['有赞自动连系统','P0','同步中心 + 客户匹配 + 异常队列','youzan'],['机构合同 / 资质 / 财务字段','P0','机构中心继续保留','hospitals']].map(x=>`<tr><td><strong>${x[0]}</strong></td><td>${pill(x[1],x[1]==='P0'?'danger':'info')}</td><td>${pill(x[2],'success')}</td><td><button class="btn-link" onclick="setPage('${x[3]}')">查看 →</button></td></tr>`))}</section><section class="card"><div class="card-head"><div><h3 class="card-title">需要主管关注</h3><div class="card-sub">企微未回复与高风险会话</div></div><button class="btn btn-sm" onclick="setPage('monitor')">全部会话</button></div><div class="event-list">${cm.filter(x=>x.level==='高风险'||x.waitHours>=24).map(x=>{const c=cust(x.customerId);return `<div class="event"><div class="event-icon">${ico('chat',15)}</div><div class="event-content"><strong>${escapeHtml(c?.name||'客户')} · ${escapeHtml(x.risk)}</strong><p>所属管家 ${escapeHtml(ownerName(c?.owner))} · ${x.waitHours?x.waitHours+'小时未回复':'需关注'}</p></div><span class="event-time">${x.lastAt.slice(5)}</span></div>`}).join('')||'<div class="empty">暂无高风险会话</div>'}</div></section></div>${foot()}`}
function renderCustomers(){const cs=S.customers.filter(c=>(filterValue==='all'||filterValue===c.tier||(filterValue==='need'&&['待回访','退款处理中','待预约'].includes(c.status)))&&[c.name,c.nickname,c.phone,c.id,c.source,c.channel,(c.tags||[]).join(' ')].join(' ').toLowerCase().includes(searchValue.toLowerCase()));return `${header('客户中心','客户分层标签 + 基础档案 + 跟进节奏；S/A/B/C 与意向/消费能力分开管理',`<button class="btn" onclick="setPage('merge')">${ico('users',15)} 查重合并</button><button class="btn" onclick="setPage('exports')">${ico('download',15)} 数据导出</button><button class="btn btn-primary" onclick="openModal('customer')">${ico('plus',16)} 新建客户</button>`)}<div class="grid4">${stat('S 级客户',S.customers.filter(c=>c.tier==='S').length+' 位','重点维护 / 高价值','users')}${stat('A 级客户',S.customers.filter(c=>c.tier==='A').length+' 位','高意向或高复购','heart')}${stat('今天需跟进',S.followups.filter(f=>f.next&&f.next<=DEMO_DATE).length+' 条','按下次跟进时间提醒','calendar')}${stat('查重候选',(S.mergeCandidates||[]).filter(x=>x.status==='待确认').length+' 组','合并前必须人工确认','users')}</div><section class="card" style="margin-top:18px"><div class="toolbar"><div class="toolbar-left"><input class="filter-input" placeholder="姓名 / 手机 / 微信昵称 / 标签" value="${escapeHtml(searchValue)}" oninput="searchValue=this.value;render()"/><select class="select" onchange="filterValue=this.value;render()"><option value="all">全部分层</option>${['S','A','B','C'].map(x=>`<option value="${x}" ${filterValue===x?'selected':''}>${x}级客户</option>`).join('')}<option value="need" ${filterValue==='need'?'selected':''}>需要处理</option></select></div><span class="note">导出权限正式上线后按角色控制，管家默认禁止批量导出</span></div>${table(['客户','分层','意向 / 消费能力','标签','生日 / 积分','来源渠道','所属管家','最近跟进','下一次跟进','状态','操作'],cs.map(c=>{const nf=S.followups.filter(f=>f.customerId===c.id&&f.next).sort((a,b)=>b.date.localeCompare(a.date))[0]?.next||'待设置';return `<tr><td>${custNameCell(c)}</td><td>${tierPill(c.tier)}</td><td>${pill('意向 '+c.intentLevel,'info')} ${pill('消费 '+c.spendingPower,'dark')}</td><td>${(c.tags||[]).slice(0,2).map(t=>pill(t,'success')).join(' ')||'—'}</td><td>${escapeHtml(c.birthday||'未维护')}<div class="muted" style="font-size:10px;margin-top:4px">${Number(c.points||0).toLocaleString()} 积分</div></td><td>${escapeHtml(c.source)}<div class="muted" style="font-size:10px;margin-top:4px">${escapeHtml(c.channel)}</div></td><td>${escapeHtml(ownerName(c.owner))}</td><td>${c.lastFollow||'—'}</td><td>${nf}${nf<=DEMO_DATE?` ${pill('已到期','danger')}`:''}</td><td>${customerBadge(c)}</td><td><button class="btn-link" onclick="openCustomer('${c.id}')">客户详情</button> <button class="btn-link" onclick="openModal('customerMeta',{customerId:'${c.id}'})">运营信息</button> <button class="btn-link" onclick="openModal('ownerTransfer',{customerId:'${c.id}'})">转交</button></td></tr>`}))}</section>${foot()}`}
function renderMerge(){const rows=S.mergeCandidates||[];return `${header('客户查重合并','多微信、多手机号、相似昵称不直接自动合并；系统给出候选，管家/运营人工确认',`<button class="btn" onclick="showToast('正式系统可按手机号、企微ExternalUserID、订单收件信息等生成候选。')">查重规则说明</button>`)}<div class="grid3">${stat('待确认候选',rows.filter(x=>x.status==='待确认').length+' 组','需要人工判断是否同一客户','users')}${stat('高相似度',rows.filter(x=>x.score>=90&&x.status==='待确认').length+' 组','相似度≥90%的候选','activity')}${stat('已处理',rows.filter(x=>x.status!=='待确认').length+' 组','保留完整合并操作日志','check')}</div><section class="card" style="margin-top:18px">${table(['候选','CRM客户','另一身份','相似度','命中依据','状态','操作'],rows.map(m=>{const c=cust(m.left);return `<tr><td>${m.id}</td><td><strong>${escapeHtml(c?.name)}</strong><div class="muted" style="font-size:10px">${escapeHtml(c?.nickname)} · ${escapeHtml(c?.phone||'无手机号')}</div></td><td><strong>${escapeHtml(m.right.name)}</strong><div class="muted" style="font-size:10px">${escapeHtml(m.right.nickname)} · ${escapeHtml(m.right.phone||m.right.wecom)}</div></td><td><strong class="text-primary">${m.score}%</strong></td><td>${m.reasons.map(x=>pill(x,'info')).join(' ')}</td><td>${pill(m.status,m.status==='待确认'?'warning':'success')}</td><td>${m.status==='待确认'?`<button class="btn btn-sm" onclick="rejectMerge('${m.id}')">不是同一人</button> <button class="btn btn-sm btn-primary" onclick="confirmMerge('${m.id}')">确认合并</button>`:'—'}</td></tr>`}))}</section><div class="callout" style="margin-top:18px">正式系统合并时，保留主客户ID；订单、权益、跟进、企业微信身份迁移到主档案，并记录“谁在什么时间合并了哪两个身份”。</div>${foot()}`}
function confirmMerge(id){const m=(S.mergeCandidates||[]).find(x=>x.id===id);if(!m)return;if(!confirm('确认这两个身份属于同一客户？\n原始身份和操作日志会保留。'))return;m.status='已确认合并';S.audit.push({event:'客户身份合并',detail:m.id+' · 人工确认',time:'10-15 14:20',icon:'users'});save();render();showToast('已完成合并确认（原型演示）')}
function rejectMerge(id){const m=(S.mergeCandidates||[]).find(x=>x.id===id);if(!m)return;m.status='已排除';save();render();showToast('已标记为不同客户')}
function renderCatalog(){const catalog=S.catalog||{subprojects:[],packages:[]};return `${header('产品与套餐中心','解决同卡多次数、录入后不可编辑、卡项无法关联参与机构三个反馈硬伤',`<button class="btn" onclick="openModal('catalogSub')">${ico('plus',16)} 新增子项目</button><button class="btn btn-primary" onclick="openModal('catalogPack')">${ico('plus',16)} 新增套餐规格</button>`)}<div class="banner"><div><strong>套餐模型：产品 → 销售规格 → 子项目权益 → 可用机构</strong><p>同一“光子水光囤货卡”可以同时存在 3次版、6次版、10次版，各自配置售价、项目次数和参与机构；修改后不影响历史订单快照。</p></div>${pill('P0 已整改','success')}</div><section class="card" style="margin-top:18px"><div class="card-head"><div><h3 class="card-title">组合套餐 / 销售规格</h3><div class="card-sub">支持编辑、上下架和参与机构配置</div></div></div>${table(['套餐','销售规格','优惠价','版本','参与机构','状态','历史销售','操作'],catalog.packages.map(p=>`<tr><td><strong>${escapeHtml(p.name)}</strong><div class="muted" style="font-size:10px">${escapeHtml(p.category)}</div></td><td>${pill(p.option,'info')}</td><td>${money(p.price)}</td><td>${escapeHtml(p.version||'V1.0')}</td><td style="max-width:260px;white-space:normal">${(p.hospitalIds||[]).map(id=>pill(hospitalName(id),'success')).join(' ')||'未配置'}</td><td>${pill(p.status||'上架中',p.status==='上架中'?'success':'warning')}</td><td>${p.sold?pill('已有订单','dark'):pill('未售卖','info')}</td><td><button class="btn-link" onclick="openModal('catalogPackEdit',{id:'${p.id}'})">编辑</button> <button class="btn-link text-red" onclick="deletePackage('${p.id}')">${p.sold?'下架':'删除'}</button></td></tr>`))}</section><section class="card" style="margin-top:18px"><div class="card-head"><div><h3 class="card-title">产品子项目库</h3><div class="card-sub">机构产品库和套餐权益统一引用子项目，不再靠自由文本拼接</div></div></div>${table(['分类','项目明细','标准单价','参与机构','状态'],catalog.subprojects.map(p=>`<tr><td>${escapeHtml(p.category)}</td><td><strong>${escapeHtml(p.name)}</strong></td><td>${money(p.price)}</td><td>${S.hospitals.filter(h=>(h.productIds||[]).includes(p.id)).map(h=>pill(h.short,'info')).join(' ')||'待配置'}</td><td>${pill('启用','success')}</td></tr>`))}</section>${foot()}`}
function deletePackage(id){const p=S.catalog.packages.find(x=>x.id===id);if(!p)return;if(p.sold){p.status='已下架';showToast('已有历史销售，套餐已下架，历史订单快照保持不变')}else{if(!confirm('确认删除未售卖的套餐规格？'))return;S.catalog.packages=S.catalog.packages.filter(x=>x.id!==id);showToast('套餐规格已删除')}save();render()}
function renderYouzan(){const rows=S.youzanOrders||[];return `${header('有赞订单同步中心','线上订单自动进入 CRM：去重 → 匹配客户 → 识别套餐 → 保留订单类型/活动归属 → 生成订单/权益 → 进入管家业绩',`<button class="btn btn-primary" onclick="syncAllYouzan()">${ico('refresh',16)} 立即拉取订单</button>`)}<div class="grid4">${stat('今日拉取',rows.length+' 单','模拟有赞订单数据','bag')}${stat('待匹配',rows.filter(x=>x.status==='待匹配').length+' 单','需要确认CRM客户','users')}${stat('同步异常',rows.filter(x=>x.status==='异常').length+' 单','疑似重复或商品映射失败','warning')}${stat('活动订单',rows.filter(x=>x.type!=='普通订单').length+' 单','保留活动与批次归属','activity')}</div><section class="card" style="margin-top:18px"><div class="toolbar"><span class="note">原型展示接口后的业务处理，不代表已连接真实有赞账号</span><button class="btn btn-sm" onclick="showToast('正式接入需确认你们有赞版本、API权限、订单/退款回调范围。')">接口前置条件</button></div>${table(['有赞订单号','客户昵称 / 手机','商品','实付','订单类型','活动 / 批次','支付时间','CRM匹配','状态','操作'],rows.map(r=>`<tr><td><strong>${r.id}</strong></td><td>${escapeHtml(r.nickname)}<div class="muted" style="font-size:10px">${escapeHtml(r.phone||'无手机号')}</div></td><td>${escapeHtml(r.item)}</td><td>${money(r.amount)}</td><td>${pill(r.type,r.type==='大促活动'?'danger':r.type==='快闪订单'?'warning':'info')}</td><td><strong>${escapeHtml(r.campaign||'日常销售')}</strong><div class="muted" style="font-size:10px">${escapeHtml(r.campaignBatch||'—')}</div></td><td>${r.paidAt}</td><td>${r.customerId?`<button class="btn-link" onclick="openCustomer('${r.customerId}')">${escapeHtml(tname(r.customerId))}</button>`:'—'}</td><td>${pill(r.status,r.status==='异常'?'danger':r.status==='待匹配'?'warning':'success')}</td><td>${r.status==='待匹配'||r.status==='异常'?`<button class="btn btn-sm btn-primary" onclick="resolveYouzan('${r.id}')">匹配并同步</button>`:`<span class="muted">已入队</span>`}</td></tr>`))}</section><div class="callout" style="margin-top:18px">防重复原则：有赞订单号必须唯一；同一订单重复推送只能更新状态，不能再次发放会员权益。退款回调也必须幂等处理。</div>${foot()}`}
function resolveYouzan(id){const r=(S.youzanOrders||[]).find(x=>x.id===id);if(!r)return;const candidate=S.customers.find(c=>c.phone&&r.phone&&c.phone===r.phone)||S.customers.find(c=>c.nickname===r.nickname);if(candidate){r.customerId=candidate.id;r.handler=ownerName(candidate.owner);r.status='已同步';showToast('已匹配 '+candidate.name+'，模拟生成CRM订单同步任务')}else{r.status='待匹配';showToast('未找到可靠客户匹配，请人工选择客户后再同步')}save();render()}
function syncAllYouzan(){showToast('已模拟拉取最新有赞订单：新增0单，更新4单');S.youzanOrders.forEach(x=>{if(x.status==='待同步')x.status='已同步'});save();render()}
function renderOrders(){const rows=S.orders.filter(o=>[o.id,o.item,tname(o.customerId),o.orderType,o.campaign,o.campaignBatch].join(' ').toLowerCase().includes(searchValue.toLowerCase())).slice().sort((a,b)=>b.date.localeCompare(a.date));return `${header('订单售卖 · V1.7','统一承接手工订单和有赞订单；订单类型与所属活动/批次分开记录，支持大促与日常业绩分离',`<button class="btn" onclick="setPage('youzan')">${ico('refresh',15)} 有赞同步</button><button class="btn btn-primary" onclick="openModal('order')">${ico('plus',16)} 新建手工订单</button>`)}<div class="grid4">${stat('普通订单',S.orders.filter(o=>o.orderType==='普通订单').length+' 单','日常销售订单','bag')}${stat('快闪订单',S.orders.filter(o=>o.orderType==='快闪订单').length+' 单','按场次独立统计','activity')}${stat('大促活动',S.orders.filter(o=>o.orderType==='大促活动').length+' 单','双11等活动单独核算','chart')}${stat('活动批次',new Set(S.orders.filter(o=>o.campaignBatch).map(o=>o.campaign+'|'+o.campaignBatch)).size+' 个','活动 + 批次双层归属','file')}</div><section class="card" style="margin-top:18px"><div class="toolbar"><input class="filter-input" placeholder="订单号 / 客户 / 活动 / 批次" value="${escapeHtml(searchValue)}" oninput="searchValue=this.value;render()"/><span class="note">普通订单也保留“日常销售”归属，避免活动字段为空造成统计断层</span></div>${table(['订单号 / 来源','客户','卡项与项目','订单类型','所属活动 / 批次','原价 / 实付','到院机构','余额','状态','操作'],rows.map(o=>`<tr><td><strong>${o.id}</strong><div class="muted" style="font-size:10px">${escapeHtml(o.sourceSystem||'CRM手工')} · ${o.date}</div></td><td><button class="btn-link" onclick="openCustomer('${o.customerId}')">${escapeHtml(tname(o.customerId))}</button></td><td>${escapeHtml(o.item)}<div class="muted" style="font-size:10px">${escapeHtml(o.project)} · ${o.quantity}次</div></td><td>${pill(o.orderType||'普通订单',o.orderType==='大促活动'?'danger':o.orderType==='快闪订单'?'warning':'info')}</td><td><strong>${escapeHtml(o.campaign||'日常销售')}</strong><div class="muted" style="font-size:10px;margin-top:4px">${escapeHtml(o.campaignBatch||'—')}</div></td><td><span class="muted" style="text-decoration:line-through">${money(o.list)}</span><div function renderHospitals(){const active=S.hospitals.filter(h=>!h.deleted);const risks=active.filter(h=>{const d=riskDays(h.qualificationExpiry);return d!==null&&d<=30});return `${header('机构中心 · 市场B端 V1.8','城市、业务类型、机构性质、商户等级、结算、收费、合同与财务资料统一维护',`<button class="btn" onclick="setPage('merchant')">${ico('file',15)} 商户一页纸</button><button class="btn btn-primary" onclick="openModal('hospital')">${ico('plus',16)} 新增合作机构</button>`)}<div class="grid4">${stat('合作机构',active.filter(h=>h.status==='合作中').length+' 家','可用于预约与履约','hospital')}${stat('S/A级商户',active.filter(h=>['S','A'].includes(h.grade)).length+' 家','重点合作商户','activity')}${stat('30天内资质到期',risks.length+' 家','自动预警','warning')}${stat('收费合作商户',active.filter(h=>h.merchantFee==='是').length+' 家','保证金 / 保投产','wallet')}</div><section class="card" style="margin-top:18px"><div class="toolbar"><input class="filter-input" placeholder="机构 / 城市 / 合同编码 / 对接人" value="${escapeHtml(searchValue)}" oninput="searchValue=this.value;render()"/><span class="note">点击机构查看合同、资质、佣金比例、收费方式、财务信息与商户一页纸</span></div>${table(['机构','城市','业务类型 / 性质','商户等级','结算方式','佣金规则','收费合作','合同到期','状态','操作'],active.filter(h=>[h.name,h.short,h.city,h.contact,h.contractNo,h.type,h.ownership].join(' ').toLowerCase().includes(searchValue.toLowerCase())).map(h=>`<tr class="click-row" onclick="openHospital('${h.id}')"><td><strong>${escapeHtml(h.short)}</strong><div class="muted" style="font-size:10px">${escapeHtml(h.name)}</div></td><td>${escapeHtml(h.city)}</td><td>${pill(h.type||'待维护','info')} ${pill(h.ownership||'待维护','dark')}</td><td>${pill((h.grade||'C')+'类',h.grade==='S'?'danger':h.grade==='A'?'warning':h.grade==='B'?'info':'dark')}</td><td>${escapeHtml(h.settlement||'待维护')}</td><td style="max-width:240px;white-space:normal">线上 ${escapeHtml(h.onlineRate||'—')} / 线下 ${escapeHtml(h.offlineRate||'—')}<div class="muted" style="font-size:10px">点评 ${escapeHtml(h.dianpingRate||'—')}</div></td><td>${h.merchantFee==='是'?pill('收费','warning'):pill('不收费','success')}<div class="muted" style="font-size:10px">${h.depositAmount?`保证金 ${money(h.depositAmount)}`:'—'}</div></td><td>${h.contractEnd||'待维护'}<div style="margin-top:4px">${riskPill(h.contractEnd,'到期')}</div></td><td>${pill(h.status,h.status==='合作中'?'success':'warning')}</td><td><button class="btn-link" onclick="event.stopPropagation();openHospital('${h.id}')">详情</button> <button class="btn-link" onclick="event.stopPropagation();openModal('hospitalEdit',{hospitalId:'${h.id}'})">修改</button></td></tr>`))}</section>${foot()}`}

function applyProfileChange(r){const h=S.hospitals.find(x=>x.id===r.hospitalId);if(!h)return;let nv=r.newValue;if(r.fieldKey==='depositAmount')nv=Number(String(nv).replace(/[^0-9.]/g,''))||0;if(['doctors','devices','cases'].includes(r.fieldKey))nv=String(nv).split(/[、,，]/).map(x=>x.trim()).filter(Boolean);h[r.fieldKey]=nv;h.lastMaintained=DEMO_DATE;r.status='已生效';r.appliedAt=DEMO_DATE+' 15:30';r.history.push({time:r.appliedAt,actor:'系统',action:'审核完成并生效',detail:`${r.fieldLabel}：${profileValueDisplay(r.oldValue)} → ${profileValueDisplay(r.newValue)}`});S.profileChangeAudit.unshift({id:cleanId('PCA'),requestId:r.id,hospitalId:r.hospitalId,fieldLabel:r.fieldLabel,oldValue:r.oldValue,newValue:r.newValue,requestedBy:r.requestedBy,marketReviewer:r.marketRequired?r.marketReviewer:'无需审核',financeReviewer:r.financeRequired?r.financeReviewer:'无需审核',result:'已生效',time:r.appliedAt});S.audit.push({event:'机构资料变更生效',detail:`${hospitalName(r.hospitalId)} · ${r.fieldLabel}`,time:'10-17 15:30',icon:'shield'})}
function approveProfileChange(id,step){const r=(S.profileChangeRequests||[]).find(x=>x.id===id);if(!r||!['待市场审核','待财务审核'].includes(r.status))return;if(step==='market'){if(!r.marketRequired||r.status!=='待市场审核')return;r.marketStatus='已通过';r.marketReviewer='市场审核 · 安安';r.history.push({time:DEMO_DATE+' 15:10',actor:r.marketReviewer,action:'市场审核通过',detail:'业务资料审核通过'});if(r.financeRequired){r.status='待财务审核'}else{applyProfileChange(r)}}else{if(!r.financeRequired||r.status!=='待财务审核')return;r.financeStatus='已通过';r.financeReviewer='财务审核 · 王会计';r.history.push({time:DEMO_DATE+' 15:20',actor:r.financeReviewer,action:'财务审核通过',detail:'结算/财务资料审核通过'});if(!r.marketRequired||r.marketStatus==='已通过'){applyProfileChange(r)}}save();render();showToast(r.status==='已生效'?'审批完成，资料已正式生效':'市场审核通过，已流转财务审核')}

function openModal(name,payload={}){if(isManager()&&['hospital','hospitalEdit','channel','catalogSub','catalogPack'].includes(name)){showToast('当前管家账号没有该管理权限');return}if(isInstitution()&&!['institutionRedeem','profileChangeRequest'].includes(name)){showToast('合作机构账号只能处理本机构预约、核销与资料变更申请');return}modalName=name;modalPayload=payload;renderModal()}
function closeModal(){modalName=null;document.querySelector('#modalContainer')?.remove()}
function modalForm(title,body,submitText='保存',handler='submitModal()'){return `<div class="modal-screen" id="modalContainer" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${escapeHtml(title)}</h2><button class="circle-btn" onclick="closeModal()">${ico('close')}</button></div><form onsubmit="event.preventDefault();${handler}"><div class="modal-body">${body}</div><div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" type="submit">${submitText}</button></div></form></div></div>`}
const fld=(label,name,type='text',placeholder='',value='',required=true,tip='')=>`<div class="field"><label for="${name}">${label}${required?' <em>*</em>':''}</label><input id="${name}" name="${name}" type="${type}" placeholder="${escapeHtml(placeholder)}" value="${escapeHtml(value)}" ${required?'required':''}/>${tip?`<small>${tip}</small>`:''}</div>`;
const sel=(label,name,opts,def='',required=true)=>`<div class="field"><label for="${name}">${label}${required?' <em>*</em>':''}</label><select name="${name}" id="${name}" ${required?'required':''}><option value="">请选择</option>${opts.map(o=>`<option value="${escapeHtml(o[0])}" ${String(o[0])===String(def)?'selected':''}>${escapeHtml(o[1])}</option>`).join('')}</select></div>`;
const fileFld=(label,name,current='')=>`<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"/><small>${current?`当前：${escapeHtml(current)}；重新选择文件后替换文件名`:'支持 PDF / Word / 图片；原型仅记录文件名，不上传真实文件'}</small></div>`;

function confirmOrder(id){const o=order(id);if(!o||o.status!=='DRAFT')return;if(!confirm('确认演示订单 '+id+' 已实际支付？本操作仅修改本地模拟数据，并发放服务次数。'))return;o.status='PAID';const c=cust(o.customerId);if(c){c.firstOrder=c.firstOrder||DEMO_DATE;c.status='服务中';c.kind='VIP'}S.audit.push({event:'手动确认订单支付（模拟）',detail:`${tname(o.customerId)} · ${o.item}`,time:'10-10',icon:'bag'});save();render();showToast('演示订单已确认，权益已生效')}
function confirmAppointment(id){if(!isInstitution())return showToast('预约确认由对应合作机构账号完成');institutionConfirmAppointment(id)}
function approveRedemption(id){if(!isInstitution())return showToast('正式核销必须由对应合作机构账号确认');institutionConfirmRedemption(id)}
function approveRefund(id){if(isManager()){showToast('管家只能提交退款申请，审批和成功打款由财务/主管处理');return}let r=S.refunds.find(x=>x.id===id);if(r&&r.status==='REQUESTED'){r.status='APPROVED';save();render();showToast('已模拟审批通过；尚未退款成功，未改变会员权益')}}
function refundNotice(){showToast('正式退款需要银行/财务成功回执。演示原型不允许直接模拟成功打款。')}
function advanceTask(id){let t=S.tasks.find(x=>x.id===id);if(!t)return;t.status=t.status==='待处理'?'处理中':t.status==='处理中'?'已完成':t.status;const c=cust(t.customerId);if(t.status==='已完成'&&c)c.lastFollow=DEMO_DATE;save();render();showToast(t.status==='已完成'?'任务完成，已更新客户最近跟进日期':'任务已接手')}
function createAiTask(id){const text=id==='C00128'?'确认客户剩余权益和下周到院档期':id==='C00129'?'核实财务退款进度':'核实客户新的服务需求';if(S.tasks.some(t=>t.customerId===id&&t.title===text&&t.status!=='已完成')){showToast('已存在相同待办，请先处理');return}S.tasks.unshift({id:cleanId('T'),customerId:id,title:text,type:id==='C00129'?'退款':'预约',priority:'高',due:DEMO_DATE,owner:cust(id)?.owner||'S01',status:'待处理',reason:'由模拟企微聊天生成的 AI 待核实建议'});save();render();showToast('已创建 AI 待核实任务，尚未修改订单与核销')}
function copyReply(id){const o=order(S.orders.find(x=>x.customerId===id&&x.project==='基础水光')?.id);const msg=id==='C00128'?`您好，您当前基础水光权益剩余 ${o?remaining(o):0} 次，我先帮您确认下周三或周四下午的医院档期，确认后回复您。`:id==='C00129'?'您好，我已看到您的退款申请，正在核对财务进度，确认后及时回复您。':'您好，收到您的消息。我先帮您核实具体项目和安排，稍后答复您。';if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(msg).then(()=>showToast('已复制建议话术，需管家审核后自行发送')).catch(()=>fallbackCopy(msg))}else fallbackCopy(msg)}
function fallbackCopy(msg){const t=document.createElement('textarea');t.value=msg;document.body.appendChild(t);t.select();try{document.execCommand('copy');showToast('已复制建议话术')}catch(e){showToast('本地文件可能限制复制，请手动选中话术')}t.remove()}

function managerLastHospital(cId){const rows=scopedRedemptions().filter(r=>order(r.orderId)?.customerId===cId&&r.status==='POSTED').slice().sort((a,b)=>b.date.localeCompare(a.date));return rows[0]?hospitalName(rows[0].hospital):'暂无到院'}
function managerNextTask(cId){return scopedTasks().filter(t=>t.customerId===cId&&t.status!=='已完成').slice().sort((a,b)=>a.due.localeCompare(b.due))[0]}
function managerMonthlyPaid(){return scopedOrders().filter(o=>o.status==='PAID'&&o.date.slice(0,7)==='2026-10').reduce((s,o)=>s+o.paid,0)}
function managerBalance(){return scopedOrders().filter(o=>o.status==='PAID').reduce((s,o)=>s+remaining(o),0)}
function renderManagerDashboard(){const me=currentStaff(),cs=managerCustomers(),tasks=scopedTasks().filter(t=>t.status!=='已完成'),today=tasks.filter(t=>t.due<=DEMO_DATE),appts=scopedAppointments().filter(a=>['待确认','已确认'].includes(a.status)),refunds=scopedRefunds().filter(r=>r.status!=='SUCCESS'),expiring=scopedOrders().filter(o=>o.status==='PAID'&&remaining(o)>0&&o.expires>DEMO_DATE&&o.expires<='2026-11-09');const monthDemo={S01:23800,S02:17800,S03:12900}[session.staffId]||managerMonthlyPaid();return `<div class="manager-welcome"><section class="manager-hero"><span class="soft-pill" style="background:rgba(255,255,255,.12);color:#c9fff3">${ico('spark',14)} AI 今日工作建议</span><h1>早上好，${escapeHtml(me?.name||'管家')}</h1><p>今天优先处理 ${today.length} 项到期待办。系统只显示你负责的 ${cs.length} 位客户，重要业务变更仍需人工确认。</p><div class="hero-actions"><button class="btn btn-primary" onclick="setPage('tasks')">开始处理今日待办 ${ico('arrow',14)}</button><button class="btn" onclick="openModal('followup')">${ico('plus',14)} 记录客户沟通</button></div></section><section class="manager-kpi"><div class="mini-stat"><small>我的客户</small><h3>${cs.length} 位</h3><div class="note">只统计本人负责客户</div></div><div class="mini-stat"><small>今日待办</small><h3>${today.length} 项</h3><div class="note">到期和逾期任务</div></div><div class="mini-stat"><small>本月业绩</small><h3>${money(monthDemo)}</h3><div class="note">原型模拟口径</div></div><div class="mini-stat"><small>剩余服务</small><h3>${managerBalance()} 次</h3><div class="note">本人客户可用权益</div></div></section></div>
<div class="manager-task-grid"><div class="work-bucket" onclick="setPage('tasks')"><div class="bucket-top"><span class="bucket-icon">${ico('clipboard',17)}</span>${pill(today.length?'需处理':'正常',today.length?'warning':'success')}</div><h3>${today.length}</h3><p>今日 / 逾期待跟进</p></div><div class="work-bucket" onclick="setPage('visits')"><div class="bucket-top"><span class="bucket-icon">${ico('calendar',17)}</span>${pill(appts.length+'项','info')}</div><h3>${appts.length}</h3><p>待确认与已确认预约</p></div><div class="work-bucket" onclick="setPage('refunds')"><div class="bucket-top"><span class="bucket-icon">${ico('wallet',17)}</span>${pill(refunds.length?'关注':'正常',refunds.length?'danger':'success')}</div><h3>${refunds.length}</h3><p>退款处理中客户</p></div><div class="work-bucket" onclick="setPage('customers')"><div class="bucket-top"><span class="bucket-icon">${ico('clock',17)}</span>${pill(expiring.length+'笔','warning')}</div><h3>${expiring.length}</h3><p>30天内到期权益</p></div></div>
<div class="section-grid section-grid-balanced"><section class="card"><div class="card-head"><div><h3 class="card-title">今天优先处理</h3><div class="card-sub">按照截止时间和优先级汇总本人客户</div></div><button class="btn btn-sm" onclick="setPage('tasks')">全部待办</button></div><div style="padding:11px 22px 20px">${tasks.slice().sort((a,b)=>a.due.localeCompare(b.due)).slice(0,6).map(t=>`<div class="customer-alert"><span class="task-dot ${['高','紧急'].includes(t.priority)?'urgent':''}"></span><div class="customer-alert-main"><strong>${escapeHtml(t.title)}</strong><p>${escapeHtml(tname(t.customerId))} · ${escapeHtml(t.type)} · 截止 ${t.due}</p></div><button class="btn btn-sm" onclick="openCustomer('${t.customerId}')">客户</button><button class="btn btn-sm btn-primary" onclick="advanceTask('${t.id}')">${t.status==='待处理'?'接手':'完成'}</button></div>`).join('')||empty('今天没有待处理任务','可以主动检查长期未消费客户')}</div></section><section class="card card-pad"><h3 class="card-title">快捷操作</h3><p class="card-sub">管家高频操作集中到一个地方</p><div class="quick-grid"><button class="quick-action" onclick="openModal('followup')">${ico('chat',18)}<strong>记录沟通</strong><small>保存一次客户联系</small></button><button class="quick-action" onclick="openModal('appointment')">${ico('calendar',18)}<strong>创建预约</strong><small>选择医院和日期</small></button><button class="quick-action" onclick="openModal('order')">${ico('bag',18)}<strong>新建订单</strong><small>先保存为订单草稿</small></button><button class="quick-action" onclick="openModal('refund')">${ico('wallet',18)}<strong>申请退款</strong><small>提交主管 / 财务审批</small></button></div><div class="divider"></div><div class="scope-note">${ico('shield',14)} 当前账号只展示 ${escapeHtml(me?.name||'当前管家')} 负责的客户数据</div></section></div>

function renderManagerCustomers(){const cs=managerCustomers().filter(c=>(filterValue==='all'||(filterValue==='need'&&['待回访','退款处理中','待预约'].includes(c.status))||(filterValue==='active'&&c.status==='服务中')||(filterValue==='lead'&&c.status==='意向跟进'))&&[c.name,c.nickname,c.phone,c.id,c.source,c.channel].join(' ').toLowerCase().includes(searchValue.toLowerCase()));return `${header('我的客户',`仅展示 ${escapeHtml(currentStaff()?.name||'当前管家')} 负责的客户；从后续正式系统的后端就应限制数据范围`,`<button class="btn btn-primary" onclick="openModal('customer')">${ico('plus',16)} 新建客户</button>`)}<section class="card"><div class="toolbar"><div class="toolbar-left"><input class="filter-input" placeholder="搜索我的客户 / 昵称 / 电话" value="${escapeHtml(searchValue)}" oninput="searchValue=this.value;document.querySelector('#view').innerHTML=renderManagerCustomers();const i=document.querySelector('.filter-input');i.focus();i.setSelectionRange(i.value.length,i.value.length)"/><select class="select" onchange="filterValue=this.value;document.querySelector('#view').innerHTML=renderManagerCustomers()"><option value="all" ${filterValue==='all'?'selected':''}>全部客户</option><option value="active" ${filterValue==='active'?'selected':''}>服务中</option><option value="need" ${filterValue==='need'?'selected':''}>待跟进 / 退款</option><option value="lead" ${filterValue==='lead'?'selected':''}>意向跟进</option></select></div><span class="scope-note">${ico('shield',13)} ${cs.length} 位本人客户</span></div>${table(['客户','状态','最近沟通','剩余权益','最近到院机构','下次跟进','操作'],cs.map(c=>{const t=managerNextTask(c.id);return `<tr><td>${custNameCell(c)}</td><td>${customerBadge(c)}</td><td>${c.lastFollow||'—'}</td><td><strong class="text-primary">${clientBalance(c.id)} 次</strong></td><td>${escapeHtml(managerLastHospital(c.id))}</td><td>${t?t.due:'—'}${t?`<div class="muted" style="font-size:10px;margin-top:4px">${escapeHtml(t.type)}</div>`:''}</td><td><button class="btn-link" onclick="openCustomer('${c.id}')">客户详情 ${ico('right',12)}</button></td></tr>`}))}</section>${foot()}`}

function renderManagerRedemptions(){const rows=scopedRedemptions().slice().sort((a,b)=>b.date.localeCompare(a.date));return `${header('核销记录','查看本人客户在哪个机构接受服务、核销几次及机构确认状态；管家不能执行最终核销',`<button class="btn btn-primary" onclick="openModal('redemption')">${ico('plus',16)} 提交核销申请</button>`)}<div class="grid3">${stat('累计正式核销',rows.filter(r=>r.status==='POSTED').reduce((s,r)=>s+r.count,0)+' 次','仅统计机构确认记录','check')}${stat('涉及机构',new Set(rows.map(r=>r.hospital)).size+' 家','按实际服务机构统计','hospital')}${stat('待机构确认',rows.filter(r=>r.status==='PENDING').length+' 笔','不会先扣客户余额','clock')}</div><section class="card" style="margin-top:18px">${table(['客户','服务日期','实际机构','项目','本次核销','所属订单','剩余次数','机构状态'],rows.map(r=>{const o=order(r.orderId);return `<tr><td><button class="btn-link" onclick="openCustomer('${o?.customerId}','redemptions')">${escapeHtml(tname(o?.customerId))}</button></td><td>${r.date}</td><td><strong>${escapeHtml(hospitalName(r.hospital))}</strong></td><td>${escapeHtml(o?.project||'—')}</td><td class="text-primary">${r.count} 次</td><td>${r.orderId}</td><td>${o&&o.status==='PAID'?remaining(o)+' 次':'—'}</td><td>${pill(r.status==='POSTED'?'机构已确认':r.status==='PENDING'?'待机构确认':r.status==='REJECTED'?'机构已退回':'已冲正',r.status==='POSTED'?'success':r.status==='REJECTED'?'danger':'warning')}</td></tr>`}) )}</section>${foot()}`}
function renderManagerOrders(){const rows=scopedOrders().slice().sort((a,b)=>b.date.localeCompare(a.date));return `${header('我的订单','管家可以为本人客户创建订单草稿；订单类型与活动归属用于区分日常、快闪和大促业绩',`<button class="btn btn-primary" onclick="openModal('order')">${ico('plus',16)} 新建订单</button>`)}<div class="grid3">${stat('本人客户订单',rows.length+' 单','含草稿与已支付','bag')}${stat('累计实付',money(rows.filter(o=>o.status==='PAID').reduce((s,o)=>s+o.paid,0)),'本人客户历史订单','wallet')}${stat('活动订单',rows.filter(o=>o.orderType!=='普通订单').length+' 单','快闪 / 大促单独标记','activity')}</div><section class="card" style="margin-top:18px">${table(['订单号','客户','卡项 / 项目','类型 / 活动','实付金额','到院机构','剩余权益','状态','操作'],rows.map(o=>`<tr><td><strong>${o.id}</strong><div class="muted" style="font-size:10px">${o.date}</div></td><td><button class="btn-link" onclick="openCustomer('${o.customerId}','orders')">${escapeHtml(tname(o.customerId))}</button></td><td>${escapeHtml(o.item)}<div class="muted" style="font-size:10px">${escapeHtml(o.project)} · ${o.quantity}次</div></td><td>${pill(o.orderType||'普通订单',o.orderType==='大促活动'?'danger':o.orderType==='快闪订单'?'warning':'info')}<div class="muted" style="font-size:10px;margin-top:4px">${escapeHtml(o.campaign||'日常销售')}${o.campaignBatch?' · '+escapeHtml(o.campaignBatch):''}</div></td><td>${money(o.paid)}</td><td>${escapeHtml(hospitalName(o.hospital))}</td><td class="text-primary">${o.status==='PAID'?remaining(o)+' 次':'未生效'}</td><td>${pill(o.status==='PAID'?'已支付':'待确认',o.status==='PAID'?'success':'warning')}</td><td><button class="btn-link" onclick="openCustomer('${o.customerId}','orders')">查看客户</button></td></tr>`))}</section><div class="callout" style="margin-top:16px">管家新建订单不等于客户已经付款。正式系统应依据付款凭证、财务确认或支付接口决定何时发放会员权益。</div>${foot()}`}

function managerChatInsight(id){const c=cust(id);if(id==='C00128')return {intent:'预约剩余服务',summary:'客户询问剩余次数，并希望下周三或周四下午预约。',action:'核实权益并确认医院排期'};if(id==='C00130')return {intent:'服务后回访',summary:'距离上一次沟通已有一段时间，客户仍有服务权益。',action:'主动回访体验并确认下一次安排'};return {intent:c?.status==='意向跟进'?'购买意向跟进':'客户服务跟进',summary:'根据最近沟通内容核实客户当前需求。',action:'记录沟通结果并设置下次跟进时间'}}
function renderManagerWecom(){const cs=managerCustomers().filter(c=>c.wecom);if(!cs.some(c=>c.id===chatId))chatId=cs[0]?.id||'';const c=cust(chatId),msgs=S.messages[chatId]||[],ins=managerChatInsight(chatId);return `${header('企微 AI 助手','只处理企业微信范围内的聊天；AI 生成的是建议和待办，不直接修改订单、核销或退款事实')}<div class="chat-layout"><section class="card chat-list"><div class="toolbar"><strong>我的企微客户</strong><span class="scope-note">${cs.length} 位</span></div>${cs.map(x=>`<button class="chat-user ${x.id===chatId?'active':''}" onclick="chatId='${x.id}';render()">${avatar(x.name,34)}<span><strong>${escapeHtml(x.name)}</strong><small>${escapeHtml(x.nickname)} · ${escapeHtml(x.status)}</small></span></button>`).join('')}</section><section class="card chat-window"><div class="chat-head"><div>${custNameCell(c||{})}</div><span class="pill success">企业微信 · 模拟</span></div><div class="chat-messages">${msgs.length?msgs.map(m=>`<div class="bubble-row ${m.role==='staff'?'staff':''}"><div class="bubble ${m.role==='staff'?'mine':''}">${escapeHtml(m.text)}<small>${m.date}</small></div></div>`).join(''):`<div class="empty">该客户暂无演示聊天记录</div>`}</div></section><aside class="card ai-panel"><span class="soft-pill">${ico('spark',14)} AI 分析</span><h3>${escapeHtml(ins.intent)}</h3><p>${escapeHtml(ins.summary)}</p><div class="divider"></div><div class="info-label">建议下一步</div><strong>${escapeHtml(ins.action)}</strong><div style="margin-top:16px;display:grid;gap:8px"><button class="btn btn-primary" onclick="createAiTask('${chatId}')">生成待核实任务</button><button class="btn" onclick="copyReply('${chatId}')">复制建议回复</button><button class="btn" onclick="openCustomer('${chatId}')">打开客户档案</button></div><div class="callout" style="margin-top:16px">AI 不允许自动扣次数、确认支付或把退款申请改成退款成功。</div></aside></div>${foot()}`}
function renderManagerPerformance(){const me=currentStaff(),targets={S01:35000,S02:30000,S03:30000},totals={S01:23800,S02:17800,S03:12900},target=targets[session.staffId]||30000,total=totals[session.staffId]||0,refund=scopedRefunds().filter(r=>r.status==='SUCCESS'&&r.date.slice(0,7)==='2026-10').reduce((s,r)=>s+r.amount,0),net=Math.max(0,total-refund),rate=Math.round(net/target*100);return `${header('我的业绩',`${escapeHtml(me?.name||'当前管家')} 的个人业绩视图，不展示其他管家的客户和详细业绩`)}<div class="banner"><div><strong>业绩数字仍为原型模拟口径</strong><p>正式系统的成交归属、退款冲回、跨月调整、医院收款是否计业绩等规则需要财务确认。</p></div>${pill('仅个人可见','success')}</div><div class="grid4">${stat('本月目标',money(target),'2026年10月 · 模拟目标','chart')}${stat('实际完成',money(total),'模拟数据','wallet')}${stat('退款冲回',money(refund),'只统计本月成功退款','wallet')}${stat('完成率',rate+'%','净业绩 / 月目标','activity')}</div><div class="section-grid"><section class="card"><div class="card-head"><div><h3 class="card-title">每日完成趋势</h3><div class="card-sub">沿用原业绩表每日列的业务需求</div></div></div><div style="padding:18px 28px 26px"><div class="mini-bars">${[28,41,54,49,67,73,65,79,82,88].map((v,i)=>`<div class="mini-bar"><div style="height:${v}%"></div><small>${i+1}日</small></div>`).join('')}</div></div></section><section class="card card-pad"><h3 class="card-title">本月服务数据</h3><div class="divider"></div><p style="line-height:2;color:#657d8a">负责客户：<strong>${managerCustomers().length}</strong> 位<br>已完成核销：<strong>${scopedRedemptions().filter(r=>r.status==='POSTED').reduce((s,r)=>s+r.count,0)}</strong> 次<br>当前待办：<strong>${openTasks().length}</strong> 项<br>待机构确认预约：<strong>${scopedAppointments().filter(a=>a.status==='待机构确认').length}</strong> 项</p></section></div>${foot()}`}


function institutionStatusPill(status){const type=status==='已完成'?'success':status==='已确认'?'info':status==='待机构确认'||status==='待核销'?'warning':status==='已到院'?'success':'dark';return pill(status,type)}
function appointmentRedemption(a,status=''){return S.redemptions.find(r=>r.appointmentId===a.id&&(!status||r.status===status))}
function institutionMaskedPhone(c){const p=c?.phone||'';return p||'手机号未登记'}
function renderInstitutionDashboard(){const h=currentInstitution(),u=currentInstitutionUser(),apps=institutionAppointments().slice().sort((a,b)=>a.date.localeCompare(b.date)),reds=institutionRedemptions();const pending=apps.filter(a=>a.status==='待机构确认'),today=apps.filter(a=>a.date===DEMO_DATE&&a.status!=='已完成'),toRedeem=reds.filter(r=>r.status==='PENDING'),posted=reds.filter(r=>r.status==='POSTED');return `${header(`${escapeHtml(h?.short||'合作机构')}工作台`,`${escapeHtml(u?.name||'机构账号')} · ${escapeHtml(u?.title||'机构人员')} ｜ 只处理本机构预约、到院服务与核销确认`)}<div class="banner"><div><span class="soft-pill">${ico('bell',14)} 机构待处理提醒</span><p><strong>${pending.length} 个新预约待机构确认，${toRedeem.length} 笔服务待核销确认。</strong></p><p>管家确定客户到院机构后，本机构账号收到提醒；客户完成服务后由本机构确认核销。机构资料如需调整，请通过“资料变更申请”提交审批。</p></div><button class="btn btn-primary" onclick="setPage('${pending.length?'visits':'redemptions'}')">立即处理 ${ico('arrow',15)}</button></div><div class="grid4">${stat('待确认预约',pending.length+' 项','管家已经选择本机构','calendar')}${stat('今日接待',today.length+' 位','仅本机构预约','users')}${stat('待核销确认',toRedeem.length+' 笔','确认后才扣减客户权益','check')}${stat('累计正式核销',posted.reduce((s,r)=>s+r.count,0)+' 次','本机构历史服务流水','activity')}</div><div class="section-grid"><section class="card"><div class="card-head"><div><h3 class="card-title">待处理预约</h3><div class="card-sub">机构需要确认是否接诊 / 排期</div></div><button class="btn btn-sm" onclick="setPage('visits')">全部预约 ${ico('right',12)}</button></div>${table(['客户','项目','预约日期','专属管家','状态','机构操作'],apps.filter(a=>a.status!=='已完成').slice(0,6).map(a=>{const c=cust(a.customerId);return `<tr><td><strong>${escapeHtml(c?.name||'—')}</strong><div class="muted" style="font-size:10px">${escapeHtml(institutionMaskedPhone(c))}</div></td><td>${escapeHtml(a.project)}</td><td>${a.date}</td><td>${escapeHtml(ownerName(a.owner))}</td><td>${institutionStatusPill(a.status)}</td><td>${institutionVisitAction(a)}</td></tr>`}))}</section><section class="card"><div class="card-head"><div><h3 class="card-title">机构消息中心</h3><div class="card-sub">由管家预约和核销申请自动形成</div></div>${pill((pending.length+toRedeem.length)+'条','warning')}</div><div class="event-list">${pending.slice(0,3).map(a=>`<div class="event"><div class="event-icon">${ico('calendar',16)}</div><div class="event-content"><strong>新预约待确认 · ${escapeHtml(tname(a.customerId))}</strong><p>${escapeHtml(a.project)} · ${a.date} · 管家 ${escapeHtml(ownerName(a.owner))}</p></div><span class="event-time">待处理</span></div>`).join('')}${toRedeem.slice(0,3).map(r=>{const o=order(r.orderId);return `<div class="event"><div class="event-icon">${ico('check',16)}</div><div class="event-content"><strong>核销待确认 · ${escapeHtml(tname(o?.customerId))}</strong><p>${escapeHtml(o?.project||'项目')} · ${r.count} 次 · ${r.date}</p></div><span class="event-time">待确认</span></div>`}).join('')}${!pending.length&&!toRedeem.length?`<div class="empty">当前没有机构待处理提醒</div>`:''}</div></section></div>${foot()}`}
function institutionVisitAction(a){if(a.status==='待机构确认')return `<button class="btn btn-sm btn-primary" onclick="institutionConfirmAppointment('${a.id}')">确认接诊</button>`;if(a.status==='已确认')return `<button class="btn btn-sm" onclick="institutionMarkArrival('${a.id}')">客户已到院</button>`;if(a.status==='已到院')return `<button class="btn btn-sm btn-primary" onclick="openModal('institutionRedeem',{appointmentId:'${a.id}'})">服务完成并核销</button>`;if(a.status==='待核销')return `<button class="btn btn-sm btn-primary" onclick="setPage('redemptions')">去确认核销</button>`;return pill('服务已完成','success')}

function renderInstitutionRedemptions(){const h=currentInstitution(),rows=institutionRedemptions().slice().sort((a,b)=>b.date.localeCompare(a.date)),pending=rows.filter(r=>r.status==='PENDING'),posted=rows.filter(r=>r.status==='POSTED');return `${header('核销确认',`客户接受服务后，由 ${escapeHtml(h?.short||'本机构')} 的授权账号最终确认核销；确认后会员剩余次数才发生变化。`)}<div class="banner"><div><strong>机构确认是正式核销的业务凭据</strong><p>管家可以提交核销申请，但不能代替机构完成最终确认。发现项目、次数或客户不一致时，应驳回并联系管家修正。</p></div>${pill(pending.length+'笔待确认','warning')}</div><div class="grid3">${stat('待确认',pending.length+' 笔','尚未扣减客户权益','clock')}${stat('本机构已核销',posted.reduce((s,r)=>s+r.count,0)+' 次','机构确认后的正式流水','check')}${stat('服务客户',new Set(posted.map(r=>order(r.orderId)?.customerId).filter(Boolean)).size+' 位','仅本机构履约客户','users')}</div><section class="card" style="margin-top:18px"><div class="card-head"><div><h3 class="card-title">待机构确认</h3><div class="card-sub">核对客户、项目、次数和服务日期</div></div></div>${table(['核销流水','客户','项目 / 订单','服务日期','本次次数','核销前剩余','提交来源','机构确认'],pending.map(r=>{const o=order(r.orderId),c=cust(o?.customerId);return `<tr><td><strong>${r.id}</strong></td><td>${escapeHtml(c?.name||'—')}<div class="muted" style="font-size:10px">${escapeHtml(institutionMaskedPhone(c))}</div></td><td>${escapeHtml(o?.project||'—')}<div class="muted" style="font-size:10px">${r.orderId}</div></td><td>${r.date}</td><td class="metric-strong">${r.count} 次</td><td class="text-primary">${o?remaining(o):'—'} 次</td><td>${r.submittedBy?`管家 ${escapeHtml(ownerName(r.submittedBy))}`:'机构服务台'}</td><td><button class="btn btn-primary btn-sm" onclick="institutionConfirmRedemption('${r.id}')">确认核销</button> <button class="btn btn-sm" onclick="institutionRejectRedemption('${r.id}')">退回</button></td></tr>`}))}</section><section class="card" style="margin-top:18px"><div class="card-head"><div><h3 class="card-title">已确认核销</h3><div class="card-sub">不可直接覆盖修改，错误需走冲正流程</div></div></div>${table(['核销流水','客户','项目','次数','服务日期','确认人','状态'],posted.slice(0,20).map(r=>{const o=order(r.orderId);const vu=institutionUsers.find(u=>u.id===r.verifiedByInstitution);return `<tr><td>${r.id}</td><td>${escapeHtml(tname(o?.customerId))}</td><td>${escapeHtml(o?.project||'—')}</td><td>${r.count} 次</td><td>${r.date}</td><td>${escapeHtml(vu?.name||'机构历史账号')}</td><td>${pill('已核销','success')}</td></tr>`}))}</section>${foot()}`}
function renderInstitutionRecords(){const rows=institutionRedemptions().filter(r=>r.status==='POSTED').slice().sort((a,b)=>b.date.localeCompare(a.date));return `${header('服务记录','本机构已经完成并确认的历史服务记录，可用于服务追溯与账单核对')}<section class="card">${table(['服务日期','客户','服务项目','核销次数','所属订单','专属管家','核销确认人'],rows.map(r=>{const o=order(r.orderId),c=cust(o?.customerId),vu=institutionUsers.find(u=>u.id===r.verifiedByInstitution);return `<tr><td>${r.date}</td><td><strong>${escapeHtml(c?.name||'—')}</strong></td><td>${escapeHtml(o?.project||'—')}</td><td class="text-primary">${r.count} 次</td><td>${r.orderId}</td><td>${escapeHtml(ownerName(c?.owner))}</td><td>${escapeHtml(vu?.name||'历史机构账号')}</td></tr>`}))}</section>${foot()}`}
function renderInstitutionSettlement(){const h=currentInstitution(),posted=institutionRedemptions().filter(r=>r.status==='POSTED'),serviceOrders=new Set(posted.map(r=>r.orderId));return `${header('对账概览','机构账号只查看本机构相关履约统计和待对账提示；最终财务结算仍由双方财务确认')}<div class="grid4">${stat('关联服务订单',serviceOrders.size+' 单','按发生核销的订单去重','bag')}${stat('正式核销',posted.reduce((s,r)=>s+r.count,0)+' 次','已由机构确认','check')}${stat('待对账金额',money(h?.balance||0),'沿用机构资料中的演示字段','wallet')}${stat('结算方式',escapeHtml(h?.settlement||'待确认'),escapeHtml(h?.settlementRate||'规则待维护'),'file')}</div><section class="card card-pad" style="margin-top:18px"><h3 class="card-title">结算规则与注意事项</h3><div class="divider"></div><div class="detail-grid"><div class="detail-item"><small>机构全称</small><strong>${escapeHtml(h?.name||'—')}</strong></div><div class="detail-item"><small>结算方式</small><strong>${escapeHtml(h?.settlement||'—')}</strong></div><div class="detail-item"><small>规则 / 比例</small><strong>${escapeHtml(h?.settlementRate||'待维护')}</strong></div><div class="detail-item"><small>对接人</small><strong>${escapeHtml(h?.contact||'—')}</strong></div><div class="detail-item"><small>联系电话</small><strong>${escapeHtml(h?.contactPhone||'—')}</strong></div><div class="detail-item"><small>待对账</small><strong>${money(h?.balance||0)}</strong></div></div><div class="callout" style="margin-top:18px">原型不根据订单金额自动推算医院应结算金额。真实系统需以合同规则、核销项目价格和财务确认的结算版本计算。</div></section>${foot()}`}
function institutionConfirmAppointment(id){if(!isInstitution())return showToast('仅合作机构账号可以执行机构确认');const a=S.appointments.find(x=>x.id===id);if(!a||a.hospital!==currentInstitutionId())return showToast('无权处理其他机构预约');if(a.status!=='待机构确认')return showToast('该预约当前不需要机构确认');a.status='已确认';a.institutionConfirmedBy=session.institutionUserId;a.institutionConfirmedAt=DEMO_DATE;S.audit.push({event:'合作机构确认预约',detail:`${hospitalName(a.hospital)} · ${tname(a.customerId)} · ${a.project}`,time:'10-10',icon:'calendar'});save();render();showToast('已确认接诊，管家端将同步看到预约已确认')}
function institutionMarkArrival(id){if(!isInstitution())return;const a=S.appointments.find(x=>x.id===id);if(!a||a.hospital!==currentInstitutionId()||a.status!=='已确认')return showToast('当前预约不能标记到院');a.status='已到院';a.arrivedAt=DEMO_DATE;save();render();showToast('已标记客户到院，可在服务结束后完成核销')}
function institutionConfirmRedemption(id){if(!isInstitution())return showToast('正式核销必须由合作机构账号确认');const r=S.redemptions.find(x=>x.id===id);if(!r||r.hospital!==currentInstitutionId())return showToast('无权处理其他机构核销');if(r.status!=='PENDING')return showToast('该核销已处理');const o=order(r.orderId);if(!o||r.count>remaining(o))return showToast('客户剩余权益不足，无法核销');if(!confirm(`确认客户 ${tname(o.customerId)} 已在 ${hospitalName(r.hospital)} 完成 ${o.project} ${r.count} 次服务？\n确认后将正式扣减会员次数。`))return;r.status='POSTED';r.verifiedByInstitution=session.institutionUserId;r.verifiedAt=DEMO_DATE;const a=r.appointmentId?S.appointments.find(x=>x.id===r.appointmentId):null;if(a)a.status='已完成';S.audit.push({event:'合作机构确认核销',detail:`${hospitalName(r.hospital)} · ${tname(o.customerId)} · ${o.project} ${r.count}次`,time:'10-10',icon:'check'});save();render();showToast('核销已确认，客户会员剩余次数已扣减')}
function institutionRejectRedemption(id){if(!isInstitution())return;const r=S.redemptions.find(x=>x.id===id);if(!r||r.hospital!==currentInstitutionId()||r.status!=='PENDING')return;if(!confirm('确认退回这笔核销申请？退回不会扣减客户权益。'))return;r.status='REJECTED';r.rejectedByInstitution=session.institutionUserId;r.rejectedAt=DEMO_DATE;const a=r.appointmentId?S.appointments.find(x=>x.id===r.appointmentId):null;if(a)a.status='已到院';save();render();showToast('核销申请已退回，会员权益未变化')}
