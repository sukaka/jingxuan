function v20Entity(kind,id){const map={customer:S.customers,followup:S.followups,subproject:S.catalog?.subprojects,channel:S.channels,appointment:S.appointments,order:S.orders,refund:S.refunds,material:S.materials,sku:S.skus,task:S.tasks};return (map[kind]||[]).find(x=>x.id===id)}
function v20SubmitEditor(ev){ev?.preventDefault?.();const form=document.querySelector('#modalContainer form');if(!form||!v20EditContext)return;const {kind,id}=v20EditContext,e=v20Entity(kind,id);if(!e)return;const v=n=>val(form,n),num=n=>Number(v(n));const before=JSON.stringify(e);
 if(kind==='customer')Object.assign(e,{name:v('name'),nickname:v('nickname'),phone:v('phone'),city:v('city'),status:v('status'),source:v('source'),channel:v('channel'),owner:v('owner'),attention:v('attention'),blocker:v('blocker'),memo:v('memo')});
 if(kind==='followup')Object.assign(e,{date:v('date'),channel:v('channel'),active:v('active'),intent:v('intent'),estimate:num('estimate')||0,next:v('next'),deal:v('deal'),blocker:v('blocker'),summary:v('summary')});
 if(kind==='subproject')Object.assign(e,{category:v('category'),name:v('name'),price:num('price')||0,status:v('status')});
 if(kind==='channel')Object.assign(e,{name:v('name'),platform:v('platform'),bd:v('bd'),leads:num('leads')||0,orders:num('orders')||0,status:v('status')});
 if(kind==='appointment'){if(e.status==='已完成')return showToast('已完成预约不可直接修改');Object.assign(e,{customerId:v('customerId'),project:v('project'),hospital:v('hospital'),date:v('date'),owner:v('owner'),status:v('status')})}
 if(kind==='order'){const hasPosted=S.redemptions.some(r=>r.orderId===e.id&&r.status==='POSTED');if(hasPosted&&v('hospital')!==e.hospital)return showToast('该订单已有正式核销，履约机构不能直接修改');Object.assign(e,{orderType:v('orderType'),campaign:v('campaign'),campaignBatch:v('campaignBatch'),hospital:v('hospital')});if(e.status==='DRAFT')Object.assign(e,{item:v('item'),project:v('project'),quantity:Math.max(1,Math.round(num('quantity')||1)),list:num('list')||0,paid:num('paid')||0})}
 if(kind==='refund'){if(e.status!=='REQUESTED')return showToast('只有待审批退款申请可以修改');Object.assign(e,{amount:num('amount')||0,returnedQty:Math.max(0,Math.round(num('returnedQty')||0)),reason:v('reason')==='其他'?(v('reasonExtra')||'其他'):v('reason')})}
 if(kind==='material')Object.assign(e,{type:v('type'),title:v('title'),city:v('city'),hospital:v('hospital'),project:v('project'),status:v('status'),summary:v('summary'),tags:v('tags').split(',').map(x=>x.trim()).filter(Boolean),updated:DEMO_DATE});
 if(kind==='sku'){const newId=v('skuId')||e.id;if(newId!==e.id&&(S.skus||[]).some(x=>x.id===newId))return showToast('SKU编码已存在');e.id=newId;Object.assign(e,{standardName:v('standardName'),category:v('category'),spec:v('spec'),price:num('price')||0,sales90:Math.max(0,Math.round(num('sales90')||0)),quality:v('quality'),status:v('status'),hospitals:v('hospitals').split(',').map(x=>x.trim()).filter(Boolean)})}
 if(kind==='task')Object.assign(e,{title:v('title'),type:v('type'),priority:v('priority'),due:v('due'),owner:v('owner'),status:v('status'),reason:v('reason')});
 v20Log(kind,id,'修改',before+' -> '+JSON.stringify(e));closeModal();v20EditContext=null;save();render();showToast('修改已保存，并记录编辑日志')
}

function v20OpenNew(kind){
 if(kind==='material'){v20EditContext={kind:'materialNew',id:''};document.body.insertAdjacentHTML('beforeend',modalForm('新增素材',`<div class="field-grid">${sel('素材类型','type',cfgPairs('materialTypes'))}${fld('标题','title','text','请输入素材标题')}${sel('城市','city',[['全国','全国'],...cfgPairs('cities')],'全国')}${sel('机构','hospital',[['','全局'],...S.hospitals.filter(h=>!h.deleted).map(h=>[h.id,h.short||h.name])],'')}${fld('关联项目 / 卡项','project','text','可选','',false)}${sel('审核状态','status',[['待审核','待审核'],['已审核','已审核']],'待审核')}</div>${fld('内容摘要','summary','text','素材说明','',false)}${fld('标签（逗号分隔）','tags','text','案例,水光','',false)}`,'保存素材','v20SubmitNew(event)'));return}
 if(kind==='sku'){v20EditContext={kind:'skuNew',id:''};document.body.insertAdjacentHTML('beforeend',modalForm('新增 SKU',`<div class="field-grid">${fld('SKU编码','skuId','text','SKU-NEW-001')}${fld('标准名称','standardName','text','标准产品名称')}${fld('分类','category','text','如：水光')}${fld('规格','spec','text','如：3次')}${fld('价格','price','number','', '0')}${fld('90天销量','sales90','number','', '0',false)}${sel('质量状态','quality',[['正常','正常'],['低频SKU','低频SKU'],['命名异常','命名异常']],'正常')}${sel('状态','status',[['启用','启用'],['停用','停用']],'启用')}</div>${fld('参与机构ID（逗号分隔）','hospitals','text','H01,H02','',false)}`,'保存 SKU','v20SubmitNew(event)'));return}
}
function v20SubmitNew(ev){ev?.preventDefault?.();const form=document.querySelector('#modalContainer form');if(!form||!v20EditContext)return;const v=n=>val(form,n),num=n=>Number(v(n));if(v20EditContext.kind==='materialNew'){const id=cleanId('M');S.materials.unshift({id,type:v('type'),title:v('title'),city:v('city'),hospital:v('hospital'),project:v('project'),status:v('status'),summary:v('summary'),tags:v('tags').split(',').map(x=>x.trim()).filter(Boolean),updated:DEMO_DATE});v20Log('material',id,'新增','新增素材');closeModal();save();render();showToast('素材已新增');return}if(v20EditContext.kind==='skuNew'){const id=v('skuId');if(!id)return showToast('SKU编码不能为空');if((S.skus||[]).some(x=>x.id===id))return showToast('SKU编码已存在');S.skus.unshift({id,standardName:v('standardName'),product:v('standardName'),category:v('category'),spec:v('spec'),price:num('price')||0,sales90:Math.max(0,Math.round(num('sales90')||0)),quality:v('quality'),status:v('status'),hospitals:v('hospitals').split(',').map(x=>x.trim()).filter(Boolean)});v20Log('sku',id,'新增','新增SKU');closeModal();save();render();showToast('SKU已新增');return}}

function v20Delete(kind,id){const e=v20Entity(kind,id);if(!e)return;if(!confirm('确认删除/停用这条记录？有关联历史的数据不会物理删除。'))return;
 if(kind==='subproject'){e.status='停用'} else if(kind==='material'){e.status='已下架'} else if(kind==='sku'){e.status='停用'} else if(kind==='channel'){e.status='暂停合作'} else if(kind==='task'){S.tasks=S.tasks.filter(x=>x.id!==id)} else if(kind==='followup'){e.deleted=true} else {showToast('该业务对象为审计类数据，不允许直接删除');return}
 v20Log(kind,id,'停用/删除','用户执行停用或删除');save();render();showToast('已处理')
}
let v20ConfigContext=null;
function v20OpenConfig(key,id=''){v20ConfigContext={key,id};const item=id?(S.configs[key]||[]).find(x=>x.id===id):null;const labels={cities:'城市',hospitalTypes:'机构业务类型',hospitalOwnerships:'机构性质',merchantGrades:'商户等级',settlementMethods:'结算方式',customerStatuses:'客户状态',customerSources:'客户来源',customerChannels:'客户渠道',orderTypes:'订单类型',campaigns:'活动名称',followupChannels:'沟通方式',taskTypes:'任务类型',refundReasons:'退款原因',materialTypes:'素材类型'};document.body.insertAdjacentHTML('beforeend',modalForm((item?'修改':'新增')+'配置项 · '+(labels[key]||key),`<div class="field-grid">${fld('显示名称','label','text','',item?.label||'')}${fld('保存值','value','text','',item?.value||'')}${sel('状态','enabled',[['true','启用'],['false','停用']],String(item?.enabled!==false))}</div><div class="callout">停用后不会出现在新建/修改页面的下拉选项中；历史数据仍保持原值。</div>`,'保存配置','v20SubmitConfig(event)'))}
function v20SubmitConfig(ev){ev?.preventDefault?.();const f=document.querySelector('#modalContainer form');const v=n=>val(f,n);const {key,id}=v20ConfigContext||{};if(!key)return;const label=v('label'),value=v('value');if(!label||!value)return showToast('显示名称和保存值不能为空');const arr=S.configs[key]||[];if(arr.some(x=>x.value===value&&x.id!==id))return showToast('该保存值已存在');if(id){const x=arr.find(x=>x.id===id);Object.assign(x,{label,value,enabled:v('enabled')==='true'})}else arr.push({id:cleanId('CFG'),label,value,enabled:v('enabled')==='true'});S.configs[key]=arr;v20Log('config',id||value,'配置修改',key+' / '+label);closeModal();save();render();showToast('配置已保存')}
function v20ToggleConfig(key,id){const x=(S.configs[key]||[]).find(x=>x.id===id);if(!x)return;x.enabled=!x.enabled;save();render();showToast(x.enabled?'已启用':'已停用')}
function v20DeleteConfig(key,id){const x=(S.configs[key]||[]).find(x=>x.id===id);if(!x)return;if(!confirm('确定删除配置项「'+x.label+'」？历史业务数据不会被修改。'))return;S.configs[key]=S.configs[key].filter(x=>x.id!==id);save();render();showToast('配置项已删除')}
function renderSettings(){const groups=[['cities','城市'],['hospitalTypes','机构业务类型'],['hospitalOwnerships','机构性质'],['merchantGrades','商户等级'],['settlementMethods','结算方式'],['customerStatuses','客户状态'],['customerSources','客户来源'],['customerChannels','客户渠道'],['orderTypes','订单类型'],['campaigns','活动名称'],['followupChannels','沟通方式'],['taskTypes','任务类型'],['refundReasons','退款原因'],['materialTypes','素材类型']];return `${header('基础字典 / 列表配置 · V2.0','把原来写死在页面里的城市、类型、状态、渠道等改成后台可维护配置；停用后不影响历史数据')}<div class="banner"><div><strong>V2.0 可配置化</strong><p>新增、修改、停用、删除均在本地原型中即时生效。正式系统建议增加配置变更权限和审计。</p></div>${pill(groups.length+'类配置','success')}</div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px">${groups.map(([key,label])=>`<section class="card"><div class="card-head"><div><h3 class="card-title">${label}</h3><div class="card-sub">启用 ${cfg(key).length} / 全部 ${(S.configs[key]||[]).length}</div></div><button class="btn btn-sm btn-primary" onclick="v20OpenConfig('${key}')">新增</button></div>${table(['名称','保存值','状态','操作'],(S.configs[key]||[]).map(x=>`<tr><td><strong>${escapeHtml(x.label)}</strong></td><td>${escapeHtml(x.value)}</td><td>${pill(x.enabled!==false?'启用':'停用',x.enabled!==false?'success':'warning')}</td><td><button class="btn-link" onclick="v20OpenConfig('${key}','${x.id}')">修改</button> <button class="btn-link" onclick="v20ToggleConfig('${key}','${x.id}')">${x.enabled!==false?'停用':'启用'}</button> <button class="btn-link text-red" onclick="v20DeleteConfig('${key}','${x.id}')">删除</button></td></tr>`))}</section>`).join('')}</div><section class="card" style="margin-top:18px"><div class="card-head"><div><h3 class="card-title">最近编辑日志</h3><div class="card-sub">业务列表和配置修改都会留演示日志</div></div></div>${table(['时间','操作人','对象','编号','动作'],(S.editLogs||[]).slice(0,20).map(l=>`<tr><td>${l.time}</td><td>${escapeHtml(l.actor)}</td><td>${escapeHtml(l.entity)}</td><td>${escapeHtml(l.id)}</td><td>${escapeHtml(l.action)}</td></tr>`))}</section>${foot()}`}

renderChannels=function(){return `${header('合作渠道 / 达人 · V2.0','渠道达人可新增、修改、暂停合作；推广渠道下拉来自“系统配置”',`<button class="btn btn-primary" onclick="openModal('channel')">${ico('plus',16)} 新增渠道达人</button>`)}<section class="card">${table(['达人ID','博主昵称','推广渠道','对接商务','归因线索','订单','状态','操作'],S.channels.map(c=>`<tr><td>${c.id}</td><td><strong>${escapeHtml(c.name)}</strong></td><td>${pill(c.platform,'info')}</td><td>${escapeHtml(ownerName(c.bd))}</td><td>${c.leads}</td><td>${c.orders}</td><td>${pill(c.status,c.status==='合作中'?'success':'warning')}</td><td><button class="btn-link" onclick="v20OpenEditor('channel','${c.id}')">修改</button> <button class="btn-link text-red" onclick="v20Delete('channel','${c.id}')">暂停</button></td></tr>`))}</section>${foot()}`}
renderVisits=function(){const tab=visitTab;return `${header('预约与机构履约 · V2.0','未完成预约可修改；核销事实仍然不能随意覆盖',`<button class="btn" onclick="openModal('appointment')">${ico('calendar',16)} 新建预约</button><button class="btn btn-primary" onclick="openModal('redemption')">${ico('plus',16)} 提交核销申请</button>`)}<section class="card"><div class="tabs"><button class="tab ${tab==='appointments'?'active':''}" onclick="visitTab='appointments';render()">到院预约</button><button class="tab ${tab==='redemptions'?'active':''}" onclick="visitTab='redemptions';render()">项目核销记录</button></div>${tab==='appointments'?table(['预约单','客户','项目','机构','日期','状态','操作'],S.appointments.map(a=>`<tr><td>${a.id}</td><td>${escapeHtml(tname(a.customerId))}</td><td>${escapeHtml(a.project)}</td><td>${escapeHtml(hospitalName(a.hospital))}</td><td>${a.date}</td><td>${institutionStatusPill(a.status)}</td><td>${a.status!=='已完成'?`<button class="btn-link" onclick="v20OpenEditor('appointment','${a.id}')">修改</button>`:'<span class="muted">已完成不可改</span>'}</td></tr>`)):table(['核销流水','客户','项目','次数','机构','日期','状态'],S.redemptions.map(r=>{const o=order(r.orderId);return `<tr><td>${r.id}</td><td>${escapeHtml(tname(o?.customerId))}</td><td>${escapeHtml(o?.project||'—')}</td><td>${r.count}</td><td>${escapeHtml(hospitalName(r.hospital))}</td><td>${r.date}</td><td>${pill(r.status,'info')}</td></tr>`}))}</section>${foot()}`}
renderOrders=function(){const rows=S.orders.filter(o=>[o.id,o.item,tname(o.customerId),o.orderType,o.campaign].join(' ').toLowerCase().includes(searchValue.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));return `${header('订单售卖 · V2.0','订单列表增加修改入口；已支付订单禁止覆盖交易事实，只允许维护活动归属和履约机构',`<button class="btn" onclick="setPage('youzan')">${ico('refresh',15)} 有赞同步</button><button class="btn btn-primary" onclick="openModal('order')">${ico('plus',16)} 新建订单</button>`)}<section class="card"><div class="toolbar"><input class="filter-input" placeholder="订单号 / 客户 / 活动" value="${escapeHtml(searchValue)}" oninput="searchValue=this.value;render()"/><span class="note">已支付交易金额/次数需要冲正，不允许直接篡改</span></div>${table(['订单号','客户','卡项 / 项目','类型 / 活动','实付','机构','状态','操作'],rows.map(o=>`<tr><td><strong>${o.id}</strong><div class="muted">${o.date}</div></td><td>${escapeHtml(tname(o.customerId))}</td><td>${escapeHtml(o.item)}<div class="muted">${escapeHtml(o.project)} · ${o.quantity}次</div></td><td>${pill(o.orderType||'普通订单','info')}<div class="muted">${escapeHtml(o.campaign||'日常销售')} ${escapeHtml(o.campaignBatch||'')}</div></td><td>${money(o.paid)}</td><td>${escapeHtml(hospitalName(o.hospital))}</td><td>${pill(o.status==='PAID'?'已支付':'草稿',o.status==='PAID'?'success':'warning')}</td><td><button class="btn-link" onclick="v20OpenEditor('order','${o.id}')">修改</button> ${o.status==='DRAFT'?`<button class="btn-link" onclick="confirmOrder('${o.id}')">确认支付</button>`:''}</td></tr>`))}</section>${foot()}`}
renderRefunds=function(){const rows=S.refunds.slice().sort((a,b)=>b.date.localeCompare(a.date));return `${header('退款与医院对账 · V2.0','待审批退款申请可以修改；审批后及已退款记录不可直接覆盖',`<button class="btn btn-primary" onclick="openModal('refund')">${ico('plus',16)} 发起退款申请</button>`)}<section class="card">${table(['申请单','客户 / 订单','金额','原因','次数','日期','状态','操作'],rows.map(r=>`<tr><td>${r.id}</td><td>${escapeHtml(tname(r.customerId))}<div class="muted">${r.orderId}</div></td><td>${money(r.amount)}</td><td>${escapeHtml(r.reason)}</td><td>${r.returnedQty||0}</td><td>${r.date}</td><td>${pill({REQUESTED:'待审批',APPROVED:'已审批',SUCCESS:'已退款'}[r.status]||r.status,r.status==='SUCCESS'?'success':'warning')}</td><td>${r.status==='REQUESTED'?`<button class="btn-link" onclick="v20OpenEditor('refund','${r.id}')">修改</button>`:'<span class="muted">锁定</span>'}</td></tr>`))}</section>${foot()}`}
renderMaterials=function(){const rows=(S.materials||[]).filter(x=>[x.title,x.type,x.city,x.project].join(' ').toLowerCase().includes(searchValue.toLowerCase()));return `${header('素材库 · V2.0','素材现在可修改、审核状态调整和下架',`<button class="btn btn-primary" onclick="v20OpenNew('material')">${ico('plus',15)} 新增素材</button>`)}<section class="card"><div class="toolbar"><input class="filter-input" placeholder="搜索素材 / 城市 / 项目" value="${escapeHtml(searchValue)}" oninput="searchValue=this.value;render()"/></div>${table(['类型','标题','城市','关联机构','项目','状态','操作'],rows.map(x=>`<tr><td>${pill(x.type,'info')}</td><td><strong>${escapeHtml(x.title)}</strong></td><td>${escapeHtml(x.city)}</td><td>${escapeHtml(x.hospital?hospitalName(x.hospital):'全局')}</td><td>${escapeHtml(x.project||'—')}</td><td>${pill(x.status,x.status==='已审核'?'success':'warning')}</td><td><button class="btn-link" onclick="openModal('materialPreview',{id:'${x.id}'})">预览</button> <button class="btn-link" onclick="v20OpenEditor('material','${x.id}')">修改</button> <button class="btn-link text-red" onclick="v20Delete('material','${x.id}')">下架</button></td></tr>`))}</section>${foot()}`}
renderSkuCenter=function(){const rows=S.skus||[];return `${header('SKU 标准化与数据质量 · V2.0','SKU主数据支持新增、修改、停用；编码重复会被阻止',`<button class="btn btn-primary" onclick="v20OpenNew('sku')">${ico('plus',15)} 新增SKU</button>`)}<section class="card">${table(['SKU编码','标准名称','分类','规格','价格','参与机构','90天销量','质量','状态','操作'],rows.map(x=>`<tr><td><strong>${escapeHtml(x.id)}</strong></td><td>${escapeHtml(x.standardName)}</td><td>${escapeHtml(x.category)}</td><td>${pill(x.spec,'info')}</td><td>${money(x.price)}</td><td>${(x.hospitals||[]).map(h=>pill(hospitalName(h),'success')).join(' ')}</td><td>${x.sales90}</td><td>${pill(x.quality,x.quality==='正常'?'success':'warning')}</td><td>${pill(x.status,x.status==='启用'?'success':'warning')}</td><td><button class="btn-link" onclick="v20OpenEditor('sku','${x.id}')">修改</button> <button class="btn-link text-red" onclick="v20Delete('sku','${x.id}')">停用</button></td></tr>`))}</section>${foot()}`}
renderTasks=function(){const cols=['待处理','处理中','已完成'];return `${header('回访任务 · V2.0','任务支持修改负责人、截止时间、优先级和状态',`<button class="btn btn-primary" onclick="openModal('task')">${ico('plus',16)} 新建任务</button>`)}<div class="kanban" style="margin-top:18px">${cols.map(col=>`<div class="kanban-col"><div class="kanban-head"><span>${col}</span>${pill(S.tasks.filter(t=>t.status===col).length+'','dark')}</div>${S.tasks.filter(t=>t.status===col).map(t=>`<div class="kanban-card"><div>${pill(t.type,'info')} ${pill(t.priority,t.priority==='紧急'?'danger':t.priority==='高'?'warning':'dark')}</div><h4>${escapeHtml(t.title)}</h4><p>${escapeHtml(t.reason)}</p><div class="kanban-foot"><span class="muted">${escapeHtml(ownerName(t.owner))} · ${dshort(t.due)}</span><div><button class="btn btn-sm" onclick="v20OpenEditor('task','${t.id}')">修改</button> ${col!=='已完成'?`<button class="btn btn-sm" onclick="advanceTask('${t.id}')">${col==='待处理'?'接手':'完成'}</button>`:''}</div></div></div>`).join('')||'<div class="empty">暂无任务</div>'}</div>`).join('')}</div>${foot()}`}

function resetData(){if(confirm('确定恢复所有虚构演示数据？本浏览器中新增的客户、订单和任务将被清空。')){S=upgradeV20(upgradeV19(upgradeV18(upgradeV16(upgradeV15(upgradeV14(structuredClone(initial)))))));save();drawerId=null;closeDrawer();setPage('dashboard');showToast('演示数据已重置')}}
function exportData(){if(isAdmin())setPage('exports');else showToast('当前角色没有批量导出权限')}

(function applyDemoQuery(){try{const q=new URLSearchParams(location.search);const role=q.get('role'),target=q.get('page');if(role==='admin'){session={type:'admin',staffId:null,institutionUserId:null}}else if(role==='manager'){session={type:'manager',staffId:q.get('id')||'S01',institutionUserId:null}}else if(role==='institution'){session={type:'institution',staffId:null,institutionUserId:q.get('id')||'IU01'}}if(target)page=target}catch(e){}})();
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modalName)closeModal();else if(drawerId)closeDrawer();else if(hospitalDrawerId)closeHospitalDrawer();closeNav()}});render();
</script></body></html>
