# 0.1.1: 文件封存与客户合并关联保护不新增或变更 API 签名。
openapi: 3.0.3
info:
  title: WhaleBeauty CRM API (development skeleton)
  version: 0.1.0
  description: >
    Skeleton contract only. Each phase expands fields and paths.
    No endpoint is production-ready without authorization, audit and tests.
servers:
  - url: http://localhost:8080/api/v1
security:
  - bearerAuth: []
paths:
  /customers:
    get:
      tags: [Customers]
      summary: List customers in caller's authorized scope
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Authorized customer page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPageResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Customers]
      summary: Create a customer. Mobile number is optional.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCustomer'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerResponse'}
  /customers/{id}/entitlements:
    get:
      tags: [Entitlements]
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200': {description: Authorized customer entitlements}
        '403': {$ref: '#/components/responses/Forbidden'}
  /orders/{id}/payment-confirmations:
    post:
      tags: [Orders]
      summary: Trusted payment confirmation, must be idempotent
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {description: Previously confirmed or newly confirmed payment}
        '409': {$ref: '#/components/responses/Conflict'}
  /redemptions:
    post:
      tags: [Redemptions]
      summary: Submit redemption pending institution confirmation
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RedemptionDraft'}
      responses:
        '201': {description: Pending institution confirmation}
        '403': {$ref: '#/components/responses/Forbidden'}
  /redemptions/{id}/post:
    post:
      tags: [Redemptions]
      summary: Institution-only confirmed redemption
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {description: Posted once and ledger updated}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /institutions/{id}/change-requests:
    post:
      tags: [InstitutionApprovals]
      summary: Request sensitive institution profile change
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '201': {description: Pending configured approvals, official value unchanged}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Page: {name: page, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
    Size: {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
  responses:
    Unauthorized: {description: Authentication required}
    Forbidden: {description: Not authorized to resource or data scope}
    Conflict: {description: Resource state conflict or duplicate idempotency key with different payload}
  schemas:
    CreateCustomer:
      type: object
      required: [ownerStaffId]
      properties:
        displayName: {type: string, nullable: true}
        nickname: {type: string, nullable: true}
        mobile: {type: string, nullable: true}
        ownerStaffId: {type: integer, format: int64}
        sourceCode: {type: string, nullable: true}
        channelCode: {type: string, nullable: true}
      description: At least one of displayName/nickname must be validated at application layer.
    CustomerSummary:
      type: object
      properties:
        id: {type: integer, format: int64}
        customerNo: {type: string}
        displayName: {type: string, nullable: true}
        nickname: {type: string, nullable: true}
        mobileMasked: {type: string, nullable: true}
        ownerStaffId: {type: integer, format: int64}
        version: {type: integer, format: int64}
    CustomerResponse:
      type: object
      properties:
        code: {type: string, enum: [OK]}
        data: {$ref: '#/components/schemas/CustomerSummary'}
        requestId: {type: string}
    CustomerPageResponse:
      type: object
      properties:
        code: {type: string, enum: [OK]}
        data:
          type: object
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/CustomerSummary'}}
            total: {type: integer, format: int64}
            page: {type: integer}
            size: {type: integer}
    RedemptionDraft:
      type: object
      required: [appointmentId, entitlementId, projectId, count, serviceAt]
      properties:
        appointmentId: {type: integer, format: int64}
        entitlementId: {type: integer, format: int64}
        projectId: {type: integer, format: int64}
        count: {type: integer, minimum: 1}
        serviceAt: {type: string, format: date-time}
        voucherFileId: {type: integer, format: int64, nullable: true}
